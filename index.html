        onPointerDown(x, y) {
          this.ensureCanvas()
          const now = performance.now()
          this.lastPoint = { x, y }
          this.lastMidX = x
          this.lastMidY = y
          this.lastTime = now
          this.currentStroke = [{ x, y, time: now, speed: 0 }]
          this.totalStrokes++

          const v = values[this.id]
          this.drawBrushSegment(x, y, x, y, v.brushSize, v)
        },

        onPointerMove(x, y, isDown) {
          if (!isDown || !this.lastPoint) return
          this.ensureCanvas()

          const now = performance.now()
          const dx = x - this.lastPoint.x
          const dy = y - this.lastPoint.y
          const dist = Math.hypot(dx, dy)
          if (dist < 1.2) return

          const dt = Math.max(0.001, (now - this.lastTime) / 1000)
          const speed = dist / dt
          this.lastTime = now

          const v = values[this.id]
          const sens = v.pressureSens
          // Pen velocity dynamics: smooth taper for handwriting & sketching
          const speedFactor = Math.max(
            0.3,
            Math.min(1.8, 1.35 - (speed / 1100) * sens),
          )
          const currentWidth = Math.max(2, v.brushSize * speedFactor)

          this.currentStroke.push({ x, y, time: now, speed })

          if (this.currentStroke.length >= 3) {
            const len = this.currentStroke.length
            const p0 = this.currentStroke[len - 2]
            const p1 = this.currentStroke[len - 1]
            const midX = (p0.x + p1.x) / 2
            const midY = (p0.y + p1.y) / 2
            this.drawSmoothCurve(
              this.lastMidX ?? p0.x,
              this.lastMidY ?? p0.y,
              p0.x,
              p0.y,
              midX,
              midY,
              currentWidth,
              v,
            )
            this.lastMidX = midX
            this.lastMidY = midY
          } else {
            this.drawBrushSegment(
              this.lastPoint.x,
              this.lastPoint.y,
              x,
              y,
              currentWidth,
              v,
            )
            this.lastMidX = (this.lastPoint.x + x) / 2
            this.lastMidY = (this.lastPoint.y + y) / 2
          }

          this.lastPoint = { x, y }
        },

        onPointerUp() {
          this.lastPoint = null
          this.lastMidX = null
          this.lastMidY = null
          this.currentStroke = null
        },

        drawBrushSegment(x1, y1, x2, y2, width, v) {
          const sCtx = this.sketchCtx
          sCtx.save()
          sCtx.lineCap = 'round'
          sCtx.lineJoin = 'round'

          if (v.brushStyle === 'neon-glow') {
            const glow = v.glowIntensity
            sCtx.shadowColor = v.brushColor
            sCtx.shadowBlur = glow
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.75
            sCtx.beginPath()
            sCtx.moveTo(x1, y1)
            sCtx.lineTo(x2, y2)
            sCtx.stroke()

            // Hot luminous core
            sCtx.shadowBlur = 0
            sCtx.strokeStyle = '#ffffff'
            sCtx.lineWidth = Math.max(1.5, width * 0.28)
            sCtx.globalAlpha = 0.95
            sCtx.stroke()
          } else if (v.brushStyle === 'chalk') {
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.72
            sCtx.beginPath()
            sCtx.moveTo(x1, y1)
            sCtx.lineTo(x2, y2)
            sCtx.stroke()

            // Realistic chalk dust speckles
            const dist = Math.hypot(x2 - x1, y2 - y1)
            const count = Math.max(2, Math.floor(dist / 2.5))
            sCtx.fillStyle = v.brushColor
            for (let k = 0; k < count; k++) {
              const t = Math.random()
              const px =
                x1 + (x2 - x1) * t + (Math.random() - 0.5) * width * 0.85
              const py =
                y1 + (y2 - y1) * t + (Math.random() - 0.5) * width * 0.85
              const r = Math.random() * 1.5 + 0.4
              sCtx.globalAlpha = Math.random() * 0.55 + 0.25
              sCtx.beginPath()
              sCtx.arc(px, py, r, 0, TAU)
              sCtx.fill()
            }
          } else if (v.brushStyle === 'ink-pen') {
            // Calligraphy fountain pen for clean handwriting
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.95
            sCtx.beginPath()
            sCtx.moveTo(x1, y1)
            sCtx.lineTo(x2, y2)
            sCtx.stroke()
          } else if (v.brushStyle === 'frosted-wipe') {
            // Translucent glass wiper
            sCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)'
            sCtx.lineWidth = width
            sCtx.shadowColor = 'rgba(255, 255, 255, 0.4)'
            sCtx.shadowBlur = width * 0.4
            sCtx.beginPath()
            sCtx.moveTo(x1, y1)
            sCtx.lineTo(x2, y2)
            sCtx.stroke()

            const dist = Math.hypot(x2 - x1, y2 - y1)
            const beads = Math.max(1, Math.floor(dist / 6))
            sCtx.fillStyle = 'rgba(255, 255, 255, 0.7)'
            for (let k = 0; k < beads; k++) {
              const side = Math.random() > 0.5 ? 1 : -1
              const t = Math.random()
              const nx = -(y2 - y1) / (dist || 1)
              const ny = (x2 - x1) / (dist || 1)
              const px = x1 + (x2 - x1) * t + nx * (width * 0.5 * side)
              const py = y1 + (y2 - y1) * t + ny * (width * 0.5 * side)
              sCtx.beginPath()
              sCtx.arc(px, py, Math.random() * 1.8 + 0.8, 0, TAU)
              sCtx.fill()
            }
          } else {
            // soft-spray
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.shadowColor = v.brushColor
            sCtx.shadowBlur = width * 0.6
            sCtx.globalAlpha = 0.55
            sCtx.beginPath()
            sCtx.moveTo(x1, y1)
            sCtx.lineTo(x2, y2)
            sCtx.stroke()
          }

          sCtx.restore()
        },

        drawSmoothCurve(startX, startY, ctrlX, ctrlY, endX, endY, width, v) {
          const sCtx = this.sketchCtx
          sCtx.save()
          sCtx.lineCap = 'round'
          sCtx.lineJoin = 'round'

          if (v.brushStyle === 'neon-glow') {
            const glow = v.glowIntensity
            sCtx.shadowColor = v.brushColor
            sCtx.shadowBlur = glow
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.75
            sCtx.beginPath()
            sCtx.moveTo(startX, startY)
            sCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY)
            sCtx.stroke()

            sCtx.shadowBlur = 0
            sCtx.strokeStyle = '#ffffff'
            sCtx.lineWidth = Math.max(1.5, width * 0.28)
            sCtx.globalAlpha = 0.95
            sCtx.stroke()
          } else if (v.brushStyle === 'chalk') {
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.72
            sCtx.beginPath()
            sCtx.moveTo(startX, startY)
            sCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY)
            sCtx.stroke()

            const dist = Math.hypot(endX - startX, endY - startY)
            const count = Math.max(2, Math.floor(dist / 2.5))
            sCtx.fillStyle = v.brushColor
            for (let k = 0; k < count; k++) {
              const t = Math.random()
              const invT = 1 - t
              const px =
                invT * invT * startX +
                2 * invT * t * ctrlX +
                t * t * endX +
                (Math.random() - 0.5) * width * 0.85
              const py =
                invT * invT * startY +
                2 * invT * t * ctrlY +
                t * t * endY +
                (Math.random() - 0.5) * width * 0.85
              const r = Math.random() * 1.5 + 0.4
              sCtx.globalAlpha = Math.random() * 0.55 + 0.25
              sCtx.beginPath()
              sCtx.arc(px, py, r, 0, TAU)
              sCtx.fill()
            }
          } else if (v.brushStyle === 'ink-pen') {
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.95
            sCtx.beginPath()
            sCtx.moveTo(startX, startY)
            sCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY)
            sCtx.stroke()
          } else if (v.brushStyle === 'frosted-wipe') {
            sCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)'
            sCtx.lineWidth = width
            sCtx.shadowColor = 'rgba(255, 255, 255, 0.4)'
            sCtx.shadowBlur = width * 0.4
            sCtx.beginPath()
            sCtx.moveTo(startX, startY)
            sCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY)
            sCtx.stroke()
          } else {
            // soft-spray
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.shadowColor = v.brushColor
            sCtx.shadowBlur = width * 0.6
            sCtx.globalAlpha = 0.55
            sCtx.beginPath()
            sCtx.moveTo(startX, startY)
            sCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY)
            sCtx.stroke()
          }

          sCtx.restore()
        },

        drawChalkboardBg(c, W, H) {
          const grad = c.createRadialGradient(
            W / 2,
            H / 2,
            50,
            W / 2,
            H / 2,
            Math.max(W, H) * 0.7,
          )
          grad.addColorStop(0, '#151d18')
          grad.addColorStop(1, '#0b0f0c')
          c.fillStyle = grad
          c.fillRect(0, 0, W, H)

          c.strokeStyle = 'rgba(255, 255, 255, 0.02)'
          c.lineWidth = 24
          c.beginPath()
          c.moveTo(W * 0.1, H * 0.2)
          c.lineTo(W * 0.9, H * 0.25)
          c.moveTo(W * 0.15, H * 0.5)
          c.lineTo(W * 0.85, H * 0.55)
          c.moveTo(W * 0.05, H * 0.8)
          c.lineTo(W * 0.95, H * 0.78)
          c.stroke()
        },

        drawDarkCanvasBg(c, W, H) {
          const grad = c.createLinearGradient(0, 0, 0, H)
          grad.addColorStop(0, '#0d1017')
          grad.addColorStop(0.5, '#121622')
          grad.addColorStop(1, '#090c12')
          c.fillStyle = grad
          c.fillRect(0, 0, W, H)

          // Subtle blueprint grid
          c.strokeStyle = 'rgba(255, 255, 255, 0.025)'
          c.lineWidth = 1
          const sz = 40
          c.beginPath()
          for (let x = 0; x < W; x += sz) {
            c.moveTo(x, 0)
            c.lineTo(x, H)
          }
          for (let y = 0; y < H; y += sz) {
            c.moveTo(0, y)
            c.lineTo(W, y)
          }
          c.stroke()
        },

        draw(v, dt) {
          const { W, H } = env
          this.ensureCanvas()

          // Vapor fade decay if enabled
          if (v.fadeRate > 0) {
            this.sketchCtx.save()
            this.sketchCtx.globalCompositeOperation = 'destination-out'
            this.sketchCtx.fillStyle = `rgba(0, 0, 0, ${Math.min(1, v.fadeRate * dt * 8)})`
            this.sketchCtx.fillRect(0, 0, W, H)
            this.sketchCtx.restore()
          }

          // Background
          if (v.background === 'media-source') {
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
          } else if (v.background === 'chalkboard') {
            this.drawChalkboardBg(ctx, W, H)
          } else if (v.background === 'dark-canvas') {
            this.drawDarkCanvasBg(ctx, W, H)
          } else if (v.background === 'pure-white') {
            ctx.fillStyle = '#ffffff'
            ctx.fillRect(0, 0, W, H)
          } else {
            ctx.fillStyle = '#06070a'
            ctx.fillRect(0, 0, W, H)
          }

          // Draw sketch canvas
          ctx.save()
          if (v.brushStyle === 'neon-glow') {
            ctx.drawImage(this.sketchCanvas, 0, 0)
            ctx.globalCompositeOperation = 'screen'
            ctx.globalAlpha = 0.35
            ctx.drawImage(this.sketchCanvas, 0, 0)
          } else {
            ctx.drawImage(this.sketchCanvas, 0, 0)
          }
          ctx.restore()

          return `${this.totalStrokes} strokes · Canvas ${W}×${H} · ${v.brushStyle}`
        },
      }

        // Internal rendering buffers (zero allocation per frame)
        animTime: 0,

        initBuffers(cols, rows) {
          if (this.cols === cols && this.rows === rows && this.imgData) return
          this.cols = cols
          this.rows = rows

          this.sampleCanvas.width = cols
          this.sampleCanvas.height = rows
          this.sampleCtx = this.sampleCanvas.getContext('2d', {
            willReadFrequently: true,

          this.offCanvas.width = cols
          this.offCanvas.height = rows
          this.offCtx = this.offCanvas.getContext('2d')

          this.imgData = this.offCtx.createImageData(cols, rows)
          this.pixels32 = new Uint32Array(this.imgData.data.buffer)

          const size = cols * rows
          this.lumGrid = new Float32Array(size)
          this.beamGrid = new Float32Array(size)
          this.srcRGrid = new Uint8Array(size)
          this.srcGGrid = new Uint8Array(size)
          this.srcBGrid = new Uint8Array(size)

        draw(v, dt) {
          const { W, H } = env
          if (!W || !H) return 'Initializing'

          this.animTime += dt * v.waveSpeed
          const time = this.animTime

          const pSize = Math.max(2, Math.floor(v.pixelSize))
          const cols = Math.ceil(W / pSize)
          const rows = Math.ceil(H / pSize)
          this.initBuffers(cols, rows)

          // 1. Downscale source frame into sample buffer
          this.sampleCtx.drawImage(env.sourceCanvas, 0, 0, cols, rows)
          const srcData = this.sampleCtx.getImageData(0, 0, cols, rows).data

          const lumGrid = this.lumGrid
          const beamGrid = this.beamGrid
          const srcRGrid = this.srcRGrid
          const srcGGrid = this.srcGGrid
          const srcBGrid = this.srcBGrid
          const pixels32 = this.pixels32

          const wFreq = v.waveFrequency
          const wAmp = v.waveAmplitude
          const wPattern = v.wavePattern
          const cursor = env.cursor
          const hasCursor = env.cursorEnabled && cursor && (cursor.x > 0 || cursor.y > 0)
          const mouseU = hasCursor ? cursor.x / W : -10
          const mouseV = hasCursor ? cursor.y / H : -10
          const rippleStrength = env.cursorEnabled ? v.interactiveRipple : 0

          // 2. Wave displacement & luminance sampling
          for (let y = 0; y < rows; y++) {
            const vCoord = y / rows
            for (let x = 0; x < cols; x++) {
              const uCoord = x / cols
              let dispX = 0
              let dispY = 0
              let waveLum = 0

              if (wPattern === 'ocean-swell') {
                const swell = Math.sin(
                  (uCoord * 2.2 + vCoord * 3.4) * wFreq - time,
                )
                dispX = swell * 0.05 * wAmp
                dispY =
                  Math.cos((uCoord * 3.0 - vCoord * 1.5) * wFreq + time * 0.8) *
                  0.04 *
                  wAmp
                waveLum = (swell * 0.5 + 0.5) * (wAmp * 0.45)
              } else if (wPattern === 'diagonal-flow') {
                const diag = Math.sin(
                  (uCoord + vCoord) * wFreq * 3.8 - time * 1.6,
                )
                dispX = diag * 0.045 * wAmp
                dispY = diag * 0.045 * wAmp
                waveLum = (diag * 0.5 + 0.5) * (wAmp * 0.5)
              } else if (wPattern === 'radial-pulse') {
                const dx = uCoord - 0.5
                const dy = vCoord - 0.5
                const r = Math.hypot(dx, dy)
                const p = Math.sin(r * wFreq * 16.0 - time * 2.5)
                dispX = (dx / (r || 1)) * p * 0.05 * wAmp
                dispY = (dy / (r || 1)) * p * 0.05 * wAmp
                waveLum = (p * 0.5 + 0.5) * (wAmp * 0.4)
              } else if (wPattern === 'glitch-steps') {
                const step = Math.floor(vCoord * 14.0)
                const g =
                  (Math.sin(step * 78.2 + Math.floor(time * 5.0)) > 0.4
                    ? 0.06
                    : -0.02) * wAmp
                dispX = g
                dispY = 0
                waveLum = (step % 2 === 0 ? 0.2 : -0.1) * wAmp
              } else {
                // harmonic-sine (default)
                const w1 = Math.sin(vCoord * wFreq * 6.28 + time)
                const w2 = Math.cos(uCoord * wFreq * 4.71 - time * 0.7)
                dispX = (w1 * 0.035 + w2 * 0.02) * wAmp
                dispY =
                  (Math.cos(vCoord * wFreq * 5.0 - time * 0.8) * 0.035 +
                    Math.sin(uCoord * wFreq * 3.14 + time) * 0.02) *
                  wAmp
                waveLum =
                  (Math.sin(
                    (uCoord * 1.5 + vCoord * 2.5) * wFreq * 3.14 - time,
                  ) *
                    0.5 +
                    0.5) *
                  (wAmp * 0.4)
              }

              // Interactive mouse ripple deflection
              if (hasCursor) {
                const dist = Math.hypot(uCoord - mouseU, vCoord - mouseV)
                if (dist < 0.45) {
                  const rip =
                    Math.sin(dist * 28.0 - time * 9.0) *
                    Math.exp(-dist * 5.0) *
                    rippleStrength *
                    0.07
                  dispX += ((uCoord - mouseU) / (dist || 1)) * rip
                  dispY += ((vCoord - mouseV) / (dist || 1)) * rip
                  waveLum += rip * 2.5
                }
              }

              const sx = Math.max(
                0,
                Math.min(cols - 1, Math.round((uCoord + dispX) * cols)),
              )
              const sy = Math.max(
                0,
                Math.min(rows - 1, Math.round((vCoord + dispY) * rows)),
              )
              const sidx = (sy * cols + sx) * 4

              const r = srcData[sidx]
              const g = srcData[sidx + 1]
              const b = srcData[sidx + 2]

              const idx = y * cols + x
              srcRGrid[idx] = r
              srcGGrid[idx] = g
              srcBGrid[idx] = b

              let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255
              lum = Math.min(1, Math.max(0, lum + waveLum))
              lumGrid[idx] = lum
            }
          }

          // 3. Pixel Beams Extrusion
          const bDir = v.beamDirection
          const intensity = v.beamIntensity
          const decay = v.beamDecay
          const beamThreshold = 0.42

          if (bDir === 'down') {
            for (let x = 0; x < cols; x++) {
              let beam = 0
              for (let y = 0; y < rows; y++) {
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beam = Math.max(emit, beam * decay)
                beamGrid[idx] = beam
              }
            }
          } else if (bDir === 'up') {
            for (let x = 0; x < cols; x++) {
              let beam = 0
              for (let y = rows - 1; y >= 0; y--) {
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beam = Math.max(emit, beam * decay)
                beamGrid[idx] = beam
              }
            }
          } else if (bDir === 'horizontal') {
            for (let y = 0; y < rows; y++) {
              let beam = 0
              for (let x = 0; x < cols; x++) {
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beam = Math.max(emit, beam * decay)
                beamGrid[idx] = beam
              }
            }
          } else if (bDir === 'diagonal-down') {
            for (let y = 0; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                const prev =
                  x > 0 && y > 0 ? beamGrid[(y - 1) * cols + (x - 1)] : 0
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beamGrid[idx] = Math.max(emit, prev * decay)
              }
            }
          } else {
            // radial-out
            const cx = cols / 2
            const cy = rows / 2
            for (let y = 0; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                const idx = y * cols + x
                const dist = Math.hypot(x - cx, y - cy)
                const radialFactor =
                  Math.sin(dist * 0.15 - time * 2.0) * 0.5 + 0.5
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.5 * intensity
                    : 0
                beamGrid[idx] = emit * (0.6 + radialFactor * 0.6)
              }
            }
          }

          // 4. Dithering Matrix calculation & Color mapping
          const pattern = v.ditherPattern
          const levels = v.ditherLevels
          const threshold = v.threshold
          const spread = v.spread
          const contrast = v.contrast
          const palette = v.colorPalette

          const customA = parseHexColor(v.colorA)
          const customB = parseHexColor(v.colorB)

          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const idx = y * cols + x
              let effLum = lumGrid[idx] + beamGrid[idx] * 0.85
              effLum = Math.max(0, Math.min(1, (effLum - 0.5) * contrast + 0.5))

              // Pattern matrix threshold lookup
              let bVal = 0.5
              if (pattern === 'bayer4') {
                bVal = BAYER4_DATA[(y & 3) * 4 + (x & 3)]
              } else if (pattern === 'bayer8') {
                bVal = BAYER8_DATA[(y & 7) * 8 + (x & 7)]
              } else if (pattern === 'bayer2') {
                bVal = BAYER2_DATA[(y & 1) * 2 + (x & 1)]
              } else if (pattern === 'clustered-dot') {
                bVal = CLUSTERED4_DATA[(y & 3) * 4 + (x & 3)]
              } else if (pattern === 'blue-noise') {
                bVal = hashNoise(x, y)
              }

              const dithered = effLum + (bVal - 0.5) * spread

              // Quantize levels
              let state = 0
              if (levels.startsWith('2-level')) {
                state = dithered >= threshold ? 1.0 : 0.0
              } else if (levels.startsWith('4-level')) {
                const q = Math.floor((dithered - threshold + 0.5) * 3 + 0.5)
                state = Math.max(0, Math.min(3, q)) / 3
              } else if (levels.startsWith('8-level')) {
                const q = Math.floor((dithered - threshold + 0.5) * 7 + 0.5)
                state = Math.max(0, Math.min(7, q)) / 7
              } else {
                state = Math.max(0, Math.min(1, dithered))
              }

              // Color mapping
              let r = 0,
                g = 0,
                b = 0
              if (palette === 'neon-cyan') {
                if (state <= 0) {
                  r = 6
                  g = 10
                  b = 28
                } else {
                  const core = Math.max(0, Math.min(1, (effLum - 0.72) / 0.28))
                  r = Math.round(0 + core * 210)
                  g = Math.round(225 + core * 30)
                  b = 255
                }
              } else if (palette === 'cyber-green') {
                if (state <= 0) {
                  r = 3
                  g = 14
                  b = 8
                } else {
                  const core = Math.max(0, Math.min(1, (effLum - 0.72) / 0.28))
                  r = Math.round(core * 200)
                  g = 255
                  b = Math.round(100 + core * 145)
                }
              } else if (palette === 'amber-crt') {
                if (state <= 0) {
                  r = 16
                  g = 6
                  b = 1
                } else {
                  const core = Math.max(0, Math.min(1, (effLum - 0.72) / 0.28))
                  r = 255
                  g = Math.round(145 + core * 100)
                  b = Math.round(core * 180)
                }
              } else if (palette === 'gameboy') {
                if (state < 0.25) {
                  r = 15
                  g = 56
                  b = 15
                } else if (state < 0.55) {
                  r = 48
                  g = 98
                  b = 48
                } else if (state < 0.85) {
                  r = 139
                  g = 172
                  b = 15
                } else {
                  r = 155
                  g = 188
                  b = 15
                }
              } else if (palette === 'sunset') {
                if (state <= 0) {
                  r = 18
                  g = 4
                  b = 30
                } else if (effLum < 0.55) {
                  r = 255
                  g = 16
                  b = 120
                } else if (effLum < 0.8) {
                  r = 255
                  g = 170
                  b = 20
                } else {
                  r = 255
                  g = 245
                  b = 180
                }
              } else if (palette === 'source-rgb') {
                const sr = srcRGrid[idx]
                const sg = srcGGrid[idx]
                const sb = srcBGrid[idx]
                if (state <= 0.05) {
                  r = Math.round(sr * 0.12)
                  g = Math.round(sg * 0.12)
                  b = Math.round(sb * 0.12)
                } else {
                  r = Math.min(
                    255,
                    Math.round(sr * (0.4 + state * 1.1) + state * 40),
                  )
                  g = Math.min(
                    255,
                    Math.round(sg * (0.4 + state * 1.1) + state * 40),
                  )
                  b = Math.min(
                    255,
                    Math.round(sb * (0.4 + state * 1.1) + state * 40),
                  )
                }
              } else if (palette === 'monochrome') {
                const val = Math.round(state * 245 + 10)
                r = val
                g = val
                b = val
              } else {
                // custom
                const t = state
                r = Math.round(customA[0] + (customB[0] - customA[0]) * t)
                g = Math.round(customA[1] + (customB[1] - customA[1]) * t)
                b = Math.round(customA[2] + (customB[2] - customA[2]) * t)
                if (effLum > 0.8) {
                  const boost = (effLum - 0.8) / 0.2
                  r = Math.min(255, Math.round(r + boost * 55))
                  g = Math.min(255, Math.round(g + boost * 55))
                  b = Math.min(255, Math.round(b + boost * 55))
                }
              }

              pixels32[idx] = packRgba32(r, g, b, 255)
            }
          }

          // 5. Draw dither buffer to main screen
          this.offCtx.putImageData(this.imgData, 0, 0)

          ctx.imageSmoothingEnabled = false
          ctx.drawImage(this.offCanvas, 0, 0, W, H)

          // 6. Phosphor Bloom Glow
          if (v.bloomGlow > 0.01) {
            ctx.save()
            ctx.globalCompositeOperation = 'screen'
            ctx.globalAlpha = v.bloomGlow
            ctx.filter = 'blur(6px)'
            ctx.drawImage(this.offCanvas, 0, 0, W, H)
            ctx.restore()
          }

          // 7. CRT Scanlines
          if (v.scanlines > 0.01) {
            ctx.save()
            ctx.fillStyle = `rgba(0, 0, 0, ${v.scanlines})`
            const step = Math.max(2, pSize)
            for (let y = 0; y < H; y += step) {
              ctx.fillRect(0, y, W, 1)
            }
            ctx.restore()
          }

          // 8. Cinematic Vignette
          if (v.vignette > 0.01) {
            ctx.save()
            const vig = ctx.createRadialGradient(
              W / 2,
              H / 2,
              Math.min(W, H) * 0.35,
              W / 2,
              H / 2,
              Math.max(W, H) * 0.72,
            )
            vig.addColorStop(0, 'rgba(0, 0, 0, 0)')
            vig.addColorStop(1, `rgba(0, 0, 0, ${v.vignette * 0.9})`)
            ctx.fillStyle = vig
            ctx.fillRect(0, 0, W, H)
            ctx.restore()
          }

          return `Dither Wave ${cols}×${rows} · ${pSize}px · ${v.colorPalette} · ${v.ditherPattern} · ${v.beamDirection} beams`
        },
      }

          } else {
            gl = glCanvas.getContext('webgl', { premultipliedAlpha: false, preserveDrawingBuffer: true }) ||

            isWebGL2 = false

              -1, -1,
               1, -1,
              -1,  1,
               1,  1,
            ]), gl.STATIC_DRAW)

            sharedTexture = gl.createTexture()
            gl.bindTexture(gl.TEXTURE_2D, sharedTexture)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)

            gl.bindTexture(gl.TEXTURE_2D, noiseTexture)

              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, noiseImg)
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT)
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT)

        const shader = glContext.createShader(type)
        glContext.shaderSource(shader, source)
        glContext.compileShader(shader)
        if (!glContext.getShaderParameter(shader, glContext.COMPILE_STATUS)) {
          console.error('Shader compile error:', glContext.getShaderInfoLog(shader))
          glContext.deleteShader(shader)
          return null
        }
        return shader

      function getOrCreateProgram(id, fsSource, customVsSource = null) {
        const { gl, isWebGL2 } = getWebGL()
        if (!gl) return null
        if (shaderPrograms[id]) return shaderPrograms[id]

        let vsSource = customVsSource
        if (!vsSource) {
          if (fsSource.trim().startsWith('#version 300 es')) {
            vsSource = `#version 300 es
              in vec2 a_position;
              out vec2 v_imageUV;
              out vec2 v_uv;
              void main() {
                vec2 uv = (a_position + 1.0) * 0.5;
                v_uv = uv;
                v_imageUV = vec2(uv.x, 1.0 - uv.y);
                gl_Position = vec4(a_position, 0.0, 1.0);
              }
            `
          } else {
            vsSource = `
              attribute vec2 a_position;
              varying vec2 v_uv;
              void main() {
                v_uv = (a_position + 1.0) * 0.5;
                v_uv.y = 1.0 - v_uv.y;
                gl_Position = vec4(a_position, 0.0, 1.0);
              }
            `
          }
        }

        const vs = compileShader(gl, gl.VERTEX_SHADER, vsSource)
        const fs = compileShader(gl, gl.FRAGMENT_SHADER, fsSource)
        if (!vs || !fs) return null

        const prog = gl.createProgram()
        gl.attachShader(prog, vs)
        gl.attachShader(prog, fs)
        gl.linkProgram(prog)
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          console.error('Program link error for ' + id + ':', gl.getProgramInfoLog(prog))
          return null
        }

        const positionLocation = gl.getAttribLocation(prog, 'a_position')
        shaderPrograms[id] = { prog, positionLocation }
        return shaderPrograms[id]
      }

        if (!hex || hex[0] !== '#') return [0, 0, 0]
        let c = hex.substring(1)
        if (c.length === 3) c = c.split('').map(x => x + x).join('')
        const num = parseInt(c, 16)
        return [(num >> 16 & 255) / 255, (num >> 8 & 255) / 255, (num & 255) / 255]

            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            return 'Heatmap (WebGL fallback)'
          }

          const progInfo = getOrCreateProgram('heatmap', heatmapFS)
          if (!progInfo) return 'Heatmap error'

          this.ensureThermalCanvas(W, H)
          const pCtx = this.thermalCtx
          pCtx.drawImage(env.sourceCanvas, 0, 0, W, H)

          const srcImgData = pCtx.getImageData(0, 0, W, H)
          const srcData = srcImgData.data
          const totalPx = W * H

          const gray = new Uint8Array(totalPx)
          for (let i = 0; i < totalPx; i++) {
            const px = i * 4
            const lum = (srcData[px] * 77 + srcData[px + 1] * 150 + srcData[px + 2] * 29) >> 8
            gray[i] = 255 - lum
          }

          const dstImgData = pCtx.createImageData(W, H)
          const dst = dstImgData.data

          const stepX = Math.max(1, Math.floor(W / 120))
          const stepY = Math.max(1, Math.floor(H / 80))

          for (let y = 0; y < H; y++) {
            const yOff = y * W
            const yMin = Math.max(0, y - stepY * 4) * W
            const yMax = Math.min(H - 1, y + stepY * 4) * W
            for (let x = 0; x < W; x++) {
              const idx = yOff + x
              const px = idx * 4
              const cVal = gray[idx]
              const xMin = Math.max(0, x - stepX * 4)
              const xMax = Math.min(W - 1, x + stepX * 4)

              const gBlur = (cVal * 4 + gray[yMin + x] * 2 + gray[yMax + x] * 2 + gray[yOff + xMin] * 2 + gray[yOff + xMax] * 2) / 12

              const edge = Math.abs(gray[yOff + Math.min(W - 1, x + 1)] - gray[yOff + Math.max(0, x - 1)]) +
                           Math.abs(gray[Math.min(H - 1, y + 1) * W + x] - gray[Math.max(0, y - 1) * W + x])

              dst[px + 0] = Math.min(255, 255 - cVal)
              dst[px + 1] = Math.min(255, gBlur)
              dst[px + 2] = Math.min(255, edge * 3)
              dst[px + 3] = 255
            }
          }

          pCtx.putImageData(dstImgData, 0, 0)

          if (!this.thermalTexture) {
            this.thermalTexture = gl.createTexture()
          }
          gl.activeTexture(gl.TEXTURE0)
          gl.bindTexture(gl.TEXTURE_2D, this.thermalTexture)
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.thermalCanvas)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)

          glCanvas.width = W
          glCanvas.height = H
          gl.viewport(0, 0, W, H)

          gl.useProgram(progInfo.prog)

          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer)
          gl.enableVertexAttribArray(progInfo.positionLocation)
          gl.vertexAttribPointer(progInfo.positionLocation, 2, gl.FLOAT, false, 0, 0)

          const count = Math.max(2, Math.min(10, Math.round(v.colorCount !== undefined ? v.colorCount : 6)))

          const colorUniforms = new Float32Array(10 * 4)
          for (let i = 0; i < 10; i++) {
            const hex = v[`color${i + 1}`] || (HEATMAP_PRESETS['DEFAULT'].colors[i] || '#ffffff')
            const rgb = hexToRgb(hex)
            colorUniforms[i * 4 + 0] = rgb[0]
            colorUniforms[i * 4 + 1] = rgb[1]
            colorUniforms[i * 4 + 2] = rgb[2]
            colorUniforms[i * 4 + 3] = 1.0
          }

          const curX = env.cursorEnabled ? (env.cursor.targetX / (W || 1)) : -1000.0
          const curY = env.cursorEnabled ? (1.0 - env.cursor.targetY / (H || 1)) : -1000.0
          const cursorHeat = env.cursorEnabled ? (v.cursorHeat !== undefined ? v.cursorHeat : 1.0) : 0.0

          gl.uniform1i(gl.getUniformLocation(progInfo.prog, 'u_image'), 0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_time'), env.time)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_speed'), v.speed !== undefined ? v.speed : 1.00)

          const cBack = hexToRgb(v.colorBack || '#000000')
          gl.uniform4f(gl.getUniformLocation(progInfo.prog, 'u_colorBack'), cBack[0], cBack[1], cBack[2], 1.0)
          gl.uniform4fv(gl.getUniformLocation(progInfo.prog, 'u_colors'), colorUniforms)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_colorsCount'), count)

          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_contour'), v.contour !== undefined ? v.contour : 1.00)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_angle'), v.angle !== undefined ? v.angle : 172)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_noise'), v.noise !== undefined ? v.noise : 1.00)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_innerGlow'), v.innerGlow !== undefined ? v.innerGlow : 0.40)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_outerGlow'), v.outerGlow !== undefined ? v.outerGlow : 0.50)

          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_scale'), v.scale !== undefined ? v.scale : 0.75)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_rotation'), v.rotation !== undefined ? v.rotation : 0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_offsetX'), v.offsetX !== undefined ? v.offsetX : 0.00)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_offsetY'), v.offsetY !== undefined ? v.offsetY : 0.00)

          gl.uniform2f(gl.getUniformLocation(progInfo.prog, 'u_cursor'), curX, curY)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_cursorHeat'), cursorHeat)

          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
          ctx.drawImage(glCanvas, 0, 0)

          return `Heatmap · ${count} colors · Angle ${v.angle}° · Scale ${v.scale}`
        },
      }

      // ======================================================================
      // 7. LIQUID METAL EFFECT (Molten chrome fluid & specular chromatic reflection)
      // Reference: https://github.com/paper-design/shaders
      // ======================================================================
      const liquidMetalFS = `
        precision highp float;
        varying vec2 v_uv;
        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_speed;
        uniform float u_repetition;
        uniform float u_softness;
        uniform float u_distortion;
        uniform float u_contour;
        uniform float u_angle;
        uniform float u_chromaticShift;
        uniform float u_specularBoost;
        uniform vec2 u_cursor;
        uniform float u_cursorRipple;
        uniform int u_preset;
        uniform vec3 u_colorTint;
        uniform vec3 u_colorBack;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m; m = m*m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        float fbm(vec2 p) {
          float f = 0.0;
          f += 0.5000 * snoise(p); p = p * 2.02;
          f += 0.2500 * snoise(p); p = p * 2.03;
          f += 0.1250 * snoise(p);
          return f;
        }

        float getStripeBand(float p, float softness) {
          float fp = fract(p);
          float s = max(softness, 0.01);
          float b1 = smoothstep(0.0, s, fp) * (1.0 - smoothstep(0.4 - s, 0.4 + s, fp));
          float b2 = smoothstep(0.5 - s, 0.5 + s, fp) * (1.0 - smoothstep(0.85 - s, 0.85 + s, fp));
          float spec = pow(smoothstep(0.15 - s * 0.5, 0.15 + s * 0.5, fp) * (1.0 - smoothstep(0.25 - s * 0.5, 0.25 + s * 0.5, fp)), 2.0) * 1.5;
          return clamp(b1 * 0.7 + b2 * 0.95 + spec, 0.0, 1.5);
        }

        void main() {
          vec2 uv = v_uv;
          vec2 texel = 1.0 / u_resolution;
          vec4 img = texture2D(u_image, uv);
          float luma = dot(img.rgb, vec3(0.299, 0.587, 0.114));

          float lLeft  = dot(texture2D(u_image, uv - vec2(texel.x * 2.0, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lRight = dot(texture2D(u_image, uv + vec2(texel.x * 2.0, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lUp    = dot(texture2D(u_image, uv - vec2(0.0, texel.y * 2.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lDown  = dot(texture2D(u_image, uv + vec2(0.0, texel.y * 2.0)).rgb, vec3(0.299, 0.587, 0.114));
          vec2 norm = vec2(lRight - lLeft, lDown - lUp);
          float edge = length(norm) * 2.5;

          float rad = (-u_angle + 70.0) * 3.14159265 / 180.0;
          mat2 rot = mat2(cos(rad), -sin(rad), sin(rad), cos(rad));
          vec2 rotUV = rot * (uv - 0.5) + 0.5;

          float fluid = fbm(uv * 3.5 + vec2(u_time * 0.15 * u_speed, u_time * 0.08 * u_speed));

          float distToCursor = length((uv - u_cursor) * vec2(u_resolution.x / u_resolution.y, 1.0));
          float cursorWave = sin(distToCursor * 25.0 - u_time * 8.0) * exp(-distToCursor * 4.0) * u_cursorRipple * 0.15;

          float baseCoord = rotUV.y * u_repetition + 
                            fluid * u_distortion * 1.5 + 
                            edge * u_contour * 0.8 + 
                            cursorWave + 
                            luma * 0.4 - 
                            u_time * 0.35 * u_speed;

          float disp = u_chromaticShift * 0.05;
          float rVal = getStripeBand(baseCoord + disp, u_softness);
          float gVal = getStripeBand(baseCoord, u_softness);
          float bVal = getStripeBand(baseCoord - disp, u_softness);
          vec3 metal = vec3(rVal, gVal, bVal) * u_specularBoost;

          vec3 metalColor = metal;
          if (u_preset == 0) {
            metalColor = metal * vec3(0.92, 0.96, 1.05);
          } else if (u_preset == 1) {
            metalColor = vec3(metal.r * 1.15, metal.g * 0.92, metal.b * 0.35);
          } else if (u_preset == 2) {
            metalColor = vec3(metal.r * 1.1, metal.g * 0.65, metal.b * 0.55);
          } else if (u_preset == 3) {
            vec3 iridescent = vec3(
              sin(baseCoord * 3.0) * 0.5 + 0.5,
              sin(baseCoord * 3.0 + 2.0) * 0.5 + 0.5,
              sin(baseCoord * 3.0 + 4.0) * 0.5 + 0.5
            );
            metalColor = mix(metal, iridescent * 1.2, 0.55);
          } else if (u_preset == 4) {
            metalColor = vec3(metal.r * 0.3, metal.g * 0.95, metal.b * 1.15);
          } else {
            metalColor = pow(metal, vec3(1.6)) * vec3(0.65, 0.7, 0.8);
          }

          metalColor = mix(metalColor, metalColor * u_colorTint, 0.6);

          float mask = clamp(luma * 1.8 + edge * 1.5, 0.0, 1.0);
          vec3 finalCol = mix(u_colorBack, metalColor, mask);

          gl_FragColor = vec4(finalCol, 1.0);
        }
      `

      const liquidMetal = {
        id: 'liquid-metal',
        label: 'Liquid Metal',
        groups: [
          {
            title: 'Metal Material & Preset',
            controls: [
              {

        draw(v, dt) {
          const { W, H } = env

      // ======================================================================
      // 8. GEM SMOKE EFFECT (Glassy gemstone refraction & ethereal smoky wisps)
      // Reference: https://github.com/paper-design/shaders
      // ======================================================================
      const gemSmokeFS = `
        precision highp float;
        varying vec2 v_uv;
        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_smokeSpeed;
        uniform float u_smokeSize;
        uniform float u_innerDistortion;
        uniform float u_outerDistortion;
        uniform float u_innerGlow;
        uniform float u_outerGlow;
        uniform float u_smokeDensity;
        uniform float u_refraction;
        uniform float u_angle;
        uniform vec2 u_cursor;
        uniform float u_cursorSwirl;
        uniform int u_gemType;
        uniform vec3 u_gemColor;
        uniform vec3 u_smokeColor;
        uniform vec3 u_colorBack;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m; m = m*m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        float fbm(vec2 p) {
          float f = 0.0;
          f += 0.5000 * snoise(p); p = p * 2.02;
          f += 0.2500 * snoise(p); p = p * 2.03;
          f += 0.1250 * snoise(p); p = p * 2.01;
          f += 0.0625 * snoise(p);
          return f;
        }

        vec2 smokeWarp(vec2 p, float t, float distort) {
          vec2 q = vec2(fbm(p + vec2(0.0, t * 0.2)), fbm(p + vec2(5.2, 1.3 - t * 0.15)));
          vec2 r = vec2(fbm(p + 3.0 * q + vec2(1.7, 9.2 + t * 0.15)), fbm(p + 3.0 * q + vec2(8.3, 2.8 - t * 0.12)));
          return p + r * distort;
        }

        void main() {
          vec2 uv = v_uv;
          vec2 texel = 1.0 / u_resolution;
          vec4 img = texture2D(u_image, uv);
          float luma = dot(img.rgb, vec3(0.299, 0.587, 0.114));

          float lLeft  = dot(texture2D(u_image, uv - vec2(texel.x * 2.0, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lRight = dot(texture2D(u_image, uv + vec2(texel.x * 2.0, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lUp    = dot(texture2D(u_image, uv - vec2(0.0, texel.y * 2.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lDown  = dot(texture2D(u_image, uv + vec2(0.0, texel.y * 2.0)).rgb, vec3(0.299, 0.587, 0.114));
          vec2 facetNorm = vec2(lRight - lLeft, lDown - lUp);
          float facetEdge = length(facetNorm) * 3.0;

          vec2 refractUV = uv + facetNorm * u_refraction * 0.08;

          float rad = u_angle * 3.14159265 / 180.0;
          vec2 flow = vec2(cos(rad), sin(rad)) * u_time * 0.2 * u_smokeSpeed;

          vec2 toCursor = (uv - u_cursor) * vec2(u_resolution.x / u_resolution.y, 1.0);
          float distCursor = length(toCursor);
          vec2 vortex = vec2(-toCursor.y, toCursor.x) * exp(-distCursor * 5.0) * u_cursorSwirl * 0.3;

          vec2 innerP = refractUV * u_smokeSize * 4.0 + flow + vortex;
          vec2 warpedInner = smokeWarp(innerP, u_time * u_smokeSpeed, u_innerDistortion);
          float innerSmoke = fbm(warpedInner);
          innerSmoke = pow(clamp(innerSmoke * 0.5 + 0.5, 0.0, 1.0), 1.4) * u_smokeDensity;

          vec2 outerP = uv * u_smokeSize * 2.5 - flow * 0.7 + vortex;
          vec2 warpedOuter = smokeWarp(outerP, u_time * u_smokeSpeed * 0.7, u_outerDistortion);
          float outerSmoke = fbm(warpedOuter);
          outerSmoke = pow(clamp(outerSmoke * 0.5 + 0.5, 0.0, 1.0), 1.8) * u_smokeDensity;

          vec3 gemBase = u_gemColor;
          vec3 smokeBase = u_smokeColor;

          if (u_gemType == 0) {
            gemBase = vec3(0.0, 0.85, 0.45);
            smokeBase = vec3(0.1, 1.0, 0.75);
          } else if (u_gemType == 1) {
            gemBase = vec3(0.9, 0.05, 0.2);
            smokeBase = vec3(1.0, 0.5, 0.15);
          } else if (u_gemType == 2) {
            gemBase = vec3(0.05, 0.35, 0.95);
            smokeBase = vec3(0.4, 0.85, 1.0);
          } else if (u_gemType == 3) {
            gemBase = vec3(0.55, 0.05, 0.85);
            smokeBase = vec3(0.95, 0.35, 0.9);
          } else if (u_gemType == 4) {
            gemBase = vec3(0.85, 0.92, 1.0);
            smokeBase = vec3(
              sin(warpedInner.x * 2.0) * 0.5 + 0.5,
              sin(warpedInner.y * 2.0 + 2.0) * 0.5 + 0.5,
              sin((warpedInner.x + warpedInner.y) * 2.0 + 4.0) * 0.5 + 0.5
            );
          } else {
            gemBase = vec3(0.12, 0.13, 0.18);
            smokeBase = vec3(0.7, 0.75, 0.85);
          }

          float sparkle = pow(clamp(fbm(refractUV * 25.0 + u_time * 0.5), 0.0, 1.0), 4.0) * facetEdge * 2.5;

          vec3 gemLit = gemBase * (luma * 0.6 + 0.4) * (innerSmoke * u_innerGlow * 1.5 + 0.2);
          vec3 smokeAura = smokeBase * outerSmoke * u_outerGlow * 1.2;
          vec3 facetSparkle = vec3(1.0, 0.98, 0.95) * (facetEdge * 0.8 + sparkle);

          float gemMask = clamp(luma * 1.5 + facetEdge * 1.2, 0.0, 1.0);
          vec3 scene = mix(smokeAura, gemLit + facetSparkle, gemMask);
          vec3 finalCol = mix(u_colorBack, scene, clamp(gemMask + outerSmoke * u_outerGlow * 0.8, 0.0, 1.0));

          gl_FragColor = vec4(finalCol, 1.0);
        }
      `

      const halftoneCMYKFS = `
        precision highp float;
        varying vec2 v_uv;
        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform float u_scale;
        uniform float u_softness;
        uniform float u_angle;
        uniform float u_contrast;
        uniform float u_opacity;
        uniform float u_cScale;
        uniform float u_mScale;
        uniform float u_yScale;
        uniform float u_kScale;
        uniform vec3 u_paperColor;
        uniform vec2 u_cursor;
        uniform float u_cursorDistort;

        mat2 rot2d(float angle) {
          float s = sin(angle);
          float c = cos(angle);
          return mat2(c, -s, s, c);
        }

        float getChannelDot(vec2 uv, float angleDeg, float channelVal, float scale, float softness) {
          float rad = angleDeg * 3.14159265 / 180.0;
          mat2 rot = rot2d(rad);
          vec2 rotUV = rot * (uv * u_resolution) / scale;
          vec2 grid = fract(rotUV) - 0.5;
          float d = length(grid);
          float radius = sqrt(clamp(channelVal, 0.0, 1.0)) * 0.7071;
          float s = max(softness * 0.5, 0.001);
          return 1.0 - smoothstep(radius - s, radius + s, d);
        }

        void main() {
          vec2 uv = v_uv;
          
          vec2 toCursor = (uv - u_cursor) * vec2(u_resolution.x / u_resolution.y, 1.0);
          float distCursor = length(toCursor);
          if (distCursor < 0.45 && u_cursorDistort > 0.0) {
            vec2 disp = normalize(toCursor) * sin(distCursor * 22.0) * exp(-distCursor * 5.5) * u_cursorDistort * 0.035;
            uv += disp;
          }

          vec4 img = texture2D(u_image, uv);
          vec3 rgb = clamp(img.rgb, 0.0, 1.0);

          rgb = clamp((rgb - 0.5) * u_contrast + 0.5, 0.0, 1.0);

          float k = 1.0 - max(max(rgb.r, rgb.g), rgb.b);
          float denom = max(1.0 - k, 0.0001);
          float c = (1.0 - rgb.r - k) / denom;
          float m = (1.0 - rgb.g - k) / denom;
          float y = (1.0 - rgb.b - k) / denom;

          c = clamp(c * u_cScale, 0.0, 1.0);
          m = clamp(m * u_mScale, 0.0, 1.0);
          y = clamp(y * u_yScale, 0.0, 1.0);
          k = clamp(k * u_kScale, 0.0, 1.0);

          // Standard offset printing angles: C: 15°, M: 75°, Y: 0°, K: 45°
          float dotC = getChannelDot(uv, u_angle + 15.0, c, u_scale, u_softness);
          float dotM = getChannelDot(uv, u_angle + 75.0, m, u_scale, u_softness);
          float dotY = getChannelDot(uv, u_angle + 0.0,  y, u_scale, u_softness);
          float dotK = getChannelDot(uv, u_angle + 45.0, k, u_scale, u_softness);

          vec3 whitePaper = u_paperColor;
          vec3 cyanInk    = vec3(0.0, 0.65, 0.85);
          vec3 magentaInk = vec3(0.85, 0.05, 0.5);
          vec3 yellowInk  = vec3(0.95, 0.9, 0.05);
          vec3 blackInk   = vec3(0.05, 0.05, 0.08);

          vec3 outColor = whitePaper;
          outColor *= (vec3(1.0) - cyanInk * dotC);
          outColor *= (vec3(1.0) - magentaInk * dotM);
          outColor *= (vec3(1.0) - yellowInk * dotY);
          outColor *= (vec3(1.0) - (vec3(1.0) - blackInk) * dotK);

          vec3 finalRgb = mix(rgb, outColor, u_opacity);
          gl_FragColor = vec4(finalRgb, 1.0);
        }
      `

      // ======================================================================
      // 10. HALFTONE DOTS (Graphic halftone raster grids with shapes & waves)
      // Reference: https://shaders.paper.design/halftone-dots
      // ======================================================================
      const halftoneDotsFS = `
        precision highp float;
        varying vec2 v_uv;
        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_scale;
        uniform float u_softness;
        uniform float u_angle;
        uniform float u_contrast;
        uniform float u_waveSpeed;
        uniform float u_waveAmp;
        uniform int u_gridType;
        uniform int u_dotShape;
        uniform bool u_invert;
        uniform vec3 u_dotColor;
        uniform vec3 u_backColor;
        uniform vec2 u_cursor;
        uniform float u_cursorRipple;

        mat2 rot2d(float angle) {
          float s = sin(angle);
          float c = cos(angle);
          return mat2(c, -s, s, c);
        }

        float getDotDist(vec2 uv, int shape) {
          if (shape == 0) {
            return length(uv);
          } else if (shape == 1) {
            return (abs(uv.x) + abs(uv.y)) * 0.7071;
          } else if (shape == 2) {
            return max(abs(uv.x), abs(uv.y));
          } else {
            return min(length(uv), min(abs(uv.x) + abs(uv.y) * 0.35, abs(uv.y) + abs(uv.x) * 0.35));
          }
        }

        void main() {
          vec2 uv = v_uv;

          float rad = u_angle * 3.14159265 / 180.0;
          mat2 rot = rot2d(rad);

          vec2 toCursor = (uv - u_cursor) * vec2(u_resolution.x / u_resolution.y, 1.0);
          float distCursor = length(toCursor);
          if (distCursor < 0.5 && u_cursorRipple > 0.0) {
            vec2 warp = normalize(toCursor) * sin(distCursor * 25.0 - u_time * 6.0) * exp(-distCursor * 5.0) * u_cursorRipple * 0.045;
            uv += warp;
          }

          if (u_waveAmp > 0.0) {
            float wave = sin(dot(uv, vec2(12.0, 16.0)) + u_time * u_waveSpeed * 3.0) * u_waveAmp * 0.015;
            uv += vec2(wave, wave * 0.6);
          }

          vec4 img = texture2D(u_image, uv);
          float luma = dot(img.rgb, vec3(0.299, 0.587, 0.114));
          luma = clamp((luma - 0.5) * u_contrast + 0.5, 0.0, 1.0);
          if (u_invert) luma = 1.0 - luma;

          vec2 p = rot * (uv * u_resolution) / u_scale;
          float d = 0.0;
          float maxRadius = 0.7071;

          if (u_gridType == 0) {
            vec2 grid = fract(p) - 0.5;
            d = getDotDist(grid, u_dotShape);
          } else if (u_gridType == 1) {
            vec2 r = vec2(1.0, 1.7320508);
            vec2 h = r * 0.5;
            vec2 a = mod(p, r) - h;
            vec2 b = mod(p - h, r) - h;
            vec2 g = dot(a, a) < dot(b, b) ? a : b;
            d = getDotDist(g, u_dotShape);
          } else if (u_gridType == 2) {
            mat2 dRot = rot2d(0.785398);
            vec2 dGrid = fract(dRot * p) - 0.5;
            d = getDotDist(dGrid, u_dotShape);
          } else {
            float lineCoord = abs(fract(p.y) - 0.5);
            d = lineCoord;
            maxRadius = 0.5;
          }

          float r = sqrt(luma) * maxRadius;
          float s = max(u_softness * 0.5, 0.001);
          float dotVal = smoothstep(r - s, r + s, d);

          vec3 col = mix(u_dotColor, u_backColor, dotVal);
          gl_FragColor = vec4(col, 1.0);
        }
      `

        draw(v, dt) {
          const { W, H } = env
          env.time += dt

          const { glCanvas, gl, quadBuffer, sharedTexture } = getWebGL()
          if (!gl) {
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            return 'Halftone Dots (WebGL fallback)'
          }

          const progInfo = getOrCreateProgram('halftoneDots', halftoneDotsFS)
          if (!progInfo) return 'Halftone Dots error'

          glCanvas.width = W
          glCanvas.height = H
          gl.viewport(0, 0, W, H)

          gl.useProgram(progInfo.prog)

          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer)
          gl.enableVertexAttribArray(progInfo.positionLocation)
          gl.vertexAttribPointer(progInfo.positionLocation, 2, gl.FLOAT, false, 0, 0)

          gl.activeTexture(gl.TEXTURE0)
          gl.bindTexture(gl.TEXTURE_2D, sharedTexture)
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, env.sourceCanvas)

          const gridIdx = ['SQUARE GRID', 'HEXAGONAL GRID', 'DIAMOND RASTER', 'STRIPE LINES'].indexOf(v.gridType)
          const dotIdx = ['CIRCLES', 'DIAMONDS', 'SQUARES', 'CROSSES'].indexOf(v.dotShape)

          const curX = env.cursorEnabled ? (env.cursor.targetX / (W || 1)) : -1000.0
          const curY = env.cursorEnabled ? (env.cursor.targetY / (H || 1)) : -1000.0
          const cursorRipple = env.cursorEnabled ? v.cursorRipple : 0.0

          gl.uniform1i(gl.getUniformLocation(progInfo.prog, 'u_image'), 0)
          gl.uniform2f(gl.getUniformLocation(progInfo.prog, 'u_resolution'), W, H)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_time'), env.time)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_scale'), v.scale)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_softness'), v.softness)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_angle'), v.angle)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_contrast'), v.contrast)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_waveSpeed'), v.waveSpeed)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_waveAmp'), v.waveAmp)
          gl.uniform1i(gl.getUniformLocation(progInfo.prog, 'u_gridType'), gridIdx >= 0 ? gridIdx : 0)
          gl.uniform1i(gl.getUniformLocation(progInfo.prog, 'u_dotShape'), dotIdx >= 0 ? dotIdx : 0)
          gl.uniform1i(gl.getUniformLocation(progInfo.prog, 'u_invert'), v.invert ? 1 : 0)
          const dotRgb = hexToRgb(v.dotColor || '#101216')
          gl.uniform3f(gl.getUniformLocation(progInfo.prog, 'u_dotColor'), dotRgb[0], dotRgb[1], dotRgb[2])
          const backRgb = hexToRgb(v.backColor || '#faf9f5')
          gl.uniform3f(gl.getUniformLocation(progInfo.prog, 'u_backColor'), backRgb[0], backRgb[1], backRgb[2])
          gl.uniform2f(gl.getUniformLocation(progInfo.prog, 'u_cursor'), curX, curY)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_cursorRipple'), cursorRipple)

          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
          ctx.drawImage(glCanvas, 0, 0)

          return `Halftone Dots · ${v.gridType} · ${v.dotShape} · ${v.scale}px`

      const lensDistortionFS = `#version 300 es
        precision highp float;
        in vec2 v_imageUV;
        out vec4 fragColor;

        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform vec2 u_imageResolution;
        uniform float u_time;

        uniform float u_spread;
        uniform float u_bias;
        uniform float u_angle;
        uniform float u_perspective;
        uniform float u_count;
        uniform float u_dispersion;
        uniform float u_dispersionShift;
        uniform float u_dispersionColor;
        uniform float u_focusCenter;
        uniform float u_focusEdges;
        uniform float u_swirl;
        uniform float u_noise;
        uniform float u_noiseFrequency;
        uniform float u_noiseOffset;
        uniform float u_lensBulge;
        uniform float u_lensCircle;
        uniform float u_grainMixer;
        uniform float u_grainOverlay;
        uniform float u_imageX;
        uniform float u_imageY;
        uniform float u_scale;
        uniform int u_fit;
        uniform vec2 u_center;

        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }

        float noise2d(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          float a = hash12(i + vec2(0.0, 0.0));
          float b = hash12(i + vec2(1.0, 0.0));
          float c = hash12(i + vec2(0.0, 1.0));
          float d = hash12(i + vec2(1.0, 1.0));
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }

        vec3 spectralRainbow(float t) {
          t = fract(t);
          vec3 c = 0.5 + 0.5 * cos(6.28318530718 * (t + vec3(0.0, 0.333, 0.667)));
          return c * 1.5;
        }

        vec4 sampleFittedImage(vec2 p) {
          vec2 uvCoord = p;
          
          if (u_fit == 0) { // contain
            float imgRatio = u_imageResolution.x / max(1.0, u_imageResolution.y);
            float screenRatio = u_resolution.x / max(1.0, u_resolution.y);
            vec2 fittedDim = (screenRatio > imgRatio) 
              ? vec2(u_resolution.y * imgRatio, u_resolution.y) 
              : vec2(u_resolution.x, u_resolution.x / imgRatio);
            vec2 offset = (u_resolution - fittedDim) * 0.5 / u_resolution;
            vec2 relUV = (uvCoord - offset) * (u_resolution / fittedDim);
            relUV = (relUV - 0.5) / max(0.01, u_scale) + 0.5;
            relUV -= vec2(u_imageX, u_imageY);
            if (relUV.x < 0.0 || relUV.x > 1.0 || relUV.y < 0.0 || relUV.y > 1.0) {
              return vec4(0.0, 0.0, 0.0, 1.0);
            }
            return texture(u_image, relUV);
          } else if (u_fit == 1) { // cover
            float imgRatio = u_imageResolution.x / max(1.0, u_imageResolution.y);
            float screenRatio = u_resolution.x / max(1.0, u_resolution.y);
            vec2 fittedDim = (screenRatio < imgRatio) 
              ? vec2(u_resolution.y * imgRatio, u_resolution.y) 
              : vec2(u_resolution.x, u_resolution.x / imgRatio);
            vec2 offset = (u_resolution - fittedDim) * 0.5 / u_resolution;
            vec2 relUV = (uvCoord - offset) * (u_resolution / fittedDim);
            relUV = (relUV - 0.5) / max(0.01, u_scale) + 0.5;
            relUV -= vec2(u_imageX, u_imageY);
            return texture(u_image, clamp(relUV, 0.0, 1.0));
          } else { // fill
            vec2 relUV = (uvCoord - 0.5) / max(0.01, u_scale) + 0.5;
            relUV -= vec2(u_imageX, u_imageY);
            return texture(u_image, clamp(relUV, 0.0, 1.0));
          }
        }

        void main() {
          vec2 uv = v_imageUV;
          vec2 center = u_center;
          vec2 aspect = vec2(u_resolution.x / u_resolution.y, 1.0);
          
          vec2 p = (uv - center) * aspect;
          float r = length(p);
          
          // Lens Bulge (barrel / pincushion)
          vec2 warpedP = p;
          if (abs(u_lensBulge) > 0.001) {
            float k = u_lensBulge * 1.8;
            float r2 = r * r;
            if (u_lensBulge > 0.0) {
              float f = 1.0 + k * r2 + k * 0.5 * r2 * r2;
              warpedP = p * f;
            } else {
              float f = 1.0 / (1.0 + abs(k) * r2 * 1.5);
              warpedP = p * f;
            }
          }
          
          // Lens Circle
          float circleMask = 1.0;
          if (u_lensCircle > 0.01) {
            float maxR = 0.5 * min(aspect.x, aspect.y);
            float edgeDist = length(warpedP) / max(0.001, maxR);
            if (edgeDist > 1.0) {
              float squeeze = mix(1.0, 1.0 / edgeDist, u_lensCircle);
              warpedP *= squeeze;
            }
            circleMask = 1.0 - smoothstep(1.0 - 0.05 * u_lensCircle, 1.0, length(warpedP) / maxR) * u_lensCircle;
          }
          
          vec2 baseUV = warpedP / aspect + center;
          
          if (u_spread <= 0.001) {
            vec4 col = sampleFittedImage(baseUV);
            if (u_grainOverlay > 0.001) {
              float gNoise = (hash12(gl_FragCoord.xy + fract(u_time * 17.13) * 100.0) - 0.5);
              col.rgb += gNoise * u_grainOverlay;
            }
            col.rgb *= circleMask;
            fragColor = vec4(col.rgb, 1.0);
            return;
          }
          
          int sampleCount = int(clamp(u_count, 2.0, 50.0));
          float fCount = float(sampleCount);
          float distC = length(warpedP);
          
          float centerFocus = smoothstep(0.0, 0.45 * (u_focusCenter + 0.001), distC);
          float edgeFocus = 1.0 - u_focusEdges * smoothstep(0.35 * min(aspect.x, aspect.y), 0.70 * max(aspect.x, aspect.y), distC);
          float focusMod = mix(1.0, centerFocus * edgeFocus, clamp(max(u_focusCenter, u_focusEdges), 0.0, 1.0));
          
          float rad = radians(u_angle);
          vec2 dirLinear = vec2(cos(rad), sin(rad));
          vec2 dirRadial = (distC > 0.0001) ? normalize(warpedP) : vec2(0.0);
          vec2 baseSpreadDir = normalize(mix(dirLinear, dirRadial, clamp(u_perspective, 0.0, 1.0)));
          
          vec3 accumColor = vec3(0.0);
          float totalWeight = 0.0;
          
          for (int i = 0; i < 50; i++) {
            if (i >= sampleCount) break;
            
            float t = float(i) / max(1.0, fCount - 1.0);
            float normProg = (t - 0.5) * 2.0;
            
            float biasedProg = normProg;
            if (abs(u_bias) > 0.01) {
              float signP = sign(normProg);
              float absP = abs(normProg);
              if (u_bias > 0.0) {
                biasedProg = signP * pow(absP, 1.0 + u_bias * 2.5);
              } else {
                biasedProg = signP * (1.0 - pow(1.0 - absP, 1.0 + abs(u_bias) * 2.5));
              }
            }
            
            vec2 layerP = warpedP;
            if (abs(u_swirl) > 0.001) {
              float swirlFalloff = max(0.0, 1.0 - distC / (0.75 * min(aspect.x, aspect.y)));
              float swirlAngle = biasedProg * u_swirl * 3.14159265 * swirlFalloff;
              float cosS = cos(swirlAngle);
              float sinS = sin(swirlAngle);
              layerP = vec2(layerP.x * cosS - layerP.y * sinS, layerP.x * sinS + layerP.y * cosS);
            }
            
            vec2 layerNoise = vec2(0.0);
            if (u_noise > 0.001) {
              vec2 nCoord = (layerP * (1.0 + u_noiseFrequency * 8.0)) + vec2(u_noiseOffset * 7.13, u_noiseOffset * 11.37);
              float n1 = noise2d(nCoord) - 0.5;
              float n2 = noise2d(nCoord + vec2(37.2, 59.4)) - 0.5;
              layerNoise = vec2(n1, n2) * (u_noise * 0.12 * (1.0 + abs(biasedProg)));
            }
            
            vec2 layerGrain = vec2(0.0);
            if (u_grainMixer > 0.001) {
              float g1 = hash12(gl_FragCoord.xy + vec2(float(i) * 19.3, float(i) * 31.7)) - 0.5;
              float g2 = hash12(gl_FragCoord.xy + vec2(float(i) * 43.1, float(i) * 7.9)) - 0.5;
              layerGrain = vec2(g1, g2) * (u_grainMixer * 0.04);
            }
            
            float spreadDist = u_spread * 0.35 * focusMod * biasedProg;
            vec2 layerOffset = (baseSpreadDir * spreadDist + layerNoise + layerGrain) / aspect;
            vec2 layerUV = layerP / aspect + center + layerOffset;
            
            vec4 sampleCol = sampleFittedImage(layerUV);
            vec3 layerRGB = sampleCol.rgb;
            
            if (u_dispersion > 0.001) {
              float shift = u_dispersionShift * (distC - 0.3);
              float spectrumHue = fract(t + u_dispersionColor + shift);
              vec3 spectrumCol = spectralRainbow(spectrumHue);
              layerRGB = mix(layerRGB, layerRGB * spectrumCol, u_dispersion);
            }
            
            accumColor += layerRGB;
            totalWeight += 1.0;
          }
          
          vec3 finalCol = (totalWeight > 0.0) ? (accumColor / totalWeight) : vec3(0.0);
          
          if (u_grainOverlay > 0.001) {
            float overlayGrain = (hash12(gl_FragCoord.xy + fract(u_time * 19.41) * 100.0) - 0.5);
            finalCol += overlayGrain * u_grainOverlay;
          }
          
          finalCol *= circleMask;
          fragColor = vec4(clamp(finalCol, 0.0, 1.0), 1.0);
        }
      `

          glCanvas.height = H

          gl.uniform2f(gl.getUniformLocation(progInfo.prog, 'u_imageResolution'), env.sourceCanvas.width || W, env.sourceCanvas.height || H)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_time'), env.time)

          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_bias'), v.bias !== undefined ? v.bias : -0.34)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_angle'), v.angle !== undefined ? v.angle : 4.0)

          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_dispersionColor'), v.dispersionColor !== undefined ? v.dispersionColor : 0.60)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_focusCenter'), v.focusCenter !== undefined ? v.focusCenter : 0.80)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_focusEdges'), v.focusEdges !== undefined ? v.focusEdges : 1.00)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_swirl'), v.swirl !== undefined ? v.swirl : 0.35)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_noise'), v.noise !== undefined ? v.noise : 0.0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_noiseFrequency'), v.noiseFrequency !== undefined ? v.noiseFrequency : 0.25)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_noiseOffset'), v.noiseOffset !== undefined ? v.noiseOffset : 0.0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_lensBulge'), v.lensBulge !== undefined ? v.lensBulge : 0.0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_lensCircle'), v.lensCircle !== undefined ? v.lensCircle : 0.0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_grainMixer'), v.grainMixer !== undefined ? v.grainMixer : 0.0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_grainOverlay'), v.grainOverlay !== undefined ? v.grainOverlay : 0.0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_imageX'), v.imageX !== undefined ? v.imageX : 0.0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_imageY'), v.imageY !== undefined ? v.imageY : 0.0)

// ======================================================================
      // 12. DITHERING (Bayer ordered matrix, blue noise, retro color palettes)
      // Reference: https://shaders.paper.design/dithering

      const ditheringFS = `
        precision highp float;
        varying vec2 v_uv;
        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_pixelSize;
        uniform float u_contrast;
        uniform float u_ditherAmount;
        uniform float u_levels;
        uniform int u_matrixType;
        uniform int u_palette;
        uniform bool u_invert;
        uniform vec3 u_lightColor;
        uniform vec3 u_darkColor;
        uniform vec2 u_cursor;
        uniform float u_cursorScatter;

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float bayer4(vec2 p) {
          vec2 f = mod(floor(p), 4.0);
          int x = int(f.x);
          int y = int(f.y);
          int index = x + y * 4;
          if (index == 0) return 0.0/16.0;
          if (index == 1) return 8.0/16.0;
          if (index == 2) return 2.0/16.0;
          if (index == 3) return 10.0/16.0;
          if (index == 4) return 12.0/16.0;
          if (index == 5) return 4.0/16.0;
          if (index == 6) return 14.0/16.0;
          if (index == 7) return 6.0/16.0;
          if (index == 8) return 3.0/16.0;
          if (index == 9) return 11.0/16.0;
          if (index == 10) return 1.0/16.0;
          if (index == 11) return 9.0/16.0;
          if (index == 12) return 15.0/16.0;
          if (index == 13) return 7.0/16.0;
          if (index == 14) return 13.0/16.0;
          return 5.0/16.0;
        }

        float bayer8(vec2 p) {
          vec2 f = mod(floor(p), 8.0);
          vec2 f4 = mod(f, 4.0);
          float m4 = bayer4(f4);
          vec2 halfBlock = floor(f / 4.0);
          float offset = 0.0;
          if (halfBlock.x == 0.0 && halfBlock.y == 0.0) offset = 0.0;
          else if (halfBlock.x == 1.0 && halfBlock.y == 0.0) offset = 2.0;
          else if (halfBlock.x == 0.0 && halfBlock.y == 1.0) offset = 3.0;
          else offset = 1.0;
          return (m4 * 4.0 + offset * (1.0 / 4.0)) / 4.0;
        }

        float getDitherThreshold(vec2 coord, int type) {
          if (type == 0) {
            return bayer8(coord) - 0.5;
          } else if (type == 1) {
            return bayer4(coord) - 0.5;
          } else if (type == 2) {
            return hash21(coord + fract(u_time * 0.05)) - 0.5;
          } else if (type == 3) {
            vec2 c = mod(floor(coord), 4.0);
            float d = (c.x == c.y || c.x == 3.0 - c.y) ? 0.35 : -0.35;
            return d;
          } else if (type == 4) {
            vec2 c = fract(coord / 6.0) - 0.5;
            return (1.0 - length(c) * 2.0) - 0.5;
          } else {
            return hash21(coord * 7.13 + u_time) - 0.5;
          }
        }

        vec3 mapPalette(float val, vec3 origRgb, int pal) {
          val = clamp(val, 0.0, 1.0);
          if (u_invert) val = 1.0 - val;

          if (pal == 0) {
            return mix(u_darkColor, u_lightColor, step(0.5, val));
          } else if (pal == 1) {
            if (val < 0.25) return vec3(0.06, 0.22, 0.06);
            if (val < 0.5)  return vec3(0.19, 0.38, 0.19);
            if (val < 0.75) return vec3(0.54, 0.67, 0.06);
            return vec3(0.61, 0.73, 0.06);
          } else if (pal == 2) {
            if (val < 0.25) return vec3(0.05, 0.02, 0.15);
            if (val < 0.5)  return vec3(0.95, 0.05, 0.45);
            if (val < 0.75) return vec3(0.0, 0.85, 0.95);
            return vec3(1.0, 0.95, 0.2);
          } else if (pal == 3) {
            return mix(vec3(0.08, 0.03, 0.0), vec3(1.0, 0.7, 0.1), val);
          } else if (pal == 4) {
            if (val < 0.25) return vec3(0.0, 0.0, 0.0);
            if (val < 0.5)  return vec3(0.0, 0.67, 0.67);
            if (val < 0.75) return vec3(0.67, 0.0, 0.67);
            return vec3(1.0, 1.0, 1.0);
          } else if (pal == 5) {
            if (val < 0.25) return vec3(0.18, 0.1, 0.35);
            if (val < 0.5)  return vec3(0.95, 0.5, 0.65);
            if (val < 0.75) return vec3(0.45, 0.85, 0.9);
            return vec3(1.0, 0.95, 0.85);
          } else {
            return clamp(origRgb, 0.0, 1.0);
          }
        }

        void main() {
          vec2 uv = v_uv;
          float pSize = max(1.0, u_pixelSize);

          vec2 toCursor = (uv - u_cursor) * vec2(u_resolution.x / u_resolution.y, 1.0);
          float distCursor = length(toCursor);
          if (distCursor < 0.45 && u_cursorScatter > 0.0) {
            float scatter = hash21(floor(uv * u_resolution / pSize) + u_time) * u_cursorScatter * 0.03;
            uv += (toCursor / (distCursor + 0.001)) * scatter;
          }

          vec2 pixelCoord = floor(uv * u_resolution / pSize);
          vec2 sampledUV = (pixelCoord + 0.5) * pSize / u_resolution;
          sampledUV = clamp(sampledUV, 0.0, 1.0);

          vec4 img = texture2D(u_image, sampledUV);
          vec3 rgb = clamp((img.rgb - 0.5) * u_contrast + 0.5, 0.0, 1.0);
          float luma = dot(rgb, vec3(0.299, 0.587, 0.114));

          float dither = getDitherThreshold(pixelCoord, u_matrixType) * u_ditherAmount;

          if (u_palette == 6) {
            float steps = max(1.0, u_levels - 1.0);
            vec3 qRgb = floor((rgb + vec3(dither)) * steps + 0.5) / steps;
            gl_FragColor = vec4(clamp(qRgb, 0.0, 1.0), 1.0);
          } else {
            float steps = max(1.0, u_levels - 1.0);
            float qLuma = floor((luma + dither) * steps + 0.5) / steps;
            vec3 finalCol = mapPalette(qLuma, rgb, u_palette);
            gl_FragColor = vec4(finalCol, 1.0);
          }
        }
      `

      const paperTextureFS = `#version 300 es
        precision mediump float;

        uniform sampler2D u_image;
        uniform bool u_isImage;
        uniform float u_imageAspectRatio;

        uniform vec4 u_colorBack;
        uniform vec4 u_colorPaper;
        uniform vec4 u_colorShadow;

        uniform float u_blending;
        uniform float u_distortion;
        uniform bool u_clip;
        uniform float u_angle;
        uniform float u_seed;

        uniform float u_roughness;
        uniform float u_roughnessSize;
        uniform float u_roughnessRows;
        uniform float u_fiber;
        uniform float u_fiberSize;
        uniform float u_folds;
        uniform float u_foldSizeX;
        uniform float u_foldSizeY;
        uniform float u_foldOffsetX;
        uniform float u_foldOffsetY;
        uniform float u_wrinkles;
        uniform float u_wrinkleSize;
        uniform float u_crumples;
        uniform float u_crumpleCount;
        uniform float u_drops;

        // Custom Point-to-Point Creases (up to 16 crease vectors)
        uniform vec4 u_creases[16];
        uniform int u_creaseCount;
        uniform float u_creaseDepth;
        uniform float u_creaseWidth;
        uniform float u_creaseHighlight;
        uniform float u_creaseBuckle;
