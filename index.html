<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image & Video Effects Lab</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0b0c10;
        color: #e8e8ec;
        display: grid;
        grid-template-columns: 310px 1fr;
        grid-template-rows: 100vh;
        overflow: hidden;
      }

      /* ---------- Sidebar ---------- */
      aside {
        background: #121319;
        border-right: 1px solid #20222c;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .brand {
        padding: 16px 18px 12px;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand-badge {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #00ff88;
        box-shadow: 0 0 10px #00ff88;
      }
      .brand small {
        display: block;
        color: #6a6c7c;
        font-weight: 400;
        font-size: 0.72rem;
        margin-top: 2px;
      }

      .menu {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 0 12px 14px;
        border-bottom: 1px solid #20222c;
      }
      .menu button {
        text-align: left;
        background: none;
        border: 1px solid transparent;
        color: #989aa8;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;

      .menu button:hover {

      .panel {

      select,

        background: #191b24;
        color: #e8e8ec;
        border: 1px solid #272a38;
        border-radius: 6px;

        font-size: 0.8rem;
        cursor: pointer;
        transition: border-color 0.15s;

      select:hover,
      button.btn:hover {

      }
      button.btn-primary {

      }
      button.btn-primary:hover {

      }

      /* ---------- Main Area ---------- */
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .toolbar {
        display: flex;
        gap: 10px;

      }
      .toolbar .spacer {

        font-size: 0.73rem;

        font-family: monospace;
      }
      .source-indicator {
        font-size: 0.7rem;
        padding: 2px 7px;
        border-radius: 4px;
        background: #1e2233;

        font-family: monospace;
      }

      .stage-wrap {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 20px;
        min-height: 0;
        background: radial-gradient(circle at center, #151722 0%, #0b0c10 100%);
      }
      #stage {
        position: relative;
        line-height: 0;
        box-shadow:
          0 25px 60px rgba(0, 0, 0, 0.7),

        background: #000;
        border-radius: 4px;

      canvas {
        display: block;

        max-height: calc(100vh - 120px);
      }
      #dropHint {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(14, 16, 26, 0.88);

  <body>
    <aside>
      <div class="brand">
        <div class="brand-badge"></div>
        <div>
          Image & Video Effects Lab
          <small>interactive shader & creative vision studio</small>
        </div>
      </div>
      <nav class="menu" id="menu"></nav>
      <div class="panel" id="panel"></div>
    </aside>

    <main>
      <div class="toolbar">
        <label>
          Media Source
          <select id="preset">
            <option value="motion-demo">
              ▶ Animated Motion Demo (Simulated Video)
            </option>
            <option value="sunset">Sunset (Image)</option>
            <option value="portrait">Portrait (Image)</option>
            <option value="flower">Flower (Image)</option>
          </select>
        </label>
        <button class="btn" id="openBtn">Open Media…</button>
        <input type="file" id="file" accept="image/*,video/*" hidden />
        <button class="btn" id="webcamBtn">Webcam</button>
        <button class="btn" id="saveBtn">Save Frame</button>
        <span class="spacer"></span>
        <span class="source-indicator" id="sourceBadge">MOTION-DEMO</span>
        <span class="stats" id="stats"></span>
      </div>
      <div class="stage-wrap">
        <div id="stage">
          <canvas id="canvas"></canvas>
          <div id="dropHint">Drop Image or Video to Load</div>
          <button id="stageClearBtn" title="Clear sketch canvas (Shortcut: C)">
            🧹 Clear Sketch (C)
          </button>
        </div>
      </div>
    </main>

    <script>
      const ROOT = 64 // canvas dimensions snapped to multiples of this
      const TAU = Math.PI * 2

      // ======================================================================
      // Shared Media Pipeline & Environment
      // ======================================================================
      const canvas = document.getElementById('canvas')
      const ctx = canvas.getContext('2d')
      const stage = document.getElementById('stage')
      const statsEl = document.getElementById('stats')
      const sourceBadge = document.getElementById('sourceBadge')

      const env = {
        W: 0,
        H: 0,
        time: 0,
        sat: null, // summed-area table for quadtree
        cursor: { x: 0, y: 0, targetX: 0, targetY: 0, lastMoveAt: 0 },
        // Offscreen canvas storing current source frame
        sourceCanvas: document.createElement('canvas'),
        sourceCtx: null,
        // Source state
        sourceType: 'demo', // 'image' | 'video' | 'webcam' | 'demo'
        sourceVideo: null,
        sourceImage: null,
        demoState: null,
      }
      env.sourceCtx = env.sourceCanvas.getContext('2d', {
        willReadFrequently: true,
      })

      // ---------------- Summed-Area Table (Quadtree) ----------------
      function buildTables(imageData) {
        const { W, H } = env
        const data = imageData.data
        const stride = W + 1
        const size = stride * (H + 1)
        const r = new Float64Array(size)
        const g = new Float64Array(size)
        const b = new Float64Array(size)
        const l = new Float64Array(size)
        const l2 = new Float64Array(size)

        for (let y = 0; y < H; y++) {
          let rr = 0,
            gg = 0,
            bb = 0,
            ll = 0,
            ll2 = 0
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4
            const luma =
              0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]
            rr += data[i]
            gg += data[i + 1]
            bb += data[i + 2]
            ll += luma
            ll2 += luma * luma
            const idx = (y + 1) * stride + (x + 1)
            const up = y * stride + (x + 1)
            r[idx] = r[up] + rr
            g[idx] = g[up] + gg
            b[idx] = b[up] + bb
            l[idx] = l[up] + ll
            l2[idx] = l2[up] + ll2
          }
        }
        env.sat = { r, g, b, l, l2, stride }
      }

      function rectSum(table, x, y, s) {
        const st = env.sat.stride
        return (
          table[(y + s) * st + (x + s)] -
          table[y * st + (x + s)] -
          table[(y + s) * st + x] +
          table[y * st + x]
        )
      }

      function lumaStdDev(x, y, s) {
        const n = s * s
        const mean = rectSum(env.sat.l, x, y, s) / n
        const variance = rectSum(env.sat.l2, x, y, s) / n - mean * mean
        return Math.sqrt(Math.max(0, variance))
      }

      function hash(x, y, s) {
        let h =
          Math.imul(x, 374761393) +
          Math.imul(y, 668265263) +
          Math.imul(s, 1274126177)
        h = Math.imul(h ^ (h >>> 13), 1274126177)
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296
      }

      // ======================================================================
      // EFFECT 1: quadtree-bokeh
      // ======================================================================
      const quadtreeBokeh = {
        id: 'quadtree-bokeh',
        label: 'quadtree-bokeh',
        groups: [
          {
            title: 'Focus',
            controls: [
              {
                key: 'shape',
                label: 'Focus shape',
                type: 'select',
                options: ['square', 'circle'],
                value: 'square',
              },
              {
                key: 'radius',
                label: 'Focus size',
                type: 'range',
                min: 20,
                max: 400,
                step: 1,
                value: 110,
                unit: 'px',
              },
              {
                key: 'falloff',
                label: 'Falloff distance',
                type: 'range',
                min: 40,
                max: 800,
                step: 1,
                value: 320,
                unit: 'px',
              },
              {
                key: 'minSize',
                label: 'Finest square',
                type: 'select',
                options: [1, 2, 4, 8],
                value: 2,
              },
              {
                key: 'maxSize',
                label: 'Coarsest square',
                type: 'select',
                options: [16, 32, 64],
                value: 64,
              },
              {
                key: 'skipFlat',
                label: 'Skip flat regions',
                type: 'checkbox',
                value: true,
              },
            ],
          },
          {
            title: 'Alive',
            controls: [
              {
                key: 'speed',
                label: 'Speed',
                type: 'range',
                min: 0,
                max: 4,
                step: 0.05,
                value: 1,
                unit: 'x',
              },
              {
                key: 'shimmer',
                label: 'Edge shimmer',
                type: 'range',
                min: 0,
                max: 160,
                step: 1,
                value: 60,
                unit: 'px',
              },
              {
                key: 'glitter',
                label: 'Glitter',
                type: 'range',
                min: 0,
                max: 1,
                step: 0.01,
                value: 0.35,
                unit: '',
              },
              {
                key: 'breathing',
                label: 'Focus breathing',
                type: 'range',
                min: 0,
                max: 1,
                step: 0.01,
                value: 0.25,
                unit: '',
              },
              {
                key: 'wander',
                label: 'Wander when idle',
                type: 'checkbox',
                value: true,
              },
            ],
          },
          {
            title: 'Display',
            controls: [
              {
                key: 'showGrid',
                label: 'Show grid',
                type: 'checkbox',
                value: false,
              },
              {
                key: 'gridWidth',
                label: 'Grid width',
                type: 'range',
                min: 0.01,
                max: 10,
                step: 0.01,
                value: 1,
                unit: 'px',
              },
              {
                key: 'gridColor',
                label: 'Grid color',
                type: 'color',
                value: '#000000',
              },
            ],
          },
        ],

        flatThreshold: 6,
        leaves: [],

        draw(v, dt) {
          const { W, H, cursor } = env
          env.time += dt * v.speed

          if (v.wander && performance.now() - cursor.lastMoveAt > 2500) {
            cursor.targetX = W * (0.5 + 0.32 * Math.sin(env.time * 0.55))
            cursor.targetY = H * (0.5 + 0.3 * Math.sin(env.time * 0.83 + 1.2))
          }
          cursor.x += (cursor.targetX - cursor.x) * 0.18
          cursor.y += (cursor.targetY - cursor.y) * 0.18

          const radius =
            v.radius * (1 + v.breathing * 0.3 * Math.sin(env.time * 0.9))
          const params = { ...v, radius, time: env.time }

          this.leaves = []
          for (let y = 0; y < H; y += ROOT) {
            for (let x = 0; x < W; x += ROOT) {
              this.subdivide(x, y, ROOT, params)
            }
          }
          this.render(v)
          return `${(this.leaves.length / 6).toLocaleString()} squares`
        },

        distance(x, y, s, shape) {
          const { cursor } = env
          const dx = Math.max(x - cursor.x, 0, cursor.x - (x + s))
          const dy = Math.max(y - cursor.y, 0, cursor.y - (y + s))
          return shape === 'square' ? Math.max(dx, dy) : Math.hypot(dx, dy)
        },

        allowedSize(x, y, s, p) {
          let d = this.distance(x, y, s, p.shape)
          if (p.shimmer > 0) {
            d += p.shimmer * Math.sin(p.time * 2.2 + hash(x, y, s) * TAU)
          }
          if (d <= p.radius) return p.minSize
          const t = Math.min(1, (d - p.radius) / p.falloff)
          return p.minSize + (p.maxSize - p.minSize) * t * t
        },

        subdivide(x, y, s, p) {
          const wantSplit = s > p.minSize && s > this.allowedSize(x, y, s, p)
          const isFlat =
            p.skipFlat && wantSplit && lumaStdDev(x, y, s) < this.flatThreshold

          if (wantSplit && !isFlat) {
            const h = s / 2
            this.subdivide(x, y, h, p)
            this.subdivide(x + h, y, h, p)
            this.subdivide(x, y + h, h, p)
            this.subdivide(x + h, y + h, h, p)
            return
          }

          const n = s * s
          this.leaves.push(
            x,
            y,
            s,
            rectSum(env.sat.r, x, y, s) / n,
            rectSum(env.sat.g, x, y, s) / n,
            rectSum(env.sat.b, x, y, s) / n,
          )
        },

        render(v) {
          const { W, H, time } = env
          const leaves = this.leaves
          const gutterGrid = v.showGrid && v.gridWidth >= 1
          const hairlineGrid = v.showGrid && v.gridWidth < 1

          ctx.fillStyle = gutterGrid ? v.gridColor : '#000'
          ctx.fillRect(0, 0, W, H)

          for (let i = 0; i < leaves.length; i += 6) {
            const x = leaves[i],
              y = leaves[i + 1],
              s = leaves[i + 2]
            let r = leaves[i + 3],
              g = leaves[i + 4],
              b = leaves[i + 5]

            if (v.glitter > 0) {
              const phase = hash(x, y, s + 101)
              const flicker =
                1 + 0.07 * v.glitter * Math.sin(time * 3 + phase * 60)
              const pulse = Math.max(0, Math.sin(time * 1.7 + phase * 80))
              const sparkle =
                Math.pow(pulse, 16) *
                v.glitter *
                (0.35 + (0.65 * s) / v.maxSize)
              r = Math.min(255, r * flicker + (255 - r) * sparkle)
              g = Math.min(255, g * flicker + (255 - g) * sparkle)
              b = Math.min(255, b * flicker + (255 - b) * sparkle)
            }

            ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`
            const inset = gutterGrid ? Math.min(v.gridWidth / 2, s * 0.25) : 0
            ctx.fillRect(x + inset, y + inset, s - inset * 2, s - inset * 2)
          }

          if (hairlineGrid) {
            ctx.globalAlpha = v.gridWidth
            ctx.strokeStyle = v.gridColor
            ctx.lineWidth = 1
            ctx.beginPath()
            for (let i = 0; i < leaves.length; i += 6) {
              ctx.rect(leaves[i], leaves[i + 1], leaves[i + 2], leaves[i + 2])
            }
            ctx.stroke()
            ctx.globalAlpha = 1
          }
        },
      }

      // ======================================================================
      // EFFECT 2: blob-tracker
      // Inspired by basementstudio/shader-lab blob tracking layer.
      // Detects motion / bright regions in image or video, frames them with
      // CCTV/transform edit-mode boxes, and animates scattered tech nodes.
      // ======================================================================
      const blobTracker = {
        id: 'blob-tracker',
        label: 'blob-tracker',
        groups: [
          {
            title: 'Detection',
            controls: [
              {
                key: 'detectMode',
                label: 'Detection mode',
                type: 'select',
                options: ['motion', 'brightness', 'hybrid'],
                value: 'motion',
              },
              {
                key: 'sensitivity',
                label: 'Sensitivity',
                type: 'range',
                min: 0.05,
                max: 0.95,
                step: 0.01,
                value: 0.4,
                unit: '',
              },
              {
                key: 'minSize',
                label: 'Min blob size',
                type: 'range',
                min: 10,
                max: 150,
                step: 5,
                value: 25,
                unit: 'px',
              },
              {
                key: 'maxBlobs',
                label: 'Max blobs',
                type: 'range',
                min: 1,
                max: 10,
                step: 1,
                value: 5,
                unit: '',
              },
              {
                key: 'smoothing',
                label: 'Tracking smooth',
                type: 'range',
                min: 0.05,
                max: 0.8,
                step: 0.05,
                value: 0.25,
                unit: '',
              },
            ],
          },
          {
            title: 'Scatter Nodes',
            controls: [
              {
                key: 'nodeShape',
                label: 'Scatter asset',
                type: 'select',
                options: [
                  'square',
                  'diamond',
                  'bracket',
                  'crosshair',
                  'circle',
                  'triangle',
                  'mixed',
                ],
                value: 'square',
              },
              {
                key: 'nodeCount',
                label: 'Node amount',
                type: 'range',
                min: 4,
                max: 48,
                step: 1,
                value: 16,
                unit: ' / blob',
              },
              {
                key: 'nodeSize',
                label: 'Node size',
                type: 'range',
                min: 3,
                max: 24,
                step: 1,
                value: 8,
                unit: 'px',
              },
              {
                key: 'jitter',
                label: 'Animation jitter',
                type: 'range',
                min: 0,
                max: 3,
                step: 0.1,
                value: 1.2,
                unit: 'x',
              },
              {
                key: 'connectNodes',
                label: 'Connect nodes (mesh)',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'nodeColor',
                label: 'Node color',
                type: 'color',
                value: '#00ff88',
              },
              {
                key: 'accentColor',
                label: 'Accent color',
                type: 'color',
                value: '#ffffff',
              },
            ],
          },
          {
            title: 'Edit Mode Framing',
            controls: [
              {
                key: 'showBoundingBox',
                label: 'Transform edit box',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'showHandles',
                label: 'Edit corner handles',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'showBrackets',
                label: 'CCTV corner brackets',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'showLabels',
                label: 'HUD coordinate tags',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'showCrosshair',
                label: 'Centroid crosshair',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'boxColor',
                label: 'Box / bracket color',
                type: 'color',
                value: '#00ff88',
              },
            ],
          },
          {
            title: 'Background & Style',
            controls: [
              {
                key: 'backgroundDim',
                label: 'Background dim',
                type: 'range',
                min: 0,
                max: 0.95,
                step: 0.05,
                value: 0.35,
                unit: '',
              },
              {
                key: 'blendMode',
                label: 'Node glow blend',
                type: 'select',
                options: ['screen', 'lighter', 'source-over'],
                value: 'screen',
              },
            ],
          },
        ],

        // Analysis state
        analysisCanvas: document.createElement('canvas'),
        analysisCtx: null,
        bgData: null, // running background model for robust motion detection
        trackedBlobs: [], // smooth tracked bounding boxes + persistent scattered nodes

        init() {
          this.analysisCtx = this.analysisCanvas.getContext('2d', {
            willReadFrequently: true,
          })
        },

        draw(v, dt) {
          const { W, H } = env
          env.time += dt

          if (!this.analysisCtx) this.init()

          // 1. Detect blobs from downsampled current frame
          const rawBlobs = this.detectBlobs(v)

          // 2. Temporally smooth blob bounding boxes and maintain node state
          this.updateTrackedBlobs(rawBlobs, v, dt)

          // 3. Render: Draw background media with dimming
          ctx.fillStyle = '#0a0b10'
          ctx.fillRect(0, 0, W, H)

          if (v.backgroundDim < 1) {
            ctx.save()
            ctx.globalAlpha = 1 - v.backgroundDim
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            ctx.restore()
          }

          // 4. Render blob tracking edit-mode overlays and scattered nodes
          this.renderTracking(v)

          return `${this.trackedBlobs.length} tracked blobs · ${this.trackedBlobs.reduce((acc, b) => acc + b.nodes.length, 0)} nodes`
        },

        detectBlobs(v) {
          const { W, H } = env
          // Grid analysis resolution
          const GW = 96
          const GH = Math.max(24, Math.round(96 * (H / W)))

          if (
            this.analysisCanvas.width !== GW ||
            this.analysisCanvas.height !== GH
          ) {
            this.analysisCanvas.width = GW
            this.analysisCanvas.height = GH
            this.bgData = null
          }

          // Downsample current source frame into analysis canvas
          this.analysisCtx.drawImage(env.sourceCanvas, 0, 0, GW, GH)
          const currImgData = this.analysisCtx.getImageData(0, 0, GW, GH)
          const data = currImgData.data

          // Initialize background model on first run or dimension change
          if (!this.bgData || this.bgData.length !== GW * GH * 3) {
            this.bgData = new Float32Array(GW * GH * 3)
            for (let i = 0; i < GW * GH; i++) {
              this.bgData[i * 3] = data[i * 4]
              this.bgData[i * 3 + 1] = data[i * 4 + 1]
              this.bgData[i * 3 + 2] = data[i * 4 + 2]
            }
          }

          const energyGrid = new Float32Array(GW * GH)

          // Calibrated threshold based on sensitivity slider
          let threshold
          if (v.detectMode === 'motion') {
            threshold = 0.02 + (1 - v.sensitivity) * 0.18
          } else if (v.detectMode === 'brightness') {
            threshold = 0.12 + (1 - v.sensitivity) * 0.65
          } else {
            // hybrid
            threshold = 0.03 + (1 - v.sensitivity) * 0.25
          }

          // Compute per-cell motion / brightness energy
          for (let y = 0; y < GH; y++) {
            for (let x = 0; x < GW; x++) {
              const idx = (y * GW + x) * 4
              const bgIdx = (y * GW + x) * 3
              const r = data[idx],
                g = data[idx + 1],
                b = data[idx + 2]
              const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255

              // Motion delta against background model
              const bgR = this.bgData[bgIdx]
              const bgG = this.bgData[bgIdx + 1]
              const bgB = this.bgData[bgIdx + 2]
              const motion =
                (Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB)) /
                (3 * 255)

              // Background model adaptation rate
              const adaptRate = 0.035
              this.bgData[bgIdx] += (r - bgR) * adaptRate
              this.bgData[bgIdx + 1] += (g - bgG) * adaptRate
              this.bgData[bgIdx + 2] += (b - bgB) * adaptRate

              let val = 0
              if (v.detectMode === 'motion') {
                val = motion
              } else if (v.detectMode === 'brightness') {
                val = luma
              } else {
                // hybrid
                val = Math.max(motion * 1.4, luma * 0.7)
              }

              energyGrid[y * GW + x] = val > threshold ? val : 0
            }
          }

          // Save current frame for next difference
          this.prevAnalysisData = currImgData

          // Connected components (flood fill) clustering
          const visited = new Uint8Array(GW * GH)
          const rawClusters = []

          for (let y = 0; y < GH; y++) {
            for (let x = 0; x < GW; x++) {
              const i = y * GW + x
              if (visited[i] || energyGrid[i] === 0) continue

              // BFS to find cluster
              let minX = x,
                maxX = x,
                minY = y,
                maxY = y
              let sumX = 0,
                sumY = 0,
                count = 0,
                sumEnergy = 0
              const queue = [x, y]
              visited[i] = 1

              while (queue.length > 0) {
                const qy = queue.pop()
                const qx = queue.pop()
                const qi = qy * GW + qx
                const e = energyGrid[qi]

                sumX += qx * e
                sumY += qy * e
                sumEnergy += e
                count++

                if (qx < minX) minX = qx
                if (qx > maxX) maxX = qx
                if (qy < minY) minY = qy
                if (qy > maxY) maxY = qy

                // 4-neighborhood
                const neighbors = [
                  [qx + 1, qy],
                  [qx - 1, qy],
                  [qx, qy + 1],
                  [qx, qy - 1],
                ]
                for (let k = 0; k < 4; k++) {
                  const nx = neighbors[k][0],
                    ny = neighbors[k][1]
                  if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
                    const ni = ny * GW + nx
                    if (!visited[ni] && energyGrid[ni] > 0) {
                      visited[ni] = 1
                      queue.push(nx, ny)
                    }
                  }
                }
              }

              // Filter out noise
              const scaleX = W / GW
              const scaleY = H / GH
              const bw = (maxX - minX + 1) * scaleX
              const bh = (maxY - minY + 1) * scaleY
              const area = Math.max(bw, bh)

              if (area >= v.minSize && count >= 3) {
                rawClusters.push({
                  x: minX * scaleX,
                  y: minY * scaleY,
                  w: bw,
                  h: bh,
                  cx: (sumX / sumEnergy) * scaleX,
                  cy: (sumY / sumEnergy) * scaleY,
                  mass: count,
                  energy: sumEnergy / count,
                })
              }
            }
          }

          // Sort by mass and limit to maxBlobs
          rawClusters.sort((a, b) => b.mass - a.mass)
          return rawClusters.slice(0, v.maxBlobs)
        },

        updateTrackedBlobs(rawBlobs, v, dt) {
          const smooth = v.smoothing

          // Match rawBlobs to existing trackedBlobs by centroid distance
          const matched = new Set()
          const updated = []

          rawBlobs.forEach((raw) => {
            let bestDist = 180
            let bestBlob = null

            this.trackedBlobs.forEach((tb) => {
              if (matched.has(tb)) return
              const d = Math.hypot(tb.cx - raw.cx, tb.cy - raw.cy)
              if (d < bestDist) {
                bestDist = d
                bestBlob = tb
              }
            })

            if (bestBlob) {
              matched.add(bestBlob)
              // Lerp bounding box
              bestBlob.x += (raw.x - bestBlob.x) * (1 - smooth)
              bestBlob.y += (raw.y - bestBlob.y) * (1 - smooth)
              bestBlob.w += (raw.w - bestBlob.w) * (1 - smooth)
              bestBlob.h += (raw.h - bestBlob.h) * (1 - smooth)
              bestBlob.cx += (raw.cx - bestBlob.cx) * (1 - smooth)
              bestBlob.cy += (raw.cy - bestBlob.cy) * (1 - smooth)
              bestBlob.mass = raw.mass
              bestBlob.life = Math.min(1, bestBlob.life + dt * 4)
              this.syncNodes(bestBlob, v)
              updated.push(bestBlob)
            } else {
              // New blob
              const newBlob = {
                id: Math.floor(100 + Math.random() * 900),
                x: raw.x,
                y: raw.y,
                w: raw.w,
                h: raw.h,
                cx: raw.cx,
                cy: raw.cy,
                mass: raw.mass,
                life: 0.1,
                nodes: [],
              }
              this.syncNodes(newBlob, v)
              updated.push(newBlob)
            }
          })

          this.trackedBlobs = updated
        },

        syncNodes(blob, v) {
          const targetCount = v.nodeCount
          while (blob.nodes.length < targetCount) {
            blob.nodes.push({
              relX: (Math.random() - 0.5) * 0.85,
              relY: (Math.random() - 0.5) * 0.85,
              phase: Math.random() * TAU,
              speed: 0.8 + Math.random() * 1.6,
              shape: this.pickShape(v.nodeShape),
              scale: 0.7 + Math.random() * 0.6,
            })
          }
          if (blob.nodes.length > targetCount) {
            blob.nodes.length = targetCount
          }
          // Update shape if changed
          blob.nodes.forEach((n) => {
            if (v.nodeShape !== 'mixed') {
              n.shape = v.nodeShape
            }
          })
        },

        pickShape(shapePref) {
          if (shapePref !== 'mixed') return shapePref
          const shapes = [
            'square',
            'diamond',
            'bracket',
            'crosshair',
            'circle',
            'triangle',
          ]
          return shapes[Math.floor(Math.random() * shapes.length)]
        },

        renderTracking(v) {
          const { time } = env

          this.trackedBlobs.forEach((b, blobIndex) => {
            const alpha = Math.min(1, b.life)
            ctx.save()
            ctx.globalAlpha = alpha

            // 1. Edit Mode Bounding Box & Handles
            if (v.showBoundingBox) {
              ctx.strokeStyle = v.boxColor
              ctx.lineWidth = 1
              ctx.strokeRect(b.x, b.y, b.w, b.h)

              if (v.showHandles) {
                // Draw 8 transform handles (4 corners + 4 midpoints)
                const handles = [
                  [b.x, b.y],
                  [b.x + b.w, b.y],
                  [b.x, b.y + b.h],
                  [b.x + b.w, b.y + b.h],
                  [b.x + b.w / 2, b.y],
                  [b.x + b.w / 2, b.y + b.h],
                  [b.x, b.y + b.h / 2],
                  [b.x + b.w, b.y + b.h / 2],
                ]
                const hs = 5
                ctx.fillStyle = '#ffffff'
                ctx.strokeStyle = v.boxColor
                ctx.lineWidth = 1
                handles.forEach(([hx, hy]) => {
                  ctx.fillRect(hx - hs / 2, hy - hs / 2, hs, hs)
                  ctx.strokeRect(hx - hs / 2, hy - hs / 2, hs, hs)
                })
              }
            }

            // 2. CCTV Corner Brackets
            if (v.showBrackets) {
              const bl = Math.min(14, b.w * 0.25, b.h * 0.25)
              ctx.strokeStyle = v.boxColor
              ctx.lineWidth = 1.5

              // Top-left
              ctx.beginPath()
              ctx.moveTo(b.x, b.y + bl)
              ctx.lineTo(b.x, b.y)
              ctx.lineTo(b.x + bl, b.y)
              // Top-right
              ctx.moveTo(b.x + b.w - bl, b.y)
              ctx.lineTo(b.x + b.w, b.y)
              ctx.lineTo(b.x + b.w, b.y + bl)
              // Bottom-left
              ctx.moveTo(b.x, b.y + b.h - bl)
              ctx.lineTo(b.x, b.y + b.h)
              ctx.lineTo(b.x + bl, b.y + b.h)
              // Bottom-right
              ctx.moveTo(b.x + b.w - bl, b.y + b.h)
              ctx.lineTo(b.x + b.w, b.y + b.h)
              ctx.lineTo(b.x + b.w, b.y + b.h - bl)
              ctx.stroke()
            }

            // 3. Centroid Crosshair
            if (v.showCrosshair) {
              const cs = 7
              ctx.strokeStyle = v.accentColor
              ctx.lineWidth = 1
              ctx.beginPath()
              ctx.moveTo(b.cx - cs, b.cy)
              ctx.lineTo(b.cx + cs, b.cy)
              ctx.moveTo(b.cx, b.cy - cs)
              ctx.lineTo(b.cx, b.cy + cs)
              ctx.stroke()
            }

            // 4. Tech HUD Labels
            if (v.showLabels) {
              ctx.font = '9px monospace'
              const label = `ID#${b.id} [${Math.round(b.cx)},${Math.round(b.cy)}] ${Math.round(b.w)}x${Math.round(b.h)}`
              const tw = ctx.measureText(label).width
              ctx.fillStyle = 'rgba(10, 12, 18, 0.75)'
              ctx.fillRect(b.x, b.y - 14, tw + 8, 12)
              ctx.strokeStyle = v.boxColor
              ctx.strokeRect(b.x, b.y - 14, tw + 8, 12)
              ctx.fillStyle = v.boxColor
              ctx.fillText(label, b.x + 4, b.y - 5)
            }

            // Calculate animated node positions
            const computedNodes = b.nodes.map((n) => {
              const jit = v.jitter
              const ox = Math.sin(time * n.speed + n.phase) * (b.w * 0.18 * jit)
              const oy =
                Math.cos(time * n.speed * 1.2 + n.phase) * (b.h * 0.18 * jit)
              return {
                x: b.cx + n.relX * b.w + ox,
                y: b.cy + n.relY * b.h + oy,
                shape: n.shape,
                size: v.nodeSize * n.scale,
              }
            })

            // 5. Connect Nodes (Mesh wireframe)
            if (v.connectNodes && computedNodes.length > 1) {
              ctx.save()
              ctx.strokeStyle = v.nodeColor
              ctx.lineWidth = 0.75
              const maxDist = Math.max(b.w, b.h) * 0.45

              for (let i = 0; i < computedNodes.length; i++) {
                for (let j = i + 1; j < computedNodes.length; j++) {
                  const d = Math.hypot(
                    computedNodes[i].x - computedNodes[j].x,
                    computedNodes[i].y - computedNodes[j].y,
                  )
                  if (d < maxDist) {
                    ctx.globalAlpha = alpha * (1 - d / maxDist) * 0.4
                    ctx.beginPath()
                    ctx.moveTo(computedNodes[i].x, computedNodes[i].y)
                    ctx.lineTo(computedNodes[j].x, computedNodes[j].y)
                    ctx.stroke()
                  }
                }
              }
              ctx.restore()
            }

            // 6. Draw Scattered Nodes
            ctx.save()
            if (v.blendMode !== 'source-over') {
              ctx.globalCompositeOperation = v.blendMode
            }
            computedNodes.forEach((cn, idx) => {
              this.drawNodeShape(
                cn.x,
                cn.y,
                cn.size,
                cn.shape,
                v.nodeColor,
                v.accentColor,
                idx,
              )
            })
            ctx.restore()

            ctx.restore()
          })
        },

        drawNodeShape(x, y, s, shape, color, accentColor, idx) {
          ctx.save()
          ctx.translate(x, y)

          if (shape === 'square') {
            // Edit-mode square handle
            ctx.fillStyle = color
            ctx.fillRect(-s / 2, -s / 2, s, s)
            ctx.strokeStyle = accentColor
            ctx.lineWidth = 1
            ctx.strokeRect(-s / 2, -s / 2, s, s)
          } else if (shape === 'diamond') {
            // Rotated vector handle
            ctx.rotate(Math.PI / 4)
            ctx.fillStyle = color
            ctx.fillRect(-s / 2, -s / 2, s, s)
            ctx.strokeStyle = accentColor
            ctx.lineWidth = 1
            ctx.strokeRect(-s / 2, -s / 2, s, s)
          } else if (shape === 'bracket') {
            // Mini framing bracket
            ctx.strokeStyle = color
            ctx.lineWidth = 1.5
            const hs = s * 0.6
            ctx.beginPath()
            ctx.moveTo(-hs, 0)
            ctx.lineTo(-hs, -hs)
            ctx.lineTo(0, -hs)
            ctx.moveTo(hs, 0)
            ctx.lineTo(hs, hs)
            ctx.lineTo(0, hs)
            ctx.stroke()
          } else if (shape === 'crosshair') {
            // Tech reticle +
            ctx.strokeStyle = color
            ctx.lineWidth = 1.2
            const hs = s * 0.6
            ctx.beginPath()
            ctx.moveTo(-hs, 0)
            ctx.lineTo(hs, 0)
            ctx.moveTo(0, -hs)
            ctx.lineTo(0, hs)
            ctx.stroke()
            ctx.fillStyle = accentColor
            ctx.fillRect(-1, -1, 2, 2)
          } else if (shape === 'circle') {
            // Vector node dot with ring
            ctx.beginPath()
            ctx.arc(0, 0, s / 2, 0, TAU)
            ctx.strokeStyle = color
            ctx.lineWidth = 1.2
            ctx.stroke()
            ctx.fillStyle = accentColor
            ctx.beginPath()
            ctx.arc(0, 0, s / 4, 0, TAU)
            ctx.fill()
          } else if (shape === 'triangle') {
            // Directional delta
            const hs = s * 0.6
            ctx.beginPath()
            ctx.moveTo(0, -hs)
            ctx.lineTo(hs, hs * 0.8)
            ctx.lineTo(-hs, hs * 0.8)
            ctx.closePath()
            ctx.fillStyle = color
            ctx.fill()
            ctx.strokeStyle = accentColor
            ctx.lineWidth = 1
            ctx.stroke()
          }
          ctx.restore()
        },
      }

      // ======================================================================
      // EFFECT 3: pixel-trail
      // Inspired by basementstudio/shader-lab Pixel Trail effect.
      // Discretizes video/image into a pixelated mosaic grid with decaying
      // temporal trails, chromatic aberration dispersion, and cursor interaction.
      // ======================================================================
      const pixelTrail = {
        id: 'pixel-trail',
        label: 'pixel-trail',
        groups: [
          {
            title: 'Trail Dynamics',
            controls: [
              {
                key: 'pixelSize',
                label: 'Pixel block size',
                type: 'range',
                min: 4,
                max: 48,
                step: 2,
                value: 12,
                unit: 'px',
              },
              {
                key: 'persistence',
                label: 'Trail persistence',
                type: 'range',
                min: 0.5,
                max: 0.98,
                step: 0.01,
                value: 0.91,
                unit: '',
              },
              {
                key: 'motionSensitivity',
                label: 'Motion sensitivity',
                type: 'range',
                min: 0.05,
                max: 0.95,
                step: 0.01,
                value: 0.45,
                unit: '',
              },
            ],
          },
          {
            title: 'Color & Aesthetics',
            controls: [
              {
                key: 'colorMode',
                label: 'Trail color palette',
                type: 'select',
                options: [
                  'chromatic',
                  'original',
                  'thermal',
                  'phosphor',
                  'tint',
                ],
                value: 'chromatic',
              },
              {
                key: 'trailColor',
                label: 'Tint color (for tint mode)',
                type: 'color',
                value: '#00ff88',
              },
              {
                key: 'blendMode',
                label: 'Trail blend mode',
                type: 'select',
                options: ['screen', 'lighter', 'source-over'],
                value: 'screen',
              },
              {
                key: 'glowIntensity',
                label: 'Glow intensity',
                type: 'range',
                min: 0.5,
                max: 2.5,
                step: 0.1,
                value: 1.3,
                unit: 'x',
              },
            ],
          },
          {
            title: 'Physics & Drift',
            controls: [
              {
                key: 'driftDirection',
                label: 'Trail drift',
                type: 'select',
                options: [
                  'none',
                  'down (drip)',
                  'up (float)',
                  'wind-right',

              {

                type: 'color',
                value: '#151722',
              },

          },
        ],

        // Trail grid buffers
        gridW: 0,
        gridH: 0,
        cellSize: 0,
        trailR: null,
        trailG: null,
        trailB: null,
        trailLife: null,
        prevR: null,
        prevG: null,
        prevB: null,
        downCanvas: document.createElement('canvas'),
        downCtx: null,

        initGrid(cols, rows, sz) {
          this.gridW = cols
          this.gridH = rows
          this.cellSize = sz
          const total = cols * rows
          this.trailR = new Float32Array(total)
          this.trailG = new Float32Array(total)
          this.trailB = new Float32Array(total)
          this.trailLife = new Float32Array(total)
          this.prevR = new Uint8Array(total)
          this.prevG = new Uint8Array(total)
          this.prevB = new Uint8Array(total)
          this.downCanvas.width = cols
          this.downCanvas.height = rows
          this.downCtx = this.downCanvas.getContext('2d', {
            willReadFrequently: true,
          })
        },

        draw(v, dt) {
          const { W, H, cursor } = env
          env.time += dt

          const sz = Math.max(4, Math.floor(v.pixelSize))
          const cols = Math.ceil(W / sz)
          const rows = Math.ceil(H / sz)

          if (
            this.gridW !== cols ||
            this.gridH !== rows ||
            this.cellSize !== sz ||
            !this.downCtx
          ) {
            this.initGrid(cols, rows, sz)
          }

          // Sample downsampled source frame
          this.downCtx.drawImage(env.sourceCanvas, 0, 0, cols, rows)
          const imgData = this.downCtx.getImageData(0, 0, cols, rows)
          const data = imgData.data

          const motionThreshold = Math.max(
            0.02,
            (1 - v.motionSensitivity) * 0.22,
          )
          const persistence = v.persistence
          const glow = v.glowIntensity

          let activeCount = 0

          // 1. Process cells: detect motion triggers and decay unactivated cells
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const idx = y * cols + x
              const pIdx = idx * 4

              const r = data[pIdx]
              const g = data[pIdx + 1]
              const b = data[pIdx + 2]

              // Motion delta
              const pr = this.prevR[idx]
              const pg = this.prevG[idx]
              const pb = this.prevB[idx]
              const motion =
                (Math.abs(r - pr) + Math.abs(g - pg) + Math.abs(b - pb)) /
                (3 * 255)

              // Update previous frame
              this.prevR[idx] = r
              this.prevG[idx] = g
              this.prevB[idx] = b

              // Motion trigger
              if (motion > motionThreshold) {
                this.trailLife[idx] = 1.0
                this.trailR[idx] = r
                this.trailG[idx] = g
                this.trailB[idx] = b
              } else {
                this.trailLife[idx] *= persistence
              }

              if (this.trailLife[idx] > 0.02) activeCount++
            }
          }

          // 2. Physics & Drift (optional dispersal)
          if (v.driftDirection !== 'none' && v.driftSpeed > 0) {
            this.applyDrift(cols, rows, v.driftDirection, v.driftSpeed * 0.15)
          }

          // 3. Render
          ctx.fillStyle = '#0a0b10'
          ctx.fillRect(0, 0, W, H)

          // Draw underlying video/image with dimming
          if (v.backgroundDim < 1) {
            ctx.save()
            ctx.globalAlpha = 1 - v.backgroundDim
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            ctx.restore()
          }

          // Draw trailing pixel blocks
          ctx.save()
          if (v.blendMode !== 'source-over') {
            ctx.globalCompositeOperation = v.blendMode
          }

          const mode = v.colorMode
          const showGrid = v.showGrid
          const gridColor = v.gridColor

          // Parse tint color once if tint mode
          let tintR = 0,
            tintG = 255,
            tintB = 136
          if (mode === 'tint') {
            const hex = v.trailColor.replace('#', '')
            tintR = parseInt(hex.substring(0, 2), 16) || 0
            tintG = parseInt(hex.substring(2, 4), 16) || 255
            tintB = parseInt(hex.substring(4, 6), 16) || 136
          }

          for (let y = 0; y < rows; y++) {
            const py = y * sz
            for (let x = 0; x < cols; x++) {
              const idx = y * cols + x
              const life = this.trailLife[idx]
              if (life <= 0.02) continue

              const px = x * sz
              let cr = 0,
                cg = 0,
                cb = 0,
                alpha = life

              if (mode === 'original') {
                cr = this.trailR[idx] * glow
                cg = this.trailG[idx] * glow
                cb = this.trailB[idx] * glow
              } else if (mode === 'chromatic') {
                // Signature chromatic aberration: R, G, B decay at different rates
                const rLife = life
                const gLife = Math.pow(life, 1.25)
                const bLife = Math.pow(life, 1.6)
                cr = this.trailR[idx] * rLife * glow
                cg = this.trailG[idx] * gLife * glow
                cb = this.trailB[idx] * bLife * glow
              } else if (mode === 'phosphor') {
                // Cyberpunk CRT phosphor glow (green/amber)
                cr = 20 * life
                cg = 255 * Math.min(1, life * 1.3) * glow
                cb = 140 * Math.pow(life, 2) * glow
              } else if (mode === 'thermal') {
                // Heat map spectrum based on trail age/life
                const [tr, tg, tb] = this.thermalColor(life)
                cr = tr * glow
                cg = tg * glow
                cb = tb * glow
              } else if (mode === 'tint') {
                cr = tintR * life * glow
                cg = tintG * life * glow
                cb = tintB * life * glow
              }

              ctx.fillStyle = `rgb(${Math.min(255, cr | 0)}, ${Math.min(255, cg | 0)}, ${Math.min(255, cb | 0)})`
              ctx.globalAlpha = Math.min(1, alpha)

              if (showGrid && sz > 4) {
                ctx.fillRect(px + 0.5, py + 0.5, sz - 1, sz - 1)
              } else {
                ctx.fillRect(px, py, sz, sz)
              }
            }
          }

          // Optional grid lines
          if (showGrid) {
            ctx.globalCompositeOperation = 'source-over'
            ctx.globalAlpha = 0.35
            ctx.strokeStyle = gridColor
            ctx.lineWidth = 0.5
            ctx.beginPath()
            for (let x = 0; x <= W; x += sz) {
              ctx.moveTo(x + 0.5, 0)
              ctx.lineTo(x + 0.5, H)
            }
            for (let y = 0; y <= H; y += sz) {
              ctx.moveTo(0, y + 0.5)
              ctx.lineTo(W, y + 0.5)
            }
            ctx.stroke()
          }

          ctx.restore()

          return `${activeCount.toLocaleString()} active trail blocks · ${sz}px grid`
        },

        thermalColor(t) {
          let r = 0,
            g = 0,
            b = 0
          if (t < 0.25) {
            b = Math.floor(t * 4 * 255)
          } else if (t < 0.5) {
            r = Math.floor((t - 0.25) * 4 * 255)
            b = 255
          } else if (t < 0.75) {
            r = 255
            g = Math.floor((t - 0.5) * 4 * 200)
            b = Math.floor((1 - (t - 0.5) * 4) * 255)
          } else {
            r = 255
            g = Math.floor(200 + (t - 0.75) * 4 * 55)
            b = Math.floor((t - 0.75) * 4 * 255)
          }
          return [r, g, b]
        },

        applyDrift(cols, rows, dir, rate) {
          const shiftChance = Math.min(0.6, rate)
          if (dir === 'down (drip)') {
            for (let y = rows - 2; y >= 0; y--) {
              for (let x = 0; x < cols; x++) {
                const i = y * cols + x
                const down = (y + 1) * cols + x
                if (this.trailLife[i] > 0.05 && Math.random() < shiftChance) {
                  this.trailLife[down] = Math.max(
                    this.trailLife[down],
                    this.trailLife[i] * 0.95,
                  )
                  this.trailR[down] = this.trailR[i]
                  this.trailG[down] = this.trailG[i]
                  this.trailB[down] = this.trailB[i]
                }
              }
            }
          } else if (dir === 'up (float)') {
            for (let y = 1; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                const i = y * cols + x
                const up = (y - 1) * cols + x
                if (this.trailLife[i] > 0.05 && Math.random() < shiftChance) {
                  this.trailLife[up] = Math.max(
                    this.trailLife[up],
                    this.trailLife[i] * 0.95,
                  )
                  this.trailR[up] = this.trailR[i]
                  this.trailG[up] = this.trailG[i]
                  this.trailB[up] = this.trailB[i]
                }
              }
            }
          } else if (dir === 'wind-right') {
            for (let y = 0; y < rows; y++) {
              for (let x = cols - 2; x >= 0; x--) {
                const i = y * cols + x
                const right = y * cols + (x + 1)
                if (this.trailLife[i] > 0.05 && Math.random() < shiftChance) {
                  this.trailLife[right] = Math.max(
                    this.trailLife[right],
                    this.trailLife[i] * 0.95,
                  )
                  this.trailR[right] = this.trailR[i]
                  this.trailG[right] = this.trailG[i]
                  this.trailB[right] = this.trailB[i]
                }
              }
            }
          } else if (dir === 'scatter') {
            for (let y = 1; y < rows - 1; y++) {
              for (let x = 1; x < cols - 1; x++) {
                const i = y * cols + x
                if (
                  this.trailLife[i] > 0.1 &&
                  Math.random() < shiftChance * 0.3
                ) {
                  const ox = Math.random() > 0.5 ? 1 : -1
                  const oy = Math.random() > 0.5 ? 1 : -1
                  const ni = (y + oy) * cols + (x + ox)
                  this.trailLife[ni] = Math.max(
                    this.trailLife[ni],
                    this.trailLife[i] * 0.9,
                  )
                }
              }
            }
          }
        },
      }

      // ======================================================================
      // EFFECT 4: finger-sketch
      // Inspired by shader-effects-inc/shaders interactive web shaders.
      // Pure, high-performance finger & stylus sketching canvas for drawing
      // and handwriting text directly by hand, with shader-like brush styles,
      // velocity-sensitive stroke weight, and one-click/shortcut clearing.
      // ======================================================================
      const fingerSketch = {
        id: 'finger-sketch',
        label: 'finger-sketch',
        groups: [
          {
            title: 'Brush & Stroke',
            controls: [

                key: 'brushStyle',

                key: 'fadeRate',

              {
                key: 'exportBtn',
                label: '💾 Export Canvas PNG',
                type: 'button',
                onClick: () => fingerSketch.exportPng(),
              },
            ],
          },
        ],

        // Internal sketch canvas buffer & state
        sketchCanvas: null,
        sketchCtx: null,
        currentStroke: null,
        lastPoint: null,
        lastMidX: null,
        lastMidY: null,
        lastTime: 0,
        totalStrokes: 0,

        ensureCanvas() {
          const { W, H } = env
          if (!W || !H) return

          if (!this.sketchCanvas) {
            this.sketchCanvas = document.createElement('canvas')
            this.sketchCtx = this.sketchCanvas.getContext('2d')
            this.sketchCanvas.width = W
            this.sketchCanvas.height = H
          } else if (
            this.sketchCanvas.width !== W ||
            this.sketchCanvas.height !== H
          ) {
            const old = document.createElement('canvas')
            old.width = this.sketchCanvas.width
            old.height = this.sketchCanvas.height
            old.getContext('2d').drawImage(this.sketchCanvas, 0, 0)

            this.sketchCanvas.width = W
            this.sketchCanvas.height = H
            this.sketchCtx.drawImage(old, 0, 0, W, H)
          }
        },

        clear() {
          if (this.sketchCanvas && this.sketchCtx) {
            this.sketchCtx.clearRect(
              0,
              0,
              this.sketchCanvas.width,
              this.sketchCanvas.height,
            )
          }
          this.currentStroke = null
          this.lastPoint = null
          this.lastMidX = null
          this.lastMidY = null
          this.totalStrokes = 0
        },

        exportPng() {
          this.ensureCanvas()
          const a = document.createElement('a')
          a.download = `finger-sketch-${Date.now()}.png`
          a.href = this.sketchCanvas.toDataURL('image/png')
          a.click()
        },

        onPointerDown(x, y) {
          this.ensureCanvas()
          const now = performance.now()
          this.lastPoint = { x, y }
          this.lastMidX = x
          this.lastMidY = y
          this.lastTime = now
          this.currentStroke = [{ x, y, time: now, speed: 0 }]
          this.totalStrokes++

          const v = values[this.id]
          this.drawBrushSegment(x, y, x, y, v.brushSize, v)
        },

        onPointerMove(x, y, isDown) {
          if (!isDown || !this.lastPoint) return
          this.ensureCanvas()

          const now = performance.now()
          const dx = x - this.lastPoint.x
          const dy = y - this.lastPoint.y
          const dist = Math.hypot(dx, dy)
          if (dist < 1.2) return

          const dt = Math.max(0.001, (now - this.lastTime) / 1000)
          const speed = dist / dt
          this.lastTime = now

          const v = values[this.id]
          const sens = v.pressureSens
          // Pen velocity dynamics: smooth taper for handwriting & sketching
          const speedFactor = Math.max(
            0.3,
            Math.min(1.8, 1.35 - (speed / 1100) * sens),
          )
          const currentWidth = Math.max(2, v.brushSize * speedFactor)

          this.currentStroke.push({ x, y, time: now, speed })

          if (this.currentStroke.length >= 3) {
            const len = this.currentStroke.length
            const p0 = this.currentStroke[len - 2]
            const p1 = this.currentStroke[len - 1]
            const midX = (p0.x + p1.x) / 2
            const midY = (p0.y + p1.y) / 2
            this.drawSmoothCurve(
              this.lastMidX ?? p0.x,
              this.lastMidY ?? p0.y,
              p0.x,
              p0.y,
              midX,
              midY,
              currentWidth,
              v,
            )
            this.lastMidX = midX
            this.lastMidY = midY
          } else {
            this.drawBrushSegment(
              this.lastPoint.x,
              this.lastPoint.y,
              x,
              y,
              currentWidth,
              v,
            )
            this.lastMidX = (this.lastPoint.x + x) / 2
            this.lastMidY = (this.lastPoint.y + y) / 2
          }

          this.lastPoint = { x, y }
        },

        onPointerUp() {
          this.lastPoint = null
          this.lastMidX = null
          this.lastMidY = null
          this.currentStroke = null
        },

        drawBrushSegment(x1, y1, x2, y2, width, v) {
          const sCtx = this.sketchCtx
          sCtx.save()
          sCtx.lineCap = 'round'
          sCtx.lineJoin = 'round'

          if (v.brushStyle === 'neon-glow') {
            const glow = v.glowIntensity
            sCtx.shadowColor = v.brushColor
            sCtx.shadowBlur = glow
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.75
            sCtx.beginPath()
            sCtx.moveTo(x1, y1)
            sCtx.lineTo(x2, y2)
            sCtx.stroke()

            // Hot luminous core
            sCtx.shadowBlur = 0
            sCtx.strokeStyle = '#ffffff'
            sCtx.lineWidth = Math.max(1.5, width * 0.28)
            sCtx.globalAlpha = 0.95
            sCtx.stroke()
          } else if (v.brushStyle === 'chalk') {
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.72
            sCtx.beginPath()
            sCtx.moveTo(x1, y1)
            sCtx.lineTo(x2, y2)
            sCtx.stroke()

            // Realistic chalk dust speckles
            const dist = Math.hypot(x2 - x1, y2 - y1)
            const count = Math.max(2, Math.floor(dist / 2.5))
            sCtx.fillStyle = v.brushColor
            for (let k = 0; k < count; k++) {
              const t = Math.random()
              const px =
                x1 + (x2 - x1) * t + (Math.random() - 0.5) * width * 0.85
              const py =
                y1 + (y2 - y1) * t + (Math.random() - 0.5) * width * 0.85
              const r = Math.random() * 1.5 + 0.4
              sCtx.globalAlpha = Math.random() * 0.55 + 0.25
              sCtx.beginPath()
              sCtx.arc(px, py, r, 0, TAU)
              sCtx.fill()
            }
          } else if (v.brushStyle === 'ink-pen') {
            // Calligraphy fountain pen for clean handwriting
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.95
            sCtx.beginPath()
            sCtx.moveTo(x1, y1)
            sCtx.lineTo(x2, y2)
            sCtx.stroke()
          } else if (v.brushStyle === 'frosted-wipe') {
            // Translucent glass wiper
            sCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)'
            sCtx.lineWidth = width
            sCtx.shadowColor = 'rgba(255, 255, 255, 0.4)'
            sCtx.shadowBlur = width * 0.4
            sCtx.beginPath()
            sCtx.moveTo(x1, y1)
            sCtx.lineTo(x2, y2)
            sCtx.stroke()

            const dist = Math.hypot(x2 - x1, y2 - y1)
            const beads = Math.max(1, Math.floor(dist / 6))
            sCtx.fillStyle = 'rgba(255, 255, 255, 0.7)'
            for (let k = 0; k < beads; k++) {
              const side = Math.random() > 0.5 ? 1 : -1
              const t = Math.random()
              const nx = -(y2 - y1) / (dist || 1)
              const ny = (x2 - x1) / (dist || 1)
              const px = x1 + (x2 - x1) * t + nx * (width * 0.5 * side)
              const py = y1 + (y2 - y1) * t + ny * (width * 0.5 * side)
              sCtx.beginPath()
              sCtx.arc(px, py, Math.random() * 1.8 + 0.8, 0, TAU)
              sCtx.fill()
            }
          } else {
            // soft-spray
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.shadowColor = v.brushColor
            sCtx.shadowBlur = width * 0.6
            sCtx.globalAlpha = 0.55
            sCtx.beginPath()
            sCtx.moveTo(x1, y1)
            sCtx.lineTo(x2, y2)
            sCtx.stroke()
          }

          sCtx.restore()
        },

        drawSmoothCurve(startX, startY, ctrlX, ctrlY, endX, endY, width, v) {
          const sCtx = this.sketchCtx
          sCtx.save()
          sCtx.lineCap = 'round'
          sCtx.lineJoin = 'round'

          if (v.brushStyle === 'neon-glow') {
            const glow = v.glowIntensity
            sCtx.shadowColor = v.brushColor
            sCtx.shadowBlur = glow
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.75
            sCtx.beginPath()
            sCtx.moveTo(startX, startY)
            sCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY)
            sCtx.stroke()

            sCtx.shadowBlur = 0
            sCtx.strokeStyle = '#ffffff'
            sCtx.lineWidth = Math.max(1.5, width * 0.28)
            sCtx.globalAlpha = 0.95
            sCtx.stroke()
          } else if (v.brushStyle === 'chalk') {
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.72
            sCtx.beginPath()
            sCtx.moveTo(startX, startY)
            sCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY)
            sCtx.stroke()

            const dist = Math.hypot(endX - startX, endY - startY)
            const count = Math.max(2, Math.floor(dist / 2.5))
            sCtx.fillStyle = v.brushColor
            for (let k = 0; k < count; k++) {
              const t = Math.random()
              const invT = 1 - t
              const px =
                invT * invT * startX +
                2 * invT * t * ctrlX +
                t * t * endX +
                (Math.random() - 0.5) * width * 0.85
              const py =
                invT * invT * startY +
                2 * invT * t * ctrlY +
                t * t * endY +
                (Math.random() - 0.5) * width * 0.85
              const r = Math.random() * 1.5 + 0.4
              sCtx.globalAlpha = Math.random() * 0.55 + 0.25
              sCtx.beginPath()
              sCtx.arc(px, py, r, 0, TAU)
              sCtx.fill()
            }
          } else if (v.brushStyle === 'ink-pen') {
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.globalAlpha = 0.95
            sCtx.beginPath()
            sCtx.moveTo(startX, startY)
            sCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY)
            sCtx.stroke()
          } else if (v.brushStyle === 'frosted-wipe') {
            sCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)'
            sCtx.lineWidth = width
            sCtx.shadowColor = 'rgba(255, 255, 255, 0.4)'
            sCtx.shadowBlur = width * 0.4
            sCtx.beginPath()
            sCtx.moveTo(startX, startY)
            sCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY)
            sCtx.stroke()
          } else {
            // soft-spray
            sCtx.strokeStyle = v.brushColor
            sCtx.lineWidth = width
            sCtx.shadowColor = v.brushColor
            sCtx.shadowBlur = width * 0.6
            sCtx.globalAlpha = 0.55
            sCtx.beginPath()
            sCtx.moveTo(startX, startY)
            sCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY)
            sCtx.stroke()
          }

          sCtx.restore()
        },

        drawChalkboardBg(c, W, H) {
          const grad = c.createRadialGradient(
            W / 2,
            H / 2,
            50,
            W / 2,
            H / 2,
            Math.max(W, H) * 0.7,
          )
          grad.addColorStop(0, '#151d18')
          grad.addColorStop(1, '#0b0f0c')
          c.fillStyle = grad
          c.fillRect(0, 0, W, H)

          c.strokeStyle = 'rgba(255, 255, 255, 0.02)'
          c.lineWidth = 24
          c.beginPath()
          c.moveTo(W * 0.1, H * 0.2)
          c.lineTo(W * 0.9, H * 0.25)
          c.moveTo(W * 0.15, H * 0.5)
          c.lineTo(W * 0.85, H * 0.55)
          c.moveTo(W * 0.05, H * 0.8)
          c.lineTo(W * 0.95, H * 0.78)
          c.stroke()
        },

        drawDarkCanvasBg(c, W, H) {
          const grad = c.createLinearGradient(0, 0, 0, H)
          grad.addColorStop(0, '#0d1017')
          grad.addColorStop(0.5, '#121622')
          grad.addColorStop(1, '#090c12')
          c.fillStyle = grad
          c.fillRect(0, 0, W, H)

          // Subtle blueprint grid
          c.strokeStyle = 'rgba(255, 255, 255, 0.025)'
          c.lineWidth = 1
          const sz = 40
          c.beginPath()
          for (let x = 0; x < W; x += sz) {
            c.moveTo(x, 0)
            c.lineTo(x, H)
          }
          for (let y = 0; y < H; y += sz) {
            c.moveTo(0, y)
            c.lineTo(W, y)
          }
          c.stroke()
        },

        draw(v, dt) {
          const { W, H } = env
          this.ensureCanvas()

          // Vapor fade decay if enabled
          if (v.fadeRate > 0) {
            this.sketchCtx.save()
            this.sketchCtx.globalCompositeOperation = 'destination-out'
            this.sketchCtx.fillStyle = `rgba(0, 0, 0, ${Math.min(1, v.fadeRate * dt * 8)})`
            this.sketchCtx.fillRect(0, 0, W, H)
            this.sketchCtx.restore()
          }

          // Background
          if (v.background === 'media-source') {
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
          } else if (v.background === 'chalkboard') {
            this.drawChalkboardBg(ctx, W, H)
          } else if (v.background === 'dark-canvas') {
            this.drawDarkCanvasBg(ctx, W, H)
          } else if (v.background === 'pure-white') {
            ctx.fillStyle = '#ffffff'
            ctx.fillRect(0, 0, W, H)
          } else {
            ctx.fillStyle = '#06070a'
            ctx.fillRect(0, 0, W, H)
          }

          // Draw sketch canvas
          ctx.save()
          if (v.brushStyle === 'neon-glow') {
            ctx.drawImage(this.sketchCanvas, 0, 0)
            ctx.globalCompositeOperation = 'screen'
            ctx.globalAlpha = 0.35
            ctx.drawImage(this.sketchCanvas, 0, 0)
          } else {
            ctx.drawImage(this.sketchCanvas, 0, 0)
          }
          ctx.restore()

          return `${this.totalStrokes} strokes · Canvas ${W}×${H} · ${v.brushStyle}`
        },
      }

      // ======================================================================
      // EFFECT 5: pixel-beams (Dither Wave)
      // Inspired by Shaders.com "Pixel Beams" & "Dither Wave" and
      // basementstudio/shader-lab WebGPU retro compositing presets.
      // Turns any image, video, webcam, or generative motion input into
      // undulating, retro-dithered light beams, wavefields, and CRT phosphor rays.
      // ======================================================================
      const BAYER2_DATA = [0 / 4, 2 / 4, 3 / 4, 1 / 4]

      const BAYER4_DATA = [
        0 / 16,
        8 / 16,
        2 / 16,
        10 / 16,
        12 / 16,
        4 / 16,
        14 / 16,
        6 / 16,
        3 / 16,
        11 / 16,
        1 / 16,
        9 / 16,
        15 / 16,
        7 / 16,
        13 / 16,
        5 / 16,
