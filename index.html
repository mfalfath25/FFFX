<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOOOOOOLS · FFFX Vision & Shader Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23111'/><text y='70' x='25' font-size='65' fill='%2300ff88' font-family='monospace'>T</text></svg>" />
    <style>
      :root {
        --bg: #f9f8f5;
        --surface: #ffffff;
        --surface-alt: #f2efe8;
        --border: #dfddd6;
        --border-subtle: #eae8e1;
        --border-focus: #111111;
        --text: #141414;
        --text-muted: #6e6d68;
        --text-dim: #999893;
        --accent: #111111;
        --accent-contrast: #ffffff;
        --tooltip-bg: #141414;
        --tooltip-fg: #f9f8f5;
        --stage-bg: #eceae3;
        --badge-bg: #eae7de;
        --active-indicator: #008844;
        --danger: #d9383a;
        --mono-font: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      }

      :root[data-theme="dark"] {
        --bg: #0e1014;
        --surface: #141720;
        --surface-alt: #1a1e2a;
        --border: #232735;
        --border-subtle: #1c202c;
        --border-focus: #f0f1f5;
        --text: #f0f1f5;
        --text-muted: #8b8f9e;
        --text-dim: #5c6072;
        --accent: #f0f1f5;
        --accent-contrast: #0e1014;
        --tooltip-bg: #f0f1f5;
        --tooltip-fg: #0e1014;
        --stage-bg: #08090d;
        --badge-bg: #1a1e2a;
        --active-indicator: #00ff88;
        --danger: #ff4d4f;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: var(--mono-font);
        font-size: 12px;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: grid;
        grid-template-columns: 230px 310px 1fr;
        grid-template-rows: 100vh;
      }

      /* ======================================================================
         Tooltip System for Icon Buttons
         ====================================================================== */
      [data-tooltip] {
        position: relative;
      }
      [data-tooltip]::after {
        content: attr(data-tooltip);
        position: absolute;
        top: calc(100% + 7px);
        left: 50%;
        transform: translateX(-50%) translateY(-2px);
        background: var(--tooltip-bg);
        color: var(--tooltip-fg);
        border: 1px solid var(--border);
        padding: 4px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
        white-space: nowrap;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.12s ease, transform 0.12s ease;
        z-index: 2000;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
      }
      [data-tooltip]:hover::after {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }
      [data-tooltip-align="right"]::after {
        left: auto;
        right: 0;
        transform: translateY(-2px);
      }
      [data-tooltip-align="right"]:hover::after {
        transform: translateY(0);
      }
      [data-tooltip-align="left"]::after {
        left: 0;
        transform: translateY(-2px);
      }
      [data-tooltip-align="left"]:hover::after {
        transform: translateY(0);
      }

      /* ======================================================================
         Column 1: Drawer (Left)
         ====================================================================== */
      .app-drawer {
        border-right: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        user-select: none;
      }
      .drawer-brand {
        padding: 14px 14px 12px;
        border-bottom: 1px solid var(--border);
      }
      .brand-title {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .brand-title .brand-box {
        font-weight: 400;
        color: var(--text-dim);
      }
      .brand-sub {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 3px;
        letter-spacing: 0.03em;
      }

      .drawer-section {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .section-heading {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      .drawer-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .drawer-item {
        background: none;
        border: 1px solid transparent;
        color: var(--text);
        padding: 6px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 2px;
        transition: all 0.1s ease;
      }
      .drawer-item:hover {
        background: var(--surface-alt);
        border-color: var(--border);
      }
      .drawer-item.active {
        background: var(--accent);
        color: var(--accent-contrast);
        border-color: var(--accent);
        font-weight: 600;
      }
      .drawer-item .item-state {
        font-size: 10px;
        opacity: 0.8;
      }

      .drawer-shortcuts {
        margin-top: auto;
        border-top: 1px solid var(--border);
        border-bottom: none;
        padding: 12px 14px;
        font-size: 10px;
      }
      .shortcut-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        color: var(--text-muted);
      }
      .shortcut-row kbd, kbd {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 1px 4px;
        border-radius: 2px;
        font-family: var(--mono-font);
        font-size: 9px;
      }

      /* ======================================================================
         Column 2: Control Panel (Center)
         ====================================================================== */
      .control-panel {
        border-right: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .uploader-card {
        border: 1px dashed var(--border);
        background: var(--surface-alt);
        margin: 12px 12px 6px;
        padding: 12px 10px;
        text-align: center;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.15s ease;
        user-select: none;
      }
      .uploader-card:hover {
        border-color: var(--accent);
        background: var(--bg);
      }
      .uploader-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .uploader-sub {
        font-size: 9px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .panel-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ASCII Collapsible Groups */
      .ascii-group {
        border-top: 1px solid var(--border-subtle);
        padding-top: 10px;
      }
      .ascii-group-header {
        width: 100%;
        background: none;
        border: none;
        padding: 0;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: var(--mono-font);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text);
        cursor: pointer;
        text-align: left;
        user-select: none;
      }
      .ascii-group-header:hover {
        color: var(--accent);
      }
      .ascii-group-header .group-toggle {
        color: var(--text-muted);
      }
      .ascii-group-body {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .ascii-group.collapsed .ascii-group-body {
        display: none;
      }

      /* Controls */
      .ctl-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .ctl-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
      }
      .ctl-label {
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .ctl-val {
        font-variant-numeric: tabular-nums;
        color: var(--text);
        font-weight: 500;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 2px;
        background: var(--border);
        outline: none;
        margin: 5px 0 2px;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 10px;
        height: 10px;
        background: var(--accent);
        cursor: pointer;
        border-radius: 1px;
      }
      input[type="range"]::-moz-range-thumb {
        width: 10px;
        height: 10px;
        background: var(--accent);
        cursor: pointer;
        border-radius: 1px;
        border: none;
      }

      .mono-select {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        border-radius: 2px;
        cursor: pointer;
        outline: none;
      }
      .mono-select:focus {
        border-color: var(--border-focus);
      }

      .mono-text-input {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        border-radius: 2px;
        outline: none;
      }
      .mono-text-input:focus {
        border-color: var(--border-focus);
      }

      .mono-toggle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.1s ease;
      }
      .mono-toggle:hover {
        background: var(--surface-alt);
      }
      .mono-toggle.active {
        border-color: var(--accent);
        font-weight: 600;
      }

      .mono-color-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
      }
      .color-preview-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .color-swatch {
        width: 22px;
        height: 20px;
        border: 1px solid var(--border);
        border-radius: 2px;
        cursor: pointer;
      }
      input[type="color"].mono-color-input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
        pointer-events: none;
      }

      .mono-btn {
        width: 100%;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.1s ease;
      }
      .mono-btn:hover {
        background: var(--bg);
        border-color: var(--accent);
      }

      .panel-footer {
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
      .btn-export {
        width: 100%;
        background: var(--accent);
        color: var(--accent-contrast);
        border: 1px solid var(--accent);
        padding: 8px 10px;
        font-family: var(--mono-font);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        border-radius: 2px;
        transition: opacity 0.15s;
      }
      .btn-export:hover {
        opacity: 0.9;
      }
      .btn-export kbd {
        background: rgba(255, 255, 255, 0.2);
        color: var(--accent-contrast);
        border: none;
      }

      /* ======================================================================
         Column 3: Stage Area & Top Menu
         ====================================================================== */
      .stage-area {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
      }

      .top-menu {
        height: 46px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px;
        user-select: none;
        position: relative;
        z-index: 100;
      }

      .menu-group {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .menu-divider {
        width: 1px;
        height: 18px;
        background: var(--border);
        margin: 0 4px;
      }
      .menu-spacer {
        flex: 1;
      }

      /* Lucide Icon Buttons */
      .icon-btn {
        width: 32px;
        height: 32px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.12s ease;
      }
      .icon-btn:hover:not(:disabled) {
        background: var(--surface-alt);
        border-color: var(--text-muted);
      }
      .icon-btn.active {
        background: var(--accent);
        color: var(--accent-contrast);
        border-color: var(--accent);
      }
      .icon-btn:disabled, .icon-btn.disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .icon-btn.danger-active {
        background: var(--danger);
        color: #fff;
        border-color: var(--danger);
      }

      /* Dropdown Popover for Image Presets */
      .dropdown-wrap {
        position: relative;
      }
      .dropdown-menu {
        position: absolute;
        top: calc(100% + 5px);
        left: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 2px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        min-width: 190px;
        display: none;
        flex-direction: column;
        padding: 4px;
        z-index: 1500;
      }
      .dropdown-wrap.open .dropdown-menu {
        display: flex;
      }
      .dropdown-item {
        background: none;
        border: none;
        color: var(--text);
        font-family: var(--mono-font);
        font-size: 11px;
        padding: 6px 8px;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 2px;
      }
      .dropdown-item:hover {
        background: var(--surface-alt);
      }
      .dropdown-sep {
        height: 1px;
        background: var(--border-subtle);
        margin: 3px 0;
      }

      /* Effects Info Bar */
      .effects-info-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--badge-bg);
        border: 1px solid var(--border);
        padding: 4px 8px;
        border-radius: 2px;
        font-size: 10px;
        cursor: default;
      }
      .info-pill {
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .info-pill.effect-name {
        color: var(--text);
      }
      .info-pill.source-name {
        color: var(--text-muted);
      }
      .info-pill.source-name::before,
      .info-pill.res-badge::before,
      .info-pill.stats-badge::before {
        content: "·";
        margin-right: 6px;
        color: var(--text-dim);
      }
      .info-pill.res-badge {
        color: var(--text-muted);
      }
      .info-pill.stats-badge {
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      /* Stage Viewport */
      .stage-wrap {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: auto;
        background: var(--stage-bg);
      }
      #stage {
        position: relative;
        line-height: 0;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.14);
        border: 1px solid var(--border);
        background: #000;
        cursor: crosshair;
        overflow: hidden;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: calc(100vh - 110px);
      }
      #dropHint {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        place-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(14, 16, 20, 0.88);
        color: #00ff88;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        border: 2px dashed #00ff88;
        pointer-events: none;
      }
      #stage.dragging #dropHint {
        display: flex;
      }
    </style>
  </head>
  <body>
    <!-- Column 1: Drawer -->
    <aside class="app-drawer">
      <div class="drawer-brand">
        <div class="brand-title"><span class="brand-box">[ ]</span> TOOOOOOLS.APP</div>
        <div class="brand-sub">FFFX VISION & SHADER LAB</div>
      </div>

      <div class="drawer-section">
        <div class="section-heading">/EFFECTS</div>
        <div class="drawer-list" id="menu"></div>
      </div>

      <div class="drawer-section">
        <div class="section-heading">/SOURCES</div>
        <div class="drawer-list" id="drawerSources">
          <button class="drawer-item active" data-source="motion-demo">
            <span>MOTION DEMO</span>
            <span class="item-state">[•]</span>
          </button>
          <button class="drawer-item" data-source="sunset">
            <span>SUNSET</span>
            <span class="item-state">[ ]</span>
          </button>
        </div>
      </div>

      <div class="drawer-shortcuts">
        <div class="section-heading">/SHORTCUTS</div>
        <div class="shortcut-row"><span>TOGGLE CURSOR</span><kbd>M</kbd></div>
        <div class="shortcut-row"><span>OPEN MEDIA</span><kbd>Ctrl+O</kbd></div>
        <div class="shortcut-row"><span>SAVE FRAME</span><kbd>Ctrl+S</kbd></div>
        <div class="shortcut-row"><span>FULLSCREEN</span><kbd>F</kbd></div>
        <div class="shortcut-row"><span>CLEAR SKETCH</span><kbd>C</kbd></div>
      </div>
    </aside>

    <!-- Column 2: Control Panel -->
    <aside class="control-panel">
      <div class="uploader-card" id="dropCard" data-tooltip="Upload Image or Video (Ctrl+O)" data-tooltip-align="left">
        <div class="uploader-header">
          <svg class="lucide lucide-upload" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <span>+ DROP MEDIA OR CLICK</span>
        </div>
        <div class="uploader-sub">PNG · JPG · MP4 · WEBM</div>
      </div>
      <input type="file" id="file" accept="image/*,video/*" hidden />

      <div class="panel-scroll" id="panel"></div>

      <div class="panel-footer">
        <button class="btn-export" id="exportBtn" data-tooltip="Save Active Frame as PNG (Ctrl+S)" data-tooltip-align="left">
          <span>EXPORT CANVAS</span>
          <kbd>Ctrl+S</kbd>
        </button>
      </div>
    </aside>

    <!-- Column 3: Stage Area -->
    <main class="stage-area">
      <!-- Top Menu -->
      <header class="top-menu">
        <!-- Media Source Buttons -->
        <div class="menu-group">
          <!-- Image Dropdown Button -->
          <div class="dropdown-wrap" id="imageDropdownWrap">
            <button class="icon-btn" id="imageBtn" data-tooltip="Image Presets & File...">
              <svg class="lucide lucide-image" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </button>
            <div class="dropdown-menu" id="imageMenu">
              <button class="dropdown-item" data-action="open-file">
                <span>Open Image File...</span>
                <kbd>Ctrl+O</kbd>
              </button>
              <div class="dropdown-sep"></div>
              <button class="dropdown-item" data-preset="sunset">Sunset Preset</button>
            </div>
          </div>

          <!-- Video / Motion Demo Button -->
          <button class="icon-btn" id="videoBtn" data-tooltip="Video / Motion Demo">
            <svg class="lucide lucide-film" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>
          </button>

          <!-- Webcam Button -->
          <button class="icon-btn" id="webcamBtn" data-tooltip="Start Live Webcam">
            <svg class="lucide lucide-camera" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          </button>

          <!-- Stop Webcam Button -->

    <script>
      const ROOT = 64 // canvas dimensions snapped to multiples of this
      const TAU = Math.PI * 2

      // ======================================================================
      // Shared Media Pipeline & Environment
      // ======================================================================
      const canvas = document.getElementById('canvas')
      const ctx = canvas.getContext('2d')
      const stage = document.getElementById('stage')
      const statsEl = document.getElementById('stats')
      const sourceBadge = document.getElementById('sourceBadge')
      const effectPill = document.getElementById('effectPill')
      const resPill = document.getElementById('resPill')

      const env = {
        W: 0,
        H: 0,
        time: 0,
        sat: null, // summed-area table for quadtree
        cursor: { x: 0, y: 0, targetX: 0, targetY: 0, lastMoveAt: 0 },
        cursorEnabled: true,
        // Offscreen canvas storing current source frame
        sourceCanvas: document.createElement('canvas'),
        sourceCtx: null,
        // Source state
        sourceType: 'demo', // 'image' | 'video' | 'webcam' | 'demo'
        sourceVideo: null,
        sourceImage: null,
        demoState: null,
        isWebcam: false,
      }
      env.sourceCtx = env.sourceCanvas.getContext('2d', {
        willReadFrequently: true,
      })
      // ---------------- Summed-Area Table (Quadtree) ----------------
      function buildTables(imageData) {
        const { W, H } = env
        const data = imageData.data
        const stride = W + 1
        const size = stride * (H + 1)
        const r = new Float64Array(size)
        const g = new Float64Array(size)
        const b = new Float64Array(size)
        const l = new Float64Array(size)
        const l2 = new Float64Array(size)

        for (let y = 0; y < H; y++) {
          let rr = 0,
            gg = 0,
            bb = 0,
            ll = 0,
            ll2 = 0
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4
            const luma =
              0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]
            rr += data[i]
            gg += data[i + 1]
            bb += data[i + 2]
            ll += luma
            ll2 += luma * luma
            const idx = (y + 1) * stride + (x + 1)
            const up = y * stride + (x + 1)
            r[idx] = r[up] + rr
            g[idx] = g[up] + gg
            b[idx] = b[up] + bb
            l[idx] = l[up] + ll
            l2[idx] = l2[up] + ll2
          }
        }
        env.sat = { r, g, b, l, l2, stride }
      }

      function rectSum(table, x, y, s) {
        const st = env.sat.stride
        return (
          table[(y + s) * st + (x + s)] -
          table[y * st + (x + s)] -
          table[(y + s) * st + x] +
          table[y * st + x]
        )
      }

      function lumaStdDev(x, y, s) {
        const n = s * s
        const mean = rectSum(env.sat.l, x, y, s) / n
        const variance = rectSum(env.sat.l2, x, y, s) / n - mean * mean
        return Math.sqrt(Math.max(0, variance))
      }

      function hash(x, y, s) {
        let h =
          Math.imul(x, 374761393) +
          Math.imul(y, 668265263) +
          Math.imul(s, 1274126177)
        h = Math.imul(h ^ (h >>> 13), 1274126177)
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296
      }

      // ======================================================================
      // EFFECT 1: quadtree-bokeh
      // ======================================================================
      const quadtreeBokeh = {
        id: 'quadtree-bokeh',
        label: 'quadtree-bokeh',
        groups: [
          {
            title: 'Focus',
            controls: [
              {
                key: 'shape',
                label: 'Focus shape',
                type: 'select',
                options: ['square', 'circle'],
                value: 'square',
              },
              {
                key: 'radius',
                label: 'Focus size',
                type: 'range',
                min: 20,
                max: 400,
                step: 1,
                value: 110,
                unit: 'px',
              },
              {
                key: 'falloff',
                label: 'Falloff distance',
                type: 'range',
                min: 40,
                max: 800,
                step: 1,
                value: 320,
                unit: 'px',
              },
              {
                key: 'minSize',
                label: 'Finest square',
                type: 'select',
                options: [1, 2, 4, 8],
                value: 2,
              },
              {
                key: 'maxSize',
                label: 'Coarsest square',
                type: 'select',
                options: [16, 32, 64],
                value: 64,
              },
              {
                key: 'skipFlat',
                label: 'Skip flat regions',
                type: 'checkbox',
                value: true,
              },
            ],
          },
          {
            title: 'Alive',
            controls: [
              {
                key: 'speed',
                label: 'Speed',
                type: 'range',
                min: 0,
                max: 4,
                step: 0.05,
                value: 1,
                unit: 'x',
              },
              {
                key: 'shimmer',
                label: 'Edge shimmer',
                type: 'range',
                min: 0,
                max: 160,
                step: 1,
                value: 60,
                unit: 'px',
              },
              {
                key: 'glitter',
                label: 'Glitter',
                type: 'range',
                min: 0,
                max: 1,
                step: 0.01,
                value: 0.35,
                unit: '',
              },
              {
                key: 'breathing',
                label: 'Focus breathing',
                type: 'range',
                min: 0,
                max: 1,
                step: 0.01,
                value: 0.25,
                unit: '',
              },
              {
                key: 'wander',
                label: 'Wander when idle',
                type: 'checkbox',
                value: true,
              },
            ],
          },
          {
            title: 'Display',
            controls: [
              {
                key: 'showGrid',
                label: 'Show grid',
                type: 'checkbox',
                value: false,
              },
              {
                key: 'gridWidth',
                label: 'Grid width',
                type: 'range',
                min: 0.01,
                max: 10,
                step: 0.01,
                value: 1,
                unit: 'px',
              },
              {
                key: 'gridColor',
                label: 'Grid color',
                type: 'color',
                value: '#000000',
              },
            ],
          },
        ],

        flatThreshold: 6,
        leaves: [],

        draw(v, dt) {
          const { W, H, cursor } = env
          env.time += dt * v.speed

          if (env.cursorEnabled && v.wander && performance.now() - cursor.lastMoveAt > 2500) {
            cursor.targetX = W * (0.5 + 0.32 * Math.sin(env.time * 0.55))
            cursor.targetY = H * (0.5 + 0.3 * Math.sin(env.time * 0.83 + 1.2))
          }
          if (env.cursorEnabled) {
            cursor.x += (cursor.targetX - cursor.x) * 0.18
            cursor.y += (cursor.targetY - cursor.y) * 0.18
          }

          const radius =
            v.radius * (1 + v.breathing * 0.3 * Math.sin(env.time * 0.9))
          const params = { ...v, radius, time: env.time }

          this.leaves = []
          for (let y = 0; y < H; y += ROOT) {
            for (let x = 0; x < W; x += ROOT) {
              this.subdivide(x, y, ROOT, params)
            }
          }
          this.render(v)
          return `${(this.leaves.length / 6).toLocaleString()} squares`
        },

        distance(x, y, s, shape) {
          const { cursor } = env
          const dx = Math.max(x - cursor.x, 0, cursor.x - (x + s))
          const dy = Math.max(y - cursor.y, 0, cursor.y - (y + s))
          return shape === 'square' ? Math.max(dx, dy) : Math.hypot(dx, dy)
        },

        allowedSize(x, y, s, p) {
          if (!env.cursorEnabled) {
            return p.minSize
          }
          let d = this.distance(x, y, s, p.shape)
          if (p.shimmer > 0) {
            d += p.shimmer * Math.sin(p.time * 2.2 + hash(x, y, s) * TAU)
          }
          if (d <= p.radius) return p.minSize
          const t = Math.min(1, (d - p.radius) / p.falloff)
          return p.minSize + (p.maxSize - p.minSize) * t * t
        },

        subdivide(x, y, s, p) {
          const wantSplit = s > p.minSize && s > this.allowedSize(x, y, s, p)
          const isFlat =
            p.skipFlat && wantSplit && lumaStdDev(x, y, s) < this.flatThreshold

          if (wantSplit && !isFlat) {
            const h = s / 2
            this.subdivide(x, y, h, p)
            this.subdivide(x + h, y, h, p)
            this.subdivide(x, y + h, h, p)
            this.subdivide(x + h, y + h, h, p)
            return
          }

          const n = s * s
          this.leaves.push(
            x,
            y,
            s,
            rectSum(env.sat.r, x, y, s) / n,
            rectSum(env.sat.g, x, y, s) / n,
            rectSum(env.sat.b, x, y, s) / n,
          )
        },

        render(v) {
          const { W, H, time } = env
          const leaves = this.leaves
          const gutterGrid = v.showGrid && v.gridWidth >= 1
          const hairlineGrid = v.showGrid && v.gridWidth < 1

          ctx.fillStyle = gutterGrid ? v.gridColor : '#000'
          ctx.fillRect(0, 0, W, H)

          for (let i = 0; i < leaves.length; i += 6) {
            const x = leaves[i],
              y = leaves[i + 1],
              s = leaves[i + 2]
            let r = leaves[i + 3],
              g = leaves[i + 4],
              b = leaves[i + 5]

            if (v.glitter > 0) {
              const phase = hash(x, y, s + 101)
              const flicker =
                1 + 0.07 * v.glitter * Math.sin(time * 3 + phase * 60)
              const pulse = Math.max(0, Math.sin(time * 1.7 + phase * 80))
              const sparkle =
                Math.pow(pulse, 16) *
                v.glitter *
                (0.35 + (0.65 * s) / v.maxSize)
              r = Math.min(255, r * flicker + (255 - r) * sparkle)
              g = Math.min(255, g * flicker + (255 - g) * sparkle)
              b = Math.min(255, b * flicker + (255 - b) * sparkle)
            }

            ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`
            const inset = gutterGrid ? Math.min(v.gridWidth / 2, s * 0.25) : 0
            ctx.fillRect(x + inset, y + inset, s - inset * 2, s - inset * 2)
          }

          if (hairlineGrid) {
            ctx.globalAlpha = v.gridWidth
            ctx.strokeStyle = v.gridColor
            ctx.lineWidth = 1
            ctx.beginPath()
            for (let i = 0; i < leaves.length; i += 6) {
              ctx.rect(leaves[i], leaves[i + 1], leaves[i + 2], leaves[i + 2])
            }
            ctx.stroke()
            ctx.globalAlpha = 1
          }
        },
      }

      // ======================================================================
      // EFFECT 2: blob-tracker
      // Inspired by basementstudio/shader-lab blob tracking layer.
      // Detects motion / bright regions in image or video, frames them with
      // CCTV/transform edit-mode boxes, and animates scattered tech nodes.
      // ======================================================================
      const blobTracker = {
        id: 'blob-tracker',
        label: 'blob-tracker',
        groups: [
          {
            title: 'Detection',
            controls: [
              {
                key: 'detectMode',
                label: 'Detection mode',
                type: 'select',
                options: ['motion', 'brightness', 'hybrid'],
                value: 'motion',
              },
              {
                key: 'sensitivity',
                label: 'Sensitivity',
                type: 'range',
                min: 0.05,
                max: 0.95,
                step: 0.01,
                value: 0.4,
                unit: '',
              },
              {
                key: 'minSize',
                label: 'Min blob size',
                type: 'range',
                min: 10,
                max: 150,
                step: 5,
                value: 25,
                unit: 'px',
              },
              {
                key: 'maxBlobs',
                label: 'Max blobs',
                type: 'range',
                min: 1,
                max: 10,
                step: 1,
                value: 5,
                unit: '',
              },
              {
                key: 'smoothing',
                label: 'Tracking smooth',
                type: 'range',
                min: 0.05,
                max: 0.8,
                step: 0.05,
                value: 0.25,
                unit: '',
              },
            ],
          },
          {
            title: 'Scatter Nodes',
            controls: [
              {
                key: 'nodeShape',
                label: 'Scatter asset',
                type: 'select',
                options: [
                  'square',
                  'diamond',
                  'bracket',
                  'crosshair',
                  'circle',
                  'triangle',
                  'mixed',
                ],
                value: 'square',
              },
              {
                key: 'nodeCount',
                label: 'Node amount',
                type: 'range',
                min: 4,
                max: 48,
                step: 1,
                value: 16,
                unit: ' / blob',
              },
              {
                key: 'nodeSize',
                label: 'Node size',
                type: 'range',
                min: 3,
                max: 24,
                step: 1,
                value: 8,
                unit: 'px',
              },
              {
                key: 'jitter',
                label: 'Animation jitter',
                type: 'range',
                min: 0,
                max: 3,
                step: 0.1,
                value: 1.2,
                unit: 'x',
              },
              {
                key: 'connectNodes',
                label: 'Connect nodes (mesh)',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'nodeColor',
                label: 'Node color',
                type: 'color',
                value: '#00ff88',
              },
              {
                key: 'accentColor',
                label: 'Accent color',
                type: 'color',
                value: '#ffffff',
              },
            ],
          },
          {
            title: 'Edit Mode Framing',
            controls: [
              {
                key: 'showBoundingBox',
                label: 'Transform edit box',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'showHandles',
                label: 'Edit corner handles',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'showBrackets',
                label: 'CCTV corner brackets',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'showLabels',
                label: 'HUD coordinate tags',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'showCrosshair',
                label: 'Centroid crosshair',
                type: 'checkbox',
                value: true,
              },
              {
                key: 'boxColor',
                label: 'Box / bracket color',
                type: 'color',
                value: '#00ff88',
              },
            ],
          },
          {
            title: 'Background & Style',
            controls: [
              {
                key: 'backgroundDim',
                label: 'Background dim',
                type: 'range',
                min: 0,
                max: 0.95,
                step: 0.05,
                value: 0.35,
                unit: '',
              },
              {
                key: 'blendMode',
                label: 'Node glow blend',
                type: 'select',
                options: ['screen', 'lighter', 'source-over'],
                value: 'screen',
              },
            ],
          },
        ],

        // Analysis state
        analysisCanvas: document.createElement('canvas'),
        analysisCtx: null,
        bgData: null, // running background model for robust motion detection
        trackedBlobs: [], // smooth tracked bounding boxes + persistent scattered nodes

        init() {
          this.analysisCtx = this.analysisCanvas.getContext('2d', {
            willReadFrequently: true,
          })
        },

        draw(v, dt) {
          const { W, H } = env
          env.time += dt

          if (!this.analysisCtx) this.init()

          // 1. Detect blobs from downsampled current frame
          const rawBlobs = this.detectBlobs(v)

          // 2. Temporally smooth blob bounding boxes and maintain node state
          this.updateTrackedBlobs(rawBlobs, v, dt)

          // 3. Render: Draw background media with dimming
          ctx.fillStyle = '#0a0b10'
          ctx.fillRect(0, 0, W, H)

          if (v.backgroundDim < 1) {
            ctx.save()
            ctx.globalAlpha = 1 - v.backgroundDim
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            ctx.restore()
          }

          // 4. Render blob tracking edit-mode overlays and scattered nodes
          this.renderTracking(v)

          return `${this.trackedBlobs.length} tracked blobs · ${this.trackedBlobs.reduce((acc, b) => acc + b.nodes.length, 0)} nodes`
        },

        detectBlobs(v) {
          const { W, H } = env
          // Grid analysis resolution
          const GW = 96
          const GH = Math.max(24, Math.round(96 * (H / W)))

          if (
            this.analysisCanvas.width !== GW ||
            this.analysisCanvas.height !== GH
          ) {
            this.analysisCanvas.width = GW
            this.analysisCanvas.height = GH
            this.bgData = null
          }

          // Downsample current source frame into analysis canvas
          this.analysisCtx.drawImage(env.sourceCanvas, 0, 0, GW, GH)
          const currImgData = this.analysisCtx.getImageData(0, 0, GW, GH)
          const data = currImgData.data

          // Initialize background model on first run or dimension change
          if (!this.bgData || this.bgData.length !== GW * GH * 3) {
            this.bgData = new Float32Array(GW * GH * 3)
            for (let i = 0; i < GW * GH; i++) {
              this.bgData[i * 3] = data[i * 4]
              this.bgData[i * 3 + 1] = data[i * 4 + 1]
              this.bgData[i * 3 + 2] = data[i * 4 + 2]
            }
          }

          const energyGrid = new Float32Array(GW * GH)

          // Calibrated threshold based on sensitivity slider
          let threshold
          if (v.detectMode === 'motion') {
            threshold = 0.02 + (1 - v.sensitivity) * 0.18
          } else if (v.detectMode === 'brightness') {
            threshold = 0.12 + (1 - v.sensitivity) * 0.65
          } else {
            // hybrid
            threshold = 0.03 + (1 - v.sensitivity) * 0.25
          }

          // Compute per-cell motion / brightness energy
          for (let y = 0; y < GH; y++) {
            for (let x = 0; x < GW; x++) {
              const idx = (y * GW + x) * 4
              const bgIdx = (y * GW + x) * 3
              const r = data[idx],
                g = data[idx + 1],
                b = data[idx + 2]
              const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255

              // Motion delta against background model
              const bgR = this.bgData[bgIdx]
              const bgG = this.bgData[bgIdx + 1]
              const bgB = this.bgData[bgIdx + 2]
              const motion =
                (Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB)) /
                (3 * 255)

              // Background model adaptation rate
              const adaptRate = 0.035
              this.bgData[bgIdx] += (r - bgR) * adaptRate
              this.bgData[bgIdx + 1] += (g - bgG) * adaptRate
              this.bgData[bgIdx + 2] += (b - bgB) * adaptRate

              let val = 0
              if (v.detectMode === 'motion') {
                val = motion
              } else if (v.detectMode === 'brightness') {
                val = luma
              } else {
                // hybrid
                val = Math.max(motion * 1.4, luma * 0.7)
              }

              energyGrid[y * GW + x] = val > threshold ? val : 0
            }
          }

          // Save current frame for next difference
          this.prevAnalysisData = currImgData

          // Connected components (flood fill) clustering
          const visited = new Uint8Array(GW * GH)
          const rawClusters = []

          for (let y = 0; y < GH; y++) {
            for (let x = 0; x < GW; x++) {
              const i = y * GW + x
              if (visited[i] || energyGrid[i] === 0) continue

              // BFS to find cluster
              let minX = x,
                maxX = x,
                minY = y,
                maxY = y
              let sumX = 0,
                sumY = 0,
                count = 0,
                sumEnergy = 0
              const queue = [x, y]
              visited[i] = 1

              while (queue.length > 0) {
                const qy = queue.pop()
                const qx = queue.pop()
                const qi = qy * GW + qx
                const e = energyGrid[qi]

                sumX += qx * e
                sumY += qy * e
                sumEnergy += e
                count++

                if (qx < minX) minX = qx
                if (qx > maxX) maxX = qx
                if (qy < minY) minY = qy
                if (qy > maxY) maxY = qy

                // 4-neighborhood
                const neighbors = [
                  [qx + 1, qy],
                  [qx - 1, qy],
                  [qx, qy + 1],
                  [qx, qy - 1],
                ]
                for (let k = 0; k < 4; k++) {
                  const nx = neighbors[k][0],
                    ny = neighbors[k][1]
                  if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
                    const ni = ny * GW + nx
                    if (!visited[ni] && energyGrid[ni] > 0) {
                      visited[ni] = 1
                      queue.push(nx, ny)
                    }
                  }
                }
              }

              // Filter out noise
              const scaleX = W / GW
              const scaleY = H / GH
              const bw = (maxX - minX + 1) * scaleX
              const bh = (maxY - minY + 1) * scaleY
              const area = Math.max(bw, bh)

              if (area >= v.minSize && count >= 3) {
                rawClusters.push({
                  x: minX * scaleX,
                  y: minY * scaleY,
                  w: bw,
                  h: bh,
                  cx: (sumX / sumEnergy) * scaleX,
                  cy: (sumY / sumEnergy) * scaleY,
                  mass: count,
                  energy: sumEnergy / count,
                })
              }
            }
          }

          // Sort by mass and limit to maxBlobs
          rawClusters.sort((a, b) => b.mass - a.mass)
          return rawClusters.slice(0, v.maxBlobs)
        },

        updateTrackedBlobs(rawBlobs, v, dt) {
          const smooth = v.smoothing

          // Match rawBlobs to existing trackedBlobs by centroid distance
          const matched = new Set()
          const updated = []

          rawBlobs.forEach((raw) => {
            let bestDist = 180
            let bestBlob = null

            this.trackedBlobs.forEach((tb) => {
              if (matched.has(tb)) return
              const d = Math.hypot(tb.cx - raw.cx, tb.cy - raw.cy)
              if (d < bestDist) {
                bestDist = d
                bestBlob = tb
              }
            })

            if (bestBlob) {
              matched.add(bestBlob)
              // Lerp bounding box
              bestBlob.x += (raw.x - bestBlob.x) * (1 - smooth)
              bestBlob.y += (raw.y - bestBlob.y) * (1 - smooth)
              bestBlob.w += (raw.w - bestBlob.w) * (1 - smooth)
              bestBlob.h += (raw.h - bestBlob.h) * (1 - smooth)
              bestBlob.cx += (raw.cx - bestBlob.cx) * (1 - smooth)
              bestBlob.cy += (raw.cy - bestBlob.cy) * (1 - smooth)
              bestBlob.mass = raw.mass
              bestBlob.life = Math.min(1, bestBlob.life + dt * 4)
              this.syncNodes(bestBlob, v)
              updated.push(bestBlob)
            } else {
              // New blob
              const newBlob = {
                id: Math.floor(100 + Math.random() * 900),
                x: raw.x,
                y: raw.y,
                w: raw.w,
                h: raw.h,
                cx: raw.cx,
                cy: raw.cy,
                mass: raw.mass,
                life: 0.1,
                nodes: [],
              }
              this.syncNodes(newBlob, v)
              updated.push(newBlob)
            }
          })

          this.trackedBlobs = updated
        },

        syncNodes(blob, v) {
          const targetCount = v.nodeCount
          while (blob.nodes.length < targetCount) {
            blob.nodes.push({
              relX: (Math.random() - 0.5) * 0.85,
              relY: (Math.random() - 0.5) * 0.85,
              phase: Math.random() * TAU,
              speed: 0.8 + Math.random() * 1.6,
              shape: this.pickShape(v.nodeShape),
              scale: 0.7 + Math.random() * 0.6,
            })
          }
          if (blob.nodes.length > targetCount) {
            blob.nodes.length = targetCount
          }
          // Update shape if changed
          blob.nodes.forEach((n) => {
            if (v.nodeShape !== 'mixed') {
              n.shape = v.nodeShape
            }
          })
        },

        pickShape(shapePref) {
          if (shapePref !== 'mixed') return shapePref
          const shapes = [
            'square',
            'diamond',
            'bracket',
            'crosshair',
            'circle',
            'triangle',
          ]
          return shapes[Math.floor(Math.random() * shapes.length)]
        },

        renderTracking(v) {
          const { time } = env

          this.trackedBlobs.forEach((b, blobIndex) => {
            const alpha = Math.min(1, b.life)
            ctx.save()
            ctx.globalAlpha = alpha

            // 1. Edit Mode Bounding Box & Handles
            if (v.showBoundingBox) {
              ctx.strokeStyle = v.boxColor
              ctx.lineWidth = 1
              ctx.strokeRect(b.x, b.y, b.w, b.h)

              if (v.showHandles) {
                // Draw 8 transform handles (4 corners + 4 midpoints)
                const handles = [
                  [b.x, b.y],
                  [b.x + b.w, b.y],
                  [b.x, b.y + b.h],
                  [b.x + b.w, b.y + b.h],
                  [b.x + b.w / 2, b.y],
                  [b.x + b.w / 2, b.y + b.h],
                  [b.x, b.y + b.h / 2],
                  [b.x + b.w, b.y + b.h / 2],
                ]
                const hs = 5
                ctx.fillStyle = '#ffffff'
                ctx.strokeStyle = v.boxColor
                ctx.lineWidth = 1
                handles.forEach(([hx, hy]) => {
                  ctx.fillRect(hx - hs / 2, hy - hs / 2, hs, hs)
                  ctx.strokeRect(hx - hs / 2, hy - hs / 2, hs, hs)
                })
              }
            }

            // 2. CCTV Corner Brackets
            if (v.showBrackets) {
              const bl = Math.min(14, b.w * 0.25, b.h * 0.25)
              ctx.strokeStyle = v.boxColor
              ctx.lineWidth = 1.5

              // Top-left
              ctx.beginPath()
              ctx.moveTo(b.x, b.y + bl)
              ctx.lineTo(b.x, b.y)
              ctx.lineTo(b.x + bl, b.y)
              // Top-right
              ctx.moveTo(b.x + b.w - bl, b.y)
              ctx.lineTo(b.x + b.w, b.y)
              ctx.lineTo(b.x + b.w, b.y + bl)
              // Bottom-left
              ctx.moveTo(b.x, b.y + b.h - bl)
              ctx.lineTo(b.x, b.y + b.h)
              ctx.lineTo(b.x + bl, b.y + b.h)
              // Bottom-right
              ctx.moveTo(b.x + b.w - bl, b.y + b.h)
              ctx.lineTo(b.x + b.w, b.y + b.h)
              ctx.lineTo(b.x + b.w, b.y + b.h - bl)
              ctx.stroke()
            }

            // 3. Centroid Crosshair
            if (v.showCrosshair) {
              const cs = 7
              ctx.strokeStyle = v.accentColor
              ctx.lineWidth = 1
              ctx.beginPath()
              ctx.moveTo(b.cx - cs, b.cy)
              ctx.lineTo(b.cx + cs, b.cy)
              ctx.moveTo(b.cx, b.cy - cs)
              ctx.lineTo(b.cx, b.cy + cs)
              ctx.stroke()
            }

            // 4. Tech HUD Labels
            if (v.showLabels) {
              ctx.font = '9px monospace'
              const label = `ID#${b.id} [${Math.round(b.cx)},${Math.round(b.cy)}] ${Math.round(b.w)}x${Math.round(b.h)}`
              const tw = ctx.measureText(label).width
              ctx.fillStyle = 'rgba(10, 12, 18, 0.75)'
              ctx.fillRect(b.x, b.y - 14, tw + 8, 12)
              ctx.strokeStyle = v.boxColor
              ctx.strokeRect(b.x, b.y - 14, tw + 8, 12)
              ctx.fillStyle = v.boxColor
              ctx.fillText(label, b.x + 4, b.y - 5)
            }

            // Calculate animated node positions
            const computedNodes = b.nodes.map((n) => {
              const jit = v.jitter
              const ox = Math.sin(time * n.speed + n.phase) * (b.w * 0.18 * jit)
              const oy =
                Math.cos(time * n.speed * 1.2 + n.phase) * (b.h * 0.18 * jit)
              return {
                x: b.cx + n.relX * b.w + ox,
                y: b.cy + n.relY * b.h + oy,
                shape: n.shape,
                size: v.nodeSize * n.scale,
              }
            })

            // 5. Connect Nodes (Mesh wireframe)
            if (v.connectNodes && computedNodes.length > 1) {
              ctx.save()
              ctx.strokeStyle = v.nodeColor
              ctx.lineWidth = 0.75
              const maxDist = Math.max(b.w, b.h) * 0.45

              for (let i = 0; i < computedNodes.length; i++) {
                for (let j = i + 1; j < computedNodes.length; j++) {
                  const d = Math.hypot(
                    computedNodes[i].x - computedNodes[j].x,
                    computedNodes[i].y - computedNodes[j].y,
                  )
                  if (d < maxDist) {
                    ctx.globalAlpha = alpha * (1 - d / maxDist) * 0.4
                    ctx.beginPath()
                    ctx.moveTo(computedNodes[i].x, computedNodes[i].y)
                    ctx.lineTo(computedNodes[j].x, computedNodes[j].y)
                    ctx.stroke()
                  }
                }
              }
              ctx.restore()
            }

            // 6. Draw Scattered Nodes
            ctx.save()
            if (v.blendMode !== 'source-over') {
              ctx.globalCompositeOperation = v.blendMode
            }
            computedNodes.forEach((cn, idx) => {
              this.drawNodeShape(
                cn.x,
                cn.y,
                cn.size,
                cn.shape,
                v.nodeColor,
                v.accentColor,
                idx,
              )
            })
            ctx.restore()

            ctx.restore()
          })
        },

        drawNodeShape(x, y, s, shape, color, accentColor, idx) {
          ctx.save()
          ctx.translate(x, y)

          if (shape === 'square') {
            // Edit-mode square handle
            ctx.fillStyle = color
            ctx.fillRect(-s / 2, -s / 2, s, s)
            ctx.strokeStyle = accentColor
            ctx.lineWidth = 1
            ctx.strokeRect(-s / 2, -s / 2, s, s)
          } else if (shape === 'diamond') {
            // Rotated vector handle
            ctx.rotate(Math.PI / 4)
            ctx.fillStyle = color
            ctx.fillRect(-s / 2, -s / 2, s, s)
            ctx.strokeStyle = accentColor
            ctx.lineWidth = 1
            ctx.strokeRect(-s / 2, -s / 2, s, s)
          } else if (shape === 'bracket') {
            // Mini framing bracket
            ctx.strokeStyle = color
            ctx.lineWidth = 1.5
            const hs = s * 0.6
            ctx.beginPath()
            ctx.moveTo(-hs, 0)
            ctx.lineTo(-hs, -hs)
            ctx.lineTo(0, -hs)
            ctx.moveTo(hs, 0)
            ctx.lineTo(hs, hs)
            ctx.lineTo(0, hs)
            ctx.stroke()
          } else if (shape === 'crosshair') {
            // Tech reticle +
            ctx.strokeStyle = color
            ctx.lineWidth = 1.2
            const hs = s * 0.6
            ctx.beginPath()
            ctx.moveTo(-hs, 0)
            ctx.lineTo(hs, 0)
            ctx.moveTo(0, -hs)
            ctx.lineTo(0, hs)
            ctx.stroke()
            ctx.fillStyle = accentColor
            ctx.fillRect(-1, -1, 2, 2)
          } else if (shape === 'circle') {
            // Vector node dot with ring
            ctx.beginPath()
            ctx.arc(0, 0, s / 2, 0, TAU)
            ctx.strokeStyle = color
            ctx.lineWidth = 1.2
            ctx.stroke()
            ctx.fillStyle = accentColor
            ctx.beginPath()
            ctx.arc(0, 0, s / 4, 0, TAU)
            ctx.fill()
          } else if (shape === 'triangle') {
            // Directional delta
            const hs = s * 0.6
            ctx.beginPath()
            ctx.moveTo(0, -hs)
            ctx.lineTo(hs, hs * 0.8)
            ctx.lineTo(-hs, hs * 0.8)
            ctx.closePath()
            ctx.fillStyle = color
            ctx.fill()
            ctx.strokeStyle = accentColor
            ctx.lineWidth = 1
            ctx.stroke()
          }
          ctx.restore()
        },
      }

      // ======================================================================
      // EFFECT 3: pixel-trail
      // Inspired by basementstudio/shader-lab Pixel Trail effect.
      // Discretizes video/image into a pixelated mosaic grid with decaying
      // temporal trails, chromatic aberration dispersion, and cursor interaction.
      // ======================================================================
      const pixelTrail = {
        id: 'pixel-trail',
        label: 'pixel-trail',
        groups: [
          {
            title: 'Trail Dynamics',
            controls: [
              {
                key: 'pixelSize',
                label: 'Pixel block size',
                type: 'range',
                min: 4,
                max: 48,
                step: 2,
                value: 12,
                unit: 'px',
              },
              {
                key: 'persistence',
                label: 'Trail persistence',
                type: 'range',
                min: 0.5,
                max: 0.98,
                step: 0.01,
                value: 0.91,
                unit: '',
              },
              {
                key: 'motionSensitivity',
                label: 'Motion sensitivity',
                type: 'range',
                min: 0.05,
                max: 0.95,
                step: 0.01,
                value: 0.45,
                unit: '',
              },
            ],
          },
          {
            title: 'Color & Aesthetics',
            controls: [
              {
                key: 'colorMode',
                label: 'Trail color palette',
                type: 'select',
                options: [
                  'chromatic',
                  'original',
                  'thermal',
                  'phosphor',
                  'tint',
                ],
                value: 'chromatic',
              },
              {
                key: 'trailColor',
                label: 'Tint color (for tint mode)',
                type: 'color',
                value: '#00ff88',
              },
              {
                key: 'blendMode',
                label: 'Trail blend mode',
                type: 'select',
                options: ['screen', 'lighter', 'source-over'],
                value: 'screen',
              },
              {
                key: 'glowIntensity',
                label: 'Glow intensity',
                type: 'range',
                min: 0.5,
                max: 2.5,
                step: 0.1,
                value: 1.3,
                unit: 'x',
              },
            ],
          },
          {
            title: 'Physics & Drift',
            controls: [
              {
                key: 'driftDirection',
                label: 'Trail drift',
                type: 'select',
                options: [
                  'none',
                  'down (drip)',
                  'up (float)',
                  'wind-right',
                  'scatter',
                ],
                value: 'none',
              },
              {
                key: 'driftSpeed',
                label: 'Drift velocity',
                type: 'range',
                min: 0,
                max: 6,
                step: 0.5,
                value: 1.5,
                unit: 'px',
              },
            ],
          },
          {
            title: 'Display & Base',
            controls: [
              {
                key: 'backgroundDim',
                label: 'Background dim',
                type: 'range',
                min: 0,
                max: 0.95,
                step: 0.05,
                value: 0.35,
                unit: '',
              },
              {
                key: 'showGrid',
                label: 'Pixel grid lines',
                type: 'checkbox',
                value: false,
              },
              {
                key: 'gridColor',
                label: 'Grid color',
                type: 'color',
                value: '#151722',
              },
            ],
          },
        ],

        // Trail grid buffers
        gridW: 0,
        gridH: 0,
        cellSize: 0,
        trailR: null,
        trailG: null,
        trailB: null,
        trailLife: null,
        prevR: null,
        prevG: null,
        prevB: null,
        downCanvas: document.createElement('canvas'),
        downCtx: null,

        initGrid(cols, rows, sz) {
          this.gridW = cols
          this.gridH = rows
          this.cellSize = sz
          const total = cols * rows
          this.trailR = new Float32Array(total)
          this.trailG = new Float32Array(total)
          this.trailB = new Float32Array(total)
          this.trailLife = new Float32Array(total)
          this.prevR = new Uint8Array(total)
          this.prevG = new Uint8Array(total)
          this.prevB = new Uint8Array(total)
          this.downCanvas.width = cols
          this.downCanvas.height = rows
          this.downCtx = this.downCanvas.getContext('2d', {
            willReadFrequently: true,
          })
        },

        draw(v, dt) {
          const { W, H, cursor } = env
          env.time += dt

          const sz = Math.max(4, Math.floor(v.pixelSize))
          const cols = Math.ceil(W / sz)
          const rows = Math.ceil(H / sz)

          if (
            this.gridW !== cols ||
            this.gridH !== rows ||
            this.cellSize !== sz ||
            !this.downCtx
          ) {
            this.initGrid(cols, rows, sz)
          }

          // Sample downsampled source frame
          this.downCtx.drawImage(env.sourceCanvas, 0, 0, cols, rows)
          const imgData = this.downCtx.getImageData(0, 0, cols, rows)
          const data = imgData.data

          const motionThreshold = Math.max(
            0.02,
            (1 - v.motionSensitivity) * 0.22,
          )
          const persistence = v.persistence
          const glow = v.glowIntensity

          let activeCount = 0

          // 1. Process cells: detect motion triggers and decay unactivated cells
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const idx = y * cols + x
              const pIdx = idx * 4

              const r = data[pIdx]
              const g = data[pIdx + 1]
              const b = data[pIdx + 2]

              // Motion delta
              const pr = this.prevR[idx]
              const pg = this.prevG[idx]
              const pb = this.prevB[idx]
              const motion =
                (Math.abs(r - pr) + Math.abs(g - pg) + Math.abs(b - pb)) /
                (3 * 255)

              // Update previous frame
              this.prevR[idx] = r
              this.prevG[idx] = g
              this.prevB[idx] = b

              // Motion trigger
              if (motion > motionThreshold) {
                this.trailLife[idx] = 1.0
                this.trailR[idx] = r
                this.trailG[idx] = g
                this.trailB[idx] = b
              } else {
                this.trailLife[idx] *= persistence
              }

              if (this.trailLife[idx] > 0.02) activeCount++
            }
          }

          // 2. Physics & Drift (optional dispersal)
          if (v.driftDirection !== 'none' && v.driftSpeed > 0) {
            this.applyDrift(cols, rows, v.driftDirection, v.driftSpeed * 0.15)
          }

          // 3. Render
          ctx.fillStyle = '#0a0b10'
          ctx.fillRect(0, 0, W, H)

          // Draw underlying video/image with dimming
          if (v.backgroundDim < 1) {
            ctx.save()
            ctx.globalAlpha = 1 - v.backgroundDim
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            ctx.restore()
          }

          // Draw trailing pixel blocks
          ctx.save()
          if (v.blendMode !== 'source-over') {
            ctx.globalCompositeOperation = v.blendMode
          }

          const mode = v.colorMode
          const showGrid = v.showGrid
          const gridColor = v.gridColor

          // Parse tint color once if tint mode
          let tintR = 0,
            tintG = 255,
            tintB = 136
          if (mode === 'tint') {
            const hex = v.trailColor.replace('#', '')
            tintR = parseInt(hex.substring(0, 2), 16) || 0
            tintG = parseInt(hex.substring(2, 4), 16) || 255
            tintB = parseInt(hex.substring(4, 6), 16) || 136
          }

          for (let y = 0; y < rows; y++) {
            const py = y * sz
            for (let x = 0; x < cols; x++) {
              const idx = y * cols + x
              const life = this.trailLife[idx]
              if (life <= 0.02) continue

              const px = x * sz
              let cr = 0,
                cg = 0,
                cb = 0,
                alpha = life

              if (mode === 'original') {
                cr = this.trailR[idx] * glow
                cg = this.trailG[idx] * glow
                cb = this.trailB[idx] * glow
              } else if (mode === 'chromatic') {
                // Signature chromatic aberration: R, G, B decay at different rates
                const rLife = life
                const gLife = Math.pow(life, 1.25)
                const bLife = Math.pow(life, 1.6)
                cr = this.trailR[idx] * rLife * glow
                cg = this.trailG[idx] * gLife * glow
                cb = this.trailB[idx] * bLife * glow
              } else if (mode === 'phosphor') {
                // Cyberpunk CRT phosphor glow (green/amber)
                cr = 20 * life
                cg = 255 * Math.min(1, life * 1.3) * glow
                cb = 140 * Math.pow(life, 2) * glow
              } else if (mode === 'thermal') {
                // Heat map spectrum based on trail age/life
                const [tr, tg, tb] = this.thermalColor(life)
                cr = tr * glow
                cg = tg * glow
                cb = tb * glow
              } else if (mode === 'tint') {
                cr = tintR * life * glow
                cg = tintG * life * glow
                cb = tintB * life * glow
              }

              ctx.fillStyle = `rgb(${Math.min(255, cr | 0)}, ${Math.min(255, cg | 0)}, ${Math.min(255, cb | 0)})`
              ctx.globalAlpha = Math.min(1, alpha)

              if (showGrid && sz > 4) {
                ctx.fillRect(px + 0.5, py + 0.5, sz - 1, sz - 1)
              } else {
                ctx.fillRect(px, py, sz, sz)
              }
            }
          }

          // Optional grid lines
          if (showGrid) {
            ctx.globalCompositeOperation = 'source-over'
            ctx.globalAlpha = 0.35
            ctx.strokeStyle = gridColor
            ctx.lineWidth = 0.5
            ctx.beginPath()
            for (let x = 0; x <= W; x += sz) {
              ctx.moveTo(x + 0.5, 0)
              ctx.lineTo(x + 0.5, H)
            }
            for (let y = 0; y <= H; y += sz) {
              ctx.moveTo(0, y + 0.5)
              ctx.lineTo(W, y + 0.5)
            }
            ctx.stroke()
          }

          ctx.restore()

          return `${activeCount.toLocaleString()} active trail blocks · ${sz}px grid`
        },

        thermalColor(t) {
          let r = 0,
            g = 0,
            b = 0
          if (t < 0.25) {
            b = Math.floor(t * 4 * 255)
          } else if (t < 0.5) {
            r = Math.floor((t - 0.25) * 4 * 255)
            b = 255
          } else if (t < 0.75) {
            r = 255
            g = Math.floor((t - 0.5) * 4 * 200)
            b = Math.floor((1 - (t - 0.5) * 4) * 255)
          } else {
            r = 255
            g = Math.floor(200 + (t - 0.75) * 4 * 55)
            b = Math.floor((t - 0.75) * 4 * 255)
          }
          return [r, g, b]
        },

        applyDrift(cols, rows, dir, rate) {
          const shiftChance = Math.min(0.6, rate)
          if (dir === 'down (drip)') {
            for (let y = rows - 2; y >= 0; y--) {
              for (let x = 0; x < cols; x++) {
                const i = y * cols + x
                const down = (y + 1) * cols + x
                if (this.trailLife[i] > 0.05 && Math.random() < shiftChance) {
                  this.trailLife[down] = Math.max(
                    this.trailLife[down],
                    this.trailLife[i] * 0.95,
                  )
                  this.trailR[down] = this.trailR[i]
                  this.trailG[down] = this.trailG[i]
                  this.trailB[down] = this.trailB[i]
                }
              }
            }
          } else if (dir === 'up (float)') {
            for (let y = 1; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                const i = y * cols + x
                const up = (y - 1) * cols + x
                if (this.trailLife[i] > 0.05 && Math.random() < shiftChance) {
                  this.trailLife[up] = Math.max(
                    this.trailLife[up],
                    this.trailLife[i] * 0.95,
                  )
                  this.trailR[up] = this.trailR[i]
                  this.trailG[up] = this.trailG[i]
                  this.trailB[up] = this.trailB[i]
                }
              }
            }
          } else if (dir === 'wind-right') {
            for (let y = 0; y < rows; y++) {
              for (let x = cols - 2; x >= 0; x--) {
                const i = y * cols + x
                const right = y * cols + (x + 1)
                if (this.trailLife[i] > 0.05 && Math.random() < shiftChance) {
                  this.trailLife[right] = Math.max(
                    this.trailLife[right],
                    this.trailLife[i] * 0.95,
                  )
                  this.trailR[right] = this.trailR[i]
                  this.trailG[right] = this.trailG[i]
                  this.trailB[right] = this.trailB[i]
                }
              }
            }
          } else if (dir === 'scatter') {
            for (let y = 1; y < rows - 1; y++) {
              for (let x = 1; x < cols - 1; x++) {
                const i = y * cols + x
                if (
                  this.trailLife[i] > 0.1 &&
                  Math.random() < shiftChance * 0.3
                ) {
                  const ox = Math.random() > 0.5 ? 1 : -1
                  const oy = Math.random() > 0.5 ? 1 : -1
                  const ni = (y + oy) * cols + (x + ox)
                  this.trailLife[ni] = Math.max(
                    this.trailLife[ni],
                    this.trailLife[i] * 0.9,
                  )
                }
              }
            }
          }
        },
      }

        ensureCanvas() {
          const { W, H } = env
          if (!W || !H) return

          if (!this.sketchCanvas) {
            this.sketchCanvas = document.createElement('canvas')
            this.sketchCtx = this.sketchCanvas.getContext('2d')
            this.sketchCanvas.width = W
            this.sketchCanvas.height = H
          } else if (
            this.sketchCanvas.width !== W ||
            this.sketchCanvas.height !== H
          ) {
            const old = document.createElement('canvas')
            old.width = this.sketchCanvas.width
            old.height = this.sketchCanvas.height
            old.getContext('2d').drawImage(this.sketchCanvas, 0, 0)

            this.sketchCanvas.width = W
            this.sketchCanvas.height = H
            this.sketchCtx.drawImage(old, 0, 0, W, H)
          }
        },

        clear() {
          if (this.sketchCanvas && this.sketchCtx) {
            this.sketchCtx.clearRect(
              0,
              0,
              this.sketchCanvas.width,
              this.sketchCanvas.height,
            )
          }
          this.currentStroke = null
          this.lastPoint = null
          this.lastMidX = null
          this.lastMidY = null
          this.totalStrokes = 0

        exportPng() {
          this.ensureCanvas()
          const a = document.createElement('a')
          a.download = `finger-sketch-${Date.now()}.png`
          a.href = this.sketchCanvas.toDataURL('image/png')
