        draw(v, dt) {
          const { W, H } = env
          if (!W || !H) return 'Initializing'

          this.animTime += dt * v.waveSpeed
          const time = this.animTime

          const pSize = Math.max(2, Math.floor(v.pixelSize))
          const cols = Math.ceil(W / pSize)
          const rows = Math.ceil(H / pSize)
          this.initBuffers(cols, rows)

          // 1. Downscale source frame into sample buffer
          this.sampleCtx.drawImage(env.sourceCanvas, 0, 0, cols, rows)
          const srcData = this.sampleCtx.getImageData(0, 0, cols, rows).data

          const lumGrid = this.lumGrid
          const beamGrid = this.beamGrid
          const srcRGrid = this.srcRGrid
          const srcGGrid = this.srcGGrid
          const srcBGrid = this.srcBGrid
          const pixels32 = this.pixels32

          const wFreq = v.waveFrequency
          const wAmp = v.waveAmplitude
          const wPattern = v.wavePattern
          const cursor = env.cursor
          const hasCursor = cursor && (cursor.x > 0 || cursor.y > 0)
          const mouseU = hasCursor ? cursor.x / W : -10
          const mouseV = hasCursor ? cursor.y / H : -10
          const rippleStrength = v.interactiveRipple

          // 2. Wave displacement & luminance sampling
          for (let y = 0; y < rows; y++) {
            const vCoord = y / rows
            for (let x = 0; x < cols; x++) {
              const uCoord = x / cols
              let dispX = 0
              let dispY = 0
              let waveLum = 0

              if (wPattern === 'ocean-swell') {
                const swell = Math.sin(
                  (uCoord * 2.2 + vCoord * 3.4) * wFreq - time,
                )
                dispX = swell * 0.05 * wAmp
                dispY =
                  Math.cos((uCoord * 3.0 - vCoord * 1.5) * wFreq + time * 0.8) *
                  0.04 *
                  wAmp
                waveLum = (swell * 0.5 + 0.5) * (wAmp * 0.45)
              } else if (wPattern === 'diagonal-flow') {
                const diag = Math.sin(
                  (uCoord + vCoord) * wFreq * 3.8 - time * 1.6,
                )
                dispX = diag * 0.045 * wAmp
                dispY = diag * 0.045 * wAmp
                waveLum = (diag * 0.5 + 0.5) * (wAmp * 0.5)
              } else if (wPattern === 'radial-pulse') {
                const dx = uCoord - 0.5
                const dy = vCoord - 0.5
                const r = Math.hypot(dx, dy)
                const p = Math.sin(r * wFreq * 16.0 - time * 2.5)
                dispX = (dx / (r || 1)) * p * 0.05 * wAmp
                dispY = (dy / (r || 1)) * p * 0.05 * wAmp
                waveLum = (p * 0.5 + 0.5) * (wAmp * 0.4)
              } else if (wPattern === 'glitch-steps') {
                const step = Math.floor(vCoord * 14.0)
                const g =
                  (Math.sin(step * 78.2 + Math.floor(time * 5.0)) > 0.4
                    ? 0.06
                    : -0.02) * wAmp
                dispX = g
                dispY = 0
                waveLum = (step % 2 === 0 ? 0.2 : -0.1) * wAmp
              } else {
                // harmonic-sine (default)
                const w1 = Math.sin(vCoord * wFreq * 6.28 + time)
                const w2 = Math.cos(uCoord * wFreq * 4.71 - time * 0.7)
                dispX = (w1 * 0.035 + w2 * 0.02) * wAmp
                dispY =
                  (Math.cos(vCoord * wFreq * 5.0 - time * 0.8) * 0.035 +
                    Math.sin(uCoord * wFreq * 3.14 + time) * 0.02) *
                  wAmp
                waveLum =
                  (Math.sin(
                    (uCoord * 1.5 + vCoord * 2.5) * wFreq * 3.14 - time,
                  ) *
                    0.5 +
                    0.5) *
                  (wAmp * 0.4)
              }

              // Interactive mouse ripple deflection
              if (hasCursor) {
                const dist = Math.hypot(uCoord - mouseU, vCoord - mouseV)
                if (dist < 0.45) {
                  const rip =
                    Math.sin(dist * 28.0 - time * 9.0) *
                    Math.exp(-dist * 5.0) *
                    rippleStrength *
                    0.07
                  dispX += ((uCoord - mouseU) / (dist || 1)) * rip
                  dispY += ((vCoord - mouseV) / (dist || 1)) * rip
                  waveLum += rip * 2.5
                }
              }

              const sx = Math.max(
                0,
                Math.min(cols - 1, Math.round((uCoord + dispX) * cols)),
              )
              const sy = Math.max(
                0,
                Math.min(rows - 1, Math.round((vCoord + dispY) * rows)),
              )
              const sidx = (sy * cols + sx) * 4

              const r = srcData[sidx]
              const g = srcData[sidx + 1]
              const b = srcData[sidx + 2]

              const idx = y * cols + x
              srcRGrid[idx] = r
              srcGGrid[idx] = g
              srcBGrid[idx] = b

              let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255
              lum = Math.min(1, Math.max(0, lum + waveLum))
              lumGrid[idx] = lum
            }
          }

          // 3. Pixel Beams Extrusion
          const bDir = v.beamDirection
          const intensity = v.beamIntensity
          const decay = v.beamDecay
          const beamThreshold = 0.42

          if (bDir === 'down') {
            for (let x = 0; x < cols; x++) {
              let beam = 0
              for (let y = 0; y < rows; y++) {
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beam = Math.max(emit, beam * decay)
                beamGrid[idx] = beam
              }
            }
          } else if (bDir === 'up') {
            for (let x = 0; x < cols; x++) {
              let beam = 0
              for (let y = rows - 1; y >= 0; y--) {
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beam = Math.max(emit, beam * decay)
                beamGrid[idx] = beam
              }
            }
          } else if (bDir === 'horizontal') {
            for (let y = 0; y < rows; y++) {
              let beam = 0
              for (let x = 0; x < cols; x++) {
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beam = Math.max(emit, beam * decay)
                beamGrid[idx] = beam
              }
            }
          } else if (bDir === 'diagonal-down') {
            for (let y = 0; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                const prev =
                  x > 0 && y > 0 ? beamGrid[(y - 1) * cols + (x - 1)] : 0
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beamGrid[idx] = Math.max(emit, prev * decay)
              }
            }
          } else {
            // radial-out
            const cx = cols / 2
            const cy = rows / 2
            for (let y = 0; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                const idx = y * cols + x
                const dist = Math.hypot(x - cx, y - cy)
                const radialFactor =
                  Math.sin(dist * 0.15 - time * 2.0) * 0.5 + 0.5
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.5 * intensity
                    : 0
                beamGrid[idx] = emit * (0.6 + radialFactor * 0.6)
              }
            }
          }

          // 4. Dithering Matrix calculation & Color mapping
          const pattern = v.ditherPattern
          const levels = v.ditherLevels
          const threshold = v.threshold
          const spread = v.spread
          const contrast = v.contrast
          const palette = v.colorPalette

          const customA = parseHexColor(v.colorA)
          const customB = parseHexColor(v.colorB)

          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const idx = y * cols + x
              let effLum = lumGrid[idx] + beamGrid[idx] * 0.85
              effLum = Math.max(0, Math.min(1, (effLum - 0.5) * contrast + 0.5))

              // Pattern matrix threshold lookup
              let bVal = 0.5
              if (pattern === 'bayer4') {
                bVal = BAYER4_DATA[(y & 3) * 4 + (x & 3)]
              } else if (pattern === 'bayer8') {
                bVal = BAYER8_DATA[(y & 7) * 8 + (x & 7)]
              } else if (pattern === 'bayer2') {
                bVal = BAYER2_DATA[(y & 1) * 2 + (x & 1)]
              } else if (pattern === 'clustered-dot') {
                bVal = CLUSTERED4_DATA[(y & 3) * 4 + (x & 3)]
              } else if (pattern === 'blue-noise') {
                bVal = hashNoise(x, y)
              }

              const dithered = effLum + (bVal - 0.5) * spread

              // Quantize levels
              let state = 0
              if (levels.startsWith('2-level')) {
                state = dithered >= threshold ? 1.0 : 0.0
              } else if (levels.startsWith('4-level')) {
                const q = Math.floor((dithered - threshold + 0.5) * 3 + 0.5)
                state = Math.max(0, Math.min(3, q)) / 3
              } else if (levels.startsWith('8-level')) {
                const q = Math.floor((dithered - threshold + 0.5) * 7 + 0.5)
                state = Math.max(0, Math.min(7, q)) / 7
              } else {
                state = Math.max(0, Math.min(1, dithered))
              }

              // Color mapping
              let r = 0,
                g = 0,
                b = 0
              if (palette === 'neon-cyan') {
                if (state <= 0) {
                  r = 6
                  g = 10
                  b = 28
                } else {
                  const core = Math.max(0, Math.min(1, (effLum - 0.72) / 0.28))
                  r = Math.round(0 + core * 210)
                  g = Math.round(225 + core * 30)
                  b = 255
                }
              } else if (palette === 'cyber-green') {
                if (state <= 0) {
                  r = 3
                  g = 14
                  b = 8
                } else {
                  const core = Math.max(0, Math.min(1, (effLum - 0.72) / 0.28))
                  r = Math.round(core * 200)
                  g = 255
                  b = Math.round(100 + core * 145)
                }
              } else if (palette === 'amber-crt') {
                if (state <= 0) {
                  r = 16
                  g = 6
                  b = 1
                } else {
                  const core = Math.max(0, Math.min(1, (effLum - 0.72) / 0.28))
                  r = 255
                  g = Math.round(145 + core * 100)
                  b = Math.round(core * 180)
                }
              } else if (palette === 'gameboy') {
                if (state < 0.25) {
                  r = 15
                  g = 56
                  b = 15
                } else if (state < 0.55) {
                  r = 48
                  g = 98
                  b = 48
                } else if (state < 0.85) {
                  r = 139
                  g = 172
                  b = 15
                } else {
                  r = 155
                  g = 188
                  b = 15
                }
              } else if (palette === 'sunset') {
                if (state <= 0) {
                  r = 18
                  g = 4
                  b = 30
                } else if (effLum < 0.55) {
                  r = 255
                  g = 16
                  b = 120
                } else if (effLum < 0.8) {
                  r = 255
                  g = 170
                  b = 20
                } else {
                  r = 255
                  g = 245
                  b = 180
                }
              } else if (palette === 'source-rgb') {
                const sr = srcRGrid[idx]
                const sg = srcGGrid[idx]
                const sb = srcBGrid[idx]
                if (state <= 0.05) {
                  r = Math.round(sr * 0.12)
                  g = Math.round(sg * 0.12)
                  b = Math.round(sb * 0.12)
                } else {
                  r = Math.min(
                    255,
                    Math.round(sr * (0.4 + state * 1.1) + state * 40),
                  )
                  g = Math.min(
                    255,
                    Math.round(sg * (0.4 + state * 1.1) + state * 40),
                  )
                  b = Math.min(
                    255,
                    Math.round(sb * (0.4 + state * 1.1) + state * 40),
                  )
                }
              } else if (palette === 'monochrome') {
                const val = Math.round(state * 245 + 10)
                r = val
                g = val
                b = val
              } else {
                // custom
                const t = state
                r = Math.round(customA[0] + (customB[0] - customA[0]) * t)
                g = Math.round(customA[1] + (customB[1] - customA[1]) * t)
                b = Math.round(customA[2] + (customB[2] - customA[2]) * t)
                if (effLum > 0.8) {
                  const boost = (effLum - 0.8) / 0.2
                  r = Math.min(255, Math.round(r + boost * 55))
                  g = Math.min(255, Math.round(g + boost * 55))
                  b = Math.min(255, Math.round(b + boost * 55))
                }
              }

              pixels32[idx] = packRgba32(r, g, b, 255)
            }
          }

          // 5. Draw dither buffer to main screen
          this.offCtx.putImageData(this.imgData, 0, 0)

          ctx.imageSmoothingEnabled = false
          ctx.drawImage(this.offCanvas, 0, 0, W, H)

          // 6. Phosphor Bloom Glow
          if (v.bloomGlow > 0.01) {
            ctx.save()
            ctx.globalCompositeOperation = 'screen'
            ctx.globalAlpha = v.bloomGlow
            ctx.filter = 'blur(6px)'
            ctx.drawImage(this.offCanvas, 0, 0, W, H)
            ctx.restore()
          }

          // 7. CRT Scanlines
          if (v.scanlines > 0.01) {
            ctx.save()
            ctx.fillStyle = `rgba(0, 0, 0, ${v.scanlines})`
            const step = Math.max(2, pSize)
            for (let y = 0; y < H; y += step) {
              ctx.fillRect(0, y, W, 1)
            }
            ctx.restore()
          }

          // 8. Cinematic Vignette
          if (v.vignette > 0.01) {
            ctx.save()
            const vig = ctx.createRadialGradient(
              W / 2,
              H / 2,
              Math.min(W, H) * 0.35,
              W / 2,
              H / 2,
              Math.max(W, H) * 0.72,
            )
            vig.addColorStop(0, 'rgba(0, 0, 0, 0)')
            vig.addColorStop(1, `rgba(0, 0, 0, ${v.vignette * 0.9})`)
            ctx.fillStyle = vig
            ctx.fillRect(0, 0, W, H)
            ctx.restore()
          }

          return `Dither Wave ${cols}×${rows} · ${pSize}px · ${v.colorPalette} · ${v.ditherPattern} · ${v.beamDirection} beams`
        },
      }

      // ======================================================================
      // Effect Registry & UI Panel Builder
      // ======================================================================
      const effects = [
        quadtreeBokeh,
        blobTracker,
        pixelTrail,
        fingerSketch,
        pixelBeams,
      ]
      const values = {}

      effects.forEach((effect) => {
        values[effect.id] = {}
        effect.groups.forEach((g) =>
          g.controls.forEach((c) => {
            values[effect.id][c.key] = c.value !== undefined ? c.value : null
          }),
        )
      })

      let activeEffect = effects[0]

      const menuEl = document.getElementById('menu')
      const panelEl = document.getElementById('panel')

      function updateStageTools() {
        const clearBtn = document.getElementById('stageClearBtn')
        if (clearBtn) {
          clearBtn.style.display =
            activeEffect.id === 'finger-sketch' ? 'block' : 'none'
        }
      }

      function renderMenu() {
        menuEl.innerHTML = ''
        effects.forEach((effect) => {
          const btn = document.createElement('button')
          btn.textContent = effect.label
          btn.className = effect === activeEffect ? 'active' : ''
          btn.addEventListener('click', () => {
            activeEffect = effect
            renderMenu()
            renderPanel()
          })
          menuEl.appendChild(btn)
        })
        updateStageTools()
      }

      function renderPanel() {
        panelEl.innerHTML = ''
        const v = values[activeEffect.id]

        activeEffect.groups.forEach((group) => {
          const groupEl = document.createElement('section')
          groupEl.className = 'group'
          groupEl.innerHTML = `<h3>${group.title}</h3>`

          group.controls.forEach((c) => {
            const wrap = document.createElement('div')
            wrap.className =
              'control' + (c.type === 'checkbox' ? ' inline' : '')
            const id = `ctl-${activeEffect.id}-${c.key}`

            if (c.type === 'range') {
              wrap.innerHTML = `<div class="row"><label for="${id}">${c.label}</label><output></output></div>
                                <input id="${id}" type="range" min="${c.min}" max="${c.max}" step="${c.step}">`
              const input = wrap.querySelector('input')
              const out = wrap.querySelector('output')
              input.value = v[c.key]
              const update = () => {
                v[c.key] = Number(input.value)
                out.textContent = v[c.key] + (c.unit || '')
              }
              input.addEventListener('input', update)
              update()
            } else if (c.type === 'select') {
              wrap.innerHTML = `<label for="${id}">${c.label}</label>
                                <select id="${id}">${c.options.map((o) => `<option>${o}</option>`).join('')}</select>`
              const select = wrap.querySelector('select')
              select.value = v[c.key]
              const numeric = typeof c.options[0] === 'number'
              select.addEventListener('change', () => {
                v[c.key] = numeric ? Number(select.value) : select.value
                if (typeof c.onChange === 'function') {
                  c.onChange(v[c.key])
                }
              })
            } else if (c.type === 'color') {
              wrap.className = 'control inline color'
              wrap.innerHTML = `<input id="${id}" type="color"><label for="${id}">${c.label}</label>`
              const input = wrap.querySelector('input')
              input.value = v[c.key]
              input.addEventListener('input', () => {
                v[c.key] = input.value
              })
            } else if (c.type === 'checkbox') {
              wrap.innerHTML = `<input id="${id}" type="checkbox"><label for="${id}">${c.label}</label>`
              const input = wrap.querySelector('input')
              input.checked = v[c.key]
              input.addEventListener('change', () => {
                v[c.key] = input.checked
              })
            } else if (c.type === 'text') {
              wrap.innerHTML = `<label for="${id}">${c.label}</label>
                                <input id="${id}" type="text" class="text-input">`
              const input = wrap.querySelector('input')
              input.value =
                v[c.key] !== undefined && v[c.key] !== null && v[c.key] !== ''
                  ? v[c.key]
                  : c.value || ''
              v[c.key] = input.value
              input.addEventListener('input', () => {
                v[c.key] = input.value
              })
            } else if (c.type === 'button') {
              wrap.innerHTML = `<button id="${id}" class="btn btn-primary" style="width: 100%; margin-top: 4px; padding: 7px 10px; font-weight: 600;">${c.label}</button>`
              const btn = wrap.querySelector('button')
              btn.addEventListener('click', () => {
                if (c.onClick) c.onClick()
              })
            }
            groupEl.appendChild(wrap)
          })
          panelEl.appendChild(groupEl)
        })
      }

      // ======================================================================
      // Media Sources: Image, Video, Webcam & Animated Motion Demo
      // ======================================================================
      function setCanvasDimensions(sw, sh) {
        const scale = Math.min(960 / sw, 640 / sh, 1.5)
        env.W = Math.max(ROOT, Math.floor((sw * scale) / ROOT) * ROOT)
        env.H = Math.max(ROOT, Math.floor((sh * scale) / ROOT) * ROOT)
        canvas.width = env.W
        canvas.height = env.H
        env.sourceCanvas.width = env.W
        env.sourceCanvas.height = env.H
        env.cursor.x = env.cursor.targetX = env.W / 2
        env.cursor.y = env.cursor.targetY = env.H / 2
      }

      function stopActiveMedia() {
        if (env.sourceVideo) {
          env.sourceVideo.pause()
          if (env.sourceVideo.srcObject) {
            env.sourceVideo.srcObject.getTracks().forEach((t) => t.stop())
          }
          env.sourceVideo = null
        }
      }

      function loadImageSource(img) {
        stopActiveMedia()
        env.sourceType = 'image'
        sourceBadge.textContent = 'IMAGE'
        sourceBadge.style.color = '#8c9eff'
        setCanvasDimensions(
          img.naturalWidth || img.width,
          img.naturalHeight || img.height,
        )
        env.sourceCtx.drawImage(img, 0, 0, env.W, env.H)
        buildTables(env.sourceCtx.getImageData(0, 0, env.W, env.H))
      }

      function loadVideoElement(video, label = 'VIDEO') {
        stopActiveMedia()
        env.sourceVideo = video
        env.sourceType = 'video'
        sourceBadge.textContent = label
        sourceBadge.style.color = '#00ff88'

        const onReady = () => {
          setCanvasDimensions(video.videoWidth || 960, video.videoHeight || 640)
        }
        if (video.readyState >= 2) onReady()
        else video.addEventListener('loadedmetadata', onReady, { once: true })
      }

      function loadMediaFile(file) {
        if (!file) return
        if (file.type.startsWith('video/')) {
          const video = document.createElement('video')
          video.src = URL.createObjectURL(file)
          video.loop = true
          video.muted = true
          video.playsInline = true
          video.play().catch(() => {})
          loadVideoElement(video, 'VIDEO FILE')
        } else if (file.type.startsWith('image/')) {
          const url = URL.createObjectURL(file)
          const img = new Image()
          img.onload = () => {
            loadImageSource(img)
            URL.revokeObjectURL(url)
          }
          img.src = url
        }
      }

      async function loadWebcam() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 960 }, height: { ideal: 640 } },
          })
          const video = document.createElement('video')
          video.srcObject = stream
          video.muted = true
          video.playsInline = true
          video.play()
          loadVideoElement(video, 'LIVE WEBCAM')
        } catch (err) {
          alert('Could not access webcam: ' + err.message)
        }
      }

      // Procedural Animated Motion Demo (Simulates high-action video footage)
      function initMotionDemo() {
        stopActiveMedia()
        env.sourceType = 'demo'
        sourceBadge.textContent = 'MOTION-DEMO'
        sourceBadge.style.color = '#ff9800'
        setCanvasDimensions(960, 640)

        env.demoState = {
          entities: [
            {
              x: 180,
              y: 300,
              vx: 2.2,
              vy: 1.6,
              r: 42,
              color: '#00ff88',
              shape: 'orb',
            },
            {
              x: 500,
              y: 220,
              vx: -1.8,
              vy: 2.1,
              r: 55,
              color: '#ec4899',
              shape: 'box',
            },
            {
              x: 740,
              y: 400,
              vx: -2.4,
              vy: -1.5,
              r: 36,
              color: '#38bdf8',
              shape: 'orb',
            },
            {
              x: 380,
              y: 450,
              vx: 1.5,
              vy: -2.3,
              r: 48,
              color: '#fbbf24',
              shape: 'poly',
            },
          ],
          particles: [],
        }
      }

      function updateAndDrawMotionDemo(dt) {
        const s = env.demoState
        const c = env.sourceCtx
        const { W, H } = env

        // Dark tech gradient background with subtle scanlines
        c.fillStyle = '#06070c'
        c.fillRect(0, 0, W, H)

        // Background animated grid lines
        c.strokeStyle = 'rgba(255, 255, 255, 0.04)'
        c.lineWidth = 1
        const gridSize = 40
        const offset = (env.time * 20) % gridSize
        c.beginPath()
        for (let x = offset; x < W; x += gridSize) {
          c.moveTo(x, 0)
          c.lineTo(x, H)
        }
        for (let y = offset; y < H; y += gridSize) {
          c.moveTo(0, y)
          c.lineTo(W, y)
        }
        c.stroke()

        // Update and draw moving neon entities
        s.entities.forEach((e) => {
          e.x += e.vx
          e.y += e.vy
          if (e.x - e.r < 0 || e.x + e.r > W) e.vx *= -1
          if (e.y - e.r < 0 || e.y + e.r > H) e.vy *= -1

          // Radial glow
          const grad = c.createRadialGradient(
            e.x,
            e.y,
            e.r * 0.2,
            e.x,
            e.y,
            e.r * 1.8,
          )
          grad.addColorStop(0, e.color)
          grad.addColorStop(1, 'transparent')
          c.fillStyle = grad
          c.beginPath()
          c.arc(e.x, e.y, e.r * 1.8, 0, TAU)
          c.fill()

          // Solid core
          c.fillStyle = '#ffffff'
          c.strokeStyle = e.color
          c.lineWidth = 3
          if (e.shape === 'orb') {
            c.beginPath()
            c.arc(e.x, e.y, e.r * 0.6, 0, TAU)
            c.fill()
            c.stroke()
          } else if (e.shape === 'box') {
            const sz = e.r * 1.1
            c.fillRect(e.x - sz / 2, e.y - sz / 2, sz, sz)
            c.strokeRect(e.x - sz / 2, e.y - sz / 2, sz, sz)
          } else {
            // Polygon
            c.save()
            c.translate(e.x, e.y)
            c.rotate(env.time * 2)
            c.beginPath()
            const sides = 5
            for (let k = 0; k < sides; k++) {
              const a = (k * TAU) / sides
              const px = Math.cos(a) * e.r * 0.7
              const py = Math.sin(a) * e.r * 0.7
              if (k === 0) c.moveTo(px, py)
              else c.lineTo(px, py)
            }
            c.closePath()
            c.fill()
            c.stroke()
            c.restore()
          }
        })

        // Rebuild quadtree tables when motion demo is active
        buildTables(c.getImageData(0, 0, W, H))
      }

      // Static Image Presets
      function makePreset(name) {
        stopActiveMedia()
        env.sourceType = 'image'
        sourceBadge.textContent = 'PRESET IMAGE'
        sourceBadge.style.color = '#8c9eff'

        const w = 960,
          h = 640
        const c = document.createElement('canvas')
        c.width = w
        c.height = h
        const p = c.getContext('2d')

        if (name === 'sunset') {
          const sky = p.createLinearGradient(0, 0, 0, h)
          sky.addColorStop(0, '#1b1f4b')
          sky.addColorStop(0.45, '#c2467a')
          sky.addColorStop(0.7, '#ff9a4d')
          sky.addColorStop(1, '#ffd98a')
          p.fillStyle = sky
          p.fillRect(0, 0, w, h)
          p.fillStyle = '#fff3c4'
          p.beginPath()
          p.arc(w * 0.62, h * 0.58, 70, 0, TAU)
          p.fill()
          const ridges = [
            ['#4a2a5c', 0.66, 40],
            ['#2c1a45', 0.76, 55],
            ['#150f2a', 0.88, 35],
          ]
          ridges.forEach(([col, base, amp], k) => {
            p.fillStyle = col
            p.beginPath()
            p.moveTo(0, h)
            for (let x = 0; x <= w; x += 8) {
              p.lineTo(
                x,
                h * base +
                  Math.sin(x * 0.012 + k * 2) * amp +
                  Math.sin(x * 0.037 + k) * amp * 0.4,
              )
            }
            p.lineTo(w, h)
            p.closePath()
            p.fill()
          })
          p.fillStyle = '#0b0818'
          for (let i = 0; i < 9; i++) {
            const x = 80 + i * 105,
              th = 60 + ((i * 37) % 50)
            p.beginPath()
            p.moveTo(x, h)
            p.lineTo(x + 18, h - th)
            p.lineTo(x + 36, h)
            p.fill()
          }
        } else if (name === 'portrait') {
          const bg = p.createRadialGradient(
            w * 0.7,
            h * 0.35,
            40,
            w * 0.7,
            h * 0.35,
            600,
          )
          bg.addColorStop(0, '#ff6b6b')
          bg.addColorStop(0.5, '#5b4bd1')
          bg.addColorStop(1, '#0c0c1c')
          p.fillStyle = bg
          p.fillRect(0, 0, w, h)
          p.fillStyle = '#12121f'
          p.beginPath()
          p.ellipse(w * 0.45, h * 0.95, 260, 200, 0, 0, TAU)
          p.fill()
          p.fillStyle = '#2b2140'
          p.beginPath()
          p.ellipse(w * 0.45, h * 0.42, 175, 215, 0, 0, TAU)
          p.fill()
          p.fillStyle = '#f2c4a0'
          p.beginPath()
          p.ellipse(w * 0.46, h * 0.46, 130, 170, 0, 0, TAU)
          p.fill()
          p.fillStyle = '#fff'
          ;[-48, 52].forEach((dx) => {
            p.beginPath()
            p.ellipse(w * 0.46 + dx, h * 0.42, 22, 12, 0, 0, TAU)
            p.fill()
          })
          p.fillStyle = '#1f6fb0'
          ;[-48, 52].forEach((dx) => {
            p.beginPath()
            p.arc(w * 0.46 + dx, h * 0.42, 9, 0, TAU)
            p.fill()
          })
          p.fillStyle = '#c93b57'
          p.beginPath()
          p.ellipse(w * 0.46 + 4, h * 0.58, 38, 13, 0, 0, TAU)
          p.fill()
        } else {
          p.fillStyle = '#143221'
          p.fillRect(0, 0, w, h)
          for (let i = 0; i < 40; i++) {
            p.fillStyle = `rgba(${30 + ((i * 13) % 50)},${90 + ((i * 29) % 90)},${50 + ((i * 17) % 40)},0.55)`
            p.beginPath()
            p.arc((i * 211) % w, (i * 127) % h, 40 + ((i * 23) % 80), 0, TAU)
            p.fill()
          }
          const fx = w / 2,
            fy = h / 2
          for (let k = 0; k < 16; k++) {
            p.save()
            p.translate(fx, fy)
            p.rotate((k * TAU) / 16)
            p.fillStyle = k % 2 ? '#d6336c' : '#f06595'
            p.beginPath()
            p.ellipse(150, 0, 130, 38, 0, 0, TAU)
            p.fill()
            p.restore()
          }
          p.fillStyle = '#ffd43b'
          p.beginPath()
          p.arc(fx, fy, 52, 0, TAU)
          p.fill()
          p.fillStyle = '#e67700'
          for (let k = 0; k < 24; k++) {
            const a = k * 0.26
            p.beginPath()
            p.arc(
              fx + Math.cos(a * 3) * 30,
              fy + Math.sin(a * 3) * 30,
              3,
              0,
              TAU,
            )
            p.fill()
          }
        }
        loadImageSource(c)
      }

      // Wiring & Events
      // ======================================================================
      document.getElementById('preset').addEventListener('change', (e) => {
        if (e.target.value === 'motion-demo') {
          initMotionDemo()
        } else {
          makePreset(e.target.value)
        }
      })

      document
        .getElementById('openBtn')
        .addEventListener('click', () =>
          document.getElementById('file').click(),
        )
      document
        .getElementById('file')
        .addEventListener('change', (e) => loadMediaFile(e.target.files[0]))
      document.getElementById('webcamBtn').addEventListener('click', loadWebcam)
      document.getElementById('saveBtn').addEventListener('click', () => {
        const a = document.createElement('a')
        a.download = `${activeEffect.id}-${Date.now()}.png`
        a.href = canvas.toDataURL('image/png')
        a.click()
      })

      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect()
        const x = (clientX - rect.left) * (env.W / rect.width)
        const y = (clientY - rect.top) * (env.H / rect.height)
        return {
          x: Math.max(0, Math.min(env.W, x)),
          y: Math.max(0, Math.min(env.H, y)),
        }
      }

      function setCursor(clientX, clientY) {
        const pt = getCanvasCoords(clientX, clientY)
        env.cursor.targetX = pt.x
        env.cursor.targetY = pt.y
        env.cursor.lastMoveAt = performance.now()
        return pt
      }

      canvas.addEventListener('mousedown', (e) => {
        env.cursor.isDown = true
        const pt = setCursor(e.clientX, e.clientY)
        env.cursor.x = pt.x
        env.cursor.y = pt.y
        if (activeEffect.onPointerDown) {
          activeEffect.onPointerDown(pt.x, pt.y, e)
        }
      })

      window.addEventListener('mouseup', (e) => {
        if (env.cursor.isDown) {
          env.cursor.isDown = false
          if (activeEffect.onPointerUp) {
            const pt = getCanvasCoords(e.clientX, e.clientY)
            activeEffect.onPointerUp(pt.x, pt.y, e)
          }
        }
      })

      canvas.addEventListener('mousemove', (e) => {
        const pt = setCursor(e.clientX, e.clientY)
        if (activeEffect.onPointerMove) {
          activeEffect.onPointerMove(pt.x, pt.y, env.cursor.isDown, e)
        }
      })

      canvas.addEventListener(
        'touchstart',
        (e) => {
          e.preventDefault()
          env.cursor.isDown = true
          const touch = e.touches[0]
          const pt = setCursor(touch.clientX, touch.clientY)
          env.cursor.x = pt.x
          env.cursor.y = pt.y
          if (activeEffect.onPointerDown) {
            activeEffect.onPointerDown(pt.x, pt.y, e)
          }
        },
        { passive: false },
      )

      canvas.addEventListener(
        'touchmove',
        (e) => {
          e.preventDefault()
          const touch = e.touches[0]
          const pt = setCursor(touch.clientX, touch.clientY)
          if (activeEffect.onPointerMove) {
            activeEffect.onPointerMove(pt.x, pt.y, env.cursor.isDown, e)
          }
        },
        { passive: false },
      )

      window.addEventListener('touchend', (e) => {
        if (env.cursor.isDown) {
          env.cursor.isDown = false
          if (activeEffect.onPointerUp) {
            activeEffect.onPointerUp(env.cursor.targetX, env.cursor.targetY, e)
          }
        }
      })

      // Stage clear button & keyboard shortcut 'C'
      const stageClearBtn = document.getElementById('stageClearBtn')
      if (stageClearBtn) {
        stageClearBtn.addEventListener('click', () => {
          if (typeof fingerSketch.clear === 'function') {
            fingerSketch.clear()
          }
        })
      }

      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')
          return
        if (e.key === 'c' || e.key === 'C') {
          if (
            activeEffect.id === 'finger-sketch' &&
            typeof fingerSketch.clear === 'function'
          ) {
            fingerSketch.clear()
          }
        }
      })

      stage.addEventListener('dragover', (e) => {
        e.preventDefault()
        stage.classList.add('dragging')
      })
      stage.addEventListener('dragleave', () =>
        stage.classList.remove('dragging'),
      )
      stage.addEventListener('drop', (e) => {
        e.preventDefault()
        stage.classList.remove('dragging')
        loadMediaFile(e.dataTransfer.files[0])
      })

      // Main RAF loop
      let lastFrame = performance.now()
      function frame(now) {
        const dt = Math.min(0.1, (now - lastFrame) / 1000)
        lastFrame = now

        // 1. Advance dynamic media source
        if (env.sourceType === 'demo') {
          updateAndDrawMotionDemo(dt)
        } else if (
          env.sourceType === 'video' &&
          env.sourceVideo &&
          env.sourceVideo.readyState >= 2
        ) {
          env.sourceCtx.drawImage(env.sourceVideo, 0, 0, env.W, env.H)
          buildTables(env.sourceCtx.getImageData(0, 0, env.W, env.H))
        }

        // 2. Draw active effect
        if (env.W > 0 && env.H > 0) {
          const t0 = performance.now()
          const info = activeEffect.draw(values[activeEffect.id], dt)
          statsEl.textContent = `${info} · ${(performance.now() - t0).toFixed(1)} ms`
        }

        requestAnimationFrame(frame)
      }

      // Initialize
      renderMenu()
      renderPanel()
      initMotionDemo()
      requestAnimationFrame(frame)
    </script>
  </body>
</html>
