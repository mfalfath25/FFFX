        in vec2 v_imageUV;
        out vec4 fragColor;

        #define TWO_PI 6.28318530718
        #define PI 3.14159265358979323846

        float getUvFrame(vec2 uv) {
          vec2 invAA = .5 / clamp(fwidth(uv), 1e-5, .02);
          vec2 lo = clamp(uv * invAA + .5, 0., 1.);
          vec2 hi = clamp((1. - uv) * invAA + .5, 0., 1.);
          return lo.x * hi.x * lo.y * hi.y;
        }

        float lst(float edge0, float edge1, float x) {
          return clamp((x - edge0) / (edge1 - edge0), 0.0, 1.0);
        }

        float hash21(vec2 p) {
          p = fract(p * vec2(0.3183099, 0.3678794)) + 0.1;
          p += dot(p, p + 19.19);
          return fract(p.x * p.y);
        }

        vec2 hash22(vec2 p) {
          p = fract(p * vec2(0.3183099, 0.3678794)) + 0.1;
          p += dot(p, p.yx + 19.19);
          return fract(vec2(p.x * p.y, p.x + p.y));
        }

        float getRoughness(vec2 p, vec2 lightDir, vec2 seedShift, float basePixel) {
          vec2 u = p / vec2(2.0, 4.0);
          float w = 100. * basePixel;
          float eps = 4. * w;

          float size = mix(3.2, .8, u_roughnessSize);
          float logLac = log2(2.1);
          float level = -log2(w + 1e-8) / logLac;
          float baseLevel = floor(level) - 2.;
          float fade = fract(level);

          vec2 px = (u.x + vec2(eps, -eps)) * .1;
          float py = u.y * .1;

          vec2 sum = vec2(0.);
          float norm = 0., amp = .5;
          float freq = exp2(baseLevel * logLac);
          for (int i = 0; i < 4; i++) {
            float absIdx = baseLevel + float(i);
            vec2 qx = size * px * freq;
            float qy = size * py * freq;

            float wi = 1.;
            if (i == 0) wi = 1. - fade;
            if (i == 3) wi = fade;

            vec2 fx = fract(qx);
            float fy = fract(qy);
            vec2 shift = .5 + absIdx * .3 + seedShift;
            float uvY = floor(qy) / 50. + shift.y;
            vec2 s0a = textureLod(u_noiseTexture, fract(vec2(floor(qx.x) / 50. + shift.x, uvY)), 0.).rg;
            vec2 s1a = textureLod(u_noiseTexture, fract(vec2( ceil(qx.x) / 50. + shift.x, uvY)), 0.).rg;
            vec2 s0b = textureLod(u_noiseTexture, fract(vec2(floor(qx.y) / 50. + shift.x, uvY)), 0.).rg;
            vec2 s1b = textureLod(u_noiseTexture, fract(vec2( ceil(qx.y) / 50. + shift.x, uvY)), 0.).rg;
            vec2 ny0 = mix(vec2(s0a.r, s0b.r), vec2(s0a.g, s0b.g), fy);
            vec2 ny1 = mix(vec2(s1a.r, s1b.r), vec2(s1a.g, s1b.g), fy);
            vec2 n = mix(ny0, ny1, fx);

            sum += amp * wi * n;
            norm += amp * wi;
            amp *= .8;
            freq *= 2.1;
          }

          vec2 r = sum / norm;
          float dx = .5 + r.x - r.y;
          float grain = 3. * dx * dx - .7;

          float rowBand = fract(dot(p, lightDir) * .05 * size);
          return grain + .6 * u_roughnessRows * (rowBand - .5);
        }

        float getFiber(vec2 p, vec2 seedShift, float basePixel) {
          float size = mix(4., 1., u_fiberSize);
          float w = 50. * basePixel;
          float level = -log2(w + 1e-8);
          float baseLevel = floor(level) - 3.;
          float fade = fract(level);

          vec2 grad = vec2(0.);
          float scale = 1.;
          float amp = 1.;
          float freq = pow(1.7, baseLevel);
          for (int i = 0; i < 5; i++) {
            float absIdx = baseLevel + float(i);
            vec2 q = size * p * freq;

            float an = absIdx * .8;
            float rc = cos(an), rs = sin(an);
            q = vec2(rc * q.x - rs * q.y, rs * q.x + rc * q.y);

            float wi = 1.;
            if (i == 0) wi = 1. - fade;
            if (i == 4) wi = fade;

            vec2 iq = floor(q);
            vec2 fq = fract(q);
            float shift = absIdx * .3;
            vec4 uv = fract(vec4(iq, iq + 1.) / 50. + .5 + shift + seedShift.xyxy);
            float aF = textureLod(u_noiseTexture, uv.xy, 0.).b;
            float bF = textureLod(u_noiseTexture, uv.zy, 0.).b;
            float cF = textureLod(u_noiseTexture, uv.xw, 0.).b;
            float dF = textureLod(u_noiseTexture, uv.zw, 0.).b;
            vec2 u = fq * fq * (3. - 2. * fq);
            vec2 du = 8. * fq * (1. - fq);
            float dx = du.x * mix(bF - aF, dF - cF, u.y);
            float dy = du.y * mix(cF - aF, dF - bF, u.x);
            grad += wi * amp * scale * vec2(rc * dx + rs * dy, -rs * dx + rc * dy);
            scale *= 1.7;
            amp *= .5;
            freq *= 1.7;
          }

          return clamp(.333 * length(grad), 0., 1.);
        }

        vec2 smoothNoise(vec2 p) {
          vec2 t = p * 50. - .5;
          vec2 i = floor(t);
          vec2 f = fract(t);
          f = f * f * (3. - 2. * f);
          return textureLod(u_noiseTexture, fract((i + f + .5) / vec2(50.)), 0.).rg;
        }

        float getDrops(vec2 uv, vec2 seedShift) {
          vec2 iDropsUV = floor(uv);
          vec2 fDropsUV = fract(uv);
          float dropsMinDist = 1.;
          for (int y = -1; y < 2; y += 1) {
            for (int x = -1; x < 2; x += 1) {
              vec2 neighbor = vec2(float(y), float(x));
              vec2 offset = hash22(iDropsUV + neighbor + 50. * seedShift);
              vec2 pos = neighbor + offset - fDropsUV;
              dropsMinDist *= min(1., dot(pos, pos));
            }
          }
          return .5 * lst(.09, .08, sqrt(sqrt(dropsMinDist)));
        }

        vec2 getCellTilt(float idx, float radius) {
          vec2 rand = hash22(vec2(idx + 31., idx * u_seed + 17.));
          float an = rand.x * TWO_PI;
          return vec2(cos(an), sin(an)) * mix(.3, 1.7, rand.y * rand.y) * mix(.7, 1., radius);
        }

        vec2 getCrumpleDetail(vec2 uv, float freq, float shift, float basePixel, out float depth) {
          depth = 0.;
          vec2 v = uv * freq;
          float pixel = .9 * freq * basePixel;
          vec2 base = floor(v);
          float n1 = 9., n2 = 9.;
          vec2 s1 = vec2(0.), s2 = vec2(0.), q1 = vec2(0.), q2 = vec2(0.);

          for (int y = -1; y <= 1; y++) {
            for (int x = -1; x <= 1; x++) {
              vec2 cell = base + vec2(float(x), float(y));
              vec2 q = hash22(vec2(cell.y * 1.9 + 3.1 + shift, cell.x * 1.3 + .11 * u_seed));
              float keep = .8;
              if (q.y > keep) continue;

              vec2 r = hash22(vec2(cell.x + .37 * u_seed + shift + 11.1, cell.y - .21 * u_seed + 5.7));
              vec2 s = cell + .06 + .88 * r;

              vec2 d = v - s;
              float dsq = dot(d, d);
              if (dsq < n1) {
                n2 = n1;
                s2 = s1;
                q2 = q1;
                n1 = dsq;
                s1 = s;
                q1 = q;
              } else if (dsq < n2) {
                n2 = dsq;
                s2 = s;
                q2 = q;
              }
            }
          }

          if (n1 > 8.) return vec2(0.);

          float an1 = q1.x * TWO_PI, mag1 = q1.y / .8;
          vec2 t1 = vec2(cos(an1), sin(an1)) * mix(.3, 1.7, mag1 * mag1);
          float an2 = q2.x * TWO_PI, mag2 = q2.y / .8;
          vec2 t2 = vec2(cos(an2), sin(an2)) * mix(.3, 1.7, mag2 * mag2);

          vec2 span = s1 - s2;
          float spanLen = max(length(span), 1e-4);
          float toEdge = (n2 - n1) / (2. * spanLen);

          float pair = hash21(s1 + s2 + 1.7 * abs(s1 - s2));
          float pairSoft = .05 + .1 * step(pair, .4);
          float b = clamp(toEdge / max(1.5 * pixel, .5 * pairSoft), 0., 1.);
          b = b * b * (3. - 2. * b);
          float d1 = max(sqrt(n1), 1e-4);
          depth = .2 * d1;
          float shoulderAmt = max(0., 1. - toEdge / .42) * b;
          vec2 shoulder = vec2(0.);
          if (shoulderAmt > 0.) {
            float d2 = max(sqrt(n2), 1e-4);
            shoulder = shoulderAmt * ((v - s2) / d2 - (v - s1) / d1);
          }

          vec2 mid = .5 * (t1 + t2);
          return mid + (t1 - mid) * b + .9 * shoulder;
        }

        vec4 getCrumples(vec2 uv) {
          float crumpleN = max(2., floor(u_crumpleCount + .5));
          float near = 60000., nearB = 60000.;
          float idx = 0., rad = 0.;
          vec2 nearP = vec2(0.), nearPb = vec2(0.);
          vec4 seeds[15];
          for (int i = 0; i < 15; i++) {
            if (float(i) >= crumpleN) break;
            vec2 rand = hash22(vec2(float(i), float(i) * u_seed));
            float an = rand.x * TWO_PI;
            vec2 p = vec2(cos(an), sin(an)) * rand.y;
            seeds[i] = vec4(p, rand);

            vec2 d = uv - p;
            float dsq = dot(d, d);
            if (dsq < near) {
              nearB = near;
              nearPb = nearP;
              near = dsq;
              idx = float(i);
              rad = rand.y;
              nearP = p;
            } else if (dsq < nearB) {
              nearB = dsq;
              nearPb = p;
            }
          }
          float l = sqrt(near), lb = sqrt(nearB);
          vec2 dir = (uv - nearP) / max(l, 1e-4);
          float edge = lst(0., .5, lb - l);

          float shoulderLimit = l + .5;

          vec2 tilt = getCellTilt(idx, rad);
          float tiltSum = 1.;
          vec2 wide = vec2(0.);
          float wideSum = 0.;
          float toEdge = 9., edgeSoft = 0.;

          for (int i = 0; i < 15; i++) {
            if (float(i) >= crumpleN) break;
            if (float(i) == idx) continue;
            vec4 seed = seeds[i];
            vec2 p = seed.xy;
            vec2 rand = seed.zw;

            vec2 d = uv - p;
            float dsq = dot(d, d);

            if (dsq < shoulderLimit * shoulderLimit) {
              float di = sqrt(dsq);
              float shoulder = lst(.5, 0., di - l);
              wide += shoulder * (d / max(di, 1e-4) - dir);
              wideSum += shoulder;
            }

            float pairSoft = .01 + .05 * step(.2, rand.x) + .3 * rand.y;
            float toBisector = (dsq - near) / (.2 * max(length(p - nearP), 1e-4));
            if (toBisector < toEdge) {
              toEdge = toBisector;
              edgeSoft = pairSoft;
            }

            float w = 1. - toBisector / pairSoft;
            if (w > 0.) {
              w *= w;
              tilt += w * getCellTilt(float(i), rand.y);
              tiltSum += w;
            }
          }

          float blend = clamp(toEdge / edgeSoft, 0., 1.);
          vec2 sharp = (1. - edge) * ((uv - nearPb) / max(lb, 1e-4) - dir);
          vec2 rounding = mix(sharp, wide / max(wideSum, 1.), min(2. * edgeSoft, 1.));
          float radial = l / max(l + toEdge, 1e-4);

          return vec4(tilt / tiltSum + rounding * blend * radial, .2 * l, edge);
        }

        void getFolds(vec2 coord, vec2 offset, vec2 count, vec2 noise, vec2 baseFwidth, out vec2 slope, out vec2 dark, out vec2 lift) {
          vec2 g = coord * count + .5 * offset + noise;
          vec2 dx = fract(g) - .5;
          vec2 adx = abs(dx);
          float foldRadius = .3;
          vec2 t = clamp(adx / foldRadius, 0., 1.);
          dark = t * t * (3. - 2. * t);
          lift = 1. - t;
          lift *= lift;

          vec2 crease = clamp(dx / max(count * baseFwidth, 1e-5), -1., 1.);
          slope = crease * (1. - dark);

          vec2 lineWidth = .02 * count * mix(vec2(2.5), vec2(.8), dark.yx) + .1 * noise;
          slope -= 1. - smoothstep(vec2(0.), lineWidth, adx);
        }

        void main() {
          vec2 patternUV = (v_imageUV - .5) * vec2(u_imageAspectRatio, 1.);
          float basePixel = max(length(dFdx(patternUV)), length(dFdy(patternUV)));
          vec2 baseFwidth = fwidth(patternUV);

          float pattern = 0.;

          float crumpleDepth = 0.;
          float wrinkleDepth = 0.;
          float foldDepth = 0.;
          float roughness = 0.;
          float fiber = 0.;
          float drops = 0.;

          float grazing = 0.7;
          float lightRad = radians(u_angle);
          vec2 lightDir = vec2(sin(lightRad), -cos(lightRad));
          float foldAngleInSector = mod(u_angle, 90.);
          float foldLightRad = radians(u_angle - foldAngleInSector + mix(12., 78., foldAngleInSector / 90.));
          vec2 foldLightDir = vec2(sin(foldLightRad), -cos(foldLightRad));
          vec2 relief = vec2(0.);
          vec2 foldSlope = vec2(0.);
          float reliefAmount = 0.;
          float foldInk = 1.;
          vec2 crumpleFlow = vec2(0.);

          vec2 warpNoise = vec2(0.);
          if (u_crumples > 0. || u_folds > 0. || u_wrinkles > 0.) {
            warpNoise = smoothNoise(patternUV * .1 + .2 + .6 * fract(.017 * u_seed)) - .5;
          }
          vec2 crumplesUV = (patternUV * .9) + .012 * warpNoise;

          if (u_crumples > 0.) {
            vec4 crumples = getCrumples(crumplesUV);

            vec2 crumpleTilt = .5 * u_crumples * crumples.xy;
            crumpleTilt -= .1 * max(dot(crumpleTilt, lightDir), 0.) * lightDir;
            relief += crumpleTilt;
            reliefAmount += .6 * u_crumples;
            crumpleFlow = crumples.w * crumpleTilt;

            crumpleDepth = clamp(5. * crumples.z, 0., 1.);
          }

          if (u_wrinkles > 0.) {
            float detailFreq = mix(10., 1., u_wrinkleSize);
            float detailAmp = .2;
            vec2 detailGrad = vec2(0.);
            float detailDepth = 0., depthSum = 0.;
            for (int i = 0; i < 3; i++) {
              float layerDepth;
              detailGrad += detailAmp * getCrumpleDetail(crumplesUV, detailFreq, 31. * float(i), basePixel, layerDepth);
              detailDepth += detailAmp * layerDepth;
              depthSum += detailAmp;
              detailAmp *= (.5 + .2 * detailGrad.x);
              detailFreq *= 2.1;
            }

            vec2 detailTilt = 1.5 * u_wrinkles * detailGrad;
            detailTilt -= .65 * max(dot(detailTilt, lightDir), 0.) * lightDir;
            relief += detailTilt;
            reliefAmount += .6 * u_wrinkles;

            wrinkleDepth = clamp(5. * detailDepth / max(depthSum, 1e-4), 0., 1.);
          }

          if (u_folds > 0.) {
            vec2 foldOffset = vec2(1. - 2. * u_foldOffsetX, 1. - 2. * u_foldOffsetY);
            vec2 foldCount = vec2(mix(3., .5, u_foldSizeX), mix(3., .5, u_foldSizeY));
            vec2 foldNoise = .005 * warpNoise * foldCount;
            vec2 uv = patternUV + .03 * crumpleFlow;

            vec2 slope, dark, lift;
            getFolds(uv, foldOffset, foldCount, foldNoise, baseFwidth, slope, dark, lift);

            foldSlope = u_folds * slope;
            reliefAmount += 1. * u_folds;
            vec2 ink = mix(vec2(.96), vec2(1.), dark);
            float flatness = dark.x * dark.y;
            foldInk *= mix(1., ink.x * ink.y * mix(.5, .3, flatness), u_folds);

            foldDepth = u_folds * (lift.y * foldLightDir.y - lift.x * foldLightDir.x);
          }

          // Custom Point-to-Point Paper Creases
          float customCreaseDepth = 0.0;
          if (u_creaseCount > 0) {
            float wWidth = max(0.003, u_creaseWidth * 0.04);
            for (int i = 0; i < 16; i++) {
              if (i >= u_creaseCount) break;
              vec4 cLine = u_creases[i];
              vec2 pa = (patternUV - (cLine.xy - 0.5) * vec2(u_imageAspectRatio, 1.0));
              vec2 ba = (cLine.zw - cLine.xy) * vec2(u_imageAspectRatio, 1.0);
              float baLenSq = dot(ba, ba);
              if (baLenSq > 1e-5) {
                float h = clamp(dot(pa, ba) / baLenSq, 0.0, 1.0);
                vec2 perp = pa - ba * h;
                float dist = length(perp);
                if (dist < wWidth * 5.0) {
                  vec2 normDir = normalize(perp + 1e-4);
                  float valley = -exp(-dist / wWidth) * u_creaseDepth * 1.3;
                  float ridge = exp(-dist / (wWidth * 0.35)) * u_creaseHighlight * 0.85;
                  
                  vec2 cTilt = normDir * (valley + ridge);
                  relief += cTilt * 1.5;
                  reliefAmount += 0.8 * u_creaseDepth;
                  crumpleFlow += normDir * exp(-dist / (wWidth * 2.0)) * u_creaseBuckle * 0.5;
                  customCreaseDepth += exp(-dist / wWidth);
                }
              }
            }
          }

          float unlit = cos(grazing);
          float lit = unlit;

          if (reliefAmount > 0.) {
            float lightFalloff = clamp(.5 + dot(v_imageUV - .5, lightDir), 0., 1.);
            float lightPower = mix(.5, 1., lightFalloff);
            float slope = clamp(dot(relief, lightDir) + dot(foldSlope, foldLightDir), -1.2, 1.2);
            lit = max(cos(slope + grazing), 0.);

            pattern += (clamp(reliefAmount, 0., 1.) * unlit + (lit - unlit)) * foldInk * lightPower;
          }

          patternUV += .04 * crumpleFlow;

          vec2 seedShift = floor(fract(u_seed * vec2(.7548776662, .5698402909)) * 50.) / 50.;

          if (u_roughness > 0.) {
            roughness = u_roughness * getRoughness(1000. * patternUV, lightDir, seedShift, basePixel);
            pattern += roughness;
          }

          if (u_fiber > 0.) {
            fiber = u_fiber * getFiber(50. * patternUV, seedShift, basePixel);
            pattern += fiber;
          }

          if (u_drops > 0.) {
            drops = u_drops * getDrops(patternUV * 10., seedShift);
          }

          pattern = clamp(pattern, 0., 1.);

          vec3 backColor = u_colorBack.rgb * u_colorBack.a;
          float backOpacity = u_colorBack.a;
          vec3 baseColor = u_colorPaper.rgb * u_colorPaper.a;
          float baseOpacity = u_colorPaper.a;
          vec3 shadowColor = u_colorShadow.rgb * u_colorShadow.a;
          float shadowOpacity = u_colorShadow.a;

          float notClipped = u_clip ? .1 : 1.;
          vec2 imageCenteredUV = v_imageUV - .5;
          float edgeDist = 2. * max(abs(imageCenteredUV.x), abs(imageCenteredUV.y));
          float wrinkleDistortion = mix(.38, .0175, smoothstep(0., 1., edgeDist));
          float scaleDistortion = .15 * u_crumples * (crumpleDepth - .5) + wrinkleDistortion * u_wrinkles * (wrinkleDepth - .5) + .05 * foldDepth + .1 * customCreaseDepth;
          vec2 linearDistortion = notClipped * .002 * lightDir * drops;
          float radialDistortion = notClipped * .02 * (roughness + fiber);
          vec2 centeredUV = imageCenteredUV * (1. - u_distortion * scaleDistortion);
          centeredUV -= u_distortion * linearDistortion;
          vec2 imageUV = .5 + centeredUV * (1. - abs(u_distortion) * radialDistortion * dot(centeredUV, centeredUV));

          vec3 color = shadowColor * pattern;
          float opacity = shadowOpacity * pattern;
          color += baseColor * (1. - opacity);
          opacity += baseOpacity * (1. - opacity);

          if (u_isImage) {
            float frame = getUvFrame(imageUV);
            vec4 image = texture(u_image, imageUV);
            frame *= image.a;

            float maxC = max(max(image.r, image.g), image.b);
            float minC = min(min(image.r, image.g), image.b);
            float sat = maxC > 0. ? (maxC - minC) / maxC : 0.;
            float midC = image.r + image.g + image.b - maxC - minC;
            float secondaryness = maxC > minC ? (midC - minC) / (maxC - minC) : 0.;
            float satDampen = sat * (1. - .5 * secondaryness);
            float darkDampen = 1. - dot(vec3(.2126, .7152, .0722), image.rgb);
            float dampen = mix(0., .7, u_blending) * max(satDampen, darkDampen);

            vec3 paper = vec3(1.) - opacity + color;
            vec3 pic = image.rgb * paper * u_blending + image.rgb * (1. - u_blending);
            pic = mix(pic, vec3(1.), .6 * pow(dampen, 2. + 3. * pattern));

            color = mix(color, pic, frame);
            opacity = frame + opacity * (1. - frame);

            if (u_clip) {
              color *= frame;
              opacity *= frame;
            }
          }

          color *= mix(vec3(1.), .5 * u_colorShadow.rgb, drops * shadowOpacity);

          color += backColor * (1. - opacity);
          opacity += backOpacity * (1. - opacity);

          fragColor = vec4(color, opacity);
        }

                },
              },
              {
                key: 'clearCreasesBtn',
                label: 'CLEAR ALL CUSTOM CREASES',
                type: 'button',
                onClick() {
                  paperTexture.clearCreases()
                },
              },
            ],
          },
          {
            title: 'Lighting & Seed',
            controls: [
              {
                key: 'angle',
                label: 'Light Angle',
                type: 'range',
                min: 0,
                max: 360,
                step: 5,
                value: 45,
                unit: '°',
              },
              {
                key: 'seed',
                label: 'Texture Seed',
                type: 'range',
                min: 0,
                max: 100,
                step: 1,
                value: 42,
              },
            ],
          },
        ],

        onPointerDown(x, y) {
          this.isDragging = true
          const u = x / (env.W || 1)
          const v = y / (env.H || 1)
          this.dragStart = { x: u, y: v }
          this.dragCurrent = { x: u, y: v }
        },

        onPointerMove(x, y, isDown) {
          if (!this.isDragging) return
          this.dragCurrent = {
            x: x / (env.W || 1),
            y: y / (env.H || 1),
          }
        },

        onPointerUp(x, y) {
          if (!this.isDragging) return
          this.isDragging = false
          const u = x / (env.W || 1)
          const v = y / (env.H || 1)
          const dx = u - this.dragStart.x
          const dy = v - this.dragStart.y
          const dist = Math.hypot(dx, dy)

          if (dist > 0.02) {
            if (this.creases.length >= 15) {
              this.creases.shift()
            }
            this.creases.push({
              x1: this.dragStart.x,
              y1: this.dragStart.y,
              x2: u,
              y2: v,
            })
          }
        },

        clearCreases() {
          this.creases = []
        },

        addPresetCreases(type) {
          if (type === 'cross') {
            this.creases = [
              { x1: 0.5, y1: 0.0, x2: 0.5, y2: 1.0 },
              { x1: 0.0, y1: 0.5, x2: 1.0, y2: 0.5 },
            ]
          } else if (type === 'diagonal') {
            this.creases = [
              { x1: 0.1, y1: 0.1, x2: 0.9, y2: 0.9 },
              { x1: 0.9, y1: 0.1, x2: 0.1, y2: 0.9 },
            ]
          } else if (type === 'origami') {
            this.creases = [
              { x1: 0.5, y1: 0.0, x2: 0.5, y2: 1.0 },
              { x1: 0.0, y1: 0.5, x2: 1.0, y2: 0.5 },
              { x1: 0.0, y1: 0.0, x2: 1.0, y2: 1.0 },
              { x1: 1.0, y1: 0.0, x2: 0.0, y2: 1.0 },
              { x1: 0.5, y1: 0.0, x2: 1.0, y2: 0.5 },
              { x1: 1.0, y1: 0.5, x2: 0.5, y2: 1.0 },
              { x1: 0.5, y1: 1.0, x2: 0.0, y2: 0.5 },
              { x1: 0.0, y1: 0.5, x2: 0.5, y2: 0.0 },
            ]
          }
        },

        draw(v, dt) {
          const { W, H } = env
          env.time += dt

          const { glCanvas, gl, quadBuffer, sharedTexture, noiseTexture } = getWebGL()
          if (!gl) {
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            return 'Paper Texture (WebGL fallback)'
          }

          const progInfo = getOrCreateProgram('paperTexture', paperTextureFS)
          if (!progInfo) return 'Paper Texture error'

          glCanvas.width = W
          glCanvas.height = H
          gl.viewport(0, 0, W, H)

          gl.useProgram(progInfo.prog)

          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer)
          gl.enableVertexAttribArray(progInfo.positionLocation)
          gl.vertexAttribPointer(progInfo.positionLocation, 2, gl.FLOAT, false, 0, 0)

          // Bind media source canvas to texture unit 0
          gl.activeTexture(gl.TEXTURE0)
          gl.bindTexture(gl.TEXTURE_2D, sharedTexture)
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, env.sourceCanvas)

          // Bind noise texture to texture unit 1
          gl.activeTexture(gl.TEXTURE1)
          gl.bindTexture(gl.TEXTURE_2D, noiseTexture)

          // Set Uniforms matching official Paper Design shader
          gl.uniform1i(gl.getUniformLocation(progInfo.prog, 'u_image'), 0)
          gl.uniform1i(gl.getUniformLocation(progInfo.prog, 'u_noiseTexture'), 1)
          gl.uniform1i(gl.getUniformLocation(progInfo.prog, 'u_isImage'), 1)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_imageAspectRatio'), (W || 1) / (H || 1))

          const cPaper = hexToRgb(v.colorPaper || '#c4a67e')
          const cShadow = hexToRgb(v.colorShadow || '#543c22')
          const cBack = hexToRgb(v.colorBack || '#2a1a0c')

          gl.uniform4f(gl.getUniformLocation(progInfo.prog, 'u_colorPaper'), cPaper[0], cPaper[1], cPaper[2], 1.0)
          gl.uniform4f(gl.getUniformLocation(progInfo.prog, 'u_colorShadow'), cShadow[0], cShadow[1], cShadow[2], 1.0)
          gl.uniform4f(gl.getUniformLocation(progInfo.prog, 'u_colorBack'), cBack[0], cBack[1], cBack[2], 1.0)

          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_blending'), v.blending)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_distortion'), v.distortion)
          gl.uniform1i(gl.getUniformLocation(progInfo.prog, 'u_clip'), 0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_angle'), v.angle)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_seed'), v.seed)

          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_roughness'), v.roughness)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_roughnessSize'), 0.5)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_roughnessRows'), 0.0)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_fiber'), v.fiber)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_fiberSize'), v.fiberSize)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_folds'), v.folds)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_foldSizeX'), 0.5)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_foldSizeY'), 0.5)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_foldOffsetX'), 0.5)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_foldOffsetY'), 0.5)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_wrinkles'), v.wrinkles)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_wrinkleSize'), v.wrinkleSize)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_crumples'), v.crumples)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_crumpleCount'), v.crumpleCount)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_drops'), v.drops)

          // Custom Creases
          const allCreases = [...this.creases]
          if (this.isDragging && env.cursorEnabled) {
            allCreases.push({
              x1: this.dragStart.x,
              y1: this.dragStart.y,
              x2: this.dragCurrent.x,
              y2: this.dragCurrent.y,
            })
          }

          const creaseFlat = new Float32Array(16 * 4)
          const creaseCount = Math.min(16, allCreases.length)
          for (let i = 0; i < creaseCount; i++) {
            const c = allCreases[i]
            creaseFlat[i * 4 + 0] = c.x1
            creaseFlat[i * 4 + 1] = c.y1
            creaseFlat[i * 4 + 2] = c.x2
            creaseFlat[i * 4 + 3] = c.y2
          }

          gl.uniform4fv(gl.getUniformLocation(progInfo.prog, 'u_creases'), creaseFlat)
          gl.uniform1i(gl.getUniformLocation(progInfo.prog, 'u_creaseCount'), creaseCount)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_creaseDepth'), v.creaseDepth)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_creaseWidth'), v.creaseWidth)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_creaseHighlight'), v.creaseHighlight)
          gl.uniform1f(gl.getUniformLocation(progInfo.prog, 'u_creaseBuckle'), v.creaseBuckle)

          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
          ctx.drawImage(glCanvas, 0, 0)

          // Draw active drag guide line
          if (this.isDragging && env.cursorEnabled) {
            ctx.save()
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'
            ctx.lineWidth = 1.5
            ctx.setLineDash([4, 4])
            ctx.beginPath()
            ctx.moveTo(this.dragStart.x * W, this.dragStart.y * H)
            ctx.lineTo(this.dragCurrent.x * W, this.dragCurrent.y * H)
            ctx.stroke()
            
            ctx.fillStyle = '#00ff88'
            ctx.setLineDash([])
            ctx.beginPath()
            ctx.arc(this.dragStart.x * W, this.dragStart.y * H, 4, 0, Math.PI * 2)
            ctx.arc(this.dragCurrent.x * W, this.dragCurrent.y * H, 4, 0, Math.PI * 2)
            ctx.fill()
            ctx.restore()
          }

          return `Paper Texture · ${v.preset} · ${creaseCount} creases · Crumples ${v.crumples}`
        },
      }

      const effects = [
        quadtreeBokeh,
        blobTracker,
        pixelTrail,
        fingerSketch,
        pixelBeams,
        heatmap,
        liquidMetal,
        gemSmoke,
        halftoneCMYK,
        halftoneDots,
        lensDistortion,
        dithering,
        paperTexture,
      ]
      const values = {}

      effects.forEach((effect) => {
        values[effect.id] = {}
        const grps = effect.getGroups ? effect.getGroups({}) : (effect.groups || [])
        grps.forEach((g) =>
          g.controls.forEach((c) => {
            values[effect.id][c.key] = c.value !== undefined ? c.value : null
          }),
        )
      })

      let activeEffect = effects[0]
      const collapsedGroups = {}

      const menuEl = document.getElementById('menu')
      const panelEl = document.getElementById('panel')
      const stageClearBtn = document.getElementById('stageClearBtn')
      const stopWebcamBtn = document.getElementById('stopWebcamBtn')
      const webcamBtn = document.getElementById('webcamBtn')
      const fullscreenBtn = document.getElementById('fullscreenBtn')
      const themeBtn = document.getElementById('themeBtn')

      function updateStageTools() {
        if (stageClearBtn) {
          stageClearBtn.style.display =
            activeEffect.id === 'finger-sketch' ? 'inline-flex' : 'none'
        }
        if (effectPill) {
          effectPill.textContent = activeEffect.label.toUpperCase()
        }
      }

      function renderMenu() {
        menuEl.innerHTML = ''
        effects.forEach((effect) => {
          const btn = document.createElement('button')
          const isActive = effect === activeEffect
          btn.className = 'drawer-item' + (isActive ? ' active' : '')
          btn.innerHTML = `<span>${effect.label.toUpperCase()}</span><span class="item-state">${isActive ? '[*]' : '[ ]'}</span>`
          btn.addEventListener('click', () => {
            activeEffect = effect
            renderMenu()
            renderPanel()
          })
          menuEl.appendChild(btn)
        })
        updateStageTools()
      }

      function updateDrawerSources(activeSourceKey) {
        document.querySelectorAll('#drawerSources .drawer-item').forEach((btn) => {
          const src = btn.getAttribute('data-source')
          const isMatch = src === activeSourceKey
          btn.classList.toggle('active', isMatch)
          const stateSpan = btn.querySelector('.item-state')
          if (stateSpan) {
            stateSpan.textContent = isMatch ? '[•]' : '[ ]'
          }
        })
      }

      function renderPanel() {
        panelEl.innerHTML = ''
        const v = values[activeEffect.id]
        const groups = activeEffect.getGroups ? activeEffect.getGroups(v) : activeEffect.groups

        groups.forEach((group, groupIdx) => {
          const groupKey = `${activeEffect.id}-${groupIdx}`
          const isCollapsed = !!collapsedGroups[groupKey]

          const groupEl = document.createElement('section')
          groupEl.className = 'ascii-group' + (isCollapsed ? ' collapsed' : '')

          const header = document.createElement('button')
          header.className = 'ascii-group-header'
          header.innerHTML = `<span class="group-title">------ ${group.title.toUpperCase()} ------</span><span class="group-toggle">${isCollapsed ? '[+]' : '[-]'}</span>`
          header.addEventListener('click', () => {
            collapsedGroups[groupKey] = !collapsedGroups[groupKey]
            renderPanel()
          })
          groupEl.appendChild(header)

          const body = document.createElement('div')
          body.className = 'ascii-group-body'

          group.controls.forEach((c) => {
            const wrap = document.createElement('div')
            wrap.className = 'ctl-row'
            const id = `ctl-${activeEffect.id}-${c.key}`

            if (c.type === 'range') {
              wrap.innerHTML = `<div class="ctl-header">
                <label class="ctl-label" for="${id}">${c.label.toUpperCase()}</label>
                <output class="ctl-val" id="${id}-out"></output>
              </div>
              <input id="${id}" type="range" class="mono-range" min="${c.min}" max="${c.max}" step="${c.step}">`
              const input = wrap.querySelector('input')
              const out = wrap.querySelector('output')
              input.value = v[c.key]
              const update = (fromUser) => {
                v[c.key] = Number(input.value)
                out.textContent = v[c.key] + (c.unit || '')
                if (fromUser && typeof c.onChange === 'function') {
                  c.onChange(v[c.key])
                }
              }
              input.addEventListener('input', () => update(true))
              update(false)
            } else if (c.type === 'select') {
              wrap.innerHTML = `<div class="ctl-header"><label class="ctl-label" for="${id}">${c.label.toUpperCase()}</label></div>
                <select id="${id}" class="mono-select">${c.options.map((o) => `<option value="${o}">${String(o).toUpperCase()}</option>`).join('')}</select>`
              const select = wrap.querySelector('select')
              select.value = v[c.key]
              const numeric = typeof c.options[0] === 'number'
              select.addEventListener('change', () => {
                v[c.key] = numeric ? Number(select.value) : select.value
                if (typeof c.onChange === 'function') {
                  c.onChange(v[c.key])
                }
              })
            } else if (c.type === 'checkbox') {
              const checked = !!v[c.key]
              wrap.innerHTML = `<button type="button" id="${id}" class="mono-toggle ${checked ? 'active' : ''}">
                <span class="ctl-label">${c.label.toUpperCase()}</span>
                <span class="toggle-state">${checked ? '[X]' : '[ ]'}</span>
              </button>`
              const toggleBtn = wrap.querySelector('button')
              toggleBtn.addEventListener('click', () => {
                v[c.key] = !v[c.key]
                toggleBtn.classList.toggle('active', v[c.key])
                toggleBtn.querySelector('.toggle-state').textContent = v[c.key] ? '[X]' : '[ ]'
              })
            } else if (c.type === 'color') {
              wrap.className = 'ctl-row'
              const curVal = v[c.key] || c.value || '#000000'
              v[c.key] = curVal
              wrap.innerHTML = `<div class="mono-color-row">
                <label class="ctl-label" for="${id}">${c.label}</label>
                <div class="color-preview-wrap">
                  <div class="color-swatch" id="${id}-swatch" style="background: ${curVal}"></div>
                  <span class="color-hex-text" id="${id}-hex">${curVal}</span>
                  <input id="${id}" type="color" class="mono-color-input" value="${curVal}">
                </div>
              </div>`
              const input = wrap.querySelector('input')
              const swatch = wrap.querySelector('.color-swatch')
              const hexText = wrap.querySelector('.color-hex-text')
              swatch.addEventListener('click', () => input.click())
              hexText.addEventListener('click', () => input.click())
              input.addEventListener('input', () => {
                v[c.key] = input.value
                swatch.style.background = input.value
                hexText.textContent = input.value
              })
            } else if (c.type === 'text') {
              wrap.innerHTML = `<div class="ctl-header"><label class="ctl-label" for="${id}">${c.label.toUpperCase()}</label></div>
                <input id="${id}" type="text" class="mono-text-input">`
              const input = wrap.querySelector('input')
              input.value = (v[c.key] !== undefined && v[c.key] !== null && v[c.key] !== '') ? v[c.key] : (c.value || '')
              v[c.key] = input.value
              input.addEventListener('input', () => {
                v[c.key] = input.value
              })
            } else if (c.type === 'button') {
              wrap.innerHTML = `<button type="button" id="${id}" class="mono-btn">${c.label.toUpperCase()}</button>`
              const btn = wrap.querySelector('button')
              btn.addEventListener('click', () => {
                if (c.onClick) c.onClick()
              })
            }
            body.appendChild(wrap)
          })

          groupEl.appendChild(body)
          panelEl.appendChild(groupEl)
        })
      }

      // ======================================================================
      // Media Sources: Image, Video, Webcam & Animated Motion Demo
      // ======================================================================
      function setCanvasDimensions(sw, sh) {
        const scale = Math.min(960 / sw, 640 / sh, 1.5)
        env.W = Math.max(ROOT, Math.floor((sw * scale) / ROOT) * ROOT)
        env.H = Math.max(ROOT, Math.floor((sh * scale) / ROOT) * ROOT)
        canvas.width = env.W
        canvas.height = env.H
        env.sourceCanvas.width = env.W
        env.sourceCanvas.height = env.H
        env.cursor.x = env.cursor.targetX = env.W / 2
        env.cursor.y = env.cursor.targetY = env.H / 2
        if (resPill) {
          resPill.textContent = `${env.W}×${env.H}`
        }
      }

      function updateWebcamUI(active) {
        env.isWebcam = active
        if (stopWebcamBtn) {
          stopWebcamBtn.disabled = !active
          stopWebcamBtn.classList.toggle('disabled', !active)
          stopWebcamBtn.classList.toggle('danger-active', active)
          stopWebcamBtn.setAttribute('data-tooltip', active ? 'Stop Live Webcam' : 'Webcam Inactive')
        }
        if (webcamBtn) {
          webcamBtn.classList.toggle('active', active)
        }
      }

      function stopActiveMedia() {
        if (env.sourceVideo) {
          env.sourceVideo.pause()
          if (env.sourceVideo.srcObject) {
            env.sourceVideo.srcObject.getTracks().forEach((t) => t.stop())
          }
          env.sourceVideo = null
        }
        updateWebcamUI(false)
      }

      function stopWebcam() {
        stopActiveMedia()
        initMotionDemo()
      }

      function loadImageSource(img, label = 'IMAGE') {
        stopActiveMedia()
        env.sourceType = 'image'
        sourceBadge.textContent = label
        setCanvasDimensions(
          img.naturalWidth || img.width,
          img.naturalHeight || img.height,
        )
        env.sourceCtx.drawImage(img, 0, 0, env.W, env.H)
        buildTables(env.sourceCtx.getImageData(0, 0, env.W, env.H))
      }

      function loadVideoElement(video, label = 'VIDEO') {
        stopActiveMedia()
        env.sourceVideo = video
        env.sourceType = 'video'
        sourceBadge.textContent = label

        const onReady = () => {
          setCanvasDimensions(video.videoWidth || 960, video.videoHeight || 640)
        }
        if (video.readyState >= 2) onReady()
        else video.addEventListener('loadedmetadata', onReady, { once: true })
      }

      function loadMediaFile(file) {
        if (!file) return
        if (file.type.startsWith('video/')) {
          const video = document.createElement('video')
          video.src = URL.createObjectURL(file)
          video.loop = true
          video.muted = true
          video.playsInline = true
          video.play().catch(() => {})
          loadVideoElement(video, 'VIDEO FILE')
          updateDrawerSources('')
        } else if (file.type.startsWith('image/')) {
          const url = URL.createObjectURL(file)
          const img = new Image()
          img.onload = () => {
            loadImageSource(img, 'IMAGE FILE')
            URL.revokeObjectURL(url)
            updateDrawerSources('')
          }
          img.src = url
        }
      }

      async function loadWebcam() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 960 }, height: { ideal: 640 } },
          })
          const video = document.createElement('video')
          video.srcObject = stream
          video.muted = true
          video.playsInline = true
          video.play()
          loadVideoElement(video, 'LIVE WEBCAM')
          updateWebcamUI(true)
          updateDrawerSources('')
        } catch (err) {
          alert('Could not access webcam: ' + err.message)
          updateWebcamUI(false)
        }
      }

      // Procedural Animated Motion Demo (Simulates high-action video footage)
      function initMotionDemo() {
        stopActiveMedia()
        env.sourceType = 'demo'
        sourceBadge.textContent = 'MOTION-DEMO'
        updateDrawerSources('motion-demo')
        setCanvasDimensions(960, 640)

        env.demoState = {
          entities: [
            {
              x: 180,
              y: 300,
              vx: 2.2,
              vy: 1.6,
              r: 42,
              color: '#00ff88',
              shape: 'orb',
            },
            {
              x: 500,
              y: 220,
              vx: -1.8,
              vy: 2.1,
              r: 55,
              color: '#ec4899',
              shape: 'box',
            },
            {
              x: 740,
              y: 400,
              vx: -2.4,
              vy: -1.5,
              r: 36,
              color: '#38bdf8',
              shape: 'orb',
            },
            {
              x: 380,
              y: 450,
              vx: 1.5,
              vy: -2.3,
              r: 48,
              color: '#fbbf24',
              shape: 'poly',
            },
          ],
          particles: [],
        }
      }

      function updateAndDrawMotionDemo(dt) {
        const s = env.demoState
        const c = env.sourceCtx
        const { W, H } = env

        c.fillStyle = '#06070c'
        c.fillRect(0, 0, W, H)

        c.strokeStyle = 'rgba(255, 255, 255, 0.04)'
        c.lineWidth = 1
        const gridSize = 40
        const offset = (env.time * 20) % gridSize
        c.beginPath()
        for (let x = offset; x < W; x += gridSize) {
          c.moveTo(x, 0)
          c.lineTo(x, H)
        }
        for (let y = offset; y < H; y += gridSize) {
          c.moveTo(0, y)
          c.lineTo(W, y)
        }
        c.stroke()

        s.entities.forEach((e) => {
          e.x += e.vx
          e.y += e.vy
          if (e.x - e.r < 0 || e.x + e.r > W) e.vx *= -1
          if (e.y - e.r < 0 || e.y + e.r > H) e.vy *= -1

          const grad = c.createRadialGradient(
            e.x,
            e.y,
            e.r * 0.2,
            e.x,
            e.y,
            e.r * 1.8,
          )
          grad.addColorStop(0, e.color)
          grad.addColorStop(1, 'transparent')
          c.fillStyle = grad
          c.beginPath()
          c.arc(e.x, e.y, e.r * 1.8, 0, TAU)
          c.fill()

          c.fillStyle = '#ffffff'
          c.strokeStyle = e.color
          c.lineWidth = 3
          if (e.shape === 'orb') {
            c.beginPath()
            c.arc(e.x, e.y, e.r * 0.6, 0, TAU)
            c.fill()
            c.stroke()
          } else if (e.shape === 'box') {
            const sz = e.r * 1.1
            c.fillRect(e.x - sz / 2, e.y - sz / 2, sz, sz)
            c.strokeRect(e.x - sz / 2, e.y - sz / 2, sz, sz)
          } else {
            c.save()
            c.translate(e.x, e.y)
            c.rotate(env.time * 1.5)
            c.beginPath()
            const sides = 5
            for (let i = 0; i < sides; i++) {
              const a = (i * TAU) / sides
              const px = Math.cos(a) * e.r * 0.7
              const py = Math.sin(a) * e.r * 0.7
              if (i === 0) c.moveTo(px, py)
              else c.lineTo(px, py)
            }
            c.closePath()
            c.fill()
            c.stroke()
            c.restore()
          }
        })

        const cur = env.cursor
        if (env.cursorEnabled && performance.now() - cur.lastMoveAt < 4000) {
          const aura = c.createRadialGradient(
            cur.targetX,
            cur.targetY,
            5,
            cur.targetX,
            cur.targetY,
            75,
          )
          aura.addColorStop(0, 'rgba(255, 255, 255, 0.9)')
          aura.addColorStop(0.3, 'rgba(124, 131, 255, 0.55)')
          aura.addColorStop(1, 'transparent')
          c.fillStyle = aura
          c.beginPath()
          c.arc(cur.targetX, cur.targetY, 75, 0, TAU)
          c.fill()
        }

        buildTables(c.getImageData(0, 0, W, H))
      }

      function makePreset(name) {
        updateDrawerSources(name)
        const c = document.createElement('canvas')
        c.width = 960
        c.height = 640
        const p = c.getContext('2d')
        const w = 960,
          h = 640

        if (name === 'sunset') {
          const sky = p.createLinearGradient(0, 0, 0, h)
          sky.addColorStop(0, '#100c2a')
          sky.addColorStop(0.35, '#5c1d58')
          sky.addColorStop(0.65, '#db4d3f')
          sky.addColorStop(0.85, '#fca242')
          sky.addColorStop(1, '#fedd74')
          p.fillStyle = sky
          p.fillRect(0, 0, w, h)
          const sun = p.createRadialGradient(
            w * 0.52,
            h * 0.62,
            10,
            w * 0.52,
            h * 0.62,
            140,
          )
          sun.addColorStop(0, '#fffbe6')
          sun.addColorStop(0.4, '#ffd159')
          sun.addColorStop(1, 'transparent')
          p.fillStyle = sun
          p.beginPath()
          p.arc(w * 0.52, h * 0.62, 140, 0, TAU)
          p.fill()
          const ridges = [
            ['#7a1f4b', 0.55, 25],
            ['#4a2a5c', 0.66, 40],
            ['#2c1a45', 0.76, 55],
            ['#150f2a', 0.88, 35],
          ]
          ridges.forEach(([col, base, amp], k) => {
            p.fillStyle = col
            p.beginPath()
            p.moveTo(0, h)
            for (let x = 0; x <= w; x += 8) {
              p.lineTo(
                x,
                h * base +
                  Math.sin(x * 0.012 + k * 2) * amp +
                  Math.sin(x * 0.037 + k) * amp * 0.4,
              )
            }
            p.lineTo(w, h)
            p.closePath()
            p.fill()
          })
          p.fillStyle = '#0b0818'
          for (let i = 0; i < 9; i++) {
            const x = 80 + i * 105,
              th = 60 + ((i * 37) % 50)
            p.beginPath()
            p.moveTo(x, h)
            p.lineTo(x + 18, h - th)
            p.lineTo(x + 36, h)
            p.fill()
          }
        }
        loadImageSource(c, `${name.toUpperCase()} PRESET`)
      }

      // ======================================================================
      // Wiring & Events
      // ======================================================================

      // Drawer Sources Clicks
      document.querySelectorAll('#drawerSources .drawer-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          const src = btn.getAttribute('data-source')
          if (src === 'motion-demo') {
            initMotionDemo()
          } else {
            makePreset(src)
          }
        })
      })

      // Image Dropdown Menu Trigger
      const imageDropdownWrap = document.getElementById('imageDropdownWrap')
      const imageBtn = document.getElementById('imageBtn')
      imageBtn.addEventListener('click', (e) => {
        e.stopPropagation()
        imageDropdownWrap.classList.toggle('open')
      })
      document.addEventListener('click', (e) => {
        if (!imageDropdownWrap.contains(e.target)) {
          imageDropdownWrap.classList.remove('open')
        }
      })
      document.querySelectorAll('#imageMenu .dropdown-item').forEach((item) => {
        item.addEventListener('click', () => {
          imageDropdownWrap.classList.remove('open')
          const act = item.getAttribute('data-action')
          const preset = item.getAttribute('data-preset')
          if (act === 'open-file') {
            document.getElementById('file').click()
          } else if (preset) {
            makePreset(preset)
          }
        })
      })

      // Video Button
      document.getElementById('videoBtn').addEventListener('click', () => {
        initMotionDemo()
      })

      // File upload drop card & input
      const fileInput = document.getElementById('file')
      const dropCard = document.getElementById('dropCard')
      dropCard.addEventListener('click', () => fileInput.click())
      fileInput.addEventListener('change', (e) => loadMediaFile(e.target.files[0]))

      // Webcam & Stop Webcam
      webcamBtn.addEventListener('click', loadWebcam)
      stopWebcamBtn.addEventListener('click', stopWebcam)

      // Save Frame Action
      function saveCurrentFrame() {
        const a = document.createElement('a')
        a.download = `${activeEffect.id}-${Date.now()}.png`
        a.href = canvas.toDataURL('image/png')
        a.click()
      }
      document.getElementById('saveBtn').addEventListener('click', saveCurrentFrame)
      document.getElementById('exportBtn').addEventListener('click', saveCurrentFrame)

      // Fullscreen Action
      const fsIcon = document.getElementById('fsIcon')
      const MAXIMIZE_SVG = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>'
      const MINIMIZE_SVG = '<path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/>'

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {})
        } else {
          document.exitFullscreen().catch(() => {})
        }
      }
      fullscreenBtn.addEventListener('click', toggleFullscreen)
      document.addEventListener('fullscreenchange', () => {
        const isFs = !!document.fullscreenElement
        fullscreenBtn.setAttribute('data-tooltip', isFs ? 'Exit Fullscreen (F)' : 'Fullscreen (F)')
        fsIcon.innerHTML = isFs ? MINIMIZE_SVG : MAXIMIZE_SVG
      })

      // Cursor Action Toggle
      const cursorToggleBtn = document.getElementById('cursorToggleBtn')
      const cursorIcon = document.getElementById('cursorIcon')
      const MOUSE_ON_SVG = '<path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="m13 13 6 6"/>'
      const MOUSE_OFF_SVG = '<path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><line x1="2" y1="2" x2="22" y2="22"/>'

      function toggleCursor(forceState) {
        env.cursorEnabled = forceState !== undefined ? forceState : !env.cursorEnabled
        if (env.cursorEnabled) {
          cursorToggleBtn.classList.add('active')
          cursorToggleBtn.setAttribute('data-tooltip', 'Cursor Action: ON (Press M)')
          cursorIcon.innerHTML = MOUSE_ON_SVG
          stage.style.cursor = 'crosshair'
        } else {
          cursorToggleBtn.classList.remove('active')
          cursorToggleBtn.setAttribute('data-tooltip', 'Cursor Action: OFF (Press M)')
          cursorIcon.innerHTML = MOUSE_OFF_SVG
          stage.style.cursor = 'default'
          env.cursor.isDown = false
        }
      }
      cursorToggleBtn.addEventListener('click', () => toggleCursor())

      // Stage Clear Button for Finger Sketch
      if (stageClearBtn) {
        stageClearBtn.addEventListener('click', () => {
          if (typeof fingerSketch.clear === 'function') {
            fingerSketch.clear()
          }
        })
      }

      // Theme Toggle (Light / Dark Mode)
      const themeIcon = document.getElementById('themeIcon')
      const SUN_SVG = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'
      const MOON_SVG = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          themeIcon.innerHTML = SUN_SVG
          themeBtn.setAttribute('data-tooltip', 'Switch to Light Theme')
        } else {
          document.documentElement.removeAttribute('data-theme')
          themeIcon.innerHTML = MOON_SVG
          themeBtn.setAttribute('data-tooltip', 'Switch to Dark Theme')
        }
        localStorage.setItem('fffx-theme', theme)
      }
      const savedTheme = localStorage.getItem('fffx-theme') || 'light'
      applyTheme(savedTheme)

      themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark'
        applyTheme(isDark ? 'light' : 'dark')
      })

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
          e.preventDefault()
          saveCurrentFrame()
        } else if ((e.ctrlKey || e.metaKey) && (e.key === 'o' || e.key === 'O')) {
          e.preventDefault()
          fileInput.click()
        } else if (e.key === 'm' || e.key === 'M') {
          e.preventDefault()
          toggleCursor()
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault()
          toggleFullscreen()
        } else if (e.key === 'c' || e.key === 'C') {
          if (
            activeEffect.id === 'finger-sketch' &&
            typeof fingerSketch.clear === 'function'
          ) {
            fingerSketch.clear()
          }
        }
      })

      // Canvas Pointer Coordinate Helper
      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect()
        const x = (clientX - rect.left) * (env.W / rect.width)
        const y = (clientY - rect.top) * (env.H / rect.height)
        return {
          x: Math.max(0, Math.min(env.W, x)),
          y: Math.max(0, Math.min(env.H, y)),
        }
      }

      function setCursor(clientX, clientY) {
        const pt = getCanvasCoords(clientX, clientY)
        env.cursor.targetX = pt.x
        env.cursor.targetY = pt.y
        env.cursor.lastMoveAt = performance.now()
        return pt
      }

      canvas.addEventListener('mousedown', (e) => {
        if (!env.cursorEnabled) return
        env.cursor.isDown = true
        const pt = setCursor(e.clientX, e.clientY)
        env.cursor.x = pt.x
        env.cursor.y = pt.y
        if (activeEffect.onPointerDown) {
          activeEffect.onPointerDown(pt.x, pt.y, e)
        }
      })

      window.addEventListener('mouseup', (e) => {
        if (!env.cursorEnabled) return
        if (env.cursor.isDown) {
          env.cursor.isDown = false
          if (activeEffect.onPointerUp) {
            const pt = getCanvasCoords(e.clientX, e.clientY)
            activeEffect.onPointerUp(pt.x, pt.y, e)
          }
        }
      })

      canvas.addEventListener('mousemove', (e) => {
        if (!env.cursorEnabled) return
        const pt = setCursor(e.clientX, e.clientY)
        if (activeEffect.onPointerMove) {
          activeEffect.onPointerMove(pt.x, pt.y, env.cursor.isDown, e)
        }
      })

      canvas.addEventListener(
        'touchstart',
        (e) => {
          if (!env.cursorEnabled) return
          e.preventDefault()
          env.cursor.isDown = true
          const touch = e.touches[0]
          const pt = setCursor(touch.clientX, touch.clientY)
          env.cursor.x = pt.x
          env.cursor.y = pt.y
          if (activeEffect.onPointerDown) {
            activeEffect.onPointerDown(pt.x, pt.y, e)
          }
        },
        { passive: false },
      )

      canvas.addEventListener(
        'touchmove',
        (e) => {
          if (!env.cursorEnabled) return
          e.preventDefault()
          const touch = e.touches[0]
          const pt = setCursor(touch.clientX, touch.clientY)
          if (activeEffect.onPointerMove) {
            activeEffect.onPointerMove(pt.x, pt.y, env.cursor.isDown, e)
          }
        },
        { passive: false },
      )

      window.addEventListener('touchend', (e) => {
        if (!env.cursorEnabled) return
        if (env.cursor.isDown) {
          env.cursor.isDown = false
          if (activeEffect.onPointerUp) {
            activeEffect.onPointerUp(env.cursor.targetX, env.cursor.targetY, e)
          }
        }
      })

      // Drag & Drop onto Stage
      stage.addEventListener('dragover', (e) => {
        e.preventDefault()
        stage.classList.add('dragging')
      })
      stage.addEventListener('dragleave', () =>
        stage.classList.remove('dragging'),
      )
      stage.addEventListener('drop', (e) => {
        e.preventDefault()
        stage.classList.remove('dragging')
        loadMediaFile(e.dataTransfer.files[0])
      })

      // Drag & Drop onto Drop Card in Control Panel
      dropCard.addEventListener('dragover', (e) => {
        e.preventDefault()
        dropCard.style.borderColor = 'var(--accent)'
      })
      dropCard.addEventListener('dragleave', () => {
        dropCard.style.borderColor = ''
      })
      dropCard.addEventListener('drop', (e) => {
        e.preventDefault()
        dropCard.style.borderColor = ''
        loadMediaFile(e.dataTransfer.files[0])
      })

      // Main RAF loop
      let lastFrame = performance.now()
      let fpsCalcTimer = performance.now()
      let fpsFrames = 0
      let currentFps = 60

      function frame(now) {
        const dt = Math.min(0.1, (now - lastFrame) / 1000)
        lastFrame = now

        fpsFrames++
        if (now - fpsCalcTimer >= 500) {
          currentFps = Math.round((fpsFrames * 1000) / (now - fpsCalcTimer))
          fpsFrames = 0
          fpsCalcTimer = now
        }

        // 1. Advance dynamic media source
        if (env.sourceType === 'demo') {
          updateAndDrawMotionDemo(dt)
        } else if (
          env.sourceType === 'video' &&
          env.sourceVideo &&
          env.sourceVideo.readyState >= 2
        ) {
          env.sourceCtx.drawImage(env.sourceVideo, 0, 0, env.W, env.H)
          buildTables(env.sourceCtx.getImageData(0, 0, env.W, env.H))
        }

        // 2. Draw active effect
        if (env.W > 0 && env.H > 0) {
          const t0 = performance.now()
          const info = activeEffect.draw(values[activeEffect.id], dt)
          const dtMs = (performance.now() - t0).toFixed(1)
          if (statsEl) {
            statsEl.textContent = `${currentFps}fps · ${dtMs}ms`
          }
        }

        requestAnimationFrame(frame)
      }

      // Initialize Application
      renderMenu()
      renderPanel()
      initMotionDemo()
      requestAnimationFrame(frame)
    </script>
  </body>
</html>
