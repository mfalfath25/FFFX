        draw(v, dt) {
          const { W, H } = env
          env.time += dt

          const { glCanvas, gl, quadBuffer, sharedTexture } = getWebGL()
          if (!gl) {
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            return 'Depth Map (WebGL fallback)'
          }

          const progInfo = getOrCreateProgram('depthMap', depthMapFS)
          if (!progInfo) return 'Depth Map shader error'

          glCanvas.width = W
          glCanvas.height = H
          gl.viewport(0, 0, W, H)
          gl.useProgram(progInfo.prog)

          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer)
          gl.enableVertexAttribArray(progInfo.positionLocation)
          gl.vertexAttribPointer(progInfo.positionLocation, 2, gl.FLOAT, false, 0, 0)

          gl.activeTexture(gl.TEXTURE0)
          gl.bindTexture(gl.TEXTURE_2D, sharedTexture)
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, env.sourceCanvas)

          const loc = (n) => gl.getUniformLocation(progInfo.prog, n)
          gl.uniform1i(loc('u_image'), 0)
          gl.uniform2f(loc('u_resolution'), W, H)
          gl.uniform1f(loc('u_time'), env.time)

          const curX = env.cursorEnabled ? (env.cursor.targetX / (W || 1)) : -1000.0
          const curY = env.cursorEnabled ? (env.cursor.targetY / (H || 1)) : -1000.0
          gl.uniform2f(loc('u_cursor'), curX, curY)

          const styleIdx = [
            'LIDAR SCANNER (Turbo)',
            'INFRARED NIGHT VISION',
            'TOPOGRAPHIC CONTOURS',
            'DEPTH OF FIELD BOKEH',
            'ANAGLYPH 3D STEREO',
            'SURFACE NORMAL RELIEF',
            'CYBERPUNK HOLO-GRID',
            'PRISTINE LINEAR DEPTH',
          ].indexOf(v.style)
          gl.uniform1i(loc('u_style'), Math.max(0, styleIdx))

          const colorMapIdx = ['Turbo', 'Spectral', 'Magma', 'Viridis', 'Cyberpunk', 'Emerald', 'Monochrome'].indexOf(v.colorMap)
          gl.uniform1i(loc('u_colorMap'), Math.max(0, colorMapIdx))

          gl.uniform1f(loc('u_overlaySource'), Number(v.overlaySource || 0))
          gl.uniform1f(loc('u_invert'), v.invert ? 1.0 : 0.0)

          gl.uniform1f(loc('u_contrastBoost'), Number(v.contrastBoost || 1.4))
          gl.uniform1f(loc('u_perspectiveBias'), Number(v.perspectiveBias || 0.85))
          gl.uniform1f(loc('u_edgeSharpness'), Number(v.edgeSharpness || 1.2))
          gl.uniform1f(loc('u_horizonLevel'), Number(v.horizonLevel || 0.45))
          gl.uniform1f(loc('u_subjectBoost'), Number(v.subjectBoost || 0.7))

          gl.uniform1f(loc('u_isoContours'), Number(v.isoContours || 16))
          gl.uniform1f(loc('u_contourLineWidth'), Number(v.contourLineWidth || 1.5))
          gl.uniform1f(loc('u_focalDistance'), Number(v.focalDistance || 0.45))
          gl.uniform1f(loc('u_bokehAperture'), Number(v.bokehAperture || 12))
          gl.uniform1f(loc('u_parallax'), Number(v.parallax || 14))
          gl.uniform1f(loc('u_lightAngle'), Number(v.lightAngle || 315))
          gl.uniform1f(loc('u_laserScan'), Number(v.laserScan || 0.6))

          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
          ctx.drawImage(glCanvas, 0, 0)

          // 2D HUD & Diagnostics Overlays
          if (v.showDepthRuler) {
            this.drawDepthRuler(W, H, v)
          }
          if (v.showHUD) {
            this.drawHUD(W, H, v)
          }

          return `Depth Map · ${v.style} · Palette ${v.colorMap}`
        },

        drawDepthRuler(W, H, v) {
          const rx = W - 32
          const ry = 60
          const rw = 10
          const rh = H - 120
          if (rh <= 20) return

          ctx.save()
          // Background capsule
          ctx.fillStyle = 'rgba(10, 14, 20, 0.75)'
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)'
          ctx.lineWidth = 1
          ctx.fillRect(rx - 4, ry - 18, rw + 28, rh + 36)
          ctx.strokeRect(rx - 4, ry - 18, rw + 28, rh + 36)

          // Color gradient
          const grad = ctx.createLinearGradient(0, ry, 0, ry + rh)
          if (v.colorMap === 'Spectral') {
            grad.addColorStop(0, '#0d1a99')
            grad.addColorStop(0.33, '#00b3e6')
            grad.addColorStop(0.66, '#1ad94d')
            grad.addColorStop(1, '#f2261a')
          } else if (v.colorMap === 'Magma') {
            grad.addColorStop(0, '#00000d')
            grad.addColorStop(0.35, '#7a1c7a')
            grad.addColorStop(0.7, '#fa8c61')
            grad.addColorStop(1, '#fcfebe')
          } else if (v.colorMap === 'Viridis') {
            grad.addColorStop(0, '#440154')
            grad.addColorStop(0.35, '#31688e')
            grad.addColorStop(0.7, '#35b779')
            grad.addColorStop(1, '#fde725')
          } else if (v.colorMap === 'Cyberpunk') {
            grad.addColorStop(0, '#0a0529')
            grad.addColorStop(0.4, '#f20da6')
            grad.addColorStop(0.8, '#00e1ff')
            grad.addColorStop(1, '#ffffff')
          } else if (v.colorMap === 'Emerald') {
            grad.addColorStop(0, '#051a14')
            grad.addColorStop(1, '#26ffa6')
          } else if (v.colorMap === 'Monochrome') {
            grad.addColorStop(0, '#000000')
            grad.addColorStop(1, '#ffffff')
          } else {
            // Turbo default
            grad.addColorStop(0, '#30123b')
            grad.addColorStop(0.25, '#1ae4b6')
            grad.addColorStop(0.5, '#a2fc3c')
            grad.addColorStop(0.75, '#fb8022')
            grad.addColorStop(1, '#7a0403')
          }

          ctx.fillStyle = grad
          ctx.fillRect(rx, ry, rw, rh)

          // Labels
          ctx.font = '8px monospace'
          ctx.fillStyle = '#ffffff'
          ctx.textAlign = 'left'
          ctx.fillText('FAR', rx + rw + 4, ry + 6)
          ctx.fillText('12m', rx + rw + 4, ry + 16)
          ctx.fillText('MID', rx + rw + 4, ry + rh * 0.5 + 3)
          ctx.fillText('NEAR', rx + rw + 4, ry + rh - 4)
          ctx.fillText('0.3m', rx + rw + 4, ry + rh + 6)
          ctx.restore()
        },

        drawHUD(W, H, v) {
          ctx.save()
          // Corner Brackets
          const bsz = 14
          ctx.strokeStyle = '#00f0ff'
          ctx.lineWidth = 1.5

          // Top Left
          ctx.beginPath()
          ctx.moveTo(12, 12 + bsz); ctx.lineTo(12, 12); ctx.lineTo(12 + bsz, 12)
          ctx.stroke()
          // Top Right
          ctx.beginPath()
          ctx.moveTo(W - 12 - bsz, 12); ctx.lineTo(W - 12, 12); ctx.lineTo(W - 12, 12 + bsz)
          ctx.stroke()
          // Bottom Left
          ctx.beginPath()
          ctx.moveTo(12, H - 12 - bsz); ctx.lineTo(12, H - 12); ctx.lineTo(12 + bsz, H - 12)
          ctx.stroke()
          // Bottom Right
          ctx.beginPath()
          ctx.moveTo(W - 12 - bsz, H - 12); ctx.lineTo(W - 12, H - 12); ctx.lineTo(W - 12, H - 12 - bsz)
          ctx.stroke()

          // Telemetry Text
          ctx.fillStyle = 'rgba(10, 15, 24, 0.75)'
          ctx.fillRect(16, 16, 210, 36)
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)'
          ctx.strokeRect(16, 16, 210, 36)

          ctx.font = '9px monospace'
          ctx.fillStyle = '#00f0ff'
          ctx.fillText(`LIDAR ESTIMATOR // ${v.style.slice(0, 16)}`, 22, 29)
          ctx.fillStyle = '#a0c0d0'
          ctx.fillText(`RANGE: 0.3m-15.0m · FOV: 78° · 60FPS`, 22, 43)

          // Interactive Cursor Depth Probe
          if (env.cursorEnabled && env.cursor.x > 0 && env.cursor.y > 0) {
            const cx = env.cursor.x
            const cy = env.cursor.y
            const normY = cy / H
            const estDist = (0.3 + (1.0 - normY) * 9.5).toFixed(2)
            const zPct = Math.round((1.0 - normY) * 100)

            ctx.strokeStyle = '#ff0055'
            ctx.lineWidth = 1.2
            ctx.beginPath()
            ctx.arc(cx, cy, 14, 0, Math.PI * 2)
            ctx.stroke()

            ctx.beginPath()
            ctx.moveTo(cx - 20, cy); ctx.lineTo(cx - 16, cy)
            ctx.moveTo(cx + 16, cy); ctx.lineTo(cx + 20, cy)
            ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy - 16)
            ctx.moveTo(cx, cy + 16); ctx.lineTo(cx, cy + 20)
            ctx.stroke()

            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'
            ctx.fillRect(cx + 18, cy - 16, 105, 28)
            ctx.strokeStyle = '#ff0055'
            ctx.strokeRect(cx + 18, cy - 16, 105, 28)

            ctx.font = '9px monospace'
            ctx.fillStyle = '#ff0055'
            ctx.fillText(`DEPTH: ${estDist}m`, cx + 22, cy - 4)
            ctx.fillStyle = '#ffffff'
            ctx.fillText(`Z: [${zPct}%]`, cx + 22, cy + 8)
          }

          ctx.restore()
        },
      }

      // ======================================================================
      // 6. HEATMAP EFFECT (1-to-1 Official Paper Design Shaders)
      // Reference: https://shaders.paper.design/heatmap
      // https://github.com/paper-design/shaders
      // ======================================================================
      const heatmapFS = `#version 300 es
        precision highp float;

        in mediump vec2 v_imageUV;
        in mediump vec2 v_uv;
        out vec4 fragColor;

        uniform sampler2D u_image;
        uniform float u_time;
        uniform float u_speed;

        uniform vec4 u_colorBack;
        uniform vec4 u_colors[10];
        uniform float u_colorsCount;

        uniform float u_contour;
        uniform float u_angle;
        uniform float u_noise;
        uniform float u_innerGlow;
        uniform float u_outerGlow;
        uniform float u_scale;
        uniform float u_rotation;
        uniform float u_offsetX;
        uniform float u_offsetY;

        uniform int u_shapeType;
        uniform float u_shapeMorph;
        uniform float u_blobSize;
        uniform float u_seed;

        uniform vec2 u_cursor;
        uniform float u_cursorHeat;

        #define TWO_PI 6.28318530718
        #define PI 3.14159265358979323846

        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }

        float getImgFrame(vec2 uv, float th) {
          float frame = 1.;
          frame *= smoothstep(0., th, uv.y);
          frame *= 1. - smoothstep(1. - th, 1., uv.y);
          frame *= smoothstep(0., th, uv.x);
          frame *= 1. - smoothstep(1. - th, 1., uv.x);
          return frame;
        }

        float circle(vec2 uv, vec2 c, vec2 r) {
          return 1. - smoothstep(r[0], r[1], length(uv - c));
        }

        float lst(float edge0, float edge1, float x) {
          return clamp((x - edge0) / (edge1 - edge0), 0.0, 1.0);
        }

        float sst(float edge0, float edge1, float x) {
          return smoothstep(edge0, edge1, x);
        }

        // 0. Classic Paper Design Visor (Curved visor cutout wave)
        float shapeVisor(vec2 uv, float t, float contour) {
          vec2 scaledUV = uv;
          float posY = mix(-1., 2., t);

          scaledUV.y -= .5;
          float mainCircleScale = sst(0., .8, posY) * lst(1.4, .9, posY);
          scaledUV *= vec2(1., 1. + 1.5 * mainCircleScale);
          scaledUV.y += .5;

          float innerR = .4;
          float outerR = 1. - .3 * (sst(.1, .2, t) * (1. - sst(.2, .5, t)));
          float s = circle(scaledUV, vec2(.5, posY - .2), vec2(innerR, outerR));
          s = pow(s, 1.4) * 1.2;

          float topFlattener = 0.;
          {
            float pos = posY - uv.y;
            float edge = 1.2;
            topFlattener = lst(-.4, 0., pos) * (1. - sst(.0, edge, pos));
            topFlattener = pow(topFlattener, 3.);
            float topFlattenerMixer = (1. - sst(.0, .3, pos));
            s = mix(topFlattener, s, topFlattenerMixer);
          }

          float seedOff = u_seed * 0.173;
          {
            float visibility = sst(.6, .7, t) * (1. - sst(.8, .9, t));
            float angle = -2. - t * TWO_PI + seedOff;
            float rightCircle = circle(uv, vec2(.95 - .2 * cos(angle), .4 - .1 * sin(angle)), vec2(.15, .3));
            rightCircle *= visibility;
            s = mix(s, 0., rightCircle);
          }

          {
            float topCircle = circle(uv, vec2(.5, .19), vec2(.05, .25));
            topCircle += 2. * contour * circle(uv, vec2(.5, .19), vec2(.2, .5));
            float visibility = .55 * sst(.2, .3, t) * (1. - sst(.3, .45, t));
            topCircle *= visibility;
            s = mix(s, 0., topCircle);
          }

          float leafMask = circle(uv, vec2(.53, .13), vec2(.08, .19));
          leafMask = mix(leafMask, 0., 1. - sst(.4, .54, uv.x));
          leafMask = mix(0., leafMask, sst(.0, .2, uv.y));
          leafMask *= (sst(.5, 1.1, posY) * sst(1.5, 1.3, posY));
          s += leafMask;

          {
            float visibility = sst(.0, .4, t) * (1. - sst(.6, .8, t));
            s = mix(s, 0., visibility * circle(uv, vec2(.52, .92), vec2(.09, .25)));
          }

          {
            float pos = sst(.0, .6, t) * (1. - sst(.6, 1., t));
            s = mix(s, .5, circle(uv, vec2(.0, 1.2 - .5 * pos), vec2(.1, .3)));
            s = mix(s, .0, circle(uv, vec2(1., .5 + .5 * pos), vec2(.1, .3)));

            s = mix(s, 1., circle(uv, vec2(.95, .2 + .2 * sst(.3, .4, t) * sst(.7, .5, t)), vec2(.07, .22)));
            s = mix(s, 1., circle(uv, vec2(.95, .2 + .2 * sst(.3, .4, t) * (1. - sst(.5, .7, t))), vec2(.07, .22)));
            s /= max(1e-4, sst(1., .85, uv.y));
          }

          return clamp(s, 0.0, 1.0);
        }

        // 1. RECT GLOW (Rectangular scanning bar moving linearly from top to bottom)
        float shapeRectGlow(vec2 uv, float t, float contour) {
          float posY = mix(1.25, -0.25, t); // Top to bottom scan
          float dy = abs(uv.y - posY);
          float height = 0.22 * max(0.2, u_blobSize);

          float band = exp(-pow(dy / max(0.01, height * 0.65), 2.0));
          float core = 1.0 - smoothstep(0.0, height * 0.95, dy);
          float glow = band * 0.85 + core * 0.45;

          // Subtle horizontal soft frame
          float edgeX = smoothstep(0.0, 0.06, uv.x) * smoothstep(1.0, 0.94, uv.x);
          glow *= edgeX;

          // Seed variation
          float seedMod = sin(uv.x * 5.0 + u_seed * 0.8 + t * TWO_PI) * 0.035;
          float bandMod = exp(-pow((dy + seedMod) / max(0.01, height * 0.8), 2.0));
          glow = mix(glow, bandMod * 1.15, 0.4);

          return clamp(glow, 0.0, 1.0);
        }

        // 2. CENTER BLOBS (Thermal blob traveling top to bottom: Small -> Full Size in Middle -> Small)
        float shapeCenterBlobs(vec2 uv, float t, float contour) {
          // Progress from top to bottom
          float posY = mix(1.22, -0.22, t);
          float seedAngle = u_seed * 1.31415;
          float posX = 0.5 + 0.07 * sin(t * TWO_PI + seedAngle);
          vec2 blobCenter = vec2(posX, posY);

          // Pulse: 0 at top (t=0), 1.0 at center (t=0.5), 0 at bottom (t=1.0)
          float progress = clamp(t, 0.0, 1.0);
          float scaleCurve = sin(progress * PI);
          scaleCurve = pow(scaleCurve, 0.85);

          // Size bounds: small at top/bottom, full size in middle
          float minRadius = 0.12 * max(0.2, u_blobSize);
          float maxRadius = 0.62 * max(0.2, u_blobSize);
          float currentRadius = mix(minRadius, maxRadius, scaleCurve);

          float dist = length(uv - blobCenter);
          float innerR = currentRadius * 0.15;
          float outerR = currentRadius;
          float mainBlob = 1.0 - smoothstep(innerR, outerR, dist);
          mainBlob = pow(mainBlob, 1.2) * (0.65 + 0.65 * scaleCurve);

          // Orbiting satellite thermal droplets
          float orbAngle = t * TWO_PI * 1.5 + seedAngle;
          float orbDist = currentRadius * (0.55 + 0.2 * scaleCurve);
          vec2 orb1 = blobCenter + vec2(cos(orbAngle), sin(orbAngle)) * orbDist;
          vec2 orb2 = blobCenter + vec2(cos(orbAngle + 2.3), sin(orbAngle + 2.3)) * (orbDist * 0.8);

          float b1 = 1.0 - smoothstep(0.02 * u_blobSize, currentRadius * 0.45, length(uv - orb1));
          float b2 = 1.0 - smoothstep(0.02 * u_blobSize, currentRadius * 0.38, length(uv - orb2));

          float totalBlob = mainBlob + b1 * 0.45 * scaleCurve + b2 * 0.35 * scaleCurve;
          return clamp(totalBlob, 0.0, 1.0);
        }

        // 3. METABALL CLUSTER (Swirling metaball group traveling from top to bottom)
        float shapeMetaballs(vec2 uv, float t, float contour) {
          float posY = mix(1.25, -0.25, t);
          float progress = clamp(t, 0.0, 1.0);
          float scaleCurve = sin(progress * PI);
          scaleCurve = pow(scaleCurve, 0.85);

          vec2 c = vec2(0.5, posY);
          float field = 0.0;
          float seedOff = u_seed * 0.8123;

          for (int k = 0; k < 6; k++) {
            float fk = float(k);
            float kAngle = t * TWO_PI * (0.5 + 0.2 * sin(fk + seedOff)) + fk * 1.047 + seedOff;
            float kDist = (0.08 + 0.20 * sin(t * PI + fk * 0.7)) * u_blobSize * mix(0.3, 1.0, scaleCurve);
            vec2 kPos = c + vec2(cos(kAngle), sin(kAngle)) * kDist;
            float d = length(uv - kPos);
            float radius = (0.03 + 0.025 * sin(fk + t * TWO_PI)) * u_blobSize * mix(0.3, 1.0, scaleCurve);
            field += radius / max(0.001, d * d + 0.008);
          }

          float s = smoothstep(0.30, 1.25, field) * (0.5 + 0.85 * scaleCurve);
          return clamp(s, 0.0, 1.0);
        }

        // 4. Concentric Ripple Pulse
        float shapeRipple(vec2 uv, float t, float contour) {
          float r = length(uv - vec2(0.5));
          float seedOff = fract(u_seed * 0.137);
          float ringProgress = fract(t + seedOff);
          float pulse = sin(ringProgress * PI);

          float ringRadius = ringProgress * 0.65 * u_blobSize;
          float ringThickness = (0.08 + 0.06 * pulse) * u_blobSize;

          float ring = exp(-pow((r - ringRadius) / max(0.01, ringThickness), 2.0));
          ring *= pulse * 1.4;

          float core = circle(uv, vec2(0.5), vec2(0.02 * u_blobSize, 0.18 * u_blobSize * pulse));
          float s = ring + core * 0.6;
          return clamp(s, 0.0, 1.0);
        }

        float blurEdge3x3(sampler2D tex, vec2 uv, vec2 dudx, vec2 dudy, float radius, float centerSample) {
          vec2 texel = 1.0 / vec2(textureSize(tex, 0));
          vec2 r = radius * texel;

          float w1 = 1.0, w2 = 2.0, w4 = 4.0;
          float norm = 16.0;
          float sum = w4 * centerSample;

          sum += w2 * textureGrad(tex, uv + vec2(0.0, -r.y), dudx, dudy).g;
          sum += w2 * textureGrad(tex, uv + vec2(0.0, r.y), dudx, dudy).g;
          sum += w2 * textureGrad(tex, uv + vec2(-r.x, 0.0), dudx, dudy).g;
          sum += w2 * textureGrad(tex, uv + vec2(r.x, 0.0), dudx, dudy).g;

          sum += w1 * textureGrad(tex, uv + vec2(-r.x, -r.y), dudx, dudy).g;
          sum += w1 * textureGrad(tex, uv + vec2(r.x, -r.y), dudx, dudy).g;
          sum += w1 * textureGrad(tex, uv + vec2(-r.x, r.y), dudx, dudy).g;
          sum += w1 * textureGrad(tex, uv + vec2(r.x, r.y), dudx, dudy).g;

          return sum / norm;
        }

        void main() {
          vec2 centered = v_imageUV - vec2(0.5);
          
          float s = max(0.05, u_scale);
          centered /= s;

          float rotRad = radians(u_rotation);
          float cosR = cos(rotRad);
          float sinR = sin(rotRad);
          centered = vec2(centered.x * cosR - centered.y * sinR, centered.x * sinR + centered.y * cosR);

          centered -= vec2(u_offsetX, -u_offsetY);

          vec2 imgUV = centered + vec2(0.5);
          float imgSoftFrame = getImgFrame(imgUV, .03);

          vec4 img = texture(u_image, imgUV);
          vec2 dudx = dFdx(imgUV);
          vec2 dudy = dFdy(imgUV);

          if (imgUV.x < 0. || imgUV.x > 1. || imgUV.y < 0. || imgUV.y > 1.) {
            fragColor = vec4(u_colorBack.rgb, 1.0);
            return;
          }

          float t = .1 * u_time * u_speed;
          t -= .3;

          float tCopy = t + 1. / 3.;
          float tCopy2 = t + 2. / 3.;

          t = mod(t, 1.);
          tCopy = mod(tCopy, 1.);
          tCopy2 = mod(tCopy2, 1.);

          vec2 animationUV = imgUV - vec2(.5);
          float angle = -u_angle * PI / 180.;
          float cosA = cos(angle);
          float sinA = sin(angle);
          animationUV = vec2(
            animationUV.x * cosA - animationUV.y * sinA,
            animationUV.x * sinA + animationUV.y * cosA
          ) + vec2(.5);

          // Texture Channels:
          // img.r = presence (1.0 inside object, 0.0 in background)
          // img.g = gBlur (distance / volume blur field from 0.0 to 1.0)
          // img.b = contour (Sobel edge magnitude)
          float presence = img.r;
          float gBlur = blurEdge3x3(u_image, imgUV, dudx, dudy, 6., img.g);
          float contourVal = img.b;

          // Inside shape vs Outside shape fields
          float innerField = gBlur * presence;
          float outerField = gBlur * (1.0 - presence);

          float inner = 0.0;
          float outer = 0.0;

          if (u_shapeType == 0) {
            // Shape 0: Classic Paper Design Visor
            float shadow = shapeVisor(animationUV, t, innerField);
            float shadowCopy = shapeVisor(animationUV, tCopy, innerField);
            float shadowCopy2 = shapeVisor(animationUV, tCopy2, innerField);

            inner = (0.5 + 0.9 * innerField) * presence;
            inner = mix(inner, 0., shadow);
            inner = mix(inner, 0., shadowCopy);
            inner = mix(inner, 0., shadowCopy2);
            inner *= mix(0., 2.5, u_innerGlow);
            inner += (u_contour * 2.8) * contourVal * presence;

            if (u_outerGlow > 0.001) {
              float tOuter = mod(t * 3. - .1, 1.);
              float y = mod(animationUV.y - tOuter, 1.);
              float animatedMask = sst(.25, .65, y) * (1. - sst(.65, 1., y));
              animatedMask = .5 + animatedMask;

              outer = pow(outerField, 0.75) * animatedMask;
              outer *= mix(0., 3.5, u_outerGlow);
              outer *= imgSoftFrame;
            }
          } else {
            // Shapes 1-4: Glowing Scanning Waves & Traveling Blobs
            float wave = 0.0;
            if (u_shapeType == 1) {
              // RECT GLOW (Top-to-bottom rectangular scan)
              wave = shapeRectGlow(animationUV, t, contourVal);
              float wave2 = shapeRectGlow(animationUV, tCopy, contourVal) * 0.35;
              wave = max(wave, wave2);
            } else if (u_shapeType == 2) {
              // CENTER BLOBS (Top-to-bottom traveling blob: small -> big in middle -> small)
              wave = shapeCenterBlobs(animationUV, t, contourVal);
              float wave2 = shapeCenterBlobs(animationUV, tCopy, contourVal) * 0.25;
              wave = max(wave, wave2);
            } else if (u_shapeType == 3) {
              // METABALL CLUSTER
              wave = shapeMetaballs(animationUV, t, contourVal);
            } else if (u_shapeType == 4) {
              // RIPPLE PULSE
              wave = shapeRipple(animationUV, t, contourVal);
            }

            if (u_shapeMorph > 0.001) {
              float morphTarget = (u_shapeType == 1) ? shapeCenterBlobs(animationUV, t, contourVal) : shapeRectGlow(animationUV, t, contourVal);
              wave = mix(wave, morphTarget, u_shapeMorph);
            }

            // 1. INNER GLOW: Object interior thermal glow illuminated by passing wave
            float innerBase = (0.20 + 0.40 * innerField) * presence * u_innerGlow;
            float innerWave = (0.65 + 1.10 * innerField) * presence * wave * mix(1.0, 2.5, u_innerGlow);
            float innerContour = (u_contour * 2.8) * contourVal * presence * (0.35 + 0.65 * wave);
            inner = innerBase + innerWave + innerContour;
            inner = clamp(inner, 0.0, 1.0);

            // 2. OUTER GLOW: Halo radiating into ambient perimeter in sync with wave
            if (u_outerGlow > 0.001) {
              outer = pow(outerField, 0.75) * (0.35 + 0.85 * wave);
              outer *= mix(0.0, 3.5, u_outerGlow);
              outer *= imgSoftFrame;
            }
          }

          inner = pow(inner, 1.15);
          float heat = clamp(inner + outer, 0., 1.);

          // Interactive cursor beacon
          if (u_cursorHeat > 0.0 && u_cursor.x >= 0.0) {
            float distToCursor = length(imgUV - u_cursor);
            float curBeacon = exp(-distToCursor * 7.5) * u_cursorHeat * 0.85;
            heat = clamp(heat + curBeacon, 0., 1.);
          }

          // Grain noise modulated by seed
          heat += (.005 + .35 * u_noise) * (fract(sin(dot(v_imageUV + u_seed * 17.319, vec2(12.9898, 78.233))) * 43758.5453123) - .5);

          float mixer = clamp(heat, 0.0, 1.0) * max(1.0, u_colorsCount - 1.0);
          int baseIdx = int(floor(mixer));
          float frac = fract(mixer);

          vec4 gradient = u_colors[0];
          for (int i = 0; i < 9; i++) {
            if (i == baseIdx) {
              vec4 cA = u_colors[i];
              vec4 cB = u_colors[i + 1];
              gradient = mix(cA, cB, frac);

            }
          }

          vec3 color = gradient.rgb;
          float opacity = gradient.a;

          vec3 bgColor = u_colorBack.rgb;
          color = color + bgColor * (1.0 - opacity);

          color += .02 * (fract(sin(dot(v_imageUV + 1. + u_seed * 7.113, vec2(12.9898, 78.233))) * 43758.5453123) - .5);

          fragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
        }
      `

        draw(v, dt) {
          const { W, H } = env

          const { glCanvas, gl, quadBuffer } = getWebGL()
          if (!gl) {

          const pCtx = this.thermalCtx
          pCtx.drawImage(env.sourceCanvas, 0, 0, W, H)

          const srcImgData = pCtx.getImageData(0, 0, W, H)
          const srcData = srcImgData.data
          const totalPx = W * H

          const gray = new Uint8Array(totalPx)
          for (let i = 0; i < totalPx; i++) {
            const px = i * 4
            const lum = (srcData[px] * 77 + srcData[px + 1] * 150 + srcData[px + 2] * 29) >> 8
            gray[i] = 255 - lum
          }

          const dstImgData = pCtx.createImageData(W, H)
          const dst = dstImgData.data

          const stepX = Math.max(1, Math.floor(W / 120))
          const stepY = Math.max(1, Math.floor(H / 80))

            const yMax = Math.min(H - 1, y + stepY * 4) * W

          glCanvas.height = H

          gl.enableVertexAttribArray(progInfo.positionLocation)
          gl.vertexAttribPointer(progInfo.positionLocation, 2, gl.FLOAT, false, 0, 0)

      // ======================================================================
      // 7. LIQUID METAL EFFECT (Molten chrome fluid & specular chromatic reflection)
      // Reference: https://github.com/paper-design/shaders
      // ======================================================================
      const liquidMetalFS = `
        precision highp float;
        varying vec2 v_uv;
        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_speed;
        uniform float u_repetition;
        uniform float u_softness;
        uniform float u_distortion;
        uniform float u_contour;
        uniform float u_angle;
        uniform float u_chromaticShift;
        uniform float u_specularBoost;
        uniform vec2 u_cursor;
        uniform float u_cursorRipple;
        uniform int u_preset;
        uniform vec3 u_colorTint;
        uniform vec3 u_colorBack;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m; m = m*m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        float fbm(vec2 p) {
          float f = 0.0;
          f += 0.5000 * snoise(p); p = p * 2.02;
          f += 0.2500 * snoise(p); p = p * 2.03;
          f += 0.1250 * snoise(p);
          return f;
        }

        float getStripeBand(float p, float softness) {
          float fp = fract(p);
          float s = max(softness, 0.01);
          float b1 = smoothstep(0.0, s, fp) * (1.0 - smoothstep(0.4 - s, 0.4 + s, fp));
          float b2 = smoothstep(0.5 - s, 0.5 + s, fp) * (1.0 - smoothstep(0.85 - s, 0.85 + s, fp));
          float spec = pow(smoothstep(0.15 - s * 0.5, 0.15 + s * 0.5, fp) * (1.0 - smoothstep(0.25 - s * 0.5, 0.25 + s * 0.5, fp)), 2.0) * 1.5;
          return clamp(b1 * 0.7 + b2 * 0.95 + spec, 0.0, 1.5);
        }

        void main() {
          vec2 uv = v_uv;
          vec2 texel = 1.0 / u_resolution;
          vec4 img = texture2D(u_image, uv);
          float luma = dot(img.rgb, vec3(0.299, 0.587, 0.114));

          float lLeft  = dot(texture2D(u_image, uv - vec2(texel.x * 2.0, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lRight = dot(texture2D(u_image, uv + vec2(texel.x * 2.0, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lUp    = dot(texture2D(u_image, uv - vec2(0.0, texel.y * 2.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lDown  = dot(texture2D(u_image, uv + vec2(0.0, texel.y * 2.0)).rgb, vec3(0.299, 0.587, 0.114));
          vec2 norm = vec2(lRight - lLeft, lDown - lUp);
          float edge = length(norm) * 2.5;

          float rad = (-u_angle + 70.0) * 3.14159265 / 180.0;
          mat2 rot = mat2(cos(rad), -sin(rad), sin(rad), cos(rad));
          vec2 rotUV = rot * (uv - 0.5) + 0.5;

          float fluid = fbm(uv * 3.5 + vec2(u_time * 0.15 * u_speed, u_time * 0.08 * u_speed));

          float distToCursor = length((uv - u_cursor) * vec2(u_resolution.x / u_resolution.y, 1.0));
          float cursorWave = sin(distToCursor * 25.0 - u_time * 8.0) * exp(-distToCursor * 4.0) * u_cursorRipple * 0.15;

          float baseCoord = rotUV.y * u_repetition + 
                            fluid * u_distortion * 1.5 + 
                            edge * u_contour * 0.8 + 
                            cursorWave + 
                            luma * 0.4 - 
                            u_time * 0.35 * u_speed;

          float disp = u_chromaticShift * 0.05;
          float rVal = getStripeBand(baseCoord + disp, u_softness);
          float gVal = getStripeBand(baseCoord, u_softness);
          float bVal = getStripeBand(baseCoord - disp, u_softness);
          vec3 metal = vec3(rVal, gVal, bVal) * u_specularBoost;

          vec3 metalColor = metal;
          if (u_preset == 0) {
            metalColor = metal * vec3(0.92, 0.96, 1.05);
          } else if (u_preset == 1) {
            metalColor = vec3(metal.r * 1.15, metal.g * 0.92, metal.b * 0.35);
          } else if (u_preset == 2) {
            metalColor = vec3(metal.r * 1.1, metal.g * 0.65, metal.b * 0.55);
          } else if (u_preset == 3) {
            vec3 iridescent = vec3(
              sin(baseCoord * 3.0) * 0.5 + 0.5,
              sin(baseCoord * 3.0 + 2.0) * 0.5 + 0.5,
              sin(baseCoord * 3.0 + 4.0) * 0.5 + 0.5
            );
            metalColor = mix(metal, iridescent * 1.2, 0.55);
          } else if (u_preset == 4) {
            metalColor = vec3(metal.r * 0.3, metal.g * 0.95, metal.b * 1.15);
          } else {
            metalColor = pow(metal, vec3(1.6)) * vec3(0.65, 0.7, 0.8);
          }

      const SHAPE_COMMON_FS = `#version 300 es
        precision highp float;
        in mediump vec2 v_imageUV;
        in mediump vec2 v_uv;
        out vec4 fragColor;

        uniform sampler2D u_image;
        uniform vec2 u_res;
        uniform float u_time;
        uniform int u_shape;
        uniform float u_scale;
        uniform float u_rotation;
        uniform float u_centerX;
        uniform float u_centerY;
        uniform float u_edgeSoftness;
        uniform float u_backgroundDim;
        uniform float u_mediaReflect;

        #define PI 3.14159265359
        #define TAU 6.28318530718

        float g_ca = 1.0;
        float g_sa = 0.0;

        float hash21(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }
        float hash31(vec3 p3) {
          p3 = fract(p3 * 0.1031);
          p3 += dot(p3, p3.zyx + 31.32);
          return fract((p3.x + p3.y) * p3.z);
        }
        float vnoise(vec3 p) {
          vec3 i = floor(p);
          vec3 f = fract(p);
          f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
          float a = hash31(i);
          float b = hash31(i + vec3(1.0, 0.0, 0.0));
          float c = hash31(i + vec3(0.0, 1.0, 0.0));
          float d = hash31(i + vec3(1.0, 1.0, 0.0));
          float e = hash31(i + vec3(0.0, 0.0, 1.0));
          float g = hash31(i + vec3(1.0, 0.0, 1.0));
          float h = hash31(i + vec3(0.0, 1.0, 1.0));
          float k = hash31(i + vec3(1.0, 1.0, 1.0));
          return mix(mix(mix(a, b, f.x), mix(c, d, f.x), f.y),
                     mix(mix(e, g, f.x), mix(h, k, f.x), f.y), f.z);
        }
        float fbm4(vec3 p) {
          float a = 0.5;
          float s = 0.0;
          for (int i = 0; i < 4; i++) {
            s += a * vnoise(p);
            p = p * 2.03 + vec3(1.7, 9.2, 3.1);
            a *= 0.5;
          }
          return s / 0.9375;
        }
        float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

        // image surface normal via finite difference of luminance
        vec3 imageNormal(vec2 uv, float strength) {
          vec2 texel = 1.0 / u_res;
          float lL = lum(texture(u_image, uv - vec2(texel.x * 2.0, 0.0)).rgb);
          float lR = lum(texture(u_image, uv + vec2(texel.x * 2.0, 0.0)).rgb);
          float lU = lum(texture(u_image, uv - vec2(0.0, texel.y * 2.0)).rgb);
          float lD = lum(texture(u_image, uv + vec2(0.0, texel.y * 2.0)).rgb);
          vec2 grad = vec2(lR - lL, lD - lU);
          return normalize(vec3(-grad * strength, 1.0));
        }

        // ---------- analytic signed distance shapes (unit scale) ----------
        float dot2(vec2 v) { return dot(v, v); }
        float sdBox(vec2 p, vec2 b) {
          vec2 d = abs(p) - b;
          return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
        }
        float sdSeg(vec2 p, vec2 a, vec2 b) {
          vec2 pa = p - a;
          vec2 ba = b - a;
          float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
          return length(pa - ba * h);
        }
        float sdHex(vec2 p, float r) {
          const vec3 k = vec3(-0.866025404, 0.5, 0.577350269);
          p = abs(p);
          p -= 2.0 * min(dot(k.xy, p), 0.0) * k.xy;
          p -= vec2(clamp(p.x, -k.z * r, k.z * r), r);
          return length(p) * sign(p.y);
        }
        float sdStar5(vec2 p, float r, float rf) {
          const vec2 k1 = vec2(0.809016994375, -0.587785252292);
          const vec2 k2 = vec2(-0.809016994375, -0.587785252292);
          p.x = abs(p.x);
          p -= 2.0 * max(dot(k1, p), 0.0) * k1;
          p -= 2.0 * max(dot(k2, p), 0.0) * k2;
          p.x = abs(p.x);
          p.y -= r;
          vec2 ba = rf * vec2(-k1.y, k1.x) - vec2(0.0, 1.0);
          float h = clamp(dot(p, ba) / dot(ba, ba), 0.0, r);
          return length(p - ba * h) * sign(p.y * ba.x - p.x * ba.y);
        }
        float sdHeart(vec2 p) {
          p.x = abs(p.x);
          if (p.y + p.x > 1.0) return sqrt(dot2(p - vec2(0.25, 0.75))) - 0.35355339;
          return sqrt(min(dot2(p - vec2(0.0, 1.0)), dot2(p - 0.5 * max(p.x + p.y, 0.0)))) * sign(p.x - p.y);
        }
        float sdTri(vec2 p, float r) {
          const float k = 1.7320508;
          p.x = abs(p.x) - r;
          p.y = p.y + r / k;
          if (p.x + k * p.y > 0.0) p = vec2(p.x - k * p.y, -k * p.x - p.y) / 2.0;
          p.x -= clamp(p.x, -2.0 * r, 0.0);
          return -length(p) * sign(p.y);
        }
        float sdShape(vec2 p) {
          if (u_shape == 0) return -1.0;
          if (u_shape == 1) return length(p) - 1.0;
          if (u_shape == 2) return sdBox(p, vec2(0.88, 0.62) - 0.32) - 0.32;
          if (u_shape == 3) return (pow(pow(abs(p.x), 4.0) + pow(abs(p.y), 4.0), 0.25) - 1.0) * 0.95;
          if (u_shape == 4) return sdSeg(p, vec2(-0.55, 0.0), vec2(0.55, 0.0)) - 0.5;
          if (u_shape == 5) return abs(length(p) - 0.72) - 0.28;
          if (u_shape == 6) return sdHex(p, 0.88);
          if (u_shape == 7) return sdStar5(p, 1.0, 0.45);
          if (u_shape == 8) return sdHeart(p * 0.6 + vec2(0.0, 0.5)) / 0.6;
          if (u_shape == 9) return sdTri(p, 0.8);
          if (u_shape == 10) return min(sdBox(p, vec2(0.78, 0.2)), sdBox(p, vec2(0.2, 0.78))) - 0.12;
          float th = atan(p.y, p.x);
          float rb = 0.82 + 0.10 * sin(3.0 * th + u_time * 0.3) + 0.06 * sin(5.0 * th - u_time * 0.2) + 0.03 * sin(7.0 * th + u_time * 0.45);
          return (length(p) - rb) * 0.8;
        }

        // shape space -> screen space (rotation only)
        vec2 toScreen(vec2 v) {
          return vec2(g_ca * v.x + g_sa * v.y, -g_sa * v.x + g_ca * v.y);
        }
        // screen space -> shape space
        vec2 toShape(vec2 v) {
          return vec2(g_ca * v.x - g_sa * v.y, g_sa * v.x + g_ca * v.y);
        }

        // p: shape space, d: signed distance (<0 inside), gd: outward gradient (screen space), alpha: coverage
        void shapeSetup(out vec2 p, out float d, out vec2 gd, out float alpha) {
          float asp = u_res.x / u_res.y;
          if (u_shape == 0) {
            p = (v_uv - 0.5) * 2.0 * vec2(asp, 1.0);
            d = -1.0;
            gd = vec2(0.0);
            alpha = 1.0;
            g_ca = 1.0;
            g_sa = 0.0;
            return;
          }
          vec2 q = (v_uv - 0.5) * 2.0 * vec2(asp, 1.0);
          q -= vec2((u_centerX - 0.5) * 2.0 * asp, (0.5 - u_centerY) * 2.0);
          float a = radians(-u_rotation);
          g_ca = cos(a);
          g_sa = sin(a);
          q = toShape(q);
          float sc = max(u_scale, 0.05) * 0.62;
          p = q / sc;
          d = sdShape(p);
          float e = 0.004;
          vec2 g = vec2(sdShape(p + vec2(e, 0.0)) - sdShape(p - vec2(e, 0.0)),
                        sdShape(p + vec2(0.0, e)) - sdShape(p - vec2(0.0, e)));
          g = g / max(length(g), 1e-5);
          gd = toScreen(g);
          float px = 2.0 / u_res.y / sc;
          float soft = u_edgeSoftness * 0.25;
          alpha = 1.0 - smoothstep(-px * 0.75, px * 0.75 + soft, d);
        }

        // Bevel / fillet normal. t=0 at silhouette, 1 once the bevel ends.
        vec3 bevelNormal(vec2 gd, float d, float w, float shapeAmt) {
          float t = clamp(-d / max(w, 1e-3), 0.0, 1.0);
          float h = sqrt(max(2.0 * t - t * t, 1e-4));
          float sFillet = (1.0 - t) / h;
          float sMach = 6.0 * (1.0 - smoothstep(0.0, 0.22, t))
                      + 0.95 * smoothstep(0.0, 0.12, t) * (1.0 - smoothstep(0.62, 0.78, t))
                      + 0.55 * exp(-pow((t - 0.8) / 0.07, 2.0));
          sMach *= 1.0 - smoothstep(0.85, 1.0, t);
          float s = mix(sFillet, sMach, shapeAmt);
          return normalize(vec3(gd * s, 1.0));
        }

        vec3 sceneBg(float d) {
          vec3 m = texture(u_image, v_imageUV).rgb;
          vec3 bg = m * (1.0 - u_backgroundDim);
          float occl = exp(-max(d, 0.0) * 3.5) * 0.35;
          return bg * (1.0 - occl);
        }

        vec3 mediaEnv(vec3 r, float blur) {
          vec2 off = vec2(r.x, -r.y) * 0.45;
          vec3 acc = texture(u_image, clamp(v_imageUV + off, 0.001, 0.999)).rgb;
          for (int i = 0; i < 8; i++) {
            float a = float(i) * 0.785398;
            vec2 o = vec2(cos(a), sin(a)) * blur * 0.06;
            acc += texture(u_image, clamp(v_imageUV + off + o, 0.001, 0.999)).rgb;
          }
          return acc / 9.0;
        }

        float sbox(vec2 a, vec2 c, vec2 hs, float soft) {
          vec2 q = abs(a - c) - hs;
          return 1.0 - smoothstep(-soft, soft, max(q.x, q.y));
        }

        // Procedural photo studio: huge frontal softbox, black flags, strip lights,
        // warm horizon band, cool floor wash. r = reflection direction (camera at +z).
        vec3 studio(vec3 r, float rot, float soft, float depth, vec3 warm, vec3 cool, float spectral) {
          float cr = cos(rot);
          float sr = sin(rot);
          r = vec3(cr * r.x + sr * r.z, r.y, -sr * r.x + cr * r.z);
          float az = atan(r.x, r.z);
          float el = asin(clamp(r.y, -1.0, 1.0));
          vec2 ae = vec2(az, el);
          float s = soft * 0.35 + 0.012;
          float skyT = smoothstep(-0.2, 1.0, el);
          float base = mix(mix(0.30, 0.05, depth), mix(0.55, 0.20, depth), skyT);
          vec3 col = vec3(base);
          float floorT = 1.0 - smoothstep(-0.7, 0.02, el);
          vec3 floorCol = mix(vec3(0.18), vec3(0.015), depth) * mix(vec3(1.0), cool * 1.1, spectral * 0.7);
          col = mix(col, floorCol, floorT);
          float flagL = sbox(ae, vec2(-1.15, 0.2), vec2(0.28, 1.2), s);
          float flagR = sbox(ae, vec2(1.15, 0.2), vec2(0.28, 1.2), s);
          col *= 1.0 - depth * 0.9 * max(flagL, flagR);
          float box = sbox(ae, vec2(0.0, 0.30), vec2(0.62, 0.55), s * 1.2);
          col = mix(col, vec3(3.4), box);
          col += box * 0.9 * smoothstep(0.0, 0.85, el);
          float warmBand = sbox(ae, vec2(0.0, 0.02), vec2(2.6, 0.045), s);
          col += warm * warmBand * 2.4 * spectral;
          float stripL = sbox(ae, vec2(-0.82, 0.25), vec2(0.035, 0.8), s);
          float stripR = sbox(ae, vec2(0.86, 0.25), vec2(0.03, 0.8), s);
          col += mix(vec3(1.0), warm, spectral) * stripL * 2.2;
          col += mix(vec3(1.0), cool, spectral) * stripR * 2.6;
          col += vec3(1.0) * sbox(ae, vec2(0.0, 1.15), vec2(1.2, 0.12), s) * 1.8;
          float behind = smoothstep(1.7, 2.3, abs(az));
          col = mix(col, vec3(mix(0.08, 0.01, depth)), behind * 0.8);
          col += mix(vec3(1.0), cool, spectral) * sbox(vec2(abs(az), el), vec2(2.9, 0.2), vec2(0.08, 0.9), s) * 2.0;
          return col;
        }

        vec3 tone(vec3 c) {
          c = c / (1.0 + c * 0.28);
          return clamp(c, 0.0, 1.0);
        }
      `

      function makeShapeEffect({ id, label, fragment, groups, defaults = {}, describe }) {
        const allGroups = [shapeGroup(defaults), ...groups]
        const locs = {}
        return {
          id,
          label,
          groups: allGroups,
          draw(v, dt) {
            const { W, H } = env
            env.time += dt

            const { glCanvas, gl, quadBuffer, sharedTexture } = getWebGL()
            if (!gl) {
              ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
              return `${label} (WebGL fallback)`
            }

            const progInfo = getOrCreateProgram('shapeMat_' + id, SHAPE_COMMON_FS + fragment)
            if (!progInfo) return `${label} shader error`

            glCanvas.width = W
            glCanvas.height = H
            gl.viewport(0, 0, W, H)
            gl.useProgram(progInfo.prog)

            gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer)
            gl.enableVertexAttribArray(progInfo.positionLocation)
            gl.vertexAttribPointer(progInfo.positionLocation, 2, gl.FLOAT, false, 0, 0)

            gl.activeTexture(gl.TEXTURE0)
            gl.bindTexture(gl.TEXTURE_2D, sharedTexture)
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, env.sourceCanvas)

            const loc = (name) => {
              if (!(name in locs)) locs[name] = gl.getUniformLocation(progInfo.prog, name)
              return locs[name]
            }
            gl.uniform1i(loc('u_image'), 0)
            gl.uniform2f(loc('u_res'), W, H)
            gl.uniform1f(loc('u_time'), env.time)

            allGroups.forEach((g) =>
              g.controls.forEach((c) => {
                const l = loc('u_' + c.key)
                if (!l) return
                const val = v[c.key]
                if (c.type === 'color') {
                  const rgb = hexToRgb(val)
                  gl.uniform3f(l, rgb[0], rgb[1], rgb[2])
                } else if (c.type === 'select') {
                  gl.uniform1i(l, Math.max(0, c.options.indexOf(val)))
                } else if (c.type === 'checkbox') {
                  gl.uniform1f(l, val ? 1 : 0)
                } else if (c.type === 'range') {

      // ----------------------------------------------------------- LIQUID METAL
      const sxLiquidMetalFS = `
        uniform vec3 u_lightColor;
        uniform vec3 u_darkColor;
        uniform float u_turbulence;
        uniform float u_ripple;
        uniform float u_warp;
        uniform float u_speed;
        uniform float u_environment;
        uniform float u_envRotation;
        uniform float u_sharpness;
        uniform float u_dispersion;
        uniform float u_lightAngle;
        uniform float u_bevelWidth;
        uniform float u_bevelShape;

        float foldField(vec2 p, float t) {
          vec2 q = p * u_ripple * 0.55;
          for (int i = 0; i < 2; i++) {
            vec2 n2 = vec2(vnoise(vec3(q * 1.1 + vec2(1.7, 9.2), t)), vnoise(vec3(q * 1.1 + vec2(8.3, 2.8), t * 1.13)));
            q += (n2 - 0.5) * u_warp * 0.9;
          }
          return fbm4(vec3(q, t * 0.7));
        }

        void main() {
          vec2 p; float d; vec2 gd; float alpha;
          shapeSetup(p, d, gd, alpha);
          vec3 bg = sceneBg(d);
          if (alpha < 0.002) { fragColor = vec4(bg, 1.0); return; }

          float t = u_time * u_speed * 0.25;
          float e = 0.02;
          vec2 g = vec2(foldField(p + vec2(e, 0.0), t) - foldField(p - vec2(e, 0.0), t),
                        foldField(p + vec2(0.0, e), t) - foldField(p - vec2(0.0, e), t)) / (2.0 * e);

          vec3 n;
          if (u_shape == 0) {
            vec3 imgN = imageNormal(v_imageUV, 2.8 + u_warp * 1.2);
            n = normalize(vec3(imgN.xy * 0.7 + g * u_turbulence * 0.18, 1.0));
          } else {
            float w = u_bevelWidth * 3.5;
            n = bevelNormal(gd, d, w, u_bevelShape);
            float inner = smoothstep(0.0, 0.35, -d);
            n.xy += toScreen(p) * 0.35 * inner;
            n.xy += toScreen(g) * u_turbulence * 0.07 * (0.35 + 0.65 * inner);
            n = normalize(n);
          }

          vec3 I = vec3(0.0, 0.0, -1.0);
          vec3 r = reflect(I, n);
          float curv = length(fwidth(n.xy));
          float dl = u_dispersion * (0.02 + 0.2 * clamp(curv * 5.0, 0.0, 1.0));
          float rot = radians(u_envRotation) + u_time * u_speed * 0.15;
          float soft = mix(0.9, 0.0, u_sharpness);
          vec3 warm = vec3(1.0, 0.78, 0.5);
          vec3 cool = vec3(0.6, 0.7, 0.95);

          vec3 Lc = vec3(lum(studio(r, rot + dl, soft, 0.75, warm, cool, 0.25)),
                         lum(studio(r, rot, soft, 0.75, warm, cool, 0.25)),
                         lum(studio(r, rot - dl, soft, 0.75, warm, cool, 0.25)));
          vec3 refrMedia = texture(u_image, clamp(v_imageUV + n.xy * 0.07, 0.001, 0.999)).rgb;
          float Lm = lum(mix(mediaEnv(r, 0.3 + soft), refrMedia, 0.6)) * 1.4;
          Lc = mix(Lc, vec3(Lm), u_mediaReflect);
          vec3 m = 1.0 - exp(-Lc * u_environment * 0.8);
          vec3 col = mix(u_darkColor, u_lightColor, m);

          float la = radians(u_lightAngle);
          vec3 Lk = normalize(vec3(cos(la), -sin(la), 0.65));
          vec3 h = normalize(Lk + vec3(0.0, 0.0, 1.0));
          float nh = max(dot(n, h), 0.0);
          float shin = mix(30.0, 3000.0, u_sharpness * u_sharpness);
          float spec = pow(nh, shin) * (1.0 + u_sharpness * 4.0);
          vec3 h2 = normalize(normalize(vec3(-Lk.xy, 0.5)) + vec3(0.0, 0.0, 1.0));
          float spec2 = pow(max(dot(n, h2), 0.0), shin * 0.6) * 0.5;
          col += u_lightColor * (spec + spec2) * 1.1;

          if (u_shape > 0) {
            col *= mix(0.7, 1.0, smoothstep(0.0, 0.02, -d));
          }
          vec3 outc = mix(bg, tone(col), alpha);
          fragColor = vec4(outc, 1.0);
        }
      `

      // ======================================================================
      // 8. GEM SMOKE EFFECT (Glassy gemstone refraction & ethereal smoky wisps)
      // Reference: https://github.com/paper-design/shaders
      // ======================================================================
      const gemSmokeFS = `
        precision highp float;
        varying vec2 v_uv;
        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_smokeSpeed;
        uniform float u_smokeSize;
        uniform float u_innerDistortion;
        uniform float u_outerDistortion;
        uniform float u_innerGlow;
        uniform float u_outerGlow;
        uniform float u_smokeDensity;
        uniform float u_refraction;
        uniform float u_angle;
        uniform vec2 u_cursor;
        uniform float u_cursorSwirl;
        uniform int u_gemType;
        uniform vec3 u_gemColor;
        uniform vec3 u_smokeColor;
        uniform vec3 u_colorBack;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m; m = m*m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        float fbm(vec2 p) {
          float f = 0.0;
          f += 0.5000 * snoise(p); p = p * 2.02;
          f += 0.2500 * snoise(p); p = p * 2.03;
          f += 0.1250 * snoise(p); p = p * 2.01;
          f += 0.0625 * snoise(p);
          return f;
        }

        vec2 smokeWarp(vec2 p, float t, float distort) {
          vec2 q = vec2(fbm(p + vec2(0.0, t * 0.2)), fbm(p + vec2(5.2, 1.3 - t * 0.15)));
          vec2 r = vec2(fbm(p + 3.0 * q + vec2(1.7, 9.2 + t * 0.15)), fbm(p + 3.0 * q + vec2(8.3, 2.8 - t * 0.12)));
          return p + r * distort;
        }

        void main() {
          vec2 uv = v_uv;
          vec2 texel = 1.0 / u_resolution;
          vec4 img = texture2D(u_image, uv);
          float luma = dot(img.rgb, vec3(0.299, 0.587, 0.114));

          float lLeft  = dot(texture2D(u_image, uv - vec2(texel.x * 2.0, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lRight = dot(texture2D(u_image, uv + vec2(texel.x * 2.0, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lUp    = dot(texture2D(u_image, uv - vec2(0.0, texel.y * 2.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lDown  = dot(texture2D(u_image, uv + vec2(0.0, texel.y * 2.0)).rgb, vec3(0.299, 0.587, 0.114));
          vec2 facetNorm = vec2(lRight - lLeft, lDown - lUp);
          float facetEdge = length(facetNorm) * 3.0;

          vec2 refractUV = uv + facetNorm * u_refraction * 0.08;

          float rad = u_angle * 3.14159265 / 180.0;
          vec2 flow = vec2(cos(rad), sin(rad)) * u_time * 0.2 * u_smokeSpeed;

          vec2 toCursor = (uv - u_cursor) * vec2(u_resolution.x / u_resolution.y, 1.0);
          float distCursor = length(toCursor);
          vec2 vortex = vec2(-toCursor.y, toCursor.x) * exp(-distCursor * 5.0) * u_cursorSwirl * 0.3;

          vec2 innerP = refractUV * u_smokeSize * 4.0 + flow + vortex;
          vec2 warpedInner = smokeWarp(innerP, u_time * u_smokeSpeed, u_innerDistortion);
          float innerSmoke = fbm(warpedInner);
          innerSmoke = pow(clamp(innerSmoke * 0.5 + 0.5, 0.0, 1.0), 1.4) * u_smokeDensity;

          vec2 outerP = uv * u_smokeSize * 2.5 - flow * 0.7 + vortex;
          vec2 warpedOuter = smokeWarp(outerP, u_time * u_smokeSpeed * 0.7, u_outerDistortion);
          float outerSmoke = fbm(warpedOuter);
          outerSmoke = pow(clamp(outerSmoke * 0.5 + 0.5, 0.0, 1.0), 1.8) * u_smokeDensity;

          vec3 gemBase = u_gemColor;
          vec3 smokeBase = u_smokeColor;

          if (u_gemType == 0) {
            gemBase = vec3(0.0, 0.85, 0.45);
            smokeBase = vec3(0.1, 1.0, 0.75);
          } else if (u_gemType == 1) {
            gemBase = vec3(0.9, 0.05, 0.2);
            smokeBase = vec3(1.0, 0.5, 0.15);
          } else if (u_gemType == 2) {
            gemBase = vec3(0.05, 0.35, 0.95);
            smokeBase = vec3(0.4, 0.85, 1.0);
          } else if (u_gemType == 3) {
            gemBase = vec3(0.55, 0.05, 0.85);
            smokeBase = vec3(0.95, 0.35, 0.9);
          } else if (u_gemType == 4) {
            gemBase = vec3(0.85, 0.92, 1.0);
            smokeBase = vec3(
              sin(warpedInner.x * 2.0) * 0.5 + 0.5,
              sin(warpedInner.y * 2.0 + 2.0) * 0.5 + 0.5,
              sin((warpedInner.x + warpedInner.y) * 2.0 + 4.0) * 0.5 + 0.5
            );
          } else {
            gemBase = vec3(0.12, 0.13, 0.18);
            smokeBase = vec3(0.7, 0.75, 0.85);
          }

          float sparkle = pow(clamp(fbm(refractUV * 25.0 + u_time * 0.5), 0.0, 1.0), 4.0) * facetEdge * 2.5;

          vec3 gemLit = gemBase * (luma * 0.6 + 0.4) * (innerSmoke * u_innerGlow * 1.5 + 0.2);
          vec3 smokeAura = smokeBase * outerSmoke * u_outerGlow * 1.2;
          vec3 facetSparkle = vec3(1.0, 0.98, 0.95) * (facetEdge * 0.8 + sparkle);

          float gemMask = clamp(luma * 1.5 + facetEdge * 1.2, 0.0, 1.0);
          vec3 scene = mix(smokeAura, gemLit + facetSparkle, gemMask);
          vec3 finalCol = mix(u_colorBack, scene, clamp(gemMask + outerSmoke * u_outerGlow * 0.8, 0.0, 1.0));

          gl_FragColor = vec4(finalCol, 1.0);
        }
      `

      const gemSmoke = {
        id: 'gem-smoke',

        draw(v, dt) {
          const { W, H } = env
          env.time += dt

          const { glCanvas, gl, quadBuffer, sharedTexture } = getWebGL()
          if (!gl) {
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)

          gl.enableVertexAttribArray(progInfo.positionLocation)

      // ======================================================================
      // 9. HALFTONE CMYK (Offset printing screen with C, M, Y, K angles)
      // Reference: https://shaders.paper.design/halftone-cmyk
      // ======================================================================
      const halftoneCMYKFS = `
        precision highp float;
        varying vec2 v_uv;
        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform float u_scale;
        uniform float u_softness;
        uniform float u_angle;
        uniform float u_contrast;
        uniform float u_opacity;
        uniform float u_cScale;
        uniform float u_mScale;
        uniform float u_yScale;
        uniform float u_kScale;
        uniform vec3 u_paperColor;
        uniform vec2 u_cursor;
        uniform float u_cursorDistort;

        mat2 rot2d(float angle) {
          float s = sin(angle);
          float c = cos(angle);
          return mat2(c, -s, s, c);
        }

        float getChannelDot(vec2 uv, float angleDeg, float channelVal, float scale, float softness) {
          float rad = angleDeg * 3.14159265 / 180.0;
          mat2 rot = rot2d(rad);
          vec2 rotUV = rot * (uv * u_resolution) / scale;
          vec2 grid = fract(rotUV) - 0.5;
          float d = length(grid);
          float radius = sqrt(clamp(channelVal, 0.0, 1.0)) * 0.7071;
          float s = max(softness * 0.5, 0.001);
          return 1.0 - smoothstep(radius - s, radius + s, d);
        }

        void main() {
          vec2 uv = v_uv;
          
          vec2 toCursor = (uv - u_cursor) * vec2(u_resolution.x / u_resolution.y, 1.0);
          float distCursor = length(toCursor);
          if (distCursor < 0.45 && u_cursorDistort > 0.0) {
            vec2 disp = normalize(toCursor) * sin(distCursor * 22.0) * exp(-distCursor * 5.5) * u_cursorDistort * 0.035;
            uv += disp;
          }

          vec4 img = texture2D(u_image, uv);
          vec3 rgb = clamp(img.rgb, 0.0, 1.0);

          rgb = clamp((rgb - 0.5) * u_contrast + 0.5, 0.0, 1.0);

          float k = 1.0 - max(max(rgb.r, rgb.g), rgb.b);
          float denom = max(1.0 - k, 0.0001);
          float c = (1.0 - rgb.r - k) / denom;
          float m = (1.0 - rgb.g - k) / denom;
          float y = (1.0 - rgb.b - k) / denom;

          c = clamp(c * u_cScale, 0.0, 1.0);
          m = clamp(m * u_mScale, 0.0, 1.0);
          y = clamp(y * u_yScale, 0.0, 1.0);
          k = clamp(k * u_kScale, 0.0, 1.0);

          // Standard offset printing angles: C: 15°, M: 75°, Y: 0°, K: 45°
          float dotC = getChannelDot(uv, u_angle + 15.0, c, u_scale, u_softness);
          float dotM = getChannelDot(uv, u_angle + 75.0, m, u_scale, u_softness);
          float dotY = getChannelDot(uv, u_angle + 0.0,  y, u_scale, u_softness);
          float dotK = getChannelDot(uv, u_angle + 45.0, k, u_scale, u_softness);

          vec3 whitePaper = u_paperColor;
          vec3 cyanInk    = vec3(0.0, 0.65, 0.85);
          vec3 magentaInk = vec3(0.85, 0.05, 0.5);
          vec3 yellowInk  = vec3(0.95, 0.9, 0.05);
          vec3 blackInk   = vec3(0.05, 0.05, 0.08);

          vec3 outColor = whitePaper;
          outColor *= (vec3(1.0) - cyanInk * dotC);
          outColor *= (vec3(1.0) - magentaInk * dotM);
          outColor *= (vec3(1.0) - yellowInk * dotY);
          outColor *= (vec3(1.0) - (vec3(1.0) - blackInk) * dotK);

          vec3 finalRgb = mix(rgb, outColor, u_opacity);
          gl_FragColor = vec4(finalRgb, 1.0);
        }
      `

      // ======================================================================
      // 10. HALFTONE DOTS (Graphic halftone raster grids with shapes & waves)
      // Reference: https://shaders.paper.design/halftone-dots
      // ======================================================================
      const halftoneDotsFS = `
        precision highp float;
        varying vec2 v_uv;
        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_scale;
        uniform float u_softness;
        uniform float u_angle;
        uniform float u_contrast;
        uniform float u_waveSpeed;
        uniform float u_waveAmp;
        uniform int u_gridType;
        uniform int u_dotShape;
        uniform bool u_invert;
        uniform vec3 u_dotColor;
        uniform vec3 u_backColor;
        uniform vec2 u_cursor;
        uniform float u_cursorRipple;

        mat2 rot2d(float angle) {
          float s = sin(angle);
          float c = cos(angle);
          return mat2(c, -s, s, c);
        }

        float getDotDist(vec2 uv, int shape) {
          if (shape == 0) {
            return length(uv);
          } else if (shape == 1) {
            return (abs(uv.x) + abs(uv.y)) * 0.7071;
          } else if (shape == 2) {
            return max(abs(uv.x), abs(uv.y));
          } else {
            return min(length(uv), min(abs(uv.x) + abs(uv.y) * 0.35, abs(uv.y) + abs(uv.x) * 0.35));
          }
        }

        void main() {
          vec2 uv = v_uv;

          float rad = u_angle * 3.14159265 / 180.0;
          mat2 rot = rot2d(rad);

          vec2 toCursor = (uv - u_cursor) * vec2(u_resolution.x / u_resolution.y, 1.0);
          float distCursor = length(toCursor);
          if (distCursor < 0.5 && u_cursorRipple > 0.0) {
            vec2 warp = normalize(toCursor) * sin(distCursor * 25.0 - u_time * 6.0) * exp(-distCursor * 5.0) * u_cursorRipple * 0.045;
            uv += warp;
          }

          if (u_waveAmp > 0.0) {
            float wave = sin(dot(uv, vec2(12.0, 16.0)) + u_time * u_waveSpeed * 3.0) * u_waveAmp * 0.015;
            uv += vec2(wave, wave * 0.6);
          }

          vec4 img = texture2D(u_image, uv);
          float luma = dot(img.rgb, vec3(0.299, 0.587, 0.114));
          luma = clamp((luma - 0.5) * u_contrast + 0.5, 0.0, 1.0);
          if (u_invert) luma = 1.0 - luma;

          vec2 p = rot * (uv * u_resolution) / u_scale;
          float d = 0.0;
          float maxRadius = 0.7071;

          if (u_gridType == 0) {
            vec2 grid = fract(p) - 0.5;
            d = getDotDist(grid, u_dotShape);
          } else if (u_gridType == 1) {
            vec2 r = vec2(1.0, 1.7320508);
            vec2 h = r * 0.5;
            vec2 a = mod(p, r) - h;
            vec2 b = mod(p - h, r) - h;
            vec2 g = dot(a, a) < dot(b, b) ? a : b;
            d = getDotDist(g, u_dotShape);
          } else if (u_gridType == 2) {
            mat2 dRot = rot2d(0.785398);
            vec2 dGrid = fract(dRot * p) - 0.5;
            d = getDotDist(dGrid, u_dotShape);
          } else {
            float lineCoord = abs(fract(p.y) - 0.5);
            d = lineCoord;
            maxRadius = 0.5;
          }

          float r = sqrt(luma) * maxRadius;
          float s = max(u_softness * 0.5, 0.001);
          float dotVal = smoothstep(r - s, r + s, d);

          vec3 col = mix(u_dotColor, u_backColor, dotVal);
          gl_FragColor = vec4(col, 1.0);
        }
      `

        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform vec2 u_imageResolution;
        uniform float u_time;

        uniform float u_spread;
        uniform float u_bias;
        uniform float u_angle;
        uniform float u_perspective;
        uniform float u_count;
        uniform float u_dispersion;
        uniform float u_dispersionShift;
        uniform float u_dispersionColor;
        uniform float u_focusCenter;
        uniform float u_focusEdges;
        uniform float u_swirl;
        uniform float u_noise;
        uniform float u_noiseFrequency;
        uniform float u_noiseOffset;
        uniform float u_lensBulge;
        uniform float u_lensCircle;
        uniform float u_grainMixer;
        uniform float u_grainOverlay;
        uniform float u_imageX;
        uniform float u_imageY;
        uniform float u_scale;
        uniform int u_fit;
        uniform vec2 u_center;

        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);

        float noise2d(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          float a = hash12(i + vec2(0.0, 0.0));
          float b = hash12(i + vec2(1.0, 0.0));
          float c = hash12(i + vec2(0.0, 1.0));
          float d = hash12(i + vec2(1.0, 1.0));
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }

        vec3 spectralRainbow(float t) {
          t = fract(t);
          vec3 c = 0.5 + 0.5 * cos(6.28318530718 * (t + vec3(0.0, 0.333, 0.667)));
          return c * 1.5;
        }

        vec4 sampleFittedImage(vec2 p) {
          vec2 uvCoord = p;
          
          if (u_fit == 0) { // contain
            float imgRatio = u_imageResolution.x / max(1.0, u_imageResolution.y);
            float screenRatio = u_resolution.x / max(1.0, u_resolution.y);
            vec2 fittedDim = (screenRatio > imgRatio) 
              ? vec2(u_resolution.y * imgRatio, u_resolution.y) 
              : vec2(u_resolution.x, u_resolution.x / imgRatio);
            vec2 offset = (u_resolution - fittedDim) * 0.5 / u_resolution;
            vec2 relUV = (uvCoord - offset) * (u_resolution / fittedDim);
            relUV = (relUV - 0.5) / max(0.01, u_scale) + 0.5;

            vec2 fittedDim = (screenRatio < imgRatio) 
              ? vec2(u_resolution.y * imgRatio, u_resolution.y) 
              : vec2(u_resolution.x, u_resolution.x / imgRatio);
            vec2 offset = (u_resolution - fittedDim) * 0.5 / u_resolution;
            vec2 relUV = (uvCoord - offset) * (u_resolution / fittedDim);
            relUV = (relUV - 0.5) / max(0.01, u_scale) + 0.5;

            float k = u_lensBulge * 1.8;
            float r2 = r * r;
            if (u_lensBulge > 0.0) {

            } else {

          for (int i = 0; i < 50; i++) {
            if (i >= sampleCount) break;
            
            float t = float(i) / max(1.0, fCount - 1.0);
            float normProg = (t - 0.5) * 2.0;
            
            float biasedProg = normProg;
            if (abs(u_bias) > 0.01) {
              float signP = sign(normProg);
              float absP = abs(normProg);
              if (u_bias > 0.0) {
                biasedProg = signP * pow(absP, 1.0 + u_bias * 2.5);
              } else {

              }
            }
            
            vec2 layerP = warpedP;
            if (abs(u_swirl) > 0.001) {
              float swirlFalloff = max(0.0, 1.0 - distC / (0.75 * min(aspect.x, aspect.y)));
              float swirlAngle = biasedProg * u_swirl * 3.14159265 * swirlFalloff;
              float cosS = cos(swirlAngle);

              layerNoise = vec2(n1, n2) * (u_noise * 0.12 * (1.0 + abs(biasedProg)));

            float spreadDist = u_spread * 0.35 * focusMod * biasedProg;
            vec2 layerOffset = (baseSpreadDir * spreadDist + layerNoise + layerGrain) / aspect;

            totalWeight += 1.0;

          vec3 finalCol = (totalWeight > 0.0) ? (accumColor / totalWeight) : vec3(0.0);

          }

          fragColor = vec4(clamp(finalCol, 0.0, 1.0), 1.0);
        }

        precision highp float;
        varying vec2 v_uv;
        uniform sampler2D u_image;

          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float bayer4(vec2 p) {
          vec2 f = mod(floor(p), 4.0);
          int x = int(f.x);
          int y = int(f.y);
          int index = x + y * 4;
          if (index == 0) return 0.0/16.0;
          if (index == 1) return 8.0/16.0;
          if (index == 2) return 2.0/16.0;
          if (index == 3) return 10.0/16.0;
          if (index == 4) return 12.0/16.0;
          if (index == 5) return 4.0/16.0;
          if (index == 6) return 14.0/16.0;
          if (index == 7) return 6.0/16.0;
          if (index == 8) return 3.0/16.0;
          if (index == 9) return 11.0/16.0;
          if (index == 10) return 1.0/16.0;
          if (index == 11) return 9.0/16.0;
          if (index == 12) return 15.0/16.0;
          if (index == 13) return 7.0/16.0;
          if (index == 14) return 13.0/16.0;
          return 5.0/16.0;
        }

        float bayer8(vec2 p) {
          vec2 f = mod(floor(p), 8.0);
          vec2 f4 = mod(f, 4.0);
          float m4 = bayer4(f4);
          vec2 halfBlock = floor(f / 4.0);
          float offset = 0.0;
          if (halfBlock.x == 0.0 && halfBlock.y == 0.0) offset = 0.0;
          else if (halfBlock.x == 1.0 && halfBlock.y == 0.0) offset = 2.0;
          else if (halfBlock.x == 0.0 && halfBlock.y == 1.0) offset = 3.0;
          else offset = 1.0;
          return (m4 * 4.0 + offset * (1.0 / 4.0)) / 4.0;
        }

        float getDitherThreshold(vec2 coord, int type) {
          if (type == 0) {
            return bayer8(coord) - 0.5;
          } else if (type == 1) {
            return bayer4(coord) - 0.5;
          } else if (type == 2) {
            return hash21(coord + fract(u_time * 0.05)) - 0.5;
          } else if (type == 3) {
            vec2 c = mod(floor(coord), 4.0);
            float d = (c.x == c.y || c.x == 3.0 - c.y) ? 0.35 : -0.35;
            return d;
          } else if (type == 4) {
            vec2 c = fract(coord / 6.0) - 0.5;
            return (1.0 - length(c) * 2.0) - 0.5;
          } else {
            return hash21(coord * 7.13 + u_time) - 0.5;
          }
        }

        vec3 mapPalette(float val, vec3 origRgb, int pal) {
          val = clamp(val, 0.0, 1.0);
          if (u_invert) val = 1.0 - val;

          if (pal == 0) {
            return mix(u_darkColor, u_lightColor, step(0.5, val));
          } else if (pal == 1) {
            if (val < 0.25) return vec3(0.06, 0.22, 0.06);
            if (val < 0.5)  return vec3(0.19, 0.38, 0.19);
            if (val < 0.75) return vec3(0.54, 0.67, 0.06);
            return vec3(0.61, 0.73, 0.06);
          } else if (pal == 2) {
            if (val < 0.25) return vec3(0.05, 0.02, 0.15);
            if (val < 0.5)  return vec3(0.95, 0.05, 0.45);
            if (val < 0.75) return vec3(0.0, 0.85, 0.95);
            return vec3(1.0, 0.95, 0.2);
          } else if (pal == 3) {
            return mix(vec3(0.08, 0.03, 0.0), vec3(1.0, 0.7, 0.1), val);
          } else if (pal == 4) {
            if (val < 0.25) return vec3(0.0, 0.0, 0.0);
            if (val < 0.5)  return vec3(0.0, 0.67, 0.67);
            if (val < 0.75) return vec3(0.67, 0.0, 0.67);
            return vec3(1.0, 1.0, 1.0);
          } else if (pal == 5) {
            if (val < 0.25) return vec3(0.18, 0.1, 0.35);
            if (val < 0.5)  return vec3(0.95, 0.5, 0.65);
            if (val < 0.75) return vec3(0.45, 0.85, 0.9);
            return vec3(1.0, 0.95, 0.85);
          } else {
            return clamp(origRgb, 0.0, 1.0);
          }
        }

        void main() {
          vec2 uv = v_uv;
          float pSize = max(1.0, u_pixelSize);

          vec2 toCursor = (uv - u_cursor) * vec2(u_resolution.x / u_resolution.y, 1.0);
          float distCursor = length(toCursor);
          if (distCursor < 0.45 && u_cursorScatter > 0.0) {
            float scatter = hash21(floor(uv * u_resolution / pSize) + u_time) * u_cursorScatter * 0.03;
            uv += (toCursor / (distCursor + 0.001)) * scatter;
          }

          vec2 pixelCoord = floor(uv * u_resolution / pSize);
          vec2 sampledUV = (pixelCoord + 0.5) * pSize / u_resolution;
          sampledUV = clamp(sampledUV, 0.0, 1.0);

          vec4 img = texture2D(u_image, sampledUV);
          vec3 rgb = clamp((img.rgb - 0.5) * u_contrast + 0.5, 0.0, 1.0);
          float luma = dot(rgb, vec3(0.299, 0.587, 0.114));

          float dither = getDitherThreshold(pixelCoord, u_matrixType) * u_ditherAmount;

          if (u_palette == 6) {
            float steps = max(1.0, u_levels - 1.0);
            vec3 qRgb = floor((rgb + vec3(dither)) * steps + 0.5) / steps;
            gl_FragColor = vec4(clamp(qRgb, 0.0, 1.0), 1.0);
          } else {
            float steps = max(1.0, u_levels - 1.0);
            float qLuma = floor((luma + dither) * steps + 0.5) / steps;
            vec3 finalCol = mapPalette(qLuma, rgb, u_palette);
            gl_FragColor = vec4(finalCol, 1.0);
          }
        }
      `
