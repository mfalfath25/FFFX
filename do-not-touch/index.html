          this.analysisCtx.drawImage(env.sourceCanvas, 0, 0, GW, GH)
          const imgData = this.analysisCtx.getImageData(0, 0, GW, GH)
          const data = imgData.data

          if (!this.bgData || this.bgData.length !== GW * GH * 3) {
            this.bgData = new Float32Array(GW * GH * 3)
            for (let i = 0; i < GW * GH; i++) {
              this.bgData[i * 3] = data[i * 4]
              this.bgData[i * 3 + 1] = data[i * 4 + 1]
              this.bgData[i * 3 + 2] = data[i * 4 + 2]
            }

          const sens = v.sensitivity !== undefined ? v.sensitivity : 0.45
          const threshold = 0.03 + (1 - sens) * 0.22
          const scaleX = W / GW

          const binaryMask = new Uint8Array(GW * GH)
          let sumX = 0, sumY = 0, totalMotion = 0
          let minX = GW, maxX = 0, minY = GH, maxY = 0

          for (let y = 0; y < GH; y++) {
            for (let x = 0; x < GW; x++) {
              const idx = (y * GW + x) * 4
              const bgIdx = (y * GW + x) * 3
              const r = data[idx], g = data[idx + 1], b = data[idx + 2]
              const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255

              const bgR = this.bgData[bgIdx]
              const bgG = this.bgData[bgIdx + 1]
              const bgB = this.bgData[bgIdx + 2]
              const diff = (Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB)) / (3 * 255)

              // Running background model adaptation
              this.bgData[bgIdx] += (r - bgR) * 0.025
              this.bgData[bgIdx + 1] += (g - bgG) * 0.025
              this.bgData[bgIdx + 2] += (b - bgB) * 0.025

              const energy = Math.max(diff * 1.8, luma > 0.35 && diff > 0.02 ? diff * 1.2 : 0)
              if (energy > threshold) {
                binaryMask[y * GW + x] = 1
                sumX += x * energy
                sumY += y * energy
                totalMotion += energy
                if (x < minX) minX = x
                if (x > maxX) maxX = x
                if (y < minY) minY = y
                if (y > maxY) maxY = y
              }
            }
          }

          // 1. Trace Perimeter Contour Points for Outlining
          const contourPts = []
          for (let y = 1; y < GH - 1; y += 2) {
            let rowLeft = -1, rowRight = -1
            for (let x = 1; x < GW - 1; x++) {
              if (binaryMask[y * GW + x]) {
                if (rowLeft === -1) rowLeft = x
                rowRight = x
              }
            }
            if (rowLeft !== -1) {
              contourPts.push({ x: rowLeft * scaleX, y: y * scaleY, side: 'left' })
              if (rowRight > rowLeft) {
                contourPts.push({ x: rowRight * scaleX, y: y * scaleY, side: 'right' })
              }
            }
          }

          // Sort contour points to form a closed continuous hull path
          const lefts = contourPts.filter(p => p.side === 'left').sort((a, b) => a.y - b.y)
          const rights = contourPts.filter(p => p.side === 'right').sort((a, b) => b.y - a.y)
          this.silhouetteContour = [...lefts, ...rights]

          // 2. Derive Kinematic Human Skeleton
          const time = env.time
          if (totalMotion > 2 && maxX > minX) {
            const cx = (sumX / totalMotion) * scaleX
            const cy = (sumY / totalMotion) * scaleY
            const bw = Math.max(W * 0.25, (maxX - minX + 1) * scaleX)
            const bh = Math.max(H * 0.35, (maxY - minY + 1) * scaleY)

            // Kinematic anatomical joints
            const headY = cy - bh * 0.38
            const neckY = cy - bh * 0.24
            const shoulderSpan = bw * 0.28
            const elbowSpan = bw * 0.42
            const wristSpan = bw * 0.52

            // Natural arm motion articulation
            const armSwingL = Math.sin(time * 2.5) * (bh * 0.08)
            const armSwingR = Math.cos(time * 2.5) * (bh * 0.08)

            const leftWrist = { x: cx - wristSpan, y: cy - bh * 0.05 + armSwingL }
            const rightWrist = { x: cx + wristSpan, y: cy - bh * 0.05 + armSwingR }

            this.kinematicPose = {
              0: { x: cx, y: headY },                               // Nose / Head
              11: { x: cx - shoulderSpan, y: neckY },               // Left Shoulder
              12: { x: cx + shoulderSpan, y: neckY },               // Right Shoulder
              13: { x: cx - elbowSpan, y: cy - bh * 0.12 + armSwingL * 0.6 }, // Left Elbow
              14: { x: cx + elbowSpan, y: cy - bh * 0.12 + armSwingR * 0.6 }, // Right Elbow
              15: leftWrist,                                        // Left Wrist
              16: rightWrist,                                       // Right Wrist
              23: { x: cx - shoulderSpan * 0.65, y: cy + bh * 0.15 }, // Left Hip
              24: { x: cx + shoulderSpan * 0.65, y: cy + bh * 0.15 }, // Right Hip
              25: { x: cx - shoulderSpan * 0.75, y: cy + bh * 0.32 }, // Left Knee
              26: { x: cx + shoulderSpan * 0.75, y: cy + bh * 0.32 }, // Right Knee
              27: { x: cx - shoulderSpan * 0.75, y: cy + bh * 0.46 }, // Left Ankle
              28: { x: cx + shoulderSpan * 0.75, y: cy + bh * 0.46 }, // Right Ankle
            }

            // Derive 5 Articulated Fingers for each wrist (Thumb, Index, Middle, Ring, Pinky)
            this.kinematicHands = [
              this.generateHandFingers(leftWrist, -1, time, -0.2),
              this.generateHandFingers(rightWrist, 1, time, 0.2),
            ]
          } else {
            // Default breathing anatomical posture
            const cx = W * 0.5
            const cy = H * 0.52
            const bw = W * 0.45
            const bh = H * 0.72

            const leftWrist = { x: cx - bw * 0.34, y: cy - bh * 0.02 + Math.sin(time * 1.5) * 8 }
            const rightWrist = { x: cx + bw * 0.34, y: cy - bh * 0.02 + Math.cos(time * 1.5) * 8 }

            this.kinematicPose = {
              0: { x: cx, y: cy - bh * 0.42 },
              11: { x: cx - bw * 0.22, y: cy - bh * 0.26 },
              12: { x: cx + bw * 0.22, y: cy - bh * 0.26 },
              13: { x: cx - bw * 0.32, y: cy - bh * 0.14 },
              14: { x: cx + bw * 0.32, y: cy - bh * 0.14 },
              15: leftWrist,
              16: rightWrist,
              23: { x: cx - bw * 0.14, y: cy + bh * 0.12 },
              24: { x: cx + bw * 0.14, y: cy + bh * 0.12 },
              25: { x: cx - bw * 0.16, y: cy + bh * 0.28 },
              26: { x: cx + bw * 0.16, y: cy + bh * 0.28 },
              27: { x: cx - bw * 0.16, y: cy + bh * 0.44 },
              28: { x: cx + bw * 0.16, y: cy + bh * 0.44 },
            }

            this.kinematicHands = [
              this.generateHandFingers(leftWrist, -1, time, -0.2),
              this.generateHandFingers(rightWrist, 1, time, 0.2),
            ]
          }
        },

        // Generates 21 anatomical landmarks for 5 fingers per hand (CMC, MCP, PIP, DIP, TIP)
        generateHandFingers(wrist, sideSign, time, armAngle = 0) {
          const pts = [{ x: wrist.x, y: wrist.y, z: 0 }] // 0: Wrist
          const palmLen = 30
          const fingerLengths = [22, 32, 36, 31, 24] // Thumb, Index, Middle, Ring, Pinky
          const baseAngles = [
            sideSign * -0.75, // Thumb
            sideSign * -0.28, // Index
            sideSign * 0.02,  // Middle
            sideSign * 0.26,  // Ring
            sideSign * 0.55,  // Pinky
          ]

          // Base MCP anchors from wrist
          baseAngles.forEach((fAngle, fIdx) => {
            const angle = armAngle + fAngle
            const fLen = fingerLengths[fIdx]
            const mcpDist = palmLen * (fIdx === 0 ? 0.6 : 0.85)
            // Articulated joint bend oscillation
            const bend = Math.sin(time * 3 + fIdx * 0.8) * 0.15

            const mcpX = wrist.x + Math.sin(angle) * mcpDist
            const mcpY = wrist.y - Math.cos(angle) * mcpDist
            pts.push({ x: mcpX, y: mcpY, z: 0 }) // Joint 1 (MCP or CMC for thumb)

            // PIP joint
            const pipX = mcpX + Math.sin(angle + bend) * (fLen * 0.4)
            const pipY = mcpY - Math.cos(angle + bend) * (fLen * 0.4)
            pts.push({ x: pipX, y: pipY, z: 0 }) // Joint 2

            // DIP joint
            const dipX = pipX + Math.sin(angle + bend * 1.5) * (fLen * 0.35)
            const dipY = pipY - Math.cos(angle + bend * 1.5) * (fLen * 0.35)
            pts.push({ x: dipX, y: dipY, z: 0 }) // Joint 3

            // TIP joint
            const tipX = dipX + Math.sin(angle + bend * 2.0) * (fLen * 0.3)
            const tipY = dipY - Math.cos(angle + bend * 2.0) * (fLen * 0.3)
            pts.push({ x: tipX, y: tipY, z: 0 }) // Joint 4 (Fingertip)
          })

          return pts
        },

        getActivePose(v) {
          if (v.engineMode === 'KINEMATIC CV (OFFLINE 60FPS)') {
            return this.kinematicPose
          }
          if (this.poseLandmarks && this.poseLandmarks.length >= 33) {
            // MediaPipe 33-point landmarks
            return this.poseLandmarks
          }
          return this.kinematicPose
        },

        getActiveHands(v, activePose) {
          if (v.engineMode === 'KINEMATIC CV (OFFLINE 60FPS)') {
            return this.kinematicHands
          }
          // Attach articulated 5 fingers to active wrists with proper hand rotation
          if (activePose && activePose[15] && activePose[16]) {
            const time = env.time
            const leftAngle = activePose[13] ? Math.atan2(activePose[15].y - activePose[13].y, activePose[15].x - activePose[13].x) - Math.PI / 2 : -0.2
            const rightAngle = activePose[14] ? Math.atan2(activePose[16].y - activePose[14].y, activePose[16].x - activePose[14].x) - Math.PI / 2 : 0.2

            return [
              this.generateHandFingers(activePose[15], -1, time, leftAngle),
              this.generateHandFingers(activePose[16], 1, time, rightAngle),
            ]
          }
          return this.kinematicHands
        },

        // Contour resolution: returns motion contour points, or anatomical hull fallback
        getContourPoints(activePose) {
          if (this.silhouetteContour && this.silhouetteContour.length >= 4) {
            return this.silhouetteContour
          }
          if (!activePose) return []
          const p = activePose
          const head = p[0] || { x: env.W * 0.5, y: env.H * 0.25 }
          const lSh = p[11], rSh = p[12]
          const lElb = p[13], rElb = p[14]
          const lWri = p[15], rWri = p[16]
          const lHip = p[23], rHip = p[24]
          const lKne = p[25], rKne = p[26]
          const lAnk = p[27], rAnk = p[28]

          const pts = []
          if (head) pts.push({ x: head.x, y: head.y - 32 })
          if (rSh)  pts.push({ x: rSh.x + 24, y: rSh.y - 12 })
          if (rElb) pts.push({ x: rElb.x + 20, y: rElb.y })
          if (rWri) pts.push({ x: rWri.x + 16, y: rWri.y + 16 })
          if (rElb) pts.push({ x: rElb.x + 8, y: rElb.y + 14 })
          if (rHip) pts.push({ x: rHip.x + 22, y: rHip.y })
          if (rKne) pts.push({ x: rKne.x + 20, y: rKne.y })
          if (rAnk) pts.push({ x: rAnk.x + 18, y: rAnk.y + 24 })
          if (lAnk) pts.push({ x: lAnk.x - 18, y: lAnk.y + 24 })
          if (lKne) pts.push({ x: lKne.x - 20, y: lKne.y })
          if (lHip) pts.push({ x: lHip.x - 22, y: lHip.y })
          if (lElb) pts.push({ x: lElb.x - 8, y: lElb.y + 14 })
          if (lWri) pts.push({ x: lWri.x - 16, y: lWri.y + 16 })
          if (lElb) pts.push({ x: lElb.x - 20, y: lElb.y })
          if (lSh)  pts.push({ x: lSh.x - 24, y: lSh.y - 12 })
          return pts
        },

        // --- OBJECT & SILHOUETTE OUTLINING ENGINE ---
        renderObjectOutline(v, activePose) {
          const { W, H, time } = env
          let color = v.outlineColor || '#00ff88'
          let width = v.outlineWidth !== undefined ? v.outlineWidth : 3
          let glow = v.outlineGlow !== undefined ? v.outlineGlow : 18
          const style = v.outlineStyle || 'NEON PULSE'

          // Adjust parameters if display style focuses on outline
          if (v.displayStyle === 'OUTLINE AURA & KINEMATICS') {
            glow *= 1.4
            width *= 1.2
          }

          ctx.save()

          // A. If MediaPipe segmentation mask is active, use pixel-perfect body mask
          const hasSeg = this.hasReceivedSeg && this.segmentationCanvas && this.segmentationCanvas.width === W && this.segmentationCanvas.height === H
          if (hasSeg && v.engineMode !== 'KINEMATIC CV (OFFLINE 60FPS)') {
            ctx.save()
            if (v.fillSilhouette) {
              ctx.globalAlpha = v.fillOpacity !== undefined ? v.fillOpacity : 0.25
              ctx.fillStyle = color
              ctx.drawImage(this.segmentationCanvas, 0, 0)
            }

            // Outline extraction via edge dilation
            ctx.globalCompositeOperation = 'screen'
            ctx.shadowColor = color
            ctx.shadowBlur = glow
            ctx.strokeStyle = color
            ctx.lineWidth = width
            ctx.drawImage(this.segmentationCanvas, 0, 0)
            ctx.restore()
          }

          // B. Vector Contour Path Outlining (hugs the body & limb perimeter!)
          const pts = this.getContourPoints(activePose)
          if (pts && pts.length >= 4) {
            ctx.beginPath()
            ctx.moveTo(pts[0].x, pts[0].y)
            for (let i = 1; i < pts.length; i++) {
              const prev = pts[i - 1]
              const curr = pts[i]
              const midX = (prev.x + curr.x) / 2
              const midY = (prev.y + curr.y) / 2
              ctx.quadraticCurveTo(prev.x, prev.y, midX, midY)
            }
            ctx.closePath()

            // 1. Translucent Body Fill if enabled
            if (v.fillSilhouette) {
              ctx.fillStyle = color
              ctx.globalAlpha = v.fillOpacity !== undefined ? v.fillOpacity : 0.25
              ctx.fill()
            }

            // 2. Render Contour Outline by Style
            if (style === 'NEON PULSE') {
              const pulse = 1.0 + Math.sin(time * 4) * 0.25
              // Outer bloom aura
              ctx.shadowColor = color
              ctx.shadowBlur = glow * pulse
              ctx.strokeStyle = color
              ctx.lineWidth = width * 1.8
              ctx.globalAlpha = 0.65
              ctx.stroke()

              // Sharp bright core
              ctx.shadowBlur = 0
              ctx.strokeStyle = '#ffffff'
              ctx.lineWidth = Math.max(1.2, width * 0.6)
              ctx.globalAlpha = 0.95
              ctx.stroke()
            } else if (style === 'CYBER HUD AURA') {
              ctx.setLineDash([8, 6])
              ctx.strokeStyle = color
              ctx.lineWidth = width
              ctx.shadowColor = color
              ctx.shadowBlur = glow * 0.5
              ctx.globalAlpha = 0.85
              ctx.stroke()

              // Tech corner brackets at silhouette extrema
              ctx.setLineDash([])
              const minP = pts.reduce((acc, p) => p.y < acc.y ? p : acc, pts[0])
              const maxP = pts.reduce((acc, p) => p.y > acc.y ? p : acc, pts[0])
              ctx.strokeStyle = '#ffffff'
              ctx.lineWidth = 1.5
              const cs = 12
              ctx.strokeRect(minP.x - cs / 2, minP.y - cs, cs, cs)
              ctx.strokeRect(maxP.x - cs / 2, maxP.y, cs, cs)
            } else if (style === 'VECTOR WIREFRAME') {
              ctx.strokeStyle = color
              ctx.lineWidth = width
              ctx.globalAlpha = 0.9
              ctx.stroke()

              // Anchor nodes at vertices
              ctx.fillStyle = '#ffffff'
              for (let i = 0; i < pts.length; i += 2) {
                ctx.beginPath()
                ctx.arc(pts[i].x, pts[i].y, 2.5, 0, Math.PI * 2)
                ctx.fill()
              }
            } else if (style === 'CHROMA GLITCH') {
              // Red Channel Offset
              ctx.save()
              ctx.translate(4, 0)
              ctx.strokeStyle = '#ff2626'
              ctx.lineWidth = width
              ctx.globalAlpha = 0.7
              ctx.stroke()
              ctx.restore()

              // Cyan Channel Offset
              ctx.save()
              ctx.translate(-4, 0)
              ctx.strokeStyle = '#00f0ff'
              ctx.lineWidth = width
              ctx.globalAlpha = 0.7
              ctx.stroke()
              ctx.restore()
            } else {
              // SILHOUETTE HATCH (Holographic diagonal scanline hatch)
              ctx.strokeStyle = color
              ctx.lineWidth = width
              ctx.stroke()

              // Draw internal diagonal hatch
              ctx.save()
              ctx.clip()
              ctx.strokeStyle = color
              ctx.lineWidth = 1
              ctx.globalAlpha = 0.22
              for (let hy = -W; hy < H + W; hy += 12) {
                ctx.beginPath()
                ctx.moveTo(0, hy)
                ctx.lineTo(W, hy + W)
                ctx.stroke()
              }
              ctx.restore()
            }
          }

          ctx.restore()
        },

        // --- LIMB SKELETAL RENDERING ---
        renderLimbSkeleton(pose, v) {
          const color = v.skeletonColor || '#00ff88'
          const jointCol = v.jointColor || '#ffffff'
          const bWidth = v.boneWidth !== undefined ? v.boneWidth : 3.0
          const jSize = v.jointSize !== undefined ? v.jointSize : 5

          // MediaPipe Pose Bone pairs
          const bones = [
            [11, 12], // Shoulders
            [11, 13], // Left upper arm
            [13, 15], // Left forearm
            [12, 14], // Right upper arm
            [14, 16], // Right forearm
            [11, 23], // Left torso
            [12, 24], // Right torso
            [23, 24], // Pelvis / Hips
            [23, 25], // Left thigh
            [25, 27], // Left shin
            [24, 26], // Right thigh
            [26, 28], // Right shin
          ]

          ctx.save()
          ctx.lineCap = 'round'
          ctx.lineJoin = 'round'

          // 1. Draw Bones
          ctx.strokeStyle = color
          ctx.lineWidth = bWidth
          ctx.shadowColor = color
          ctx.shadowBlur = 10

          bones.forEach(([i1, i2]) => {
            const p1 = pose[i1]
            const p2 = pose[i2]
            if (p1 && p2 && (p1.visibility === undefined || p1.visibility > 0.4)) {
              ctx.beginPath()
              ctx.moveTo(p1.x, p1.y)
              ctx.lineTo(p2.x, p2.y)
              ctx.stroke()
            }
          })

          // Spine & Neck bone
          if (pose[11] && pose[12] && pose[23] && pose[24]) {
            const neckX = (pose[11].x + pose[12].x) / 2
            const neckY = (pose[11].y + pose[12].y) / 2
            const spineX = (pose[23].x + pose[24].x) / 2
            const spineY = (pose[23].y + pose[24].y) / 2

            // Spine
            ctx.beginPath()
            ctx.moveTo(neckX, neckY)
            ctx.lineTo(spineX, spineY)
            ctx.stroke()

            // Neck to Head
            if (pose[0]) {
              ctx.beginPath()
              ctx.moveTo(neckX, neckY)
              ctx.lineTo(pose[0].x, pose[0].y)
              ctx.stroke()
            }
          }

          // 2. Draw Joint Reticles
          ctx.shadowBlur = 0
          const jointIndices = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]
          jointIndices.forEach((idx) => {
            const pt = pose[idx]
            if (pt && (pt.visibility === undefined || pt.visibility > 0.4)) {
              // Outer concentric ring
              ctx.strokeStyle = color
              ctx.lineWidth = 1.5
              ctx.beginPath()
              ctx.arc(pt.x, pt.y, jSize, 0, Math.PI * 2)
              ctx.stroke()

              // Center joint pivot
              ctx.fillStyle = jointCol
              ctx.beginPath()
              ctx.arc(pt.x, pt.y, jSize * 0.45, 0, Math.PI * 2)
              ctx.fill()
            }
          })

          ctx.restore()
        },

        // --- 5-FINGER ARTICULATED HAND SKELETON RENDERING ---
        renderFingerSkeletons(hands, v) {
          const fingerCol = v.fingerColor || '#00e5ff'
          const bWidth = Math.max(1.2, (v.boneWidth || 3.0) * 0.65)
          const jSize = Math.max(2, (v.jointSize || 5) * 0.6)

          // 21-joint Hand Bone Connections
          const fingerBones = [
            // Palm
            [0, 1], [0, 5], [5, 9], [9, 13], [13, 17], [0, 17],
            // Thumb
            [1, 2], [2, 3], [3, 4],
            // Index
            [5, 6], [6, 7], [7, 8],
            // Middle
            [9, 10], [10, 11], [11, 12],
            // Ring
            [13, 14], [14, 15], [15, 16],
            // Pinky
            [17, 18], [18, 19], [19, 20],
          ]

          // Color palette for individual fingers
          const fingerColors = [
            '#ff3b30', // Thumb: Red-Orange
            '#00e5ff', // Index: Cyan
            '#00ff66', // Middle: Lime
            '#ffd60a', // Ring: Yellow
            '#bf5af2', // Pinky: Purple
          ]

          ctx.save()
          ctx.lineCap = 'round'
          ctx.lineJoin = 'round'

          hands.forEach((handPts) => {
            if (!handPts || handPts.length < 21) return

            // 1. Draw Finger Bones
            ctx.shadowColor = fingerCol
            ctx.shadowBlur = 8
            ctx.lineWidth = bWidth

            fingerBones.forEach(([i1, i2]) => {
              const p1 = handPts[i1]
              const p2 = handPts[i2]
              if (p1 && p2) {
                // Determine finger index: Thumb(1-4), Index(5-8), Middle(9-12), Ring(13-16), Pinky(17-20)
                let c = fingerCol
                if (i2 >= 1 && i2 <= 4) c = fingerColors[0]
                else if (i2 >= 5 && i2 <= 8) c = fingerColors[1]
                else if (i2 >= 9 && i2 <= 12) c = fingerColors[2]
                else if (i2 >= 13 && i2 <= 16) c = fingerColors[3]
                else if (i2 >= 17 && i2 <= 20) c = fingerColors[4]

                ctx.strokeStyle = c
                ctx.beginPath()
                ctx.moveTo(p1.x, p1.y)
                ctx.lineTo(p2.x, p2.y)
                ctx.stroke()
              }
            })

            // 2. Draw Finger Joints & Fingertip Laser Nodes
            ctx.shadowBlur = 0
            handPts.forEach((pt, jIdx) => {
              const isTip = jIdx === 4 || jIdx === 8 || jIdx === 12 || jIdx === 16 || jIdx === 20
              if (isTip) {
                // Glowing Fingertip Target Node
                ctx.fillStyle = '#ffffff'
                ctx.beginPath()
                ctx.arc(pt.x, pt.y, jSize * 1.3, 0, Math.PI * 2)
                ctx.fill()

                ctx.strokeStyle = fingerCol
                ctx.lineWidth = 1.2
                ctx.beginPath()
                ctx.arc(pt.x, pt.y, jSize * 2.2, 0, Math.PI * 2)
                ctx.stroke()
              } else {
                // Interior Phalange Joint
                ctx.fillStyle = '#ffffff'
                ctx.beginPath()
                ctx.arc(pt.x, pt.y, jSize * 0.75, 0, Math.PI * 2)
                ctx.fill()
              }
            })
          })

          ctx.restore()
        },

        // --- MOTION TRAILS & FINGERTIP RIBBONS ---
        updateAndRenderTrails(pose, hands, v) {
          const maxLen = v.trailLength !== undefined ? v.trailLength : 18
          const now = performance.now()

          // Track key active points: Wrists and Fingertips
          const trackerPoints = []
          if (pose) {
            if (pose[15]) trackerPoints.push({ id: 'wrist_l', x: pose[15].x, y: pose[15].y, col: '#00ff88' })
            if (pose[16]) trackerPoints.push({ id: 'wrist_r', x: pose[16].x, y: pose[16].y, col: '#00ff88' })
            if (pose[0])  trackerPoints.push({ id: 'head',    x: pose[0].x,  y: pose[0].y,  col: '#ffd60a' })
          }
          if (hands) {
            hands.forEach((h, hIdx) => {
              const tips = [4, 8, 12, 16, 20]
              tips.forEach((tipIdx) => {
                if (h[tipIdx]) {
                  trackerPoints.push({
                    id: `hand_${hIdx}_tip_${tipIdx}`,
                    x: h[tipIdx].x,
                    y: h[tipIdx].y,
                    col: '#00e5ff',
                  })
                }
              })
            })
          }

          // Update motion trail buffers
          trackerPoints.forEach((tp) => {
            if (!this.motionTrails[tp.id]) this.motionTrails[tp.id] = []
            this.motionTrails[tp.id].unshift({ x: tp.x, y: tp.y, time: now })
            if (this.motionTrails[tp.id].length > maxLen) {

            const trail = this.motionTrails[tp.id]
            if (trail && trail.length >= 3) {
              ctx.strokeStyle = tp.col
              ctx.shadowColor = tp.col
              ctx.shadowBlur = 8
              ctx.lineCap = 'round'

              for (let i = 0; i < trail.length - 1; i++) {
                const alpha = (1 - i / trail.length) * 0.75
                const width = Math.max(1, (1 - i / trail.length) * 3.5)
                ctx.globalAlpha = alpha
                ctx.lineWidth = width
                ctx.beginPath()
                ctx.moveTo(trail[i].x, trail[i].y)
                ctx.lineTo(trail[i + 1].x, trail[i + 1].y)
                ctx.stroke()
              }
            }
          })
          ctx.restore()

          const { W, H } = env
          ctx.save()

          // 1. Calculate & Render Anatomical Joint Angles
          if (v.showAngles !== false && pose) {
            const angleCalculators = [
              { name: 'L.ELBOW', a: 11, b: 13, c: 15 }, // Shoulder - Elbow - Wrist
              { name: 'R.ELBOW', a: 12, b: 14, c: 16 },
              { name: 'L.KNEE',  a: 23, b: 25, c: 27 }, // Hip - Knee - Ankle
              { name: 'R.KNEE',  a: 24, b: 26, c: 28 },
            ]

            ctx.font = '9px monospace'
            ctx.fillStyle = '#00ff88'

            angleCalculators.forEach(({ name, a, b, c }) => {
              const pA = pose[a], pB = pose[b], pC = pose[c]
              if (pA && pB && pC) {
                const angleRad = Math.atan2(pC.y - pB.y, pC.x - pB.x) - Math.atan2(pA.y - pB.y, pA.x - pB.x)
                let deg = Math.abs(Math.round((angleRad * 180) / Math.PI))
                if (deg > 180) deg = 360 - deg

                // Draw technical angle label near joint
                const tag = `${name}: ${deg}°`
                ctx.fillStyle = 'rgba(10, 14, 20, 0.75)'
                const tw = ctx.measureText(tag).width
                ctx.fillRect(pB.x + 8, pB.y - 7, tw + 4, 11)
                ctx.fillStyle = '#00ff88'
                ctx.fillText(tag, pB.x + 10, pB.y + 2)

                // Arc indicator around joint pivot
                ctx.strokeStyle = '#00ff88'
                ctx.lineWidth = 1
                ctx.beginPath()
                ctx.arc(pB.x, pB.y, 10, 0, (deg * Math.PI) / 180)
                ctx.stroke()
              }
            })
          }

          // 2. Render Hand & Pose Bounding Boxes
          if (v.showBBoxes !== false) {
            if (hands && hands.length > 0) {
              hands.forEach((hPts, idx) => {
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity
                hPts.forEach((p) => {
                  if (p.x < minX) minX = p.x
                  if (p.x > maxX) maxX = p.x
                  if (p.y < minY) minY = p.y
                  if (p.y > maxY) maxY = p.y
                })
                const pad = 12
                const bx = Math.max(4, minX - pad)
                const by = Math.max(4, minY - pad)
                const bw = Math.min(W - bx - 4, maxX - minX + pad * 2)
                const bh = Math.min(H - by - 4, maxY - minY + pad * 2)

                ctx.strokeStyle = '#00e5ff'
                ctx.lineWidth = 1.0
                ctx.strokeRect(bx, by, bw, bh)

                ctx.font = '9px monospace'
                const tag = `HAND_${idx + 1} [${Math.round(bx)},${Math.round(by)}]`
                ctx.fillStyle = 'rgba(10, 14, 20, 0.75)'
                ctx.fillRect(bx, by - 12, ctx.measureText(tag).width + 4, 11)
                ctx.fillStyle = '#00e5ff'
                ctx.fillText(tag, bx + 2, by - 3)
              })
            }
          }

          ctx.restore()
        },

        initGrid(cols, rows, sz) {
          this.gridW = cols
          this.gridH = rows
          this.cellSize = sz
          const total = cols * rows
          this.trailR = new Float32Array(total)
          this.trailG = new Float32Array(total)
          this.trailB = new Float32Array(total)
          this.trailLife = new Float32Array(total)
          this.prevR = new Uint8Array(total)
          this.prevG = new Uint8Array(total)
          this.prevB = new Uint8Array(total)
          this.downCanvas.width = cols
          this.downCanvas.height = rows
          this.downCtx = this.downCanvas.getContext('2d', {
            willReadFrequently: true,
          })
        },

        draw(v, dt) {
          const { W, H, cursor } = env
          env.time += dt

          const sz = Math.max(4, Math.floor(v.pixelSize))
          const cols = Math.ceil(W / sz)
          const rows = Math.ceil(H / sz)

          if (
            this.gridW !== cols ||
            this.gridH !== rows ||
            this.cellSize !== sz ||
            !this.downCtx
          ) {
            this.initGrid(cols, rows, sz)
          }

          // Sample downsampled source frame
          this.downCtx.drawImage(env.sourceCanvas, 0, 0, cols, rows)
          const imgData = this.downCtx.getImageData(0, 0, cols, rows)
          const data = imgData.data

          const motionThreshold = Math.max(
            0.02,
            (1 - v.motionSensitivity) * 0.22,
          )
          const persistence = v.persistence
          const glow = v.glowIntensity

          let activeCount = 0

          // 1. Process cells: detect motion triggers and decay unactivated cells
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const idx = y * cols + x
              const pIdx = idx * 4

              const r = data[pIdx]
              const g = data[pIdx + 1]
              const b = data[pIdx + 2]

              // Motion delta
              const pr = this.prevR[idx]
              const pg = this.prevG[idx]
              const pb = this.prevB[idx]
              const motion =
                (Math.abs(r - pr) + Math.abs(g - pg) + Math.abs(b - pb)) /
                (3 * 255)

              // Update previous frame
              this.prevR[idx] = r
              this.prevG[idx] = g
              this.prevB[idx] = b

              // Motion trigger
              if (motion > motionThreshold) {
                this.trailLife[idx] = 1.0
                this.trailR[idx] = r
                this.trailG[idx] = g
                this.trailB[idx] = b
              } else {
                this.trailLife[idx] *= persistence
              }

              if (this.trailLife[idx] > 0.02) activeCount++

          ctx.fillStyle = '#0a0b10'
          ctx.fillRect(0, 0, W, H)

            ctx.save()
            ctx.globalAlpha = 1 - v.backgroundDim
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            ctx.restore()
          }

          // Draw trailing pixel blocks
          ctx.save()
          if (v.blendMode !== 'source-over') {
            ctx.globalCompositeOperation = v.blendMode
          }

          const mode = v.colorMode
          const showGrid = v.showGrid
          const gridColor = v.gridColor

          // Parse tint color once if tint mode
          let tintR = 0,
            tintG = 255,
            tintB = 136
          if (mode === 'tint') {
            const hex = v.trailColor.replace('#', '')
            tintR = parseInt(hex.substring(0, 2), 16) || 0
            tintG = parseInt(hex.substring(2, 4), 16) || 255
            tintB = parseInt(hex.substring(4, 6), 16) || 136
          }

          for (let y = 0; y < rows; y++) {
            const py = y * sz
            for (let x = 0; x < cols; x++) {
              const idx = y * cols + x
              const life = this.trailLife[idx]
              if (life <= 0.02) continue

              const px = x * sz
              let cr = 0,
                cg = 0,
                cb = 0,
                alpha = life

              if (mode === 'original') {
                cr = this.trailR[idx] * glow
                cg = this.trailG[idx] * glow
                cb = this.trailB[idx] * glow
              } else if (mode === 'chromatic') {
                // Signature chromatic aberration: R, G, B decay at different rates
                const rLife = life
                const gLife = Math.pow(life, 1.25)
                const bLife = Math.pow(life, 1.6)
                cr = this.trailR[idx] * rLife * glow
                cg = this.trailG[idx] * gLife * glow
                cb = this.trailB[idx] * bLife * glow
              } else if (mode === 'phosphor') {
                // Cyberpunk CRT phosphor glow (green/amber)
                cr = 20 * life
                cg = 255 * Math.min(1, life * 1.3) * glow
                cb = 140 * Math.pow(life, 2) * glow
              } else if (mode === 'thermal') {
                // Heat map spectrum based on trail age/life
                const [tr, tg, tb] = this.thermalColor(life)
                cr = tr * glow
                cg = tg * glow
                cb = tb * glow
              } else if (mode === 'tint') {
                cr = tintR * life * glow
                cg = tintG * life * glow
                cb = tintB * life * glow
              }

              ctx.fillStyle = `rgb(${Math.min(255, cr | 0)}, ${Math.min(255, cg | 0)}, ${Math.min(255, cb | 0)})`

              } else {

            ctx.globalAlpha = 0.35
            ctx.strokeStyle = gridColor
            ctx.lineWidth = 0.5
            ctx.beginPath()
            for (let x = 0; x <= W; x += sz) {
              ctx.moveTo(x + 0.5, 0)
              ctx.lineTo(x + 0.5, H)
            }
            for (let y = 0; y <= H; y += sz) {
              ctx.moveTo(0, y + 0.5)
              ctx.lineTo(W, y + 0.5)
            }
            ctx.stroke()
          }

          ctx.restore()

          return `${activeCount.toLocaleString()} active trail blocks · ${sz}px grid`
        },

        thermalColor(t) {
          let r = 0,
            g = 0,
            b = 0
          if (t < 0.25) {
            b = Math.floor(t * 4 * 255)
          } else if (t < 0.5) {
            r = Math.floor((t - 0.25) * 4 * 255)
            b = 255
          } else if (t < 0.75) {
            r = 255
            g = Math.floor((t - 0.5) * 4 * 200)
            b = Math.floor((1 - (t - 0.5) * 4) * 255)
          } else {
            r = 255
            g = Math.floor(200 + (t - 0.75) * 4 * 55)
            b = Math.floor((t - 0.75) * 4 * 255)
          }
          return [r, g, b]
        },

        applyDrift(cols, rows, dir, rate) {
          const shiftChance = Math.min(0.6, rate)
          if (dir === 'down (drip)') {
            for (let y = rows - 2; y >= 0; y--) {
              for (let x = 0; x < cols; x++) {
                const i = y * cols + x
                const down = (y + 1) * cols + x
                if (this.trailLife[i] > 0.05 && Math.random() < shiftChance) {
                  this.trailLife[down] = Math.max(
                    this.trailLife[down],
                    this.trailLife[i] * 0.95,
                  )
                  this.trailR[down] = this.trailR[i]
                  this.trailG[down] = this.trailG[i]
                  this.trailB[down] = this.trailB[i]
                }
              }
            }
          } else if (dir === 'up (float)') {
            for (let y = 1; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                const i = y * cols + x
                const up = (y - 1) * cols + x
                if (this.trailLife[i] > 0.05 && Math.random() < shiftChance) {
                  this.trailLife[up] = Math.max(
                    this.trailLife[up],
                    this.trailLife[i] * 0.95,
                  )
                  this.trailR[up] = this.trailR[i]
                  this.trailG[up] = this.trailG[i]
                  this.trailB[up] = this.trailB[i]
                }
              }
            }
          } else if (dir === 'wind-right') {
            for (let y = 0; y < rows; y++) {
              for (let x = cols - 2; x >= 0; x--) {
                const i = y * cols + x
                const right = y * cols + (x + 1)
                if (this.trailLife[i] > 0.05 && Math.random() < shiftChance) {
                  this.trailLife[right] = Math.max(
                    this.trailLife[right],
                    this.trailLife[i] * 0.95,
                  )
                  this.trailR[right] = this.trailR[i]
                  this.trailG[right] = this.trailG[i]
                  this.trailB[right] = this.trailB[i]
                }
              }
            }
          } else if (dir === 'scatter') {
            for (let y = 1; y < rows - 1; y++) {
              for (let x = 1; x < cols - 1; x++) {
                const i = y * cols + x
                if (
                  this.trailLife[i] > 0.1 &&
                  Math.random() < shiftChance * 0.3

                  const ox = Math.random() > 0.5 ? 1 : -1
                  const oy = Math.random() > 0.5 ? 1 : -1
                  const ni = (y + oy) * cols + (x + ox)
                  this.trailLife[ni] = Math.max(
                    this.trailLife[ni],
                    this.trailLife[i] * 0.9,

                }
              }
            }

        // Internal rendering buffers (zero allocation per frame)
        animTime: 0,
        cols: 0,
        rows: 0,
        sampleCanvas: document.createElement('canvas'),
        sampleCtx: null,
        offCanvas: document.createElement('canvas'),
        offCtx: null,
        imgData: null,
        pixels32: null,
        lumGrid: null,
        beamGrid: null,
        srcRGrid: null,
        srcGGrid: null,
        srcBGrid: null,

        initBuffers(cols, rows) {
          if (this.cols === cols && this.rows === rows && this.imgData) return
          this.cols = cols
          this.rows = rows

          this.sampleCanvas.width = cols
          this.sampleCanvas.height = rows
          this.sampleCtx = this.sampleCanvas.getContext('2d', {
            willReadFrequently: true,
          })

          this.offCanvas.width = cols
          this.offCanvas.height = rows
          this.offCtx = this.offCanvas.getContext('2d')

          this.imgData = this.offCtx.createImageData(cols, rows)
          this.pixels32 = new Uint32Array(this.imgData.data.buffer)

          const size = cols * rows
          this.lumGrid = new Float32Array(size)
          this.beamGrid = new Float32Array(size)
          this.srcRGrid = new Uint8Array(size)
          this.srcGGrid = new Uint8Array(size)
          this.srcBGrid = new Uint8Array(size)
        },

          } else if (name === 'Cyberpunk Neon (Dual Chromatic)') {

            v.waveAmplitude = 0.6
            v.wavePattern = 'glitch-steps'
            v.pixelSize = 4

            v.ditherLevels = '2-level (1-bit Binary)'
            v.threshold = 0.45
            v.spread = 1.2

          } else if (name === 'Source Color Rainbow Dither') {
            v.colorPalette = 'source-rgb'
            v.beamDirection = 'down'
            v.beamLength = 35
            v.beamIntensity = 1.3
            v.beamDecay = 0.86
            v.waveSpeed = 1.4
            v.waveFrequency = 2.5
            v.waveAmplitude = 0.4
            v.wavePattern = 'harmonic-sine'
            v.pixelSize = 4
            v.ditherPattern = 'bayer8'
            v.ditherLevels = 'continuous'
            v.threshold = 0.48
            v.spread = 1.1

        draw(v, dt) {
          const { W, H } = env
          if (!W || !H) return 'Initializing'

          this.animTime += dt * v.waveSpeed
          const time = this.animTime

          const pSize = Math.max(2, Math.floor(v.pixelSize))
          const cols = Math.ceil(W / pSize)
          const rows = Math.ceil(H / pSize)
          this.initBuffers(cols, rows)

          // 1. Downscale source frame into sample buffer
          this.sampleCtx.drawImage(env.sourceCanvas, 0, 0, cols, rows)
          const srcData = this.sampleCtx.getImageData(0, 0, cols, rows).data

          const lumGrid = this.lumGrid
          const beamGrid = this.beamGrid
          const srcRGrid = this.srcRGrid
          const srcGGrid = this.srcGGrid
          const srcBGrid = this.srcBGrid
          const pixels32 = this.pixels32

          const wFreq = v.waveFrequency
          const wAmp = v.waveAmplitude
          const wPattern = v.wavePattern
          const cursor = env.cursor
          const hasCursor = env.cursorEnabled && cursor && (cursor.x > 0 || cursor.y > 0)
          const mouseU = hasCursor ? cursor.x / W : -10
          const mouseV = hasCursor ? cursor.y / H : -10
          const rippleStrength = env.cursorEnabled ? v.interactiveRipple : 0

          // 2. Wave displacement & luminance sampling
          for (let y = 0; y < rows; y++) {
            const vCoord = y / rows
            for (let x = 0; x < cols; x++) {
              const uCoord = x / cols
              let dispX = 0
              let dispY = 0
              let waveLum = 0

              if (wPattern === 'ocean-swell') {
                const swell = Math.sin(
                  (uCoord * 2.2 + vCoord * 3.4) * wFreq - time,
                )
                dispX = swell * 0.05 * wAmp
                dispY =
                  Math.cos((uCoord * 3.0 - vCoord * 1.5) * wFreq + time * 0.8) *
                  0.04 *
                  wAmp
                waveLum = (swell * 0.5 + 0.5) * (wAmp * 0.45)
              } else if (wPattern === 'diagonal-flow') {
                const diag = Math.sin(
                  (uCoord + vCoord) * wFreq * 3.8 - time * 1.6,
                )
                dispX = diag * 0.045 * wAmp
                dispY = diag * 0.045 * wAmp
                waveLum = (diag * 0.5 + 0.5) * (wAmp * 0.5)
              } else if (wPattern === 'radial-pulse') {
                const dx = uCoord - 0.5
                const dy = vCoord - 0.5
                const r = Math.hypot(dx, dy)
                const p = Math.sin(r * wFreq * 16.0 - time * 2.5)
                dispX = (dx / (r || 1)) * p * 0.05 * wAmp
                dispY = (dy / (r || 1)) * p * 0.05 * wAmp
                waveLum = (p * 0.5 + 0.5) * (wAmp * 0.4)
              } else if (wPattern === 'glitch-steps') {
                const step = Math.floor(vCoord * 14.0)
                const g =
                  (Math.sin(step * 78.2 + Math.floor(time * 5.0)) > 0.4
                    ? 0.06
                    : -0.02) * wAmp
                dispX = g
                dispY = 0
                waveLum = (step % 2 === 0 ? 0.2 : -0.1) * wAmp
              } else {
                // harmonic-sine (default)
                const w1 = Math.sin(vCoord * wFreq * 6.28 + time)
                const w2 = Math.cos(uCoord * wFreq * 4.71 - time * 0.7)
                dispX = (w1 * 0.035 + w2 * 0.02) * wAmp
                dispY =
                  (Math.cos(vCoord * wFreq * 5.0 - time * 0.8) * 0.035 +
                    Math.sin(uCoord * wFreq * 3.14 + time) * 0.02) *
                  wAmp
                waveLum =
                  (Math.sin(
                    (uCoord * 1.5 + vCoord * 2.5) * wFreq * 3.14 - time,
                  ) *
                    0.5 +
                    0.5) *
                  (wAmp * 0.4)
              }

              // Interactive mouse ripple deflection
              if (hasCursor) {
                const dist = Math.hypot(uCoord - mouseU, vCoord - mouseV)
                if (dist < 0.45) {
                  const rip =
                    Math.sin(dist * 28.0 - time * 9.0) *
                    Math.exp(-dist * 5.0) *
                    rippleStrength *
                    0.07
                  dispX += ((uCoord - mouseU) / (dist || 1)) * rip
                  dispY += ((vCoord - mouseV) / (dist || 1)) * rip
                  waveLum += rip * 2.5
                }
              }

              const sx = Math.max(
                0,
                Math.min(cols - 1, Math.round((uCoord + dispX) * cols)),
              )
              const sy = Math.max(
                0,
                Math.min(rows - 1, Math.round((vCoord + dispY) * rows)),
              )
              const sidx = (sy * cols + sx) * 4

              const r = srcData[sidx]
              const g = srcData[sidx + 1]
              const b = srcData[sidx + 2]

              const idx = y * cols + x
              srcRGrid[idx] = r
              srcGGrid[idx] = g
              srcBGrid[idx] = b

              let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255
              lum = Math.min(1, Math.max(0, lum + waveLum))
              lumGrid[idx] = lum
            }
          }

          // 3. Pixel Beams Extrusion
          const bDir = v.beamDirection
          const intensity = v.beamIntensity
          const decay = v.beamDecay
          const beamThreshold = 0.42

          if (bDir === 'down') {
            for (let x = 0; x < cols; x++) {
              let beam = 0
              for (let y = 0; y < rows; y++) {
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beam = Math.max(emit, beam * decay)
                beamGrid[idx] = beam
              }
            }
          } else if (bDir === 'up') {
            for (let x = 0; x < cols; x++) {
              let beam = 0
              for (let y = rows - 1; y >= 0; y--) {
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beam = Math.max(emit, beam * decay)
                beamGrid[idx] = beam
              }
            }
          } else if (bDir === 'horizontal') {
            for (let y = 0; y < rows; y++) {
              let beam = 0
              for (let x = 0; x < cols; x++) {
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beam = Math.max(emit, beam * decay)
                beamGrid[idx] = beam
              }
            }
          } else if (bDir === 'diagonal-down') {
            for (let y = 0; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                const prev =
                  x > 0 && y > 0 ? beamGrid[(y - 1) * cols + (x - 1)] : 0
                const idx = y * cols + x
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.8 * intensity
                    : 0
                beamGrid[idx] = Math.max(emit, prev * decay)
              }
            }
          } else {
            // radial-out
            const cx = cols / 2
            const cy = rows / 2
            for (let y = 0; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                const idx = y * cols + x
                const dist = Math.hypot(x - cx, y - cy)
                const radialFactor =
                  Math.sin(dist * 0.15 - time * 2.0) * 0.5 + 0.5
                const lum = lumGrid[idx]
                const emit =
                  lum > beamThreshold
                    ? (lum - beamThreshold) * 1.5 * intensity
                    : 0
                beamGrid[idx] = emit * (0.6 + radialFactor * 0.6)
              }
            }
          }

          // 4. Dithering Matrix calculation & Color mapping
          const pattern = v.ditherPattern
          const levels = v.ditherLevels
          const threshold = v.threshold
          const spread = v.spread
          const contrast = v.contrast
          const palette = v.colorPalette

          const customA = parseHexColor(v.colorA)
          const customB = parseHexColor(v.colorB)

          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const idx = y * cols + x
              let effLum = lumGrid[idx] + beamGrid[idx] * 0.85
              effLum = Math.max(0, Math.min(1, (effLum - 0.5) * contrast + 0.5))

              // Pattern matrix threshold lookup
              let bVal = 0.5
              if (pattern === 'bayer4') {
                bVal = BAYER4_DATA[(y & 3) * 4 + (x & 3)]
              } else if (pattern === 'bayer8') {
                bVal = BAYER8_DATA[(y & 7) * 8 + (x & 7)]
              } else if (pattern === 'bayer2') {
                bVal = BAYER2_DATA[(y & 1) * 2 + (x & 1)]
              } else if (pattern === 'clustered-dot') {
                bVal = CLUSTERED4_DATA[(y & 3) * 4 + (x & 3)]
              } else if (pattern === 'blue-noise') {
                bVal = hashNoise(x, y)
              }

              const dithered = effLum + (bVal - 0.5) * spread

              // Quantize levels
              let state = 0
              if (levels.startsWith('2-level')) {
                state = dithered >= threshold ? 1.0 : 0.0
              } else if (levels.startsWith('4-level')) {
                const q = Math.floor((dithered - threshold + 0.5) * 3 + 0.5)
                state = Math.max(0, Math.min(3, q)) / 3
              } else if (levels.startsWith('8-level')) {
                const q = Math.floor((dithered - threshold + 0.5) * 7 + 0.5)
                state = Math.max(0, Math.min(7, q)) / 7
              } else {
                state = Math.max(0, Math.min(1, dithered))
              }

              // Color mapping
              let r = 0,
                g = 0,
                b = 0
              if (palette === 'neon-cyan') {
                if (state <= 0) {
                  r = 6
                  g = 10
                  b = 28
                } else {
                  const core = Math.max(0, Math.min(1, (effLum - 0.72) / 0.28))
                  r = Math.round(0 + core * 210)
                  g = Math.round(225 + core * 30)
                  b = 255
                }
              } else if (palette === 'cyber-green') {
                if (state <= 0) {
                  r = 3
                  g = 14
                  b = 8
                } else {
                  const core = Math.max(0, Math.min(1, (effLum - 0.72) / 0.28))
                  r = Math.round(core * 200)
                  g = 255
                  b = Math.round(100 + core * 145)
                }
              } else if (palette === 'amber-crt') {
                if (state <= 0) {
                  r = 16
                  g = 6
                  b = 1
                } else {
                  const core = Math.max(0, Math.min(1, (effLum - 0.72) / 0.28))
                  r = 255
                  g = Math.round(145 + core * 100)
                  b = Math.round(core * 180)
                }
              } else if (palette === 'gameboy') {
                if (state < 0.25) {
                  r = 15
                  g = 56
                  b = 15
                } else if (state < 0.55) {
                  r = 48
                  g = 98
                  b = 48
                } else if (state < 0.85) {
                  r = 139
                  g = 172
                  b = 15
                } else {
                  r = 155
                  g = 188
                  b = 15
                }
              } else if (palette === 'sunset') {
                if (state <= 0) {
                  r = 18
                  g = 4
                  b = 30
                } else if (effLum < 0.55) {
                  r = 255
                  g = 16
                  b = 120
                } else if (effLum < 0.8) {
                  r = 255
                  g = 170
                  b = 20
                } else {
                  r = 255
                  g = 245
                  b = 180
                }
              } else if (palette === 'source-rgb') {
                const sr = srcRGrid[idx]
                const sg = srcGGrid[idx]
                const sb = srcBGrid[idx]
                if (state <= 0.05) {
                  r = Math.round(sr * 0.12)
                  g = Math.round(sg * 0.12)
                  b = Math.round(sb * 0.12)
                } else {
                  r = Math.min(
                    255,
                    Math.round(sr * (0.4 + state * 1.1) + state * 40),
                  )
                  g = Math.min(
                    255,
                    Math.round(sg * (0.4 + state * 1.1) + state * 40),
                  )
                  b = Math.min(
                    255,
                    Math.round(sb * (0.4 + state * 1.1) + state * 40),
                  )
                }
              } else if (palette === 'monochrome') {
                const val = Math.round(state * 245 + 10)
                r = val
                g = val
                b = val
              } else {
                // custom
                const t = state
                r = Math.round(customA[0] + (customB[0] - customA[0]) * t)
                g = Math.round(customA[1] + (customB[1] - customA[1]) * t)
                b = Math.round(customA[2] + (customB[2] - customA[2]) * t)
                if (effLum > 0.8) {
                  const boost = (effLum - 0.8) / 0.2
                  r = Math.min(255, Math.round(r + boost * 55))
                  g = Math.min(255, Math.round(g + boost * 55))
                  b = Math.min(255, Math.round(b + boost * 55))
                }
              }

              pixels32[idx] = packRgba32(r, g, b, 255)
            }
          }

          // 5. Draw dither buffer to main screen
          this.offCtx.putImageData(this.imgData, 0, 0)

          ctx.imageSmoothingEnabled = false
          ctx.drawImage(this.offCanvas, 0, 0, W, H)

          // 6. Phosphor Bloom Glow
          if (v.bloomGlow > 0.01) {
            ctx.save()
            ctx.globalCompositeOperation = 'screen'
            ctx.globalAlpha = v.bloomGlow
            ctx.filter = 'blur(6px)'
            ctx.drawImage(this.offCanvas, 0, 0, W, H)
            ctx.restore()
          }

          // 7. CRT Scanlines
          if (v.scanlines > 0.01) {
            ctx.save()
            ctx.fillStyle = `rgba(0, 0, 0, ${v.scanlines})`
            const step = Math.max(2, pSize)
            for (let y = 0; y < H; y += step) {
              ctx.fillRect(0, y, W, 1)
            }
            ctx.restore()
          }

          // 8. Cinematic Vignette
          if (v.vignette > 0.01) {
            ctx.save()
            const vig = ctx.createRadialGradient(
              W / 2,
              H / 2,
              Math.min(W, H) * 0.35,
              W / 2,
              H / 2,
              Math.max(W, H) * 0.72,
            )
            vig.addColorStop(0, 'rgba(0, 0, 0, 0)')
            vig.addColorStop(1, `rgba(0, 0, 0, ${v.vignette * 0.9})`)
            ctx.fillStyle = vig
            ctx.fillRect(0, 0, W, H)
            ctx.restore()
          }

          return `Dither Wave ${cols}×${rows} · ${pSize}px · ${v.colorPalette} · ${v.ditherPattern} · ${v.beamDirection} beams`
        },

          glCanvas = document.createElement('canvas')
          gl = glCanvas.getContext('webgl2', { premultipliedAlpha: false, preserveDrawingBuffer: true })
          if (gl) {
            isWebGL2 = true
          } else {
            gl = glCanvas.getContext('webgl', { premultipliedAlpha: false, preserveDrawingBuffer: true }) ||
                 glCanvas.getContext('experimental-webgl', { premultipliedAlpha: false, preserveDrawingBuffer: true })
            isWebGL2 = false
          }

          if (gl) {
            quadBuffer = gl.createBuffer()
            gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer)
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
              -1, -1,
               1, -1,
              -1,  1,
               1,  1,
            ]), gl.STATIC_DRAW)

            sharedTexture = gl.createTexture()
            gl.bindTexture(gl.TEXTURE_2D, sharedTexture)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)

            // Create Paper Shaders Noise Texture
            noiseTexture = gl.createTexture()
            gl.bindTexture(gl.TEXTURE_2D, noiseTexture)
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([128, 128, 128, 255]))
            const noiseImg = new Image()
            noiseImg.onload = () => {
              gl.bindTexture(gl.TEXTURE_2D, noiseTexture)
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, noiseImg)
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT)
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT)
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
            }
            noiseImg.src = noiseDataUri
          }
        }
        return { glCanvas, gl, quadBuffer, sharedTexture, noiseTexture, isWebGL2 }
      }

      function compileShader(glContext, type, source) {
        const shader = glContext.createShader(type)
        glContext.shaderSource(shader, source)
        glContext.compileShader(shader)
        if (!glContext.getShaderParameter(shader, glContext.COMPILE_STATUS)) {
          console.error('Shader compile error:', glContext.getShaderInfoLog(shader))
          glContext.deleteShader(shader)
          return null
        }
        return shader
      }

      function getOrCreateProgram(id, fsSource, customVsSource = null) {
        const { gl, isWebGL2 } = getWebGL()
        if (!gl) return null
        if (shaderPrograms[id]) return shaderPrograms[id]

        let vsSource = customVsSource
        if (!vsSource) {
          if (fsSource.trim().startsWith('#version 300 es')) {
            vsSource = `#version 300 es
              in vec2 a_position;
              out vec2 v_imageUV;
              out vec2 v_uv;
              void main() {
                vec2 uv = (a_position + 1.0) * 0.5;
                v_uv = uv;
                v_imageUV = vec2(uv.x, 1.0 - uv.y);
                gl_Position = vec4(a_position, 0.0, 1.0);
              }
            `
          } else {
            vsSource = `
              attribute vec2 a_position;
              varying vec2 v_uv;
              void main() {
                v_uv = (a_position + 1.0) * 0.5;
                v_uv.y = 1.0 - v_uv.y;
                gl_Position = vec4(a_position, 0.0, 1.0);
              }
            `
          }
        }

        const vs = compileShader(gl, gl.VERTEX_SHADER, vsSource)
        const fs = compileShader(gl, gl.FRAGMENT_SHADER, fsSource)
        if (!vs || !fs) return null

        const prog = gl.createProgram()
        gl.attachShader(prog, vs)
        gl.attachShader(prog, fs)
        gl.linkProgram(prog)
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          console.error('Program link error for ' + id + ':', gl.getProgramInfoLog(prog))
          return null
        }

        const positionLocation = gl.getAttribLocation(prog, 'a_position')
        shaderPrograms[id] = { prog, positionLocation }
        return shaderPrograms[id]
      }

      function hexToRgb(hex) {
        if (!hex || hex[0] !== '#') return [0, 0, 0]
        let c = hex.substring(1)
        if (c.length === 3) c = c.split('').map(x => x + x).join('')
        const num = parseInt(c, 16)
        return [(num >> 16 & 255) / 255, (num >> 8 & 255) / 255, (num & 255) / 255]
      }

      // ======================================================================
      // EFFECT: depth-map (Depth Map Computer Vision & Styling)
      // Real-time monocular depth estimation with perspective priors,
      // high-frequency gradient energy, dark channel / haze attenuation,
      // and scientific/cinematic visual styles (LiDAR Turbo, Infrared NVG,
      // Topographic Contours, Depth of Field Bokeh, Anaglyph 3D Stereo,
      // Surface Normal Relief, Cyberpunk Holo-Grid, and Pristine Linear Depth).
      // ======================================================================
      const depthMapFS = `#version 300 es
        precision highp float;

        in mediump vec2 v_imageUV;
        in mediump vec2 v_uv;
        out vec4 fragColor;

        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform vec2 u_cursor;

        uniform int u_style;
        uniform int u_colorMap;
        uniform float u_overlaySource;
        uniform float u_invert;

        uniform float u_contrastBoost;
        uniform float u_perspectiveBias;
        uniform float u_edgeSharpness;
        uniform float u_horizonLevel;
        uniform float u_subjectBoost;

        uniform float u_isoContours;
        uniform float u_contourLineWidth;
        uniform float u_focalDistance;
        uniform float u_bokehAperture;
        uniform float u_parallax;
        uniform float u_lightAngle;
        uniform float u_laserScan;

        float getLum(vec3 c) {
          return dot(c, vec3(0.299, 0.587, 0.114));
        }

        float sampleDepth(vec2 uv) {
          vec2 texel = 1.0 / u_resolution;
          vec3 col = texture(u_image, uv).rgb;
          float lum = getLum(col);

          float ground = clamp((uv.y - u_horizonLevel) / max(1.0 - u_horizonLevel, 0.02), 0.0, 1.0);
          float perspRamp = 1.0 - pow(ground, 0.75);

          float lLeft  = getLum(texture(u_image, uv - vec2(texel.x * 2.5, 0.0)).rgb);
          float lRight = getLum(texture(u_image, uv + vec2(texel.x * 2.5, 0.0)).rgb);
          float lUp    = getLum(texture(u_image, uv - vec2(0.0, texel.y * 2.5)).rgb);
          float lDown  = getLum(texture(u_image, uv + vec2(0.0, texel.y * 2.5)).rgb);
          vec2 grad = vec2(lRight - lLeft, lDown - lUp);
          float edgeEnergy = length(grad) * 2.2;

          float maxC = max(col.r, max(col.g, col.b));
          float minC = min(col.r, min(col.g, col.b));
          float sat = (maxC > 1e-4) ? (maxC - minC) / maxC : 0.0;

          vec2 centerVec = (uv - vec2(0.5, 0.55)) * vec2(u_resolution.x / u_resolution.y, 1.0);
          float subjectPrior = exp(-dot(centerVec, centerVec) * 4.5);

          float d = mix(perspRamp, 1.0 - lum, 0.35);
          d = mix(d, perspRamp, clamp(u_perspectiveBias * 0.5, 0.0, 1.0));
          d -= edgeEnergy * u_edgeSharpness * 0.35;
          d -= sat * 0.15;
          d -= subjectPrior * u_subjectBoost * 0.25;

          d = clamp(d, 0.01, 0.99);
          d = pow(d, max(u_contrastBoost, 0.1));

          if (u_invert > 0.5) d = 1.0 - d;
          return clamp(d, 0.0, 1.0);
        }

        vec3 colormapTurbo(float x) {
          x = clamp(x, 0.0, 1.0);
          const vec4 kRedVec4   = vec4(0.13572138,  4.61539260, -42.66032258,  132.13108234);
          const vec4 kGreenVec4 = vec4(0.09140261,  2.19418839,   4.84296658,  -14.18503333);
          const vec4 kBlueVec4  = vec4(0.10667330, 12.64194608, -60.58204836,  110.36276771);
          const vec2 kRedVec2   = vec2(-152.94239396,  59.28637943);
          const vec2 kGreenVec2 = vec2(   4.27729857,   2.82956604);
          const vec2 kBlueVec2  = vec2( -89.90310912,  27.34824973);

          vec4 v4 = vec4(1.0, x, x * x, x * x * x);
          vec2 v2 = v4.zw * v4.z;
          return clamp(vec3(
            dot(v4, kRedVec4)   + dot(v2, kRedVec2),
            dot(v4, kGreenVec4) + dot(v2, kGreenVec2),
            dot(v4, kBlueVec4)  + dot(v2, kBlueVec2)
          ), 0.0, 1.0);
        }

        vec3 colormapSpectral(float t) {
          t = clamp(t, 0.0, 1.0);
          if (t < 0.25) return mix(vec3(0.05, 0.1, 0.6), vec3(0.0, 0.7, 0.9), t * 4.0);
          if (t < 0.5)  return mix(vec3(0.0, 0.7, 0.9), vec3(0.1, 0.85, 0.3), (t - 0.25) * 4.0);
          if (t < 0.75) return mix(vec3(0.1, 0.85, 0.3), vec3(1.0, 0.9, 0.1), (t - 0.5) * 4.0);
          return mix(vec3(1.0, 0.9, 0.1), vec3(0.95, 0.15, 0.1), (t - 0.75) * 4.0);
        }

        vec3 colormapMagma(float t) {
          t = clamp(t, 0.0, 1.0);
          vec3 c1 = vec3(0.00, 0.00, 0.05);
          vec3 c2 = vec3(0.32, 0.07, 0.48);
          vec3 c3 = vec3(0.71, 0.21, 0.48);
          vec3 c4 = vec3(0.98, 0.55, 0.38);
          vec3 c5 = vec3(0.99, 0.99, 0.75);
          if (t < 0.25) return mix(c1, c2, t * 4.0);
          if (t < 0.50) return mix(c2, c3, (t - 0.25) * 4.0);
          if (t < 0.75) return mix(c3, c4, (t - 0.50) * 4.0);
          return mix(c4, c5, (t - 0.75) * 4.0);
        }

        vec3 colormapViridis(float t) {
          t = clamp(t, 0.0, 1.0);
          vec3 c1 = vec3(0.27, 0.00, 0.33);
          vec3 c2 = vec3(0.19, 0.41, 0.56);
          vec3 c3 = vec3(0.12, 0.63, 0.53);
          vec3 c4 = vec3(0.56, 0.79, 0.24);
          vec3 c5 = vec3(0.99, 0.91, 0.15);
          if (t < 0.25) return mix(c1, c2, t * 4.0);
          if (t < 0.50) return mix(c2, c3, (t - 0.25) * 4.0);
          if (t < 0.75) return mix(c3, c4, (t - 0.50) * 4.0);
          return mix(c4, c5, (t - 0.75) * 4.0);
        }

        vec3 colormapCyberpunk(float t) {
          t = clamp(t, 0.0, 1.0);
          vec3 c1 = vec3(0.04, 0.02, 0.16);
          vec3 c2 = vec3(0.48, 0.02, 0.45);
          vec3 c3 = vec3(0.95, 0.05, 0.65);
          vec3 c4 = vec3(0.00, 0.88, 1.00);
          vec3 c5 = vec3(0.95, 1.00, 1.00);
          if (t < 0.25) return mix(c1, c2, t * 4.0);
          if (t < 0.50) return mix(c2, c3, (t - 0.25) * 4.0);
          if (t < 0.75) return mix(c3, c4, (t - 0.50) * 4.0);
          return mix(c4, c5, (t - 0.75) * 4.0);
        }

        vec3 colormapEmerald(float t) {
          t = clamp(t, 0.0, 1.0);
          return mix(vec3(0.02, 0.10, 0.08), vec3(0.15, 1.00, 0.65), t);
        }

        vec3 applyPalette(float d) {
          if (u_colorMap == 0) return colormapTurbo(d);
          if (u_colorMap == 1) return colormapSpectral(d);
          if (u_colorMap == 2) return colormapMagma(d);
          if (u_colorMap == 3) return colormapViridis(d);
          if (u_colorMap == 4) return colormapCyberpunk(d);
          if (u_colorMap == 5) return colormapEmerald(d);
          return vec3(clamp(d, 0.0, 1.0));
        }

        void main() {
          vec2 uv = v_imageUV;
          float depth = sampleDepth(uv);
          vec3 srcCol = texture(u_image, uv).rgb;
          vec3 col = applyPalette(depth);

          // Style 0: LIDAR SCANNER (Turbo / Rainbow)
          if (u_style == 0) {
            if (u_isoContours > 0.5) {
              float ring = fract(depth * u_isoContours);
              float line = smoothstep(u_contourLineWidth * 0.06, 0.0, abs(ring - 0.5));
              col = mix(col, vec3(1.0), line * 0.45);
            }
            if (u_laserScan > 0.01) {
              float scanY = fract(u_time * 0.35);
              float scanDist = abs(uv.y - scanY);
              float laserBeam = exp(-scanDist * scanDist * 4000.0) * u_laserScan;
              col += vec3(0.3, 0.85, 1.0) * laserBeam * 2.2;
            }
          }
          // Style 1: INFRARED NIGHT VISION (NVG)
          else if (u_style == 1) {
            vec3 nvg = mix(vec3(0.01, 0.08, 0.03), vec3(0.15, 0.98, 0.35), pow(depth, 0.75));
            float scanline = sin(uv.y * u_resolution.y * 1.5) * 0.5 + 0.5;
            nvg *= 0.85 + 0.15 * scanline;
            float gn = fract(sin(dot(uv * (u_time + 1.0), vec2(12.9898, 78.233))) * 43758.5453);
            nvg += (gn - 0.5) * 0.07;
            vec2 sc = uv - 0.5;
            float vig = 1.0 - dot(sc, sc) * 1.5;
            col = nvg * clamp(vig, 0.0, 1.0);
          }
          // Style 2: TOPOGRAPHIC CONTOURS
          else if (u_style == 2) {
            vec3 bgTop = vec3(0.04, 0.06, 0.09);
            float bands = depth * max(u_isoContours, 4.0);
            float bandFrac = fract(bands);
            float majorLine = smoothstep(u_contourLineWidth * 0.08, 0.0, abs(fract(bands * 0.2) - 0.5));
            float minorLine = smoothstep(u_contourLineWidth * 0.05, 0.0, abs(bandFrac - 0.5));
            vec3 topoCol = applyPalette(depth);
            col = mix(bgTop, topoCol, 0.18 + 0.82 * max(minorLine * 0.7, majorLine));
          }
          // Style 3: DEPTH OF FIELD BOKEH
          else if (u_style == 3) {
            float coc = abs(depth - u_focalDistance) * (u_bokehAperture / u_resolution.y);
            vec3 bokehAcc = vec3(0.0);
            float totalW = 0.0;
            const int TAPS = 16;
            for (int i = 0; i < TAPS; i++) {
              float th = float(i) * 2.39996323;
              float r = sqrt(float(i + 1) / float(TAPS)) * coc;
              vec2 off = vec2(cos(th), sin(th)) * r;
              vec3 tapCol = texture(u_image, clamp(uv + off, 0.001, 0.999)).rgb;
              float w = 1.0 + getLum(tapCol) * 1.6;
              bokehAcc += tapCol * w;
              totalW += w;
            }
            vec3 dof = bokehAcc / max(totalW, 1e-4);
            float focalGuide = smoothstep(0.02, 0.0, abs(depth - u_focalDistance));
            col = mix(dof, dof * vec3(1.1, 1.25, 1.0), focalGuide * 0.35);
          }
          // Style 4: ANAGLYPH 3D STEREO
          else if (u_style == 4) {
            float shift = (depth - 0.5) * (u_parallax / u_resolution.x);
            vec3 colL = texture(u_image, clamp(uv - vec2(shift, 0.0), 0.001, 0.999)).rgb;
            vec3 colR = texture(u_image, clamp(uv + vec2(shift, 0.0), 0.001, 0.999)).rgb;
            col = vec3(colL.r, colR.g, colR.b);
          }
          // Style 5: SURFACE NORMAL RELIEF
          else if (u_style == 5) {
            vec2 texel = 1.0 / u_resolution;
            float dL = sampleDepth(uv - vec2(texel.x * 2.0, 0.0));
            float dR = sampleDepth(uv + vec2(texel.x * 2.0, 0.0));
            float dU = sampleDepth(uv - vec2(0.0, texel.y * 2.0));
            float dD = sampleDepth(uv + vec2(0.0, texel.y * 2.0));
            vec3 norm = normalize(vec3((dL - dR) * 25.0, (dU - dD) * 25.0, 1.0));

            float la = radians(u_lightAngle);
            vec3 lightDir = normalize(vec3(cos(la), -sin(la), 0.7));
            float diff = max(dot(norm, lightDir), 0.0);
            vec3 halfV = normalize(lightDir + vec3(0.0, 0.0, 1.0));
            float spec = pow(max(dot(norm, halfV), 0.0), 32.0) * 0.6;

            vec3 clay = applyPalette(depth);
            col = clay * (0.28 + 0.72 * diff) + vec3(1.0) * spec;
          }
          // Style 6: CYBERPUNK HOLO-GRID
          else if (u_style == 6) {
            vec2 gridUV = uv * vec2(30.0, 20.0) + vec2(depth * 5.0, 0.0);
            vec2 gridLines = abs(fract(gridUV - 0.5) - 0.5) / max(fwidth(gridUV), vec2(0.001));
            float lineG = 1.0 - min(min(gridLines.x, gridLines.y), 1.0);
            vec3 gridCol = mix(vec3(0.02, 0.03, 0.08), vec3(0.0, 0.9, 1.0), depth);
            gridCol += vec3(1.0, 0.0, 0.65) * lineG * 1.6;
            col = gridCol;
          }
          // Style 7: PRISTINE LINEAR DEPTH
          else {
            col = vec3(depth);
          }

          if (u_overlaySource > 0.001) {
            col = mix(col, srcCol, clamp(u_overlaySource, 0.0, 1.0));
          }

          fragColor = vec4(col, 1.0);
        }
      `;
