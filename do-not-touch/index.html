<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOOOOOOLS · FFFX Vision & Shader Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23111'/><text y='70' x='25' font-size='65' fill='%2300ff88' font-family='monospace'>T</text></svg>" />
    <style>
      :root {
        --bg: #f9f8f5;
        --surface: #ffffff;
        --surface-alt: #f2efe8;
        --border: #dfddd6;
        --border-subtle: #eae8e1;
        --border-focus: #111111;
        --text: #141414;
        --text-muted: #6e6d68;
        --text-dim: #999893;
        --accent: #111111;
        --accent-contrast: #ffffff;
        --tooltip-bg: #141414;
        --tooltip-fg: #f9f8f5;
        --stage-bg: #eceae3;
        --badge-bg: #eae7de;
        --active-indicator: #008844;
        --danger: #d9383a;
        --mono-font: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      }

      :root[data-theme="dark"] {
        --bg: #0e1014;
        --surface: #141720;
        --surface-alt: #1a1e2a;
        --border: #232735;
        --border-subtle: #1c202c;
        --border-focus: #f0f1f5;
        --text: #f0f1f5;
        --text-muted: #8b8f9e;
        --text-dim: #5c6072;
        --accent: #f0f1f5;
        --accent-contrast: #0e1014;
        --tooltip-bg: #f0f1f5;
        --tooltip-fg: #0e1014;
        --stage-bg: #08090d;
        --badge-bg: #1a1e2a;
        --active-indicator: #00ff88;
        --danger: #ff4d4f;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: var(--mono-font);
        font-size: 12px;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: grid;
        grid-template-columns: 230px 310px 1fr;
        grid-template-rows: 100vh;
      }

      /* ======================================================================
         Tooltip System for Icon Buttons
         ====================================================================== */
      [data-tooltip] {
        position: relative;
      }
      [data-tooltip]::after {
        content: attr(data-tooltip);
        position: absolute;
        top: calc(100% + 7px);
        left: 50%;
        transform: translateX(-50%) translateY(-2px);
        background: var(--tooltip-bg);
        color: var(--tooltip-fg);
        border: 1px solid var(--border);
        padding: 4px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
        white-space: nowrap;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.12s ease, transform 0.12s ease;
        z-index: 2000;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
      }
      [data-tooltip]:hover::after {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }
      [data-tooltip-align="right"]::after {
        left: auto;
        right: 0;
        transform: translateY(-2px);
      }
      [data-tooltip-align="right"]:hover::after {
        transform: translateY(0);
      }
      [data-tooltip-align="left"]::after {
        left: 0;
        transform: translateY(-2px);
      }
      [data-tooltip-align="left"]:hover::after {
        transform: translateY(0);
      }

      /* ======================================================================
         Column 1: Drawer (Left)
         ====================================================================== */
      .app-drawer {
        border-right: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        user-select: none;
      }
      .drawer-brand {
        padding: 14px 14px 12px;
        border-bottom: 1px solid var(--border);
      }
      .brand-title {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .brand-title .brand-box {
        font-weight: 400;
        color: var(--text-dim);
      }
      .brand-sub {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 3px;
        letter-spacing: 0.03em;
      }

      .drawer-section {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .section-heading {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      .drawer-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .drawer-item {
        background: none;
        border: 1px solid transparent;
        color: var(--text);
        padding: 6px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 2px;
        transition: all 0.1s ease;
      }
      .drawer-item:hover {
        background: var(--surface-alt);
        border-color: var(--border);
      }
      .drawer-item.active {
        background: var(--accent);
        color: var(--accent-contrast);
        border-color: var(--accent);
        font-weight: 600;
      }
      .drawer-item .item-state {
        font-size: 10px;
        opacity: 0.8;
      }

      .drawer-shortcuts {
        margin-top: auto;
        border-top: 1px solid var(--border);
        border-bottom: none;
        padding: 12px 14px;
        font-size: 10px;
      }
      .shortcut-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        color: var(--text-muted);
      }
      .shortcut-row kbd, kbd {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 1px 4px;
        border-radius: 2px;
        font-family: var(--mono-font);
        font-size: 9px;
      }

      /* ======================================================================
         Column 2: Control Panel (Center)
         ====================================================================== */
      .control-panel {
        border-right: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .uploader-card {
        border: 1px dashed var(--border);
        background: var(--surface-alt);
        margin: 12px 12px 6px;
        padding: 12px 10px;
        text-align: center;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.15s ease;
        user-select: none;
      }
      .uploader-card:hover {
        border-color: var(--accent);
        background: var(--bg);
      }
      .uploader-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .uploader-sub {
        font-size: 9px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .panel-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ASCII Collapsible Groups */
      .ascii-group {
        border-top: 1px solid var(--border-subtle);
        padding-top: 10px;
      }
      .ascii-group-header {
        width: 100%;
        background: none;
        border: none;
        padding: 0;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: var(--mono-font);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text);
        cursor: pointer;
        text-align: left;
        user-select: none;
      }
      .ascii-group-header:hover {
        color: var(--accent);
      }
      .ascii-group-header .group-toggle {
        color: var(--text-muted);
      }
      .ascii-group-body {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .ascii-group.collapsed .ascii-group-body {
        display: none;
      }

      /* Controls */
      .ctl-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .ctl-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
      }
      .ctl-label {
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .ctl-val {
        font-variant-numeric: tabular-nums;
        color: var(--text);
        font-weight: 500;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 2px;
        background: var(--border);
        outline: none;
        margin: 5px 0 2px;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 10px;
        height: 10px;
        background: var(--accent);
        cursor: pointer;
        border-radius: 1px;
      }
      input[type="range"]::-moz-range-thumb {
        width: 10px;
        height: 10px;
        background: var(--accent);
        cursor: pointer;
        border-radius: 1px;
        border: none;
      }

      .mono-select {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        border-radius: 2px;
        cursor: pointer;
        outline: none;
      }
      .mono-select:focus {
        border-color: var(--border-focus);
      }

      .mono-text-input {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        border-radius: 2px;
        outline: none;
      }
      .mono-text-input:focus {
        border-color: var(--border-focus);
      }

      .mono-toggle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.1s ease;
      }
      .mono-toggle:hover {
        background: var(--surface-alt);
      }
      .mono-toggle.active {
        border-color: var(--accent);
        font-weight: 600;
      }

      .mono-color-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
      }
      .color-preview-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .color-swatch {
        width: 22px;
        height: 20px;
        border: 1px solid var(--border);
        border-radius: 2px;
        cursor: pointer;
      }
      input[type="color"].mono-color-input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
        pointer-events: none;
      }

      .mono-btn {
        width: 100%;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 8px;
        font-family: var(--mono-font);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.1s ease;
      }
      .mono-btn:hover {
        background: var(--bg);
        border-color: var(--accent);
      }

      .panel-footer {
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
      .btn-export {
        width: 100%;
        background: var(--accent);
        color: var(--accent-contrast);
        border: 1px solid var(--accent);
        padding: 8px 10px;
        font-family: var(--mono-font);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        border-radius: 2px;
        transition: opacity 0.15s;
      }
      .btn-export:hover {
        opacity: 0.9;
      }
      .btn-export kbd {
        background: rgba(255, 255, 255, 0.2);
        color: var(--accent-contrast);
        border: none;
      }

      /* ======================================================================
         Column 3: Stage Area & Top Menu
         ====================================================================== */
      .stage-area {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
      }

      .top-menu {
        height: 46px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px;
        user-select: none;
        position: relative;
        z-index: 100;
      }

      .menu-group {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .menu-divider {
        width: 1px;
        height: 18px;
        background: var(--border);
        margin: 0 4px;
      }
      .menu-spacer {
        flex: 1;
      }

      /* Lucide Icon Buttons */
      .icon-btn {
        width: 32px;
        height: 32px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.12s ease;
      }
      .icon-btn:hover:not(:disabled) {
        background: var(--surface-alt);
        border-color: var(--text-muted);
      }
      .icon-btn.active {
        background: var(--accent);
        color: var(--accent-contrast);
        border-color: var(--accent);
      }
      .icon-btn:disabled, .icon-btn.disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .icon-btn.danger-active {
        background: var(--danger);
        color: #fff;
        border-color: var(--danger);
      }

      /* Dropdown Popover for Image Presets */
      .dropdown-wrap {
        position: relative;
      }
      .dropdown-menu {
        position: absolute;
        top: calc(100% + 5px);
        left: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 2px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        min-width: 190px;
        display: none;
        flex-direction: column;
        padding: 4px;
        z-index: 1500;
      }
      .dropdown-wrap.open .dropdown-menu {
        display: flex;
      }
      .dropdown-item {
        background: none;
        border: none;
        color: var(--text);
        font-family: var(--mono-font);
        font-size: 11px;
        padding: 6px 8px;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 2px;
      }
      .dropdown-item:hover {
        background: var(--surface-alt);
      }
      .dropdown-sep {
        height: 1px;
        background: var(--border-subtle);
        margin: 3px 0;
      }

      /* Effects Info Bar */
      .effects-info-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--badge-bg);
        border: 1px solid var(--border);
        padding: 4px 8px;
        border-radius: 2px;
        font-size: 10px;
        cursor: default;
      }
      .info-pill {
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .info-pill.effect-name {
        color: var(--text);
      }
      .info-pill.source-name {
        color: var(--text-muted);
      }
      .info-pill.source-name::before,
      .info-pill.res-badge::before,
      .info-pill.stats-badge::before {
        content: "·";
        margin-right: 6px;
        color: var(--text-dim);
      }
      .info-pill.res-badge {
        color: var(--text-muted);
      }
      .info-pill.stats-badge {
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      /* Stage Viewport */
      .stage-wrap {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: auto;
        background: var(--stage-bg);
      }
      #stage {
        position: relative;
        line-height: 0;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.14);
        border: 1px solid var(--border);
        background: #000;
        cursor: crosshair;
        overflow: hidden;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: calc(100vh - 110px);
      }
      #dropHint {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        place-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(14, 16, 20, 0.88);
        color: #00ff88;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        border: 2px dashed #00ff88;
        pointer-events: none;
      }
      #stage.dragging #dropHint {
        display: flex;
      }
    </style>
    <!-- MediaPipe Pose for Tracking v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <!-- Column 1: Drawer -->
    <aside class="app-drawer">
      <div class="drawer-brand">
        <div class="brand-title"><span class="brand-box">[ ]</span> TOOOOOOLS.APP</div>
        <div class="brand-sub">FFFX VISION & SHADER LAB</div>
      </div>

      <div class="drawer-section">
        <div class="section-heading">/EFFECTS</div>
        <div class="drawer-list" id="menu"></div>
      </div>

      <div class="drawer-section">
        <div class="section-heading">/SOURCES</div>
        <div class="drawer-list" id="drawerSources">
          <button class="drawer-item active" data-source="motion-demo">
            <span>MOTION DEMO</span>
            <span class="item-state">[•]</span>
          </button>
          <button class="drawer-item" data-source="sunset">
            <span>SUNSET</span>
            <span class="item-state">[ ]</span>
          </button>
        </div>
      </div>

      <div class="drawer-shortcuts">
        <div class="section-heading">/SHORTCUTS</div>
        <div class="shortcut-row"><span>TOGGLE CURSOR</span><kbd>M</kbd></div>
        <div class="shortcut-row"><span>OPEN MEDIA</span><kbd>Ctrl+O</kbd></div>
        <div class="shortcut-row"><span>SAVE FRAME</span><kbd>Ctrl+S</kbd></div>
        <div class="shortcut-row"><span>FULLSCREEN</span><kbd>F</kbd></div>
        <div class="shortcut-row"><span>CLEAR SKETCH</span><kbd>C</kbd></div>
      </div>
    </aside>

    <!-- Column 2: Control Panel -->
    <aside class="control-panel">
      <div class="uploader-card" id="dropCard" data-tooltip="Upload Image or Video (Ctrl+O)" data-tooltip-align="left">
        <div class="uploader-header">
          <svg class="lucide lucide-upload" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <span>+ DROP MEDIA OR CLICK</span>
        </div>
        <div class="uploader-sub">PNG · JPG · MP4 · WEBM</div>
      </div>
      <input type="file" id="file" accept="image/*,video/*" hidden />

      <div class="panel-scroll" id="panel"></div>

      <div class="panel-footer">
        <button class="btn-export" id="exportBtn" data-tooltip="Save Active Frame as PNG (Ctrl+S)" data-tooltip-align="left">
          <span>EXPORT CANVAS</span>
          <kbd>Ctrl+S</kbd>
        </button>
      </div>
    </aside>

    <!-- Column 3: Stage Area -->
    <main class="stage-area">
      <!-- Top Menu -->
      <header class="top-menu">
        <!-- Media Source Buttons -->
        <div class="menu-group">
          <!-- Image Dropdown Button -->
          <div class="dropdown-wrap" id="imageDropdownWrap">
            <button class="icon-btn" id="imageBtn" data-tooltip="Image Presets & File...">
              <svg class="lucide lucide-image" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </button>
            <div class="dropdown-menu" id="imageMenu">
              <button class="dropdown-item" data-action="open-file">
                <span>Open Image File...</span>
                <kbd>Ctrl+O</kbd>
              </button>
              <div class="dropdown-sep"></div>
              <button class="dropdown-item" data-preset="sunset">Sunset Preset</button>
            </div>
          </div>

          <!-- Video / Motion Demo Button -->
          <button class="icon-btn" id="videoBtn" data-tooltip="Video / Motion Demo">
            <svg class="lucide lucide-film" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>
          </button>

      const ROOT = 64 // canvas dimensions snapped to multiples of this
      const TAU = Math.PI * 2

      // ======================================================================
      // Shared Media Pipeline & Environment
      // ======================================================================
      const canvas = document.getElementById('canvas')
      const ctx = canvas.getContext('2d')
      const stage = document.getElementById('stage')
      const statsEl = document.getElementById('stats')
      const sourceBadge = document.getElementById('sourceBadge')
      const effectPill = document.getElementById('effectPill')
      const resPill = document.getElementById('resPill')

      const env = {
        W: 0,
        H: 0,
        time: 0,
        sat: null, // summed-area table for quadtree
        cursor: { x: 0, y: 0, targetX: 0, targetY: 0, lastMoveAt: 0 },
        cursorEnabled: true,
        // Offscreen canvas storing current source frame
        sourceCanvas: document.createElement('canvas'),
        sourceCtx: null,
        // Source state
        sourceType: 'demo', // 'image' | 'video' | 'webcam' | 'demo'
        sourceVideo: null,
        sourceImage: null,
        demoState: null,
        isWebcam: false,
        mirrorWebcam: true,
      }
      env.sourceCtx = env.sourceCanvas.getContext('2d', {
        willReadFrequently: true,
      })
      // ---------------- Summed-Area Table (Quadtree) ----------------
      function buildTables(imageData) {
        const { W, H } = env
        const data = imageData.data
        const stride = W + 1
        const size = stride * (H + 1)
        const r = new Float64Array(size)
        const g = new Float64Array(size)
        const b = new Float64Array(size)
        const l = new Float64Array(size)
        const l2 = new Float64Array(size)

        for (let y = 0; y < H; y++) {
          let rr = 0,
            gg = 0,
            bb = 0,
            ll = 0,
            ll2 = 0
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4
            const luma =
              0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]
            rr += data[i]
            gg += data[i + 1]
            bb += data[i + 2]
            ll += luma
            ll2 += luma * luma
            const idx = (y + 1) * stride + (x + 1)
            const up = y * stride + (x + 1)
            r[idx] = r[up] + rr
            g[idx] = g[up] + gg
            b[idx] = b[up] + bb
            l[idx] = l[up] + ll
            l2[idx] = l2[up] + ll2
          }
        }
        env.sat = { r, g, b, l, l2, stride }
      }

      function rectSum(table, x, y, s) {
        const st = env.sat.stride
        return (
          table[(y + s) * st + (x + s)] -
          table[y * st + (x + s)] -
          table[(y + s) * st + x] +
          table[y * st + x]
        )
      }

      function lumaStdDev(x, y, s) {
        const n = s * s
        const mean = rectSum(env.sat.l, x, y, s) / n
        const variance = rectSum(env.sat.l2, x, y, s) / n - mean * mean
        return Math.sqrt(Math.max(0, variance))
      }

      function hash(x, y, s) {
        let h =
          Math.imul(x, 374761393) +
          Math.imul(y, 668265263) +
          Math.imul(s, 1274126177)
        h = Math.imul(h ^ (h >>> 13), 1274126177)
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296
      }

      // ======================================================================
      // EFFECT 1: quadtree-bokeh
      // ======================================================================
      const quadtreeBokeh = {
        id: 'quadtree-bokeh',
        label: 'quadtree-bokeh',
        groups: [
          {
            title: 'Focus',
            controls: [
              {
                key: 'shape',

            ],

        ],

        flatThreshold: 6,
        leaves: [],

        draw(v, dt) {
          const { W, H, cursor } = env
          env.time += dt * v.speed

          if (env.cursorEnabled && v.wander && performance.now() - cursor.lastMoveAt > 2500) {
            cursor.targetX = W * (0.5 + 0.32 * Math.sin(env.time * 0.55))
            cursor.targetY = H * (0.5 + 0.3 * Math.sin(env.time * 0.83 + 1.2))
          }
          if (env.cursorEnabled) {
            cursor.x += (cursor.targetX - cursor.x) * 0.18
            cursor.y += (cursor.targetY - cursor.y) * 0.18
          }

          const radius =
            v.radius * (1 + v.breathing * 0.3 * Math.sin(env.time * 0.9))
          const params = { ...v, radius, time: env.time }

          this.leaves = []
          for (let y = 0; y < H; y += ROOT) {
            for (let x = 0; x < W; x += ROOT) {
              this.subdivide(x, y, ROOT, params)
            }
          }
          this.render(v)
          return `${(this.leaves.length / 6).toLocaleString()} squares`
        },

        distance(x, y, s, shape) {
          const { cursor } = env
          const dx = Math.max(x - cursor.x, 0, cursor.x - (x + s))
          const dy = Math.max(y - cursor.y, 0, cursor.y - (y + s))
          return shape === 'square' ? Math.max(dx, dy) : Math.hypot(dx, dy)
        },

        allowedSize(x, y, s, p) {
          if (!env.cursorEnabled) {
            return p.minSize
          }
          let d = this.distance(x, y, s, p.shape)
          if (p.shimmer > 0) {
            d += p.shimmer * Math.sin(p.time * 2.2 + hash(x, y, s) * TAU)
          }
          if (d <= p.radius) return p.minSize
          const t = Math.min(1, (d - p.radius) / p.falloff)
          return p.minSize + (p.maxSize - p.minSize) * t * t
        },

        subdivide(x, y, s, p) {
          const wantSplit = s > p.minSize && s > this.allowedSize(x, y, s, p)
          const isFlat =
            p.skipFlat && wantSplit && lumaStdDev(x, y, s) < this.flatThreshold

          if (wantSplit && !isFlat) {
            const h = s / 2
            this.subdivide(x, y, h, p)
            this.subdivide(x + h, y, h, p)
            this.subdivide(x, y + h, h, p)
            this.subdivide(x + h, y + h, h, p)
            return
          }

          const n = s * s
          this.leaves.push(
            x,
            y,
            s,
            rectSum(env.sat.r, x, y, s) / n,
            rectSum(env.sat.g, x, y, s) / n,
            rectSum(env.sat.b, x, y, s) / n,
          )
        },

        render(v) {
          const { W, H, time } = env
          const leaves = this.leaves
          const gutterGrid = v.showGrid && v.gridWidth >= 1
          const hairlineGrid = v.showGrid && v.gridWidth < 1

          ctx.fillStyle = gutterGrid ? v.gridColor : '#000'
          ctx.fillRect(0, 0, W, H)

          for (let i = 0; i < leaves.length; i += 6) {
            const x = leaves[i],
              y = leaves[i + 1],
              s = leaves[i + 2]
            let r = leaves[i + 3],
              g = leaves[i + 4],
              b = leaves[i + 5]

            if (v.glitter > 0) {
              const phase = hash(x, y, s + 101)
              const flicker =
                1 + 0.07 * v.glitter * Math.sin(time * 3 + phase * 60)
              const pulse = Math.max(0, Math.sin(time * 1.7 + phase * 80))
              const sparkle =
                Math.pow(pulse, 16) *
                v.glitter *
                (0.35 + (0.65 * s) / v.maxSize)
              r = Math.min(255, r * flicker + (255 - r) * sparkle)
              g = Math.min(255, g * flicker + (255 - g) * sparkle)
              b = Math.min(255, b * flicker + (255 - b) * sparkle)
            }

            ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`
            const inset = gutterGrid ? Math.min(v.gridWidth / 2, s * 0.25) : 0
            ctx.fillRect(x + inset, y + inset, s - inset * 2, s - inset * 2)
          }

          if (hairlineGrid) {
            ctx.globalAlpha = v.gridWidth
            ctx.strokeStyle = v.gridColor
            ctx.lineWidth = 1
            ctx.beginPath()
            for (let i = 0; i < leaves.length; i += 6) {
              ctx.rect(leaves[i], leaves[i + 1], leaves[i + 2], leaves[i + 2])
            }
            ctx.stroke()
            ctx.globalAlpha = 1
          }
        },
      }

        draw(v, dt) {
          const { W, H } = env
          env.time += dt

          if (!this.analysisCtx) this.init()

          // 1. Detect blobs from downsampled current frame
          const rawBlobs = this.detectBlobs(v)

          // 2. Temporally smooth blob bounding boxes and maintain node state
          this.updateTrackedBlobs(rawBlobs, v, dt)

          // 3. Render: Draw background media with dimming
          ctx.fillStyle = '#0a0b10'
          ctx.fillRect(0, 0, W, H)

          if (v.backgroundDim < 1) {
            ctx.save()
            ctx.globalAlpha = 1 - v.backgroundDim
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            ctx.restore()
          }

          // 4. Render selected variation
          const variation = v.variation || 'GLITCH ARROWS & HUD'
          if (variation === 'GLITCH ARROWS & HUD') {
            this.renderGlitchArrows(v, dt)
            const ptCount = this.trackedBlobs.reduce(
              (acc, b) => acc + (b.landmarks ? b.landmarks.length : 0),
              0,
            )
            return `${this.trackedBlobs.length || 1} tracked targets · ${ptCount || v.landmarkCount || 24} landmarks · Forensic HUD`
          } else if (variation === 'INTERCONNECTED WEB SWARM') {
            this.renderWebSwarm(v, dt)
            return `${this.trackedBlobs.length} tracked targets · ${this.webParticles.length} swarm filaments · Web Lattice`
          } else {
            this.renderTracking(v)
            return `${this.trackedBlobs.length} tracked blobs · ${this.trackedBlobs.reduce((acc, b) => acc + b.nodes.length, 0)} nodes`
          }
        },

        detectBlobs(v) {
          const { W, H } = env
          // Grid analysis resolution
          const GW = 96
          const GH = Math.max(24, Math.round(96 * (H / W)))

          if (
            this.analysisCanvas.width !== GW ||
            this.analysisCanvas.height !== GH
          ) {
            this.analysisCanvas.width = GW
            this.analysisCanvas.height = GH
            this.bgData = null
          }

          // Downsample current source frame into analysis canvas
          this.analysisCtx.drawImage(env.sourceCanvas, 0, 0, GW, GH)
          const currImgData = this.analysisCtx.getImageData(0, 0, GW, GH)
          const data = currImgData.data

          // Initialize background model on first run or dimension change
          if (!this.bgData || this.bgData.length !== GW * GH * 3) {
            this.bgData = new Float32Array(GW * GH * 3)
            for (let i = 0; i < GW * GH; i++) {
              this.bgData[i * 3] = data[i * 4]
              this.bgData[i * 3 + 1] = data[i * 4 + 1]
              this.bgData[i * 3 + 2] = data[i * 4 + 2]
            }
          }

          const energyGrid = new Float32Array(GW * GH)

          // Calibrated threshold based on sensitivity slider
          let threshold
          const sens = v.sensitivity !== undefined ? v.sensitivity : 0.45
          const mode = v.detectMode || 'hybrid'
          if (mode === 'motion') {
            threshold = 0.02 + (1 - sens) * 0.18
          } else if (mode === 'brightness') {
            threshold = 0.12 + (1 - sens) * 0.65
          } else {
            // hybrid
            threshold = 0.03 + (1 - sens) * 0.25
          }

          // Compute per-cell motion / brightness energy
          for (let y = 0; y < GH; y++) {
            for (let x = 0; x < GW; x++) {
              const idx = (y * GW + x) * 4
              const bgIdx = (y * GW + x) * 3
              const r = data[idx],
                g = data[idx + 1],
                b = data[idx + 2]
              const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255

              // Motion delta against background model
              const bgR = this.bgData[bgIdx]
              const bgG = this.bgData[bgIdx + 1]
              const bgB = this.bgData[bgIdx + 2]
              const motion =
                (Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB)) /
                (3 * 255)

              // Background model adaptation rate
              const adaptRate = 0.035
              this.bgData[bgIdx] += (r - bgR) * adaptRate
              this.bgData[bgIdx + 1] += (g - bgG) * adaptRate
              this.bgData[bgIdx + 2] += (b - bgB) * adaptRate

              let val = 0
              if (mode === 'motion') {
                val = motion
              } else if (mode === 'brightness') {
                val = luma
              } else {
                // hybrid: strong blend that works on both moving video and static subject photos
                val = Math.max(motion * 1.5, luma * 0.8)
              }

              energyGrid[y * GW + x] = val > threshold ? val : 0
            }
          }

          // Save current frame for next difference
          this.prevAnalysisData = currImgData

          // Connected components (flood fill) clustering
          const visited = new Uint8Array(GW * GH)
          const rawClusters = []

          for (let y = 0; y < GH; y++) {
            for (let x = 0; x < GW; x++) {
              const i = y * GW + x
              if (visited[i] || energyGrid[i] === 0) continue

              // BFS to find cluster
              let minX = x,
                maxX = x,
                minY = y,
                maxY = y
              let sumX = 0,
                sumY = 0,
                count = 0,
                sumEnergy = 0
              const queue = [x, y]
              visited[i] = 1

              while (queue.length > 0) {
                const qy = queue.pop()
                const qx = queue.pop()
                const qi = qy * GW + qx
                const e = energyGrid[qi]

                sumX += qx * e
                sumY += qy * e
                sumEnergy += e
                count++

                if (qx < minX) minX = qx
                if (qx > maxX) maxX = qx
                if (qy < minY) minY = qy
                if (qy > maxY) maxY = qy

                // 4-neighborhood
                const neighbors = [
                  [qx + 1, qy],
                  [qx - 1, qy],
                  [qx, qy + 1],
                  [qx, qy - 1],
                ]
                for (let k = 0; k < 4; k++) {
                  const nx = neighbors[k][0],
                    ny = neighbors[k][1]
                  if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
                    const ni = ny * GW + nx
                    if (!visited[ni] && energyGrid[ni] > 0) {
                      visited[ni] = 1
                      queue.push(nx, ny)
                    }
                  }
                }
              }

              // Filter out noise
              const scaleX = W / GW
              const scaleY = H / GH
              const bw = (maxX - minX + 1) * scaleX
              const bh = (maxY - minY + 1) * scaleY
              const area = Math.max(bw, bh)
              const minSz = v.minSize !== undefined ? v.minSize : 25

              if (area >= minSz && count >= 3) {
                rawClusters.push({
                  x: minX * scaleX,
                  y: minY * scaleY,
                  w: bw,
                  h: bh,
                  cx: (sumX / sumEnergy) * scaleX,
                  cy: (sumY / sumEnergy) * scaleY,
                  mass: count,
                  energy: sumEnergy / count,
                })
              }
            }
          }

          // Sort by mass and limit to maxBlobs
          rawClusters.sort((a, b) => b.mass - a.mass)
          const maxB = v.maxBlobs !== undefined ? v.maxBlobs : 5
          return rawClusters.slice(0, maxB)
        },

        updateTrackedBlobs(rawBlobs, v, dt) {
          const smooth = v.smoothing !== undefined ? v.smoothing : 0.25

          // Match rawBlobs to existing trackedBlobs by centroid distance
          const matched = new Set()
          const updated = []

          rawBlobs.forEach((raw) => {
            let bestDist = 180
            let bestBlob = null

            this.trackedBlobs.forEach((tb) => {
              if (matched.has(tb)) return
              const d = Math.hypot(tb.cx - raw.cx, tb.cy - raw.cy)
              if (d < bestDist) {
                bestDist = d
                bestBlob = tb
              }
            })

            if (bestBlob) {
              matched.add(bestBlob)
              // Lerp bounding box
              bestBlob.x += (raw.x - bestBlob.x) * (1 - smooth)
              bestBlob.y += (raw.y - bestBlob.y) * (1 - smooth)
              bestBlob.w += (raw.w - bestBlob.w) * (1 - smooth)
              bestBlob.h += (raw.h - bestBlob.h) * (1 - smooth)
              bestBlob.cx += (raw.cx - bestBlob.cx) * (1 - smooth)
              bestBlob.cy += (raw.cy - bestBlob.cy) * (1 - smooth)
              bestBlob.mass = raw.mass
              bestBlob.life = Math.min(1, bestBlob.life + dt * 4)
              this.syncNodes(bestBlob, v)
              this.syncLandmarks(bestBlob, v)
              updated.push(bestBlob)
            } else {
              // New blob
              const newBlob = {
                id: Math.floor(100 + Math.random() * 900),
                x: raw.x,
                y: raw.y,
                w: raw.w,
                h: raw.h,
                cx: raw.cx,
                cy: raw.cy,
                mass: raw.mass,
                life: 0.1,
                nodes: [],
                landmarks: [],
              }
              this.syncNodes(newBlob, v)
              this.syncLandmarks(newBlob, v)
              updated.push(newBlob)
            }
          })

          this.trackedBlobs = updated
        },

        // --- VARIATION 1: GLITCH ARROWS & HUD (Photogrammetry / Computer Vision Tracking) ---
        syncLandmarks(blob, v) {
          if (!blob.landmarks) blob.landmarks = []
          const count = v.landmarkCount !== undefined ? v.landmarkCount : 24
          const crosshairColors = ['#00f0ff', '#ff00aa', '#ffff00', '#ffffff', '#00ff66']

          while (blob.landmarks.length < count) {
            const idx = blob.landmarks.length
            // Distribute points across 3 feature clusters (top flower cluster, right fingers/hand cluster, lower stem/wrist)
            let rx, ry, sGroup
            if (idx < count * 0.40) {
              // Cluster 0: Upper feature group (flowers / top subject)
              rx = (Math.random() - 0.5) * 0.55
              ry = -0.15 - Math.random() * 0.35
              sGroup = 0
            } else if (idx < count * 0.75) {
              // Cluster 1: Mid-right feature group (fingers / lateral structure)
              rx = 0.08 + Math.random() * 0.42
              ry = -0.05 + Math.random() * 0.45
              sGroup = 1
            } else {
              // Cluster 2: Lower anchor group (stem / palm / wrist)
              rx = (Math.random() - 0.5) * 0.45
              ry = 0.12 + Math.random() * 0.38
              sGroup = 2
            }

            blob.landmarks.push({
              id: idx,
              relX: rx,
              relY: ry,
              speed: 0.8 + Math.random() * 1.5,
              phase: Math.random() * Math.PI * 2,
              hasCrosshair: Math.random() < 0.38,
              crosshairColor: crosshairColors[Math.floor(Math.random() * crosshairColors.length)],
              showLabel: Math.random() < 0.55,
              subGroup: sGroup,
            })
          }
          if (blob.landmarks.length > count) {
            blob.landmarks.length = count
          }
        },

        renderGlitchEffects(blobs, v) {
          const { W, H } = env
          const intensity = v.glitchIntensity !== undefined ? v.glitchIntensity : 0.65
          if (intensity <= 0.01) return

          ctx.save()

          // 1. Horizontal Slices Displacement with Chromatic Aberration
          const numSlices = Math.floor(4 + intensity * 14)
          for (let i = 0; i < numSlices; i++) {
            const b = blobs[Math.floor(Math.random() * blobs.length)]
            const sy = Math.max(0, Math.min(H - 16, b.y + Math.random() * b.h))
            const sh = Math.floor(3 + Math.random() * 16)
            const sx = Math.max(0, b.x - 20)
            const sw = Math.min(W - sx, b.w + 40)
            const dx = (Math.random() - 0.5) * 44 * intensity

            if (sw <= 4 || sh <= 2) continue

            // Shifted slice clip
            ctx.save()
            ctx.beginPath()
            ctx.rect(sx, sy, sw, sh)
            ctx.clip()

            // Displaced source slice
            ctx.drawImage(env.sourceCanvas, sx, sy, sw, sh, sx + dx, sy, sw, sh)

            const rgbSplit = v.rgbSplit !== undefined ? v.rgbSplit : 6
            if (rgbSplit > 0) {
              // Red chromatic shift
              ctx.globalCompositeOperation = 'screen'
              ctx.drawImage(
                env.sourceCanvas,
                sx,
                sy,
                sw,
                sh,
                sx + dx + rgbSplit,
                sy,
                sw,
                sh,
              )
              ctx.fillStyle = 'rgba(255, 30, 40, 0.32)'
              ctx.fillRect(sx + dx, sy, sw, sh)

              // Cyan chromatic shift
              ctx.drawImage(
                env.sourceCanvas,
                sx,
                sy,
                sw,
                sh,
                sx + dx - rgbSplit,
                sy,
                sw,
                sh,
              )
              ctx.fillStyle = 'rgba(0, 230, 255, 0.32)'
              ctx.fillRect(sx + dx, sy, sw, sh)
            }
            ctx.restore()
          }

          // 2. Digital Glitch / Datamosh Blocks (matching reference images.jpeg)
          if (v.blockArtifacts) {
            const blockCount = Math.floor(6 + intensity * 22)
            const blockColors = [
              '#ff3b30',
              '#ff9500',
              '#00e5ff',
              '#34c759',
              '#af52de',
              '#ffffff',
              '#ffd60a',
            ]
            for (let i = 0; i < blockCount; i++) {
              const b = blobs[Math.floor(Math.random() * blobs.length)]
              const bw = Math.floor(4 + Math.random() * 14)
              const bh = Math.floor(4 + Math.random() * 12)
              const bx = Math.max(
                0,
                Math.min(W - bw, b.x + Math.random() * b.w + (Math.random() - 0.5) * 30),
              )
              const by = Math.max(
                0,
                Math.min(H - bh, b.y + Math.random() * b.h + (Math.random() - 0.5) * 30),
              )

              if (Math.random() < 0.45) {
                // Pixelated color noise block
                ctx.fillStyle =
                  blockColors[Math.floor(Math.random() * blockColors.length)]
                ctx.globalAlpha = 0.35 + Math.random() * 0.45
                ctx.fillRect(bx, by, bw, bh)
              } else {
                // Datamosh pixel stretch block
                ctx.save()
                ctx.imageSmoothingEnabled = false
                ctx.globalAlpha = 0.75
                const srcX = Math.max(
                  0,
                  Math.min(W - 4, bx + (Math.random() - 0.5) * 16),
                )
                const srcY = Math.max(
                  0,
                  Math.min(H - 4, by + (Math.random() - 0.5) * 16),
                )
                ctx.drawImage(env.sourceCanvas, srcX, srcY, 4, 4, bx, by, bw, bh)
                ctx.restore()
              }
            }
          }

          ctx.restore()
        },

        renderGlitchArrows(v, dt) {
          const { W, H, time } = env
          let blobs = this.trackedBlobs
          if (blobs.length === 0) {
            // Graceful subject fallback target framing the canvas content
            blobs = [
              {
                id: 701,
                x: W * 0.20,
                y: H * 0.12,
                w: W * 0.60,
                h: H * 0.76,
                cx: W * 0.50,
                cy: H * 0.50,
                life: 1.0,
                mass: 120,
                landmarks: [],
              },
            ]
          }

          // 1. Render Glitch artifacts (displacement & datamosh blocks)
          this.renderGlitchEffects(blobs, v)

          // 2. Render Photogrammetry HUD & Vectors
          blobs.forEach((b) => {
            this.syncLandmarks(b, v)

            const pts = b.landmarks.map((lm) => {
              const jitterX = Math.sin(time * lm.speed + lm.phase) * (b.w * 0.018)
              const jitterY = Math.cos(time * lm.speed * 1.1 + lm.phase) * (b.h * 0.018)
              return {
                x: Math.max(6, Math.min(W - 6, b.cx + lm.relX * b.w + jitterX)),
                y: Math.max(6, Math.min(H - 6, b.cy + lm.relY * b.h + jitterY)),
                id: lm.id,
                hasCrosshair: lm.hasCrosshair,
                crosshairColor: lm.crosshairColor,
                showLabel: lm.showLabel,
                subGroup: lm.subGroup,
              }
            })

            // A. Hierarchical Wireframe Bounding Boxes (Red & Cyan)
            if (v.showBoxes !== false) {
              ctx.save()
              ctx.strokeStyle = v.boxColor || '#ff2626'
              ctx.lineWidth = 1.0

              // 1. Outer full bounding box
              ctx.strokeRect(b.x, b.y, b.w, b.h)

              // Canvas-wide vertical reference lines (as seen in reference images.jpeg)
              ctx.beginPath()
              ctx.moveTo(b.x, 0)
              ctx.lineTo(b.x, H)
              ctx.moveTo(b.x + b.w, 0)
              ctx.lineTo(b.x + b.w, H)
              ctx.moveTo(b.x + b.w * 0.86, 0)
              ctx.lineTo(b.x + b.w * 0.86, H)
              ctx.stroke()

              // 2. Sub-cluster red boxes (framing dense feature sub-groups)
              const groups = [0, 1, 2]
              groups.forEach((gId) => {
                const gPts = pts.filter((p) => p.subGroup === gId)
                if (gPts.length >= 2) {
                  let minX = Infinity,
                    maxX = -Infinity,
                    minY = Infinity,
                    maxY = -Infinity
                  gPts.forEach((p) => {
                    if (p.x < minX) minX = p.x
                    if (p.x > maxX) maxX = p.x
                    if (p.y < minY) minY = p.y
                    if (p.y > maxY) maxY = p.y
                  })
                  const pad = 12
                  const bx = Math.max(0, minX - pad)
                  const by = Math.max(0, minY - pad)
                  const bw = Math.min(W - bx, maxX - minX + pad * 2)
                  const bh = Math.min(H - by, maxY - minY + pad * 2)

                  ctx.strokeRect(bx, by, bw, bh)

                  if (v.showCoordinates !== false) {
                    ctx.font = '9px monospace'
                    ctx.fillStyle = v.boxColor || '#ff2626'
                    ctx.fillText(
                      `x: ${Math.round(bx)} y: ${Math.round(by)}`,
                      bx + 3,
                      by - 4,
                    )
                  }
                }
              })

              // 3. Cyan highlight bounding box (framing the secondary cluster, e.g. fingers/hand)
              if (v.cyanHighlight !== false) {
                const cyanPts = pts.filter((p) => p.subGroup === 1)
                if (cyanPts.length > 0) {
                  let minX = Infinity,
                    maxX = -Infinity,
                    minY = Infinity,
                    maxY = -Infinity
                  cyanPts.forEach((p) => {
                    if (p.x < minX) minX = p.x
                    if (p.x > maxX) maxX = p.x
                    if (p.y < minY) minY = p.y
                    if (p.y > maxY) maxY = p.y
                  })
                  const pad = 14
                  const cx = Math.max(0, minX - pad)
                  const cy = Math.max(0, minY - pad)
                  const cw = Math.min(W - cx, maxX - minX + pad * 2)
                  const ch = Math.min(H - cy, maxY - minY + pad * 2)

                  ctx.strokeStyle = '#00e5ff'
                  ctx.lineWidth = 1.2
                  ctx.strokeRect(cx, cy, cw, ch)

                  if (v.showCoordinates !== false) {
                    ctx.font = '9px monospace'
                    ctx.fillStyle = '#00e5ff'
                    ctx.fillText(
                      `x: ${Math.round(cx)} y: ${Math.round(cy)}`,
                      cx + 4,
                      cy - 4,
                    )
                  }
                }
              }

              // 4. Micro feature boxes around 2-3 specific landmarks
              for (let i = 0; i < Math.min(3, pts.length); i++) {
                const p = pts[i]
                ctx.strokeStyle = v.boxColor || '#ff2626'
                ctx.lineWidth = 0.9
                const msz = 18
                ctx.strokeRect(p.x - msz / 2, p.y - msz / 2, msz, msz)
              }

              ctx.restore()
            }

            // B. Directed Dashed Vector Arrows (--->)
            ctx.save()
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)'
            ctx.lineWidth = 1.1
            ctx.setLineDash([4, 4])

            const maxArrows = v.arrowDensity !== undefined ? v.arrowDensity : 14
            let arrowsDrawn = 0

            for (let i = 0; i < pts.length && arrowsDrawn < maxArrows; i++) {
              let bestTarget = null
              let bestDist = Infinity
              for (let j = 0; j < pts.length; j++) {
                if (i === j) continue
                const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y)
                if (d > 22 && d < b.w * 0.65 && d < bestDist) {
                  bestDist = d
                  bestTarget = pts[j]
                }
              }

              if (bestTarget && bestDist < Infinity) {
                const p1 = pts[i]
                const p2 = bestTarget

                // Dashed vector line
                ctx.beginPath()
                ctx.moveTo(p1.x, p1.y)
                ctx.lineTo(p2.x, p2.y)
                ctx.stroke()

                // Vector arrowhead at destination (p2)
                const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x)
                const arrowLen = 7
                const arrowAngle = 0.44
                ctx.beginPath()
                ctx.moveTo(p2.x, p2.y)
                ctx.lineTo(
                  p2.x - arrowLen * Math.cos(angle - arrowAngle),
                  p2.y - arrowLen * Math.sin(angle - arrowAngle),
                )
                ctx.moveTo(p2.x, p2.y)
                ctx.lineTo(
                  p2.x - arrowLen * Math.cos(angle + arrowAngle),
                  p2.y - arrowLen * Math.sin(angle + arrowAngle),
                )
                ctx.stroke()

                arrowsDrawn++
              }
            }

            // Prominent dashed circular arc in center with vector arrowhead (matching images.jpeg)
            const arcR = Math.max(12, Math.min(b.w || 60, b.h || 60) * 0.28)
            ctx.beginPath()
            ctx.arc(b.cx, b.cy, arcR, -0.65 * Math.PI, 0.38 * Math.PI)
            ctx.stroke()

            const endAngle = 0.38 * Math.PI
            const ax = b.cx + arcR * Math.cos(endAngle)
            const ay = b.cy + arcR * Math.sin(endAngle)
            const tangAngle = endAngle + Math.PI / 2
            const arcArrowLen = 7
            ctx.beginPath()
            ctx.moveTo(ax, ay)
            ctx.lineTo(
              ax - arcArrowLen * Math.cos(tangAngle - 0.42),
              ay - arcArrowLen * Math.sin(tangAngle - 0.42),
            )
            ctx.moveTo(ax, ay)
            ctx.lineTo(
              ax - arcArrowLen * Math.cos(tangAngle + 0.42),
              ay - arcArrowLen * Math.sin(tangAngle + 0.42),
            )
            ctx.stroke()

            ctx.restore()

            // C. Landmark Keypoint Dots & Crosshairs & Coordinates
            ctx.save()
            pts.forEach((p) => {
              // 1. Bright lime-green landmark dot
              ctx.fillStyle = v.dotColor || '#00ff66'
              ctx.beginPath()
              ctx.arc(p.x, p.y, 3.4, 0, Math.PI * 2)
              ctx.fill()
              ctx.strokeStyle = '#051108'
              ctx.lineWidth = 1.0
              ctx.stroke()

              // 2. Micro crosshair (+) on selected points
              if (p.hasCrosshair) {
                const cs = 5
                ctx.strokeStyle = p.crosshairColor || '#00ffff'
                ctx.lineWidth = 1.0
                ctx.beginPath()
                ctx.moveTo(p.x - cs, p.y)
                ctx.lineTo(p.x + cs, p.y)
                ctx.moveTo(p.x, p.y - cs)
                ctx.lineTo(p.x, p.y + cs)
                ctx.stroke()
              }

              // 3. Monospace Coordinate Tag: x: [val] y: [val]
              if (v.showCoordinates !== false && p.showLabel) {
                ctx.font = '9px monospace'
                const tag = `x: ${Math.round(p.x)} y: ${Math.round(p.y)}`
                const tw = ctx.measureText(tag).width
                ctx.fillStyle = 'rgba(10, 12, 16, 0.72)'
                ctx.fillRect(p.x + 5, p.y - 7, tw + 4, 10)
                ctx.fillStyle = '#f0f3f6'
                ctx.fillText(tag, p.x + 7, p.y + 1)
              }
            })
            ctx.restore()
          })
        },

        // --- VARIATION 2: INTERCONNECTED WEB SWARM ---
        renderWebSwarm(v, dt) {
          const { W, H, time } = env
          let blobs = this.trackedBlobs

          const targetCount = v.swarmCount !== undefined ? v.swarmCount : 80
          if (!this.webParticles) this.webParticles = []

          while (this.webParticles.length < targetCount) {
            this.webParticles.push({
              x: Math.random() * W,
              y: Math.random() * H,
              vx: (Math.random() - 0.5) * 10,
              vy: (Math.random() - 0.5) * 10,
              phase: Math.random() * Math.PI * 2,
              speed: 0.8 + Math.random() * 1.5,
              mass: 0.8 + Math.random() * 0.5,
            })
          }
          if (this.webParticles.length > targetCount) {
            this.webParticles.length = targetCount
          }

          const attract = v.swarmAttract !== undefined ? v.swarmAttract : 1.4
          const tension = v.stringTension !== undefined ? v.stringTension : 0.65
          const reach = v.webReach !== undefined ? v.webReach : 120
          const vib = v.vibration !== undefined ? v.vibration : 0.4
          const webColor = v.webColor || '#99e0ff'

          // Swarm Physics Simulation
          this.webParticles.forEach((p) => {
            if (blobs.length > 0) {
              // Find nearest tracked blob
              let nearB = blobs[0]
              let nearDist = Math.hypot(blobs[0].cx - p.x, blobs[0].cy - p.y)
              for (let i = 1; i < blobs.length; i++) {
                const d = Math.hypot(blobs[i].cx - p.x, blobs[i].cy - p.y)
                if (d < nearDist) {
                  nearDist = d
                  nearB = blobs[i]
                }
              }

              const dx = nearB.cx - p.x
              const dy = nearB.cy - p.y
              const dist = Math.hypot(dx, dy) || 1

              // Gravitational swarm attraction force
              const force = (attract * 340) / Math.max(35, dist)
              const nx = dx / dist
              const ny = dy / dist

              p.vx += nx * force * dt * 2.5
              p.vy += ny * force * dt * 2.5

              // Orbital tangential swirl around the blob centroid
              p.vx += -ny * force * 0.45 * dt
              p.vy += nx * force * 0.45 * dt

              // Repulsion core preventing collapse into a single pixel
              if (dist < nearB.w * 0.22) {
                p.vx -= nx * 85 * dt
                p.vy -= ny * 85 * dt
              }
            } else {
              // Ambient gentle float when no target active
              p.vx += Math.sin(time * p.speed + p.phase) * 12 * dt
              p.vy += Math.cos(time * p.speed * 0.9 + p.phase) * 12 * dt
            }

            // Drag / friction damping
            p.vx *= 0.93
            p.vy *= 0.93
            p.x += p.vx
            p.y += p.vy

            // Canvas boundary constraints
            if (p.x < 10) {
              p.x = 10
              p.vx *= -0.5
            }
            if (p.x > W - 10) {
              p.x = W - 10
              p.vx *= -0.5
            }
            if (p.y < 10) {
              p.y = 10
              p.vy *= -0.5
            }
            if (p.y > H - 10) {
              p.y = H - 10
              p.vy *= -0.5
            }
          })

          ctx.save()

          // 1. Interconnected Web Strings between particles
          ctx.strokeStyle = webColor
          ctx.lineWidth = 0.85

          const n = this.webParticles.length
          for (let i = 0; i < n; i++) {
            const p1 = this.webParticles[i]
            const jit1X = Math.sin(time * 26 + p1.phase) * vib * 1.5
            const jit1Y = Math.cos(time * 26 + p1.phase) * vib * 1.5
            const x1 = p1.x + jit1X
            const y1 = p1.y + jit1Y

            for (let j = i + 1; j < n; j++) {
              const p2 = this.webParticles[j]
              const d = Math.hypot(p1.x - p2.x, p1.y - p2.y)
              if (d < reach) {
                const alpha = (1 - d / reach) * 0.68
                ctx.globalAlpha = alpha

                const jit2X = Math.sin(time * 26 + p2.phase) * vib * 1.5
                const jit2Y = Math.cos(time * 26 + p2.phase) * vib * 1.5
                const x2 = p2.x + jit2X
                const y2 = p2.y + jit2Y

                if (tension < 0.95) {
                  // Catenary tension sag curve
                  const midX = (x1 + x2) / 2
                  const midY = (y1 + y2) / 2
                  const sag = (1 - tension) * 14
                  ctx.beginPath()
                  ctx.moveTo(x1, y1)
                  ctx.quadraticCurveTo(midX, midY + sag, x2, y2)
                  ctx.stroke()
                } else {
                  ctx.beginPath()
                  ctx.moveTo(x1, y1)
                  ctx.lineTo(x2, y2)
                  ctx.stroke()
                }
              }
            }
          }

          // 2. Radial Anchor Threads from Blobs
          blobs.forEach((b) => {
            const spokes = v.radialSpokes !== undefined ? v.radialSpokes : 12
            const sortedByDist = [...this.webParticles].sort((a, bPt) => {
              return (
                Math.hypot(a.x - b.cx, a.y - b.cy) -
                Math.hypot(bPt.x - b.cx, bPt.y - b.cy)
              )
            })

            ctx.lineWidth = 1.0
            for (let k = 0; k < Math.min(spokes, sortedByDist.length); k++) {
              const targetP = sortedByDist[k]
              const d = Math.hypot(targetP.x - b.cx, targetP.y - b.cy)
              ctx.globalAlpha = Math.max(
                0.2,
                Math.min(0.85, 1 - d / (b.w * 1.3)),
              )
              ctx.beginPath()
              ctx.moveTo(b.cx, b.cy)
              ctx.lineTo(targetP.x, targetP.y)
              ctx.stroke()
            }

            // Concentric web rings around centroid
            const rings = 3
            ctx.lineWidth = 0.75
            for (let r = 1; r <= rings; r++) {
              const radius = Math.max(4, (b.w || 40) * 0.16 * r + Math.sin(time * 2 + r) * 3)
              ctx.globalAlpha = 0.45 / r
              ctx.beginPath()
              ctx.arc(b.cx, b.cy, radius, 0, Math.PI * 2)
              ctx.stroke()
            }
          })

          // 3. Silk Joint Nodes
          if (v.silkJointsGlow !== false) {
            ctx.shadowColor = webColor
            ctx.shadowBlur = 6
          }
          this.webParticles.forEach((p) => {
            ctx.globalAlpha = 0.85
            ctx.fillStyle = '#ffffff'
            ctx.beginPath()
            ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2)
            ctx.fill()
          })

          ctx.restore()
        },

        // --- VARIATION 3: SCATTER NODES (Classic CCTV / Edit Box Preserved 100%) ---
        syncNodes(blob, v) {
          const targetCount = v.nodeCount !== undefined ? v.nodeCount : 16
          while (blob.nodes.length < targetCount) {
            blob.nodes.push({
              relX: (Math.random() - 0.5) * 0.85,
              relY: (Math.random() - 0.5) * 0.85,
              phase: Math.random() * TAU,
              speed: 0.8 + Math.random() * 1.6,
              shape: this.pickShape(v.nodeShape || 'square'),
              scale: 0.7 + Math.random() * 0.6,
            })
          }
          if (blob.nodes.length > targetCount) {
            blob.nodes.length = targetCount
          }
          // Update shape if changed
          blob.nodes.forEach((n) => {
            if (v.nodeShape && v.nodeShape !== 'mixed') {
              n.shape = v.nodeShape
            }
          })
        },

        pickShape(shapePref) {
          if (shapePref !== 'mixed') return shapePref
          const shapes = [
            'square',
            'diamond',
            'bracket',
            'crosshair',
            'circle',
            'triangle',
          ]
          return shapes[Math.floor(Math.random() * shapes.length)]
        },

        renderTracking(v) {
          const { time } = env

          this.trackedBlobs.forEach((b) => {
            const alpha = Math.min(1, b.life)
            ctx.save()
            ctx.globalAlpha = alpha

            // 1. Edit Mode Bounding Box & Handles
            if (v.showBoundingBox !== false) {
              ctx.strokeStyle = v.boxColor || '#00ff88'
              ctx.lineWidth = 1
              ctx.strokeRect(b.x, b.y, b.w, b.h)

              if (v.showHandles !== false) {
                const handles = [
                  [b.x, b.y],
                  [b.x + b.w, b.y],
                  [b.x, b.y + b.h],
                  [b.x + b.w, b.y + b.h],
                  [b.x + b.w / 2, b.y],
                  [b.x + b.w / 2, b.y + b.h],
                  [b.x, b.y + b.h / 2],
                  [b.x + b.w, b.y + b.h / 2],
                ]
                const hs = 5
                ctx.fillStyle = '#ffffff'
                ctx.strokeStyle = v.boxColor || '#00ff88'
                ctx.lineWidth = 1
                handles.forEach(([hx, hy]) => {
                  ctx.fillRect(hx - hs / 2, hy - hs / 2, hs, hs)
                  ctx.strokeRect(hx - hs / 2, hy - hs / 2, hs, hs)
                })
              }
            }

            // 2. CCTV Corner Brackets
            if (v.showBrackets !== false) {
              const bl = Math.min(14, b.w * 0.25, b.h * 0.25)
              ctx.strokeStyle = v.boxColor || '#00ff88'
              ctx.lineWidth = 1.5

              // Top-left
              ctx.beginPath()
              ctx.moveTo(b.x, b.y + bl)
              ctx.lineTo(b.x, b.y)
              ctx.lineTo(b.x + bl, b.y)
              // Top-right
              ctx.moveTo(b.x + b.w - bl, b.y)
              ctx.lineTo(b.x + b.w, b.y)
              ctx.lineTo(b.x + b.w, b.y + bl)
              // Bottom-left
              ctx.moveTo(b.x, b.y + b.h - bl)
              ctx.lineTo(b.x, b.y + b.h)
              ctx.lineTo(b.x + bl, b.y + b.h)
              // Bottom-right
              ctx.moveTo(b.x + b.w - bl, b.y + b.h)
              ctx.lineTo(b.x + b.w, b.y + b.h)
              ctx.lineTo(b.x + b.w, b.y + b.h - bl)
              ctx.stroke()
            }

            // 3. Centroid Crosshair
            if (v.showCrosshair !== false) {
              const cs = 7
              ctx.strokeStyle = v.accentColor || '#ffffff'
              ctx.lineWidth = 1
              ctx.beginPath()
              ctx.moveTo(b.cx - cs, b.cy)
              ctx.lineTo(b.cx + cs, b.cy)
              ctx.moveTo(b.cx, b.cy - cs)
              ctx.lineTo(b.cx, b.cy + cs)
              ctx.stroke()
            }

            // 4. Tech HUD Labels
            if (v.showLabels !== false) {
              ctx.font = '9px monospace'
              const label = `ID#${b.id} [${Math.round(b.cx)},${Math.round(b.cy)}] ${Math.round(b.w)}x${Math.round(b.h)}`
              const tw = ctx.measureText(label).width
              ctx.fillStyle = 'rgba(10, 12, 18, 0.75)'
              ctx.fillRect(b.x, b.y - 14, tw + 8, 12)
              ctx.strokeStyle = v.boxColor || '#00ff88'
              ctx.strokeRect(b.x, b.y - 14, tw + 8, 12)
              ctx.fillStyle = v.boxColor || '#00ff88'
              ctx.fillText(label, b.x + 4, b.y - 5)
            }

            // Calculate animated node positions
            const computedNodes = b.nodes.map((n) => {
              const jit = v.jitter !== undefined ? v.jitter : 1.2
              const ox = Math.sin(time * n.speed + n.phase) * (b.w * 0.18 * jit)
              const oy =
                Math.cos(time * n.speed * 1.2 + n.phase) * (b.h * 0.18 * jit)
              return {
                x: b.cx + n.relX * b.w + ox,
                y: b.cy + n.relY * b.h + oy,
                shape: n.shape,
                size: (v.nodeSize !== undefined ? v.nodeSize : 8) * n.scale,
              }
            })

            // 5. Connect Nodes (Mesh wireframe)
            if (v.connectNodes !== false && computedNodes.length > 1) {
              ctx.save()
              ctx.strokeStyle = v.nodeColor || '#00ff88'
              ctx.lineWidth = 0.75
              const maxDist = Math.max(b.w, b.h) * 0.45

              for (let i = 0; i < computedNodes.length; i++) {
                for (let j = i + 1; j < computedNodes.length; j++) {
                  const d = Math.hypot(
                    computedNodes[i].x - computedNodes[j].x,
                    computedNodes[i].y - computedNodes[j].y,
                  )
                  if (d < maxDist) {
                    ctx.globalAlpha = alpha * (1 - d / maxDist) * 0.4
                    ctx.beginPath()
                    ctx.moveTo(computedNodes[i].x, computedNodes[i].y)
                    ctx.lineTo(computedNodes[j].x, computedNodes[j].y)
                    ctx.stroke()
                  }
                }
              }
              ctx.restore()
            }

            // 6. Draw Scattered Nodes
            ctx.save()
            const blend = v.blendMode || 'source-over'
            if (blend !== 'source-over') {
              ctx.globalCompositeOperation = blend
            }
            computedNodes.forEach((cn, idx) => {
              this.drawNodeShape(
                cn.x,
                cn.y,
                cn.size,
                cn.shape,
                v.nodeColor || '#00ff88',
                v.accentColor || '#ffffff',
                idx,
              )
            })
            ctx.restore()

            ctx.restore()
          })
        },

        drawNodeShape(x, y, s, shape, color, accentColor, idx) {
          ctx.save()
          ctx.translate(x, y)

          if (shape === 'square') {
            ctx.fillStyle = color
            ctx.fillRect(-s / 2, -s / 2, s, s)
            ctx.strokeStyle = accentColor
            ctx.lineWidth = 1
            ctx.strokeRect(-s / 2, -s / 2, s, s)
          } else if (shape === 'diamond') {
            ctx.rotate(Math.PI / 4)
            ctx.fillStyle = color
            ctx.fillRect(-s / 2, -s / 2, s, s)
            ctx.strokeStyle = accentColor
            ctx.lineWidth = 1
            ctx.strokeRect(-s / 2, -s / 2, s, s)
          } else if (shape === 'bracket') {
            ctx.strokeStyle = color
            ctx.lineWidth = 1.5
            const hs = s * 0.6
            ctx.beginPath()
            ctx.moveTo(-hs, 0)
            ctx.lineTo(-hs, -hs)
            ctx.lineTo(0, -hs)
            ctx.moveTo(hs, 0)
            ctx.lineTo(hs, hs)
            ctx.lineTo(0, hs)
            ctx.stroke()
          } else if (shape === 'crosshair') {
            ctx.strokeStyle = color
            ctx.lineWidth = 1.2
            const hs = s * 0.6
            ctx.beginPath()
            ctx.moveTo(-hs, 0)
            ctx.lineTo(hs, 0)
            ctx.moveTo(0, -hs)
            ctx.lineTo(0, hs)
            ctx.stroke()
            ctx.fillStyle = accentColor
            ctx.fillRect(-1, -1, 2, 2)
          } else if (shape === 'circle') {
            ctx.beginPath()
            ctx.arc(0, 0, s / 2, 0, TAU)
            ctx.strokeStyle = color
            ctx.lineWidth = 1.2
            ctx.stroke()
            ctx.fillStyle = accentColor
            ctx.beginPath()
            ctx.arc(0, 0, s / 4, 0, TAU)
            ctx.fill()
          } else if (shape === 'triangle') {
            const hs = s * 0.6
            ctx.beginPath()
            ctx.moveTo(0, -hs)
            ctx.lineTo(hs, hs * 0.8)
            ctx.lineTo(-hs, hs * 0.8)
            ctx.closePath()
            ctx.fillStyle = color
            ctx.fill()
            ctx.strokeStyle = accentColor
            ctx.lineWidth = 1
            ctx.stroke()
          }
          ctx.restore()
        },
      }

      // ======================================================================

      const voxelDrift = {

        label: 'voxel-drift',

        getGroups(v) {

        },

        draw(v, dt) {
          const { W, H } = env
          env.time += dt

          if (!this.analysisCtx) this.init()

          const sz = Math.max(10, Math.min(64, Math.round(v.voxelSize || 20)))
          const cols = Math.ceil(W / sz)
          const rows = Math.ceil(H / sz)

          // 1. Update Motion & Subject Detection Energy Grid
          this.updateEnergyGrid(v, cols, rows, sz)

          // 2. Render Dispersal Void
          const activeVoxels = this.renderDispersalVoid(v, cols, rows, sz, dt)

          return `${activeVoxels} voxels dispersed · Dispersal Void · Motion Tracked`
        },

        updateEnergyGrid(v, cols, rows, sz) {
          const { W, H } = env
          if (this.gridW !== cols || this.gridH !== rows) {
            this.gridW = cols
            this.gridH = rows
            this.analysisCanvas.width = cols
            this.analysisCanvas.height = rows
            this.bgData = null
            this.energyGrid = new Float32Array(cols * rows)
          }

          this.analysisCtx.drawImage(env.sourceCanvas, 0, 0, cols, rows)
          const imgData = this.analysisCtx.getImageData(0, 0, cols, rows)
          const d = imgData.data

          if (!this.bgData || this.bgData.length !== cols * rows * 3) {
            this.bgData = new Float32Array(cols * rows * 3)
            for (let i = 0; i < cols * rows; i++) {
              this.bgData[i * 3] = d[i * 4]
              this.bgData[i * 3 + 1] = d[i * 4 + 1]
              this.bgData[i * 3 + 2] = d[i * 4 + 2]
            }
          }

          const sens = v.sensitivity !== undefined ? v.sensitivity : 0.45
          const mode = v.detectMode || 'hybrid'
          let minThreshold = 0.05 + (1 - sens) * 0.35

          let sumX = 0, sumY = 0, sumEnergy = 0, count = 0
          let minX = cols, maxX = 0, minY = rows, maxY = 0

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const idx = (r * cols + c) * 4
              const bgIdx = (r * cols + c) * 3
              const red = d[idx], green = d[idx + 1], blue = d[idx + 2]
              const luma = (0.299 * red + 0.587 * green + 0.114 * blue) / 255

              const bgR = this.bgData[bgIdx]
              const bgG = this.bgData[bgIdx + 1]
              const bgB = this.bgData[bgIdx + 2]
              const motion = (Math.abs(red - bgR) + Math.abs(green - bgG) + Math.abs(blue - bgB)) / (3 * 255)

              // Update background model
              this.bgData[bgIdx] += (red - bgR) * 0.03
              this.bgData[bgIdx + 1] += (green - bgG) * 0.03
              this.bgData[bgIdx + 2] += (blue - bgB) * 0.03

              let rawEnergy = 0
              if (mode === 'motion') {
                rawEnergy = motion * 2.2
              } else if (mode === 'brightness') {
                rawEnergy = luma * 1.2
              } else {
                // hybrid: combines motion bursts with subject brightness silhouette
                rawEnergy = Math.max(motion * 2.0, luma * 0.9)
              }

              // Smooth decay on energy grid
              const cellIdx = r * cols + c
              const prev = this.energyGrid[cellIdx] || 0
              const curr = Math.max(rawEnergy, prev * 0.88)
              this.energyGrid[cellIdx] = curr

              if (curr > minThreshold) {
                sumX += (c + 0.5) * sz
                sumY += (r + 0.5) * sz
                sumEnergy += curr
                count++
                if (c < minX) minX = c
                if (c > maxX) maxX = c
                if (r < minY) minY = r
                if (r > maxY) maxY = r
              }
            }
          }

          if (count > 3 && sumEnergy > 0) {
            this.subjectBounds = {
              cx: sumX / sumEnergy,
              cy: sumY / sumEnergy,
              w: Math.max(sz * 2, (maxX - minX + 1) * sz),
              h: Math.max(sz * 2, (maxY - minY + 1) * sz),
              active: true,
            }
          } else {
            // Graceful center fallback if quiet
            this.subjectBounds = {
              cx: W * 0.5,
              cy: H * 0.5,
              w: W * 0.55,
              h: H * 0.70,
              active: false,
            }
          }
        },

        // --- DISPERSAL VOID ---
        renderDispersalVoid(v, cols, rows, sz, dt) {
          const { W, H, time } = env
          const drift = v.driftAmount !== undefined ? v.driftAmount : 1.4
          const speed = v.driftSpeed !== undefined ? v.driftSpeed : 1.1
          const motionResp = v.motionResponse !== undefined ? v.motionResponse : 2.0
          const sens = v.sensitivity !== undefined ? v.sensitivity : 0.45
          const cutoff = (1 - sens) * 0.22
          const redSeam = v.customEdgeColor || '#ff2626'
          const sub = this.subjectBounds

          let activeCount = 0
          ctx.save()

          // Pure black background for high contrast void
          const dim = v.backgroundDim !== undefined ? v.backgroundDim : 1.0
          ctx.fillStyle = '#000000'
          ctx.fillRect(0, 0, W, H)

          if (!v.backgroundCutout && dim < 1.0) {
            ctx.save()
            ctx.globalAlpha = 1 - dim
            ctx.drawImage(env.sourceCanvas, 0, 0, W, H)
            ctx.restore()
          }

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const e = this.energyGrid[r * cols + c] || 0
              if (v.backgroundCutout && e < cutoff) continue

              const sx = c * sz
              const sy = r * sz
              if (sx >= W || sy >= H) continue

              // Aggressive void dispersal drift
              const angle = Math.atan2(sy - sub.cy, sx - sub.cx)
              const kick = Math.sin(time * speed * 2 + c * 0.5 + r * 0.4) * (24 * drift) + (e * motionResp * 24)
              const waveX = Math.cos(time * speed * 1.4 + r * 0.3) * (8 * drift)
              const waveY = Math.sin(time * speed * 1.4 + c * 0.3) * (8 * drift)
              const x = sx + Math.cos(angle) * kick + waveX
              const y = sy + Math.sin(angle) * kick + waveY

              activeCount++

              // Draw disintegrated voxel block
              ctx.drawImage(env.sourceCanvas, sx, sy, sz, sz, x, y, sz, sz)

              // Glowing Neon Perimeter Seam
              if (v.wireframeEdges !== false) {
                ctx.save()
                ctx.strokeStyle = redSeam
                ctx.lineWidth = 1.6
                ctx.shadowColor = redSeam
                ctx.shadowBlur = 8
                ctx.strokeRect(x, y, sz, sz)
                ctx.restore()
              }
            }
          }

          ctx.restore()
          return activeCount
        },

        // --- REAL-TIME KINEMATIC & OPTICAL CONTOUR SOLVER (60 FPS) ---
        updateKinematicTracking(v, dt) {
          const { W, H } = env
          if (!W || !H) return
          const GW = 96
          const GH = Math.max(32, Math.round(96 * (H / W)))

          if (this.analysisCanvas.width !== GW || this.analysisCanvas.height !== GH) {

            this.analysisCanvas.height = GH
